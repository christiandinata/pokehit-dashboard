/* ===================== CHARTS ===================== */
var chartState = { gran:"daily", metric:"revenue", product:"all" };

function allSales(){
  // Returns flat list of {date, qty, total, cogs, profit, product, buyer} respecting product filter.
  var out=[];
  products.forEach(function(p){
    if(chartState.product!=="all" && String(p.productId)!==String(chartState.product)) return;
    var nm=prodName(p);
    arr(p.sales).forEach(function(s){
      if(!s || !s.date) return;
      out.push({
        date:String(s.date).slice(0,10), qty:+s.qty||0, total:+s.total||0,
        cogs:+s.cogs||0, profit:+s.profit||0, product:nm, buyer:s.buyer||""
      });
    });
  });
  return out;
}
function isoWeekKey(d){
  // ISO week key YYYY-Www
  var dt=new Date(d+"T00:00:00Z");
  if(isNaN(dt)) return d;
  var day=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-day+3);
  var firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  var week=1+Math.round(((dt-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return dt.getUTCFullYear()+"-W"+(week<10?"0":"")+week;
}
function bucketKey(date){
  if(chartState.gran==="monthly") return date.slice(0,7);
  if(chartState.gran==="weekly") return isoWeekKey(date);
  return date;
}
function metricVal(row){
  if(chartState.metric==="units") return row.qty;
  if(chartState.metric==="profit") return row.profit;
  return row.total;
}
function buildSeries(){
  var sales=allSales();
  var map={};
  sales.forEach(function(s){
    var k=bucketKey(s.date);
    if(!map[k]) map[k]={key:k, val:0};
    map[k].val += metricVal(s);
  });
  var keys=Object.keys(map).sort();
  return keys.map(function(k){ return map[k]; });
}
function metricLabel(){
  if(chartState.metric==="units") return "Units";
  if(chartState.metric==="profit") return "Gross profit";
  return "Revenue";
}
function fmtMetric(v){
  if(chartState.metric==="units") return num(v);
  return money(v);
}
function drawChart(series){
  var box=el("chartbox");
  if(!series.length){ box.innerHTML='<div class="empty">No sales data for this selection.</div>'; return; }
  // Fixed coordinate space; scales responsively via width:100% + viewBox.
  var isMobile = (typeof window!=="undefined" && window.innerWidth<900);
  var W=720, H=isMobile?248:308;
  var padL=52, padR=14, padT=16, padB=isMobile?40:36;
  var n=series.length;

  var maxV=0, minV=0;
  series.forEach(function(d){ if(d.val>maxV)maxV=d.val; if(d.val<minV)minV=d.val; });
  if(maxV===0 && minV===0) maxV=1;
  // round the top up to a "nice" number so gridline labels read cleanly
  var rawTop=maxV>0?maxV:1;
  var top=niceCeil(rawTop);
  var bot=minV<0?-niceCeil(-minV):0;
  var range=(top-bot)||1;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  function Y(v){ return padT + (1-((v-bot)/range))*plotH; }
  var zeroY=Y(0);

  // bar geometry: even slots, gap between bars
  var slot=plotW/n;
  var bw=Math.max(4, Math.min(slot*0.62, 46));
  function cx(i){ return padL + slot*i + slot/2; }

  var fmtY = (chartState.metric==="units") ? num : shortMoney;

  // gridlines + right-aligned y labels in the gutter
  var grid="";
  for(var g=0; g<=4; g++){
    var gv=bot + (g/4)*range;
    var gy=Y(gv);
    grid+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="#233246" stroke-width="1" opacity="0.7"/>';
    grid+='<text x="'+(padL-8)+'" y="'+(gy+3.5).toFixed(1)+'" fill="#5c6f82" font-size="11" text-anchor="end">'+esc(fmtY(gv))+'</text>';
  }

  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">';
  svg+='<defs>'
     +'<linearGradient id="barUp" x1="0" y1="0" x2="0" y2="1">'
       +'<stop offset="0%" stop-color="#4c9aff" stop-opacity="0.95"/>'
       +'<stop offset="100%" stop-color="#4c9aff" stop-opacity="0.30"/></linearGradient>'
     +'<linearGradient id="barDn" x1="0" y1="0" x2="0" y2="1">'
       +'<stop offset="0%" stop-color="#fb7185" stop-opacity="0.30"/>'
       +'<stop offset="100%" stop-color="#fb7185" stop-opacity="0.95"/></linearGradient>'
     +'</defs>';
  svg+=grid;

  // bars (rounded top)
  var rx=Math.min(4, bw/2);
  series.forEach(function(d,i){
    var x=cx(i)-bw/2;
    var yv=Y(d.val), h=Math.abs(zeroY-yv);
    var y=Math.min(yv, zeroY);
    var fill=d.val<0?"url(#barDn)":"url(#barUp)";
    svg+='<rect class="cbar" data-i="'+i+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1.5,h).toFixed(1)+'" rx="'+rx.toFixed(1)+'" fill="'+fill+'"/>';
  });

  // x labels — never overlap: pick a step so we draw ~6-7 labels max
  var maxLabels=7;
  var step=n<=maxLabels?1:Math.ceil(n/maxLabels);
  series.forEach(function(d,i){
    if(n>maxLabels && i%step!==0 && i!==n-1) return;
    svg+='<text x="'+cx(i).toFixed(1)+'" y="'+(H-padB+18)+'" fill="#5c6f82" font-size="11" text-anchor="middle">'+esc(shortKey(d.key))+'</text>';
  });

  // full-height invisible hit slots for tap/hover
  series.forEach(function(d,i){
    svg+='<rect class="chit" data-i="'+i+'" x="'+(padL+slot*i).toFixed(1)+'" y="'+padT+'" width="'+slot.toFixed(1)+'" height="'+plotH+'" fill="transparent"/>';
  });
  svg+='</svg><div class="chart-tip" id="chartTip"></div>';
  box.innerHTML=svg;

  var tip=el("chartTip");
  var bars=box.querySelectorAll(".cbar");
  function showTip(i){
    var d=series[i];
    tip.innerHTML='<span class="tk">'+esc(prettyKey(d.key))+'</span><br><b>'+fmtMetric(d.val)+'</b>';
    tip.style.display="block";
    Array.prototype.forEach.call(bars,function(b,j){ b.classList.toggle("dim", j!==i); });
    var fx=(cx(i)/W)*box.clientWidth;
    var fy=(Y(Math.max(0,d.val))/H)*box.clientHeight;
    tip.style.left=Math.max(48,Math.min(box.clientWidth-48,fx))+"px";
    tip.style.top=Math.max(28,fy-10)+"px";
  }
  function hideTip(){ tip.style.display="none"; Array.prototype.forEach.call(bars,function(b){ b.classList.remove("dim"); }); }
  Array.prototype.forEach.call(box.querySelectorAll(".chit"),function(h){
    var i=+h.getAttribute("data-i");
    h.addEventListener("mouseenter",function(){ showTip(i); });
    h.addEventListener("mousemove",function(){ showTip(i); });
    h.addEventListener("mouseleave",hideTip);
    h.addEventListener("touchstart",function(e){ showTip(i); },{passive:true});
    h.addEventListener("click",function(){ showTip(i); });
  });
}
function niceCeil(v){
  if(!(v>0)) return 1;
  var mag=Math.pow(10,Math.floor(Math.log(v)/Math.LN10));
  var f=v/mag;
  var nice = f<=1?1 : f<=2?2 : f<=2.5?2.5 : f<=5?5 : 10;
  return nice*mag;
}
function shortMoney(n){
  var a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1)+"B";
  if(a>=1e6) return (n/1e6).toFixed(1)+"M";
  if(a>=1e3) return Math.round(n/1e3)+"k";
  return String(Math.round(n));
}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function shortKey(k){
  // Compact axis labels that never feel cramped.
  // Daily YYYY-MM-DD -> "27 Apr"
  var md=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k);
  if(md) return (+md[3])+" "+MON[(+md[2])-1];
  // Monthly YYYY-MM -> "Apr 25"
  var mm=/^(\d{4})-(\d{2})$/.exec(k);
  if(mm) return MON[(+mm[2])-1]+" "+mm[1].slice(2);
  // Weekly YYYY-Www -> "W17 '25"
  var mw=/^(\d{4})-W(\d{2})$/.exec(k);
  if(mw) return "W"+(+mw[2])+" '"+mw[1].slice(2);
  return k;
}
function prettyKey(k){
  // Fuller label for tooltips.
  var md=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k);
  if(md) return (+md[3])+" "+MON[(+md[2])-1]+" "+md[1];
  var mm=/^(\d{4})-(\d{2})$/.exec(k);
  if(mm) return MON[(+mm[2])-1]+" "+mm[1];
  var mw=/^(\d{4})-W(\d{2})$/.exec(k);
  if(mw) return "Week "+(+mw[2])+", "+mw[1];
  return k;
}
function renderChartSummary(series){
  var total=0; series.forEach(function(d){ total+=d.val; });
  var avg=series.length?total/series.length:0;
  var unit=metricLabel();
  var unitWord = chartState.gran==="daily"?"day":(chartState.gran==="weekly"?"week":"month");

    '<span class="ttotal"><span class="t">Total '+esc(unit.toLowerCase())+'</span><div class="v num">'+fmtMetric(total)+'</div></span>'
   +'<span class="ttotal"><span class="t">Avg / '+unitWord+'</span><div class="v num">'+fmtMetric(avg)+'</div></span>'
   +'<span class="ttotal"><span class="t">Periods</span><div class="v num">'+num(series.length)+'</div></span>';

  // top movers
  if(!series.length){ el("chartMovers").innerHTML=""; return; }
  var best=series[0], worst=series[0];

  el("chartMovers").innerHTML=
    moverCard("Best "+unitWord, best, "pos")

    m.addEventListener("click",function(){ m.classList.toggle("open"); });
  });
}
function salesInBucket(key){
  // Sales (respecting product filter + current granularity) that fall in the given bucket key.
  return allSales().filter(function(s){ return bucketKey(s.date)===key; })
    .sort(function(a,b){ return (a.date<b.date?-1:a.date>b.date?1:0); });
}
function moverCard(label, d, valCls){
  var list=salesInBucket(d.key);
  var rows=list.map(function(s){
    return '<tr><td>'+esc(s.product||"—")+'</td>'

      +'<td class="num">'+money(s.total)+'</td></tr>';
  }).join("");
  var tbl = list.length
    ? '<div class="tscroll"><table class="compact"><thead><tr><th>Product</th><th>Buyer</th><th>Qty</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    : '<div class="empty">No sales in this period.</div>';
  return '<div class="mover expandable">'
    +'<div class="mk">'+esc(label)+'<span class="chev">▶</span></div>'
    +'<div class="mv '+valCls+'">'+fmtMetric(d.val)+'</div>'
    +'<div class="md">'+esc(prettyKey(d.key))+'</div>'
    +'<div class="mexp">'+tbl+'</div>'
  +'</div>';
}
function refreshChart(){
  var series=buildSeries();

  renderChartSummary(series);
}

/* ===================== PERFORMANCE ===================== */
function rankBars(items, valueFn, fmtFn, colorFn){
  var max=1;
  items.forEach(function(p){ max=Math.max(max,Math.abs(valueFn(p))); });
  return items.map(function(p){
    var v=valueFn(p), w=(Math.abs(v)/max)*100;
    return '<div class="rrow"><div class="rhead">'
      +'<span class="rn">'+esc(prodName(p))+'</span>'
      +'<span class="rv num '+(colorFn?colorFn(p):'')+'">'+fmtFn(p)+'</span></div>'
      +'<div class="rtrack"><div class="rfill" style="width:'+Math.max(2,w)+'%;background:linear-gradient(135deg,var(--acc-a),var(--acc-b));"></div></div>'
    +'</div>';
  }).join("");
}
function marginBarColor(p){
  var m=p.marginPct;
  if(m===null||m===undefined||isNaN(m)) return "var(--muted)";
  if(m<0) return "var(--red)"; if(m<8) return "var(--amber)"; return "var(--green)";
}
function renderPerformance(){
  if(!products.length){ el("sec-performance").innerHTML='<div class="empty">No products.</div>'; return; }

  var winners=products.slice().sort(function(a,b){return (b.grossProfit||0)-(a.grossProfit||0);}).slice(0,12);
  var winHtml=rankBars(winners,
    function(p){return p.grossProfit||0;},
    function(p){return money(p.grossProfit);},
    function(p){return (p.grossProfit||0)>=0?'pos':'neg';});

  var sold=products.filter(function(p){return (p.unitsSold||0)>0;});
  var lowMargin=sold.slice().sort(function(a,b){
    return (a.marginPct==null?999:a.marginPct)-(b.marginPct==null?999:b.marginPct);
  }).slice(0,10);
  var lowHtml=lowMargin.map(function(p){
    var m=p.marginPct, w=Math.max(2,Math.min(100,Math.abs(m||0)));
    return '<div class="rrow"><div class="rhead">'
      +'<span class="rn">'+esc(prodName(p))+'</span>'
      +'<span class="rv num '+marginClass(m)+'">'+pct(m)+'</span></div>'
      +'<div class="rtrack"><div class="rfill" style="width:'+w+'%;background:'+marginBarColor(p)+';"></div></div>'
    +'</div>';
  }).join("") || '<div class="empty">No sales yet.</div>';

  var lowSellers=products.slice().sort(function(a,b){return (a.unitsSold||0)-(b.unitsSold||0);}).slice(0,10);
  var lowSellHtml=lowSellers.map(function(p){
    return '<div class="rrow"><div class="rhead">'
      +'<span class="rn">'+esc(prodName(p))+'</span>'
      +'<span class="rv num">'+num(p.unitsSold)+' sold</span></div></div>';
  }).join("");

  el("sec-performance").innerHTML=
    '<div class="sec-title">🏆 Winners — by gross profit</div>'
   +'<div class="card">'+(winHtml||'<div class="empty">No data.</div>')+'</div>'
   +'<div class="sec-title">⚠️ Needs attention — lowest margin</div>'
   +'<div class="card">'+lowHtml+'</div>'
   +'<div class="sec-title">🐌 Slow movers — fewest units sold</div>'
   +'<div class="card">'+lowSellHtml+'</div>';
}

function renderExpenses(){

  }).join("") || '<div class="stackseg" style="width:100%;background:var(--panel-b);"></div>';

  var allocRows = allocSorted.map(function(a){
    var amt=Math.abs(+a.amount||0);
    var p=(amt/baseOut)*100;
    var wbar=(amt/(allocSorted.length?Math.abs(+allocSorted[0].amount||0)||1:1))*100;
    return '<div class="alloc-row">'

  var outRows = outSorted.map(function(r){

  var cashBal = (bal && bal.cash!=null) ? +bal.cash : net;

  var matchLine = matches
    ? '<div class="recon-match">✓ This matches your Cash balance.</div>'

     +'<div class="recon-sub"><span>Total in</span><span class="rr pos">'+money(totalIn)+'</span></div>'
     +'<div class="recon-h"><span>Money out</span><span></span></div>'
     +outRows
     +'<div class="recon-sub"><span>Total out</span><span class="rr neg">−'+money(totalOut)+'</span></div>'
     +'<div class="recon-net"><span class="nl">Net cash</span><span class="nv '+(net>=0?'pos':'neg')+'">'+money(net)+'</span></div>'
     +matchLine
   +'</div>';

  /* ---- (C) OPERATING EXPENSES detail ---- */
  var opSorted = arr(opex).slice().filter(function(o){ return Math.abs(+o.amount||0)>0; })
    .sort(function(a,b){ return (Math.abs(+b.amount||0))-(Math.abs(+a.amount||0)); });
  var opMax = 1; opSorted.forEach(function(o){ opMax=Math.max(opMax,Math.abs(+o.amount||0)); });
  var opHtml = opSorted.map(function(o){
    var amt=Math.abs(+o.amount||0);

        +'<td>'+esc(r.counterparty||"—")+'</td>'

    var tx = txRows.length
      ? '<div class="tscroll"><table class="compact"><thead><tr><th>Date</th><th>Counterparty</th><th>Amount</th><th>Description</th></tr></thead><tbody>'+txBody+'</tbody></table></div>'
      : '<div class="empty">No matching transactions.</div>';
    return '<div class="opx" data-opx="1">'
      +'<div class="opx-head"><span class="opx-name"><span class="chev">▶</span>'+esc(cat||"—")+'</span>'
        +'<span class="opx-amt num">'+money(amt)+'</span></div>'

      +'<div class="opx-tx">'+tx+'</div>'

  }).join("") || '<div class="empty">No operating expenses.</div>';

  var sectionC =
    '<div class="sec-title">Operating expenses — tap to see transactions</div>'
   +'<div class="card">'+opHtml+'</div>';

  /* ---- (D) FULL OUTFLOW LEDGER ---- */
  var cats={};
  rows.forEach(function(r){ if(r.category) cats[r.category]=true; });
  var catOpts='<option value="all">All categories</option>'+Object.keys(cats).sort().map(function(c){
    return '<option value="'+esc(c)+'">'+esc(c)+'</option>';

     +'</div>'

     +'<div id="exLedgerTable"></div>'
   +'</div>';

  sec.innerHTML = sectionA + sectionB + sectionC + sectionD;

  // wire (C) expand
  Array.prototype.forEach.call(sec.querySelectorAll(".opx"),function(o){
    o.addEventListener("click",function(){ o.classList.toggle("open"); });

  // wire (D) filter + search
  var catSel=el("exLedgerCat"), srch=el("exLedgerSearch");
  if(catSel){ catSel.value=exLedgerState.cat; catSel.addEventListener("change",function(e){ exLedgerState.cat=e.target.value; refreshExLedger(); }); }
  if(srch){ srch.value=exLedgerState.q; srch.addEventListener("input",function(e){ exLedgerState.q=e.target.value; refreshExLedger(); }); }
  refreshExLedger();
}
function refreshExLedger(){
  var tbl=el("exLedgerTable"); if(!tbl) return;
  var cf = cashflow || {};
  // Global search box should also filter the ledger.
  var globalQ="";
  var gs=el("searchD")||el("searchM"); if(gs) globalQ=(gs.value||"").trim().toLowerCase();
  var localQ=(exLedgerState.q||"").trim().toLowerCase();
  var rows=arr(cf.outflowRows).slice();
  // newest first
  rows.sort(function(a,b){ return (a.date<b.date?1:a.date>b.date?-1:0); });
  rows=rows.filter(function(r){
    if(exLedgerState.cat!=="all" && (r.category||"")!==exLedgerState.cat) return false;
    function hit(q){
      if(!q) return true;
      var hay=((r.category||"")+" "+(r.counterparty||"")+" "+(r.desc||"")+" "+(r.date||"")).toLowerCase();
      return hay.indexOf(q)>=0;
    }
    return hit(localQ) && hit(globalQ);
  });
  var cnt=el("exLedgerCount");
  if(cnt) cnt.textContent = num(rows.length)+(rows.length===1?" transaction":" transactions");
  if(!rows.length){ tbl.innerHTML='<div class="empty">No transactions match.</div>'; return; }
  var body=rows.map(function(r){
    return '<tr><td>'+esc(r.date||"—")+'</td>'
      +'<td>'+esc(r.category||"—")+'</td>'
      +'<td>'+esc(r.counterparty||"—")+'</td>'
      +'<td class="num neg">'+money(Math.abs(+r.amount||0))+'</td>'
      +'<td>'+esc(r.desc||"—")+'</td></tr>';
  }).join("");
  tbl.innerHTML='<div class="tscroll"><table><thead><tr>'
    +'<th>Date</th><th>Category</th><th>Counterparty</th><th>Amount</th><th>Description</th>'
    +'</tr></thead><tbody>'+body+'</tbody></table></div>';
}

/* ===================== SANDBOX ===================== */
var sbState = { product:null, price:0, qty:0, targetMargin:30, batch:"" };

function sbProduct(){
  if(sbState.product==null) return products[0]||null;
  return products.filter(function(p){return String(p.productId)===String(sbState.product);})[0]||products[0]||null;
}
function sbBatches(p){ return (p && p.modalBatches && p.modalBatches.length) ? p.modalBatches : []; }
// cost basis = a specific batch's landed cost when one is picked, else the avg landed modal
function sbLanded(p){
  var bs=sbBatches(p);
  if(sbState.batch!=="" && sbState.batch!=null && bs[+sbState.batch]) return +bs[+sbState.batch].landedPerUnit||0;
  return +p.modalLanded||0;
}
function renderSandbox(){
  if(!products.length){ el("sec-sandbox").innerHTML='<div class="empty">No products.</div>'; return; }
  el("sec-sandbox").innerHTML=
    '<style>'
    +'.sb-combo{position:relative;flex:1;min-width:0;}'
    +'.sb-menu{position:absolute;left:0;right:0;top:100%;z-index:40;margin-top:4px;max-height:300px;overflow:auto;'
      +'background:var(--card,#0f1623);border:1px solid var(--line,#243044);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.45);}'
    +'.sb-mi{padding:9px 13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.03);}'
    +'.sb-mi:hover{background:var(--accent-weak,rgba(56,132,255,.16));}'

    +'.sb-mi.empty{color:var(--muted);cursor:default;}'
    +'</style>'
    +'<div class="note">A what-if playground. Pick a product, then <b>drag the sliders</b> to see what happens '
    +'to your profit and margin instantly. Cost basis is the product\'s real landed modal.</div>'
   +'<div class="sec-title">Profit calculator</div>'
   +'<div class="card">'
     +'<div class="ctl-row" style="margin-bottom:10px;"><span class="ctl-lbl">Product</span>'
       +'<div class="sb-combo" id="sbProdCombo">'
         +'<input class="inp" id="sbProdSearch" type="search" autocomplete="off" placeholder="🔍 Search product…" style="width:100%;">'
         +'<div class="sb-menu" id="sbProdMenu" style="display:none;"></div>'
       +'</div></div>'
     +'<div class="ctl-row" style="margin-bottom:10px;"><span class="ctl-lbl">Cost basis</span>'
       +'<select class="dd" id="sbBatch" style="flex:1;min-width:0;"></select></div>'
     +'<div id="sbBasis" class="sb-hint" style="margin-bottom:8px;"></div>'
     +'<div class="ctl-row"><span class="ctl-lbl">Sell price per unit</span>'
       +'<input class="inp" id="sbPriceN" type="number" inputmode="numeric" min="0" step="1000">'
       +'<input id="sbPriceR" type="range" min="0" step="1000">'
       +'<div class="sb-hint" id="sbPriceHint"></div></div>'
     +'<div class="ctl-row" style="margin-top:10px;"><span class="ctl-lbl">Quantity to sell</span>'
       +'<input class="inp" id="sbQtyN" type="number" inputmode="numeric" min="0" step="1">'
       +'<input id="sbQtyR" type="range" min="0" step="1">'
       +'<div class="sb-hint" id="sbQtyHint"></div></div>'
     +'<div class="sb-out" id="sbOut"></div>'
     +'<div class="sb-cmp" id="sbCmp"></div>'
   +'</div>'
   +'<div class="sec-title">Price for target margin</div>'
   +'<div class="card">'
     +'<div class="ctl-row"><span class="ctl-lbl">Desired margin %</span>'
       +'<input class="inp" id="sbTgtN" type="number" inputmode="numeric" min="0" max="95" step="1">'
       +'<input id="sbTgtR" type="range" min="0" max="95" step="1">'
       +'<div class="sb-hint">Required sell price = landed cost ÷ (1 − margin).</div></div>'
     +'<div class="sb-out" id="sbTgtOut" style="grid-template-columns:repeat(2,1fr);"></div>'
   +'</div>';

  // rebuild the batch dropdown for the current product (avg + one row per batch)
  function fillBatches(){
    var p=sbProduct(), bs=sbBatches(p), sel=el("sbBatch");
    if(!sel) return;
    if(!bs.length){ sel.innerHTML='<option value="">Average landed</option>'; sel.disabled=true; sbState.batch=""; return; }
    sel.disabled=false;
    var opts='<option value="">⌀ Average landed ('+money(+p.modalLanded||0)+')</option>';
    opts+=bs.map(function(b,i){
      var nm=b.label||("#"+(b.shipmentId||i));
      var tag=b.onOrder?' · on order (buy only)':(b.qtyRemaining!=null?(' · '+num(b.qtyRemaining)+' left'):'');
      return '<option value="'+i+'">'+esc(nm)+' · '+money(+b.landedPerUnit||0)+tag+'</option>';
    }).join("");
    sel.innerHTML=opts;
    sel.value=(sbState.batch==null?"":sbState.batch);
  }
  function updateBasis(){
    var p=sbProduct(), bs=sbBatches(p), landed=sbLanded(p);
    var picked=(sbState.batch!=="" && sbState.batch!=null && bs[+sbState.batch]);
    var extra='';
    if(picked){
      var b=bs[+sbState.batch];
      extra=' <span style="color:var(--muted);">(buy '+money(+b.buyPerUnit||0)+' + ship/fee '+money(+b.shipFeePerUnit||0)+')</span>';
    }
    el("sbBasis").innerHTML='Cost basis '+(picked?'(selected batch)':'(avg landed)')+': <b>'+money(landed)+'</b> / unit'+extra
      +(p.retailPrice?(' · retail '+money(p.retailPrice)):'')
      +(p.supplierPrice?(' · supplier '+money(p.supplierPrice)):'');
  }
  // init defaults from current product (also resets the basis to average)
  function loadDefaults(){
    var p=sbProduct();
    sbState.batch="";
    fillBatches();
    var landed=sbLanded(p);
    var defPrice=Math.round(+p.retailPrice || (landed*1.2) || 0);
    var defQty=Math.max(1, Math.round(+p.inWarehouse || 10));
    sbState.price=defPrice; sbState.qty=defQty;
    var priceMax=Math.max(defPrice*3, landed*3, 100000);
    var qtyMax=Math.max(defQty*4, 50);
    el("sbPriceN").value=defPrice; el("sbPriceR").max=priceMax; el("sbPriceR").value=defPrice;
    el("sbQtyN").value=defQty; el("sbQtyR").max=qtyMax; el("sbQtyR").value=defQty;
    updateBasis();
  }
  function recalc(){
    var p=sbProduct();
    var landed=sbLanded(p);
    var price=+sbState.price||0, qty=+sbState.qty||0;
    var revenue=price*qty, cogs=landed*qty, profit=revenue-cogs;
    var margin=revenue>0?(profit/revenue*100):0;
    el("sbPriceHint").textContent="= "+money(price)+" each";
    el("sbQtyHint").textContent=num(qty)+" units";
    el("sbOut").innerHTML=
      '<div class="sb-cell"><div class="k">Revenue</div><div class="v num">'+money(revenue)+'</div></div>'
     +'<div class="sb-cell"><div class="k">COGS</div><div class="v num">'+money(cogs)+'</div></div>'
     +'<div class="sb-cell"><div class="k">Profit</div><div class="v num '+(profit>=0?"pos":"neg")+'">'+money(profit)+'</div></div>'
     +'<div class="sb-cell"><div class="k">Margin</div><div class="v num '+marginClass(margin)+'">'+pct(margin)+'</div></div>';
    var cmp="";
    if(p.retailPrice){
      var rm=p.retailPrice>0?((p.retailPrice-landed)/p.retailPrice*100):0;
      var diff=price-p.retailPrice;
      cmp+='At your retail price ('+money(p.retailPrice)+') margin would be <b class="'+marginClass(rm)+'">'+pct(rm)+'</b>. '
         +'You are '+(diff>=0?'<b class="pos">'+money(diff)+' above</b>':'<b class="neg">'+money(-diff)+' below</b>')+' retail.';
    }
    if(p.supplierPrice){
      cmp+=(cmp?'<br>':'')+'Supplier price is '+money(p.supplierPrice)+' / unit.';
    }
    if(!cmp) cmp='No retail/supplier price on record to compare against.';
    el("sbCmp").innerHTML=cmp;
  }
  function recalcTarget(){
    var p=sbProduct();
    var landed=sbLanded(p);
    var m=Math.max(0,Math.min(94,+sbState.targetMargin||0));
    var reqPrice = m>=100 ? 0 : landed/(1-m/100);
    var profit=reqPrice-landed;
    el("sbTgtOut").innerHTML=
      '<div class="sb-cell"><div class="k">Required price / unit</div><div class="v num">'+money(reqPrice)+'</div></div>'
     +'<div class="sb-cell"><div class="k">Profit / unit</div><div class="v num pos">'+money(profit)+'</div></div>';
  }
  function recalcAll(){ recalc(); recalcTarget(); }

  loadDefaults();
  // target default
  el("sbTgtN").value=sbState.targetMargin; el("sbTgtR").value=sbState.targetMargin;
  recalcAll();

  // searchable product combo
  function sbRenderMenu(filter){
    var q=(filter||"").toLowerCase().trim();
    var list=products.filter(function(p){ return !q || prodName(p).toLowerCase().indexOf(q)>=0; });
    var menu=el("sbProdMenu");
    if(!list.length){ menu.innerHTML='<div class="sb-mi empty">No match</div>'; return; }
    menu.innerHTML=list.map(function(p){
      var on=String(p.productId)===String(sbProduct()&&sbProduct().productId);
      return '<div class="sb-mi'+(on?' on':'')+'" data-pid="'+esc(p.productId)+'">'+esc(prodName(p))+'</div>';
    }).join("");
    Array.prototype.forEach.call(menu.querySelectorAll("[data-pid]"),function(it){
      it.addEventListener("mousedown",function(ev){ ev.preventDefault(); sbPick(it.getAttribute("data-pid")); });
    });
  }
  function sbPick(pid){
    sbState.product=pid;
    el("sbProdSearch").value=prodName(sbProduct());
    el("sbProdMenu").style.display="none";
    loadDefaults(); recalcAll();
  }
  el("sbProdSearch").value=prodName(sbProduct());
  el("sbProdSearch").addEventListener("focus",function(){ this.select(); sbRenderMenu(""); el("sbProdMenu").style.display="block"; });
  el("sbProdSearch").addEventListener("input",function(){ sbRenderMenu(this.value); el("sbProdMenu").style.display="block"; });
  el("sbProdSearch").addEventListener("blur",function(){
    var inp=this; setTimeout(function(){ var m=el("sbProdMenu"); if(m) m.style.display="none"; if(inp) inp.value=prodName(sbProduct()); },150);
  });
  el("sbBatch").addEventListener("change",function(e){ sbState.batch=e.target.value; updateBasis(); recalcAll(); });
  el("sbPriceN").addEventListener("input",function(e){ sbState.price=+e.target.value||0; el("sbPriceR").value=sbState.price; recalc(); });
  el("sbPriceR").addEventListener("input",function(e){ sbState.price=+e.target.value||0; el("sbPriceN").value=sbState.price; recalc(); });
  el("sbQtyN").addEventListener("input",function(e){ sbState.qty=+e.target.value||0; el("sbQtyR").value=sbState.qty; recalc(); });
  el("sbQtyR").addEventListener("input",function(e){ sbState.qty=+e.target.value||0; el("sbQtyN").value=sbState.qty; recalc(); });
  el("sbTgtN").addEventListener("input",function(e){ sbState.targetMargin=+e.target.value||0; el("sbTgtR").value=sbState.targetMargin; recalcTarget(); });
  el("sbTgtR").addEventListener("input",function(e){ sbState.targetMargin=+e.target.value||0; el("sbTgtN").value=sbState.targetMargin; recalcTarget(); });
}

function okCard(title,desc){

}
function fixedCard(title,desc){

    +'<div class="ftitle">'+esc(title)+'</div><div class="fdesc">'+desc+'</div></div>';
}
function watchCard(title,fields){
  var subs=Object.keys(fields).map(function(k){
    return '<div class="fsub"><div class="k">'+esc(k)+'</div><div class="t">'+fields[k]+'</div></div>';
  }).join("");
  return '<div class="card finding watch"><span class="ftag">WATCH</span>'
    +'<div class="ftitle">'+esc(title)+'</div>'+subs+'</div>';
}
function renderAudit(){
  var html='<div class="sec-title">Audit findings</div>';
  html += okCard("Revenue integrity","Sales table = cashflow ledger, no double-counting.");
  html += okCard("COGS completeness","Buy + shipping + legs + Wise/FX all captured (~9.6% of COGS is overhead).");
  html += okCard("Books balance","Assets = capital + value created, reconciled ~0%.");
  html += okCard("Supplier debt","All invoices fully paid.");
  html += fixedCard("Sale #60 Journey Together","2 units sold, only 1 costed; added missing FIFO allocation (+Rp114,943 COGS).");

  html += watchCard("Misc opex contains non-expenses",{
    "Problem":"The Rp22.7M 'Miscellaneous' line includes a Rp20M loan to Jodi (repaid) + Rp2.64M store cash float; only ~Rp79k is a real expense.",
    "Affects":"Overstates opex by ~Rp22.6M, would understate net margin to ~8.6% vs true ~10.6%.",
    "How it happened":"Cash-outs to a partner and the store were tagged 'Miscellaneous' (catch-all) instead of a balance-sheet movement; the app lacks a default Loan/Transfer category excluded from P&amp;L.",
    "Solution":"Reclassify the Rp20M as a Loan (receivable, now settled) and the Rp2.64M as an internal store transfer — both excluded from opex.",
    "Effect":"Net profit reflects reality (~Rp130M / 10.6%) and future loans/transfers won't pollute P&amp;L."
  });
  html += watchCard("Sale #338 Rp0 giveaway (CONFIRMED)",{
    "Problem":"1 Ninja Spinner recorded at Rp0.",
    "Affects":"Shows −Rp43,343 on that line (consumed stock at cost, no revenue), tiny drag on gross profit.",
    "How it happened":"Intentional promo/giveaway recorded as a normal Rp0 sale.",
    "Solution":"Confirmed intentional &amp; annotated; optionally reclassify giveaways as a Marketing/Promo expense so COGS shows as marketing spend not negative-margin sale.",
    "Effect":"If reclassified, gross margin isn't dinged by promos and promo cost is visible as marketing."
  });

  html += '<div class="card finding ok verdict"><span class="ftag">VERDICT</span>'
    +'<div class="ftitle">✅ Profitable &amp; healthy</div>'
    +'<div class="fdesc">Profitable; gross ~14%, net ~10.6%. Value created ~Rp121M on ~Rp1B capital in ~7 weeks. '
    +'Thin margin driven by near-cost bulk lots; the key lever is to raise bulk floors / shift mix toward retail + bundles.</div></div>';

  el("sec-audit").innerHTML=html;
}

// integer with "." thousands separators — built by hand (no regex; template
// literals eat backslashes, see prettyTs gotcha).
function menuDots(n){
  var s=String(Math.round(n)), out="", c=0;
  for(var i=s.length-1;i>=0;i--){ out=s.charAt(i)+out; if(++c%3===0 && i>0) out="."+out; }

function menuShortType(t){

function buildMenuText(readyOnly){

var stockState={ q:"", sortKey:"totalStock", sortDir:-1, built:false };
function renderStock(){
  var sec=el("sec-stock");
  if(!stockState.built){
    sec.innerHTML='<div class="sec-title">Stock on hand</div>'
      +'<div class="card">'
        +'<div class="chart-controls" style="margin-bottom:10px;"><div class="ctl-row grow"><span class="ctl-lbl">Search</span>'
          +'<input class="inp" id="stkQ" type="search" autocomplete="off" placeholder="product name…"></div></div>'
        +'<div class="ttotals" id="stkValues" style="margin:2px 0 10px;"></div>'
        +'<div class="mg-count" id="stkCount"></div>'
        +'<div id="stkTable">'+ '' +'</div>'
      +'</div>';
    stockState.built=true;
    el("stkQ").addEventListener("input",function(e){ stockState.q=e.target.value; paintStockBody(); });
  }
  paintStockBody();
}
function paintStockBody(){
  if(!products.length){ el("stkTable").innerHTML='<div class="empty">No products.</div>'; el("stkCount").textContent=""; return; }
  var q=(stockState.q||"").toLowerCase().trim();
  var rows=arr(products).filter(function(p){ return !q || prodName(p).toLowerCase().indexOf(q)>=0; });
  // Value each bucket exactly like the Inventory KPI does: received stock
  // (warehouse/store/transit) at avg LANDED cost, on-order at avg BUY cost — nothing
  // has shipped for it yet, so it carries no shipping. Composites fall back to their
  // derived pair cost. Summing these ties the tab to the Inventory card.
  function landedOf(p){ return +p.avgLanded || +p.modalLanded || 0; }
  function buyOf(p){ return +p.avgBuy || +p.modalBuy || 0; }
  function onHand(p){ return (+p.inWarehouse||0)+(+p.inStore||0)+(+p.inTransit||0); }
  function valWh(p){ return (+p.inWarehouse||0)*landedOf(p); }
  function valSt(p){ return (+p.inStore||0)*landedOf(p); }
  function valTr(p){ return (+p.inTransit||0)*landedOf(p); }
  function valOo(p){ return (+p.onOrder||0)*buyOf(p); }
  function stkValue(p){ return valWh(p)+valSt(p)+valTr(p)+valOo(p); }
  var k=stockState.sortKey, dir=stockState.sortDir;
  rows.sort(function(a,b){
    var va,vb;
    if(k==="name"){ va=prodName(a).toLowerCase(); vb=prodName(b).toLowerCase(); }
    else if(k==="value"){ va=stkValue(a); vb=stkValue(b); }
    else { va=+a[k]||0; vb=+b[k]||0; }
    if(va<vb) return -1*dir; if(va>vb) return 1*dir;
    return prodName(a).toLowerCase().localeCompare(prodName(b).toLowerCase());
  });
  // Composite rows (BBWF) are a view of stock already counted in their parts —
  // include them in the table but NEVER in the totals, or every paired card counts twice.
  var t={inWarehouse:0,inStore:0,inTransit:0,onOrder:0,totalStock:0,value:0,
         vWh:0,vSt:0,vTr:0,vOo:0}, nComp=0;
  rows.forEach(function(p){
    if(p.isComposite){ nComp++; return; }
    t.inWarehouse+=+p.inWarehouse||0; t.inStore+=+p.inStore||0; t.inTransit+=+p.inTransit||0;
    t.onOrder+=+p.onOrder||0; t.totalStock+=+p.totalStock||0;
    t.vWh+=valWh(p); t.vSt+=valSt(p); t.vTr+=valTr(p); t.vOo+=valOo(p);
    t.value+=stkValue(p);
  });
  function vcell(icon,label,units,val){
    return '<div class="ttotal"><div class="t">'+icon+' '+label+'</div>'
      +'<div class="v num">'+money(val)+'</div>'
      +'<div class="t" style="margin-top:2px;">'+num(units)+' units</div></div>';
  }
  el("stkValues").innerHTML=
     vcell("🏠","Warehouse",t.inWarehouse,t.vWh)
    +vcell("🏬","Store",t.inStore,t.vSt)
    +vcell("🚚","In transit",t.inTransit,t.vTr)
    +vcell("⏳","On order",t.onOrder,t.vOo)
    +'<div class="ttotal"><div class="t">📦 Total inventory</div>'
      +'<div class="v num">'+money(t.value)+'</div>'
      +'<div class="t" style="margin-top:2px;">'+num(t.totalStock)+' units</div></div>';
  el("stkCount").innerHTML=num(rows.length)+' products · on-order valued at buy cost (no shipping booked yet)'
    +(nComp?' · <span style="color:var(--muted);">'+num(nComp)+' composite row'+(nComp===1?'':'s')+' shown but not added (already counted in their parts)</span>':'');
  function th(key,label){ var a=stockState.sortKey===key?(stockState.sortDir===-1?" ↓":" ↑"):""; return '<th class="stk-sort" data-k="'+key+'" style="cursor:pointer;white-space:nowrap;">'+label+a+'</th>'; }
  function cell(n){ n=+n||0; return '<td class="num"'+(n===0?' style="color:var(--muted);opacity:.4;"':'')+'>'+num(n)+'</td>'; }
  var body=rows.map(function(p){
    var val=stkValue(p);
    var tag = p.isComposite
      ? ' <span style="font-size:11px;color:var(--muted);">= '+esc(arr(p.parts).map(function(x){ return (x.qty>1?x.qty+"× ":"")+x.name; }).join(" + "))+'</span>'
      : '';
    return '<tr><td style="text-align:left;">🎴 '+esc(prodName(p))+tag+'</td>'
      +cell(p.inWarehouse)+cell(p.inStore)+cell(p.inTransit)+cell(p.onOrder)
      +'<td class="num"><b>'+num(+p.totalStock||0)+'</b></td>'
      +'<td class="num"'+((val===0||p.isComposite)?' style="color:var(--muted);opacity:.55;"':'')
        +(p.isComposite?' title="already counted in its parts"':'')+'>'+money(val)+(p.isComposite?' *':'')+'</td></tr>';
  }).join("");
  el("stkTable").innerHTML='<div class="tscroll"><table><thead><tr>'
    +th("name","Product")+th("inWarehouse","🏠 Wh")+th("inStore","🏬 Store")+th("inTransit","🚚 Transit")+th("onOrder","⏳ Order")+th("totalStock","📦 Total")+th("value","💰 Value")
    +'</tr></thead><tbody>'+body+'</tbody></table></div>';
  Array.prototype.forEach.call(el("stkTable").querySelectorAll(".stk-sort"),function(h){
    h.addEventListener("click",function(){
      var key=h.getAttribute("data-k");
      if(stockState.sortKey===key) stockState.sortDir=stockState.sortDir===-1?1:-1;
      else { stockState.sortKey=key; stockState.sortDir=key==="name"?1:-1; }
      paintStockBody();
    });
  });
}

function prettyTs(ts){
  // Postgres now()::text: "2026-06-11 06:40:50.92827+00" (UTC). Parsed by
  // hand with slice() — deliberately NO regexes: this JS lives inside a TS
  // template literal which eats backslash escapes (a literal d became d in
  // the shipped page once; never again).
  if(!ts) return {abs:"—", rel:""};
  var s=String(ts);
  function N(x){ return parseInt(x,10); }
  var y=N(s.slice(0,4)), mo=N(s.slice(5,7)), da=N(s.slice(8,10));
  var hh=N(s.slice(11,13)), mi=N(s.slice(14,16)), se=N(s.slice(17,19));
  if(!y||!mo||!da||isNaN(hh)||isNaN(mi)) return {abs:s.split(".")[0], rel:""};
  var offMin=0, rest=s.slice(19), pi=rest.indexOf("+"), ni=rest.indexOf("-");
  var p=(pi>=0)?pi:ni, sign=(pi>=0)?1:-1;
  if(p>=0){
    var oz=rest.slice(p+1).split(":").join("");
    offMin=sign*((N(oz.slice(0,2))||0)*60+(N(oz.slice(2,4))||0));
  }
  var d=new Date(Date.UTC(y,mo-1,da,hh,mi,isNaN(se)?0:se)-offMin*60000);
  var abs;
  try{
    abs=d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
  }catch(e){ abs=d.toLocaleString(); }
  var diff=Math.max(0,(Date.now()-d.getTime())/1000), rel;
  if(diff<60) rel="just now";
  else if(diff<3600) rel=Math.round(diff/60)+" min ago";
  else if(diff<86400) rel=Math.round(diff/3600)+" hr ago";
  else rel=Math.round(diff/86400)+" day"+(diff<172800?"":"s")+" ago";
  return {abs:abs, rel:rel};
}

};

/* Searchable combo — options registry + one-time delegated events, so combos
   work inside any modal without per-callsite wiring. Value lives in the hidden
   input (same id the callers already read via MG.v). */
MG._combo = {};
MG._comboWired = false;
MG.wireCombos = function(){
  if(MG._comboWired) return; MG._comboWired=true;
  function wrapOf(t){ return t && t.closest ? t.closest(".mg-combo") : null; }
  function listOf(w){ return w.querySelector(".mg-combo-list"); }
  function openList(w, q){
    var id=w.getAttribute("data-combo"), opts=MG._combo[id]||[], list=listOf(w);
    var needle=(q||"").toLowerCase().trim();
    var hits=needle?opts.filter(function(o){ return o.l.toLowerCase().indexOf(needle)>=0; }):opts;
    list.innerHTML = hits.length
      ? hits.slice(0,80).map(function(o){ return '<div class="mg-combo-opt" data-v="'+esc(o.v)+'">'+esc(o.l)+'</div>'; }).join("")
        +(hits.length>80?'<div class="mg-combo-opt none">…'+num(hits.length-80)+' more — keep typing</div>':'')
      : '<div class="mg-combo-opt none">No match</div>';
    list.style.display="block";
  }
  function pick(w, v, l){
    w.querySelector("input[type=hidden]").value=v;
    w.querySelector("input[type=text]").value=l;
    listOf(w).style.display="none";
  }
  function closeAll(except){
    Array.prototype.forEach.call(document.querySelectorAll(".mg-combo-list"),function(n){
      if(!except || !except.contains(n)) n.style.display="none";
    });
  }
  document.addEventListener("focusin",function(e){
    var w=wrapOf(e.target);
    if(w && e.target.type==="text"){ closeAll(w); e.target.select(); openList(w, ""); }
  });
  document.addEventListener("input",function(e){
    var w=wrapOf(e.target);
    if(w && e.target.type==="text"){
      // typing invalidates the previous selection until a new pick is made
      w.querySelector("input[type=hidden]").value="";
      openList(w, e.target.value);
    }
  });
  document.addEventListener("keydown",function(e){
    if(e.key!=="Enter") return;
    var w=wrapOf(e.target);
    if(w && e.target.type==="text"){
      var first=listOf(w).querySelector(".mg-combo-opt:not(.none)");
      if(first){ e.preventDefault(); pick(w, first.getAttribute("data-v"), first.textContent); }
    }
  });
  document.addEventListener("click",function(e){
    var opt=e.target && e.target.closest ? e.target.closest(".mg-combo-opt:not(.none)") : null;
    if(opt){ var w=wrapOf(opt); pick(w, opt.getAttribute("data-v"), opt.textContent); return; }
    closeAll(wrapOf(e.target));
  });
};
MG.wireCombos();

// Normalize any stored language value to the canonical toggle id, so the
// edit form pre-selects correctly whether the row says "EN"/"JP"/"English"/etc.
MG.normLang = function(l){
  var s=(l||"").toLowerCase();
  if(s==="en"||s==="eng"||s==="english") return "English";
  if(s==="jp"||s==="ja"||s==="japanese") return "Japanese";
  if(s==="cn"||s==="zh"||s==="chinese"||s==="mandarin") return "Chinese";
  if(s==="id"||s==="ind"||s==="indonesia"||s==="indonesian") return "Indonesia";
  return l ? (l.charAt(0).toUpperCase()+l.slice(1)) : "Japanese";
};

/* ---------- searchable product picker ---------- */
MG.pickerHtml = function(id, ph){
  return '<div class="mg-pp" id="'+id+'">'
    +'<input class="inp" type="text" autocomplete="off" placeholder="'+esc(ph||"Search product…")+'" data-pid="">'
    +'<div class="mg-pp-list" style="display:none;"></div></div>';
};
MG.wirePicker = function(root, id, onPick){
  var box=root.querySelector("#"+id); if(!box) return;
  var input=box.querySelector("input"), list=box.querySelector(".mg-pp-list");
  var idx=-1, matches=[];
  function rows(q){
    q=(q||"").toLowerCase().trim();
    var toks=q?q.split(/\s+/):[];
    return MG.cat.products.filter(function(p){
      if(p.is_active===false) return false;
      var hay=MG.prodLabel(p).toLowerCase();
      for(var i=0;i<toks.length;i++) if(hay.indexOf(toks[i])<0) return false;
      return true;
    }).slice(0,40);
  }
  function paint(){
    if(!matches.length){ list.innerHTML='<div class="mg-pp-item" style="cursor:default;color:var(--muted);">No products match.</div>'; return; }
    list.innerHTML=matches.map(function(p,i){
      var st=MG.stockOf(p.id);
      return '<div class="mg-pp-item'+(i===idx?' sel':'')+'" data-i="'+i+'">'
        +'<span>🎴 '+esc(MG.prodLabel(p))+'</span>'
        +'<span class="st">🏠'+num(st.in_warehouse)+' 🏬'+num(st.in_store)
        +(p.sale_price_idr?' · 💵'+money(p.sale_price_idr):'')+'</span></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".mg-pp-item[data-i]"),function(n){
      n.addEventListener("mousedown",function(e){ e.preventDefault(); choose(+n.getAttribute("data-i")); });
    });
  }
  function open(){ matches=rows(input.value); idx=matches.length?0:-1; paint(); list.style.display="block"; }
  function closeList(){ list.style.display="none"; }
  function choose(i){
    var p=matches[i]; if(!p) return;
    input.value=MG.prodLabel(p);
    input.setAttribute("data-pid", String(p.id));
    closeList();
    if(onPick) onPick(p);
  }
  input.addEventListener("focus",open);
  input.addEventListener("input",function(){ input.setAttribute("data-pid",""); open(); });
  input.addEventListener("blur",function(){ setTimeout(closeList,150); });
  input.addEventListener("keydown",function(e){
    if(list.style.display==="none") return;
    if(e.key==="ArrowDown"){ e.preventDefault(); idx=Math.min(matches.length-1,idx+1); paint(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); idx=Math.max(0,idx-1); paint(); }
    else if(e.key==="Enter"){ e.preventDefault(); if(idx>=0) choose(idx); }
    else if(e.key==="Escape"){ closeList(); }
  });
};
MG.pickerVal = function(root, id){
  var box=root.querySelector("#"+id); if(!box) return null;
  var pid=box.querySelector("input").getAttribute("data-pid");
  return pid ? +pid : null;

          return '<option value="'+c.id+'">'+c.icon+' '+esc(c.label)+'</option>';
        }).join("");
      });
    }
    this.fetch();
  },

  fetch:function(force){
    var self=this, st=this.st;
    if(st.loading && !force) return;
    st.loading=true;
    el("mgSaleTable").innerHTML=MG.skel(6);
    st.page=1;
    var body={ limit:100000 };   // load all matching; paginate client-side so search/filter span everything
    if(st.date_from) body.date_from=st.date_from;
    if(st.date_to) body.date_to=st.date_to;
    if(st.product_id) body.product_id=+st.product_id;
    if(st.channel) body.channel=st.channel;
    Promise.all([MG.loadCatalog(), MG.api("sales.list", body)]).then(function(res){
      st.rows=arr((res[1]||{}).sales);
      st.loading=false; st.sel={};
      self.paint();
    }).catch(function(err){
      st.loading=false;
      el("mgSaleTable").innerHTML='<div class="empty">Could not load sales — '+esc(err.message)+'</div>';
    });
  },

  filtered:function(){
    var q=(this.st.q||"").toLowerCase().trim();
    if(!q) return this.st.rows;
    return this.st.rows.filter(function(s){
      var hay=((s.product_name||"")+" "+(s.customer_name||"")+" "+(s.channel_order_id||"")+" "+(s.sale_date||"")+" "+(s.channel||"")+" "+(s.entered_by||"")+" "+(s.notes||"")).toLowerCase();
      return hay.indexOf(q)>=0;
    });
  },

  paint:function(){
    var self=this, st=this.st, all=this.filtered();
    var total=all.length, ps=st.pageSize||100, pages=Math.max(1, Math.ceil(total/ps));
    if(st.page>pages) st.page=pages; if(st.page<1) st.page=1;
    var start=(st.page-1)*ps, rows=all.slice(start, start+ps);
    // Totals over the WHOLE filtered set (all pages / date range), not just this page.
    var tRev=0, tCogs=0, tUnits=0;
    all.forEach(function(s){ tRev+=+s.total_idr||0; tCogs+=+s.cogs_total_idr||0; tUnits+=+s.quantity||0; });
    var tProfit=tRev-tCogs, tMargin=tRev>0?(tProfit/tRev*100):0;
    el("mgSaleTotals").innerHTML=
      '<div class="ttotal"><div class="t">Sales</div><div class="v num">'+num(total)+'</div></div>'
     +'<div class="ttotal"><div class="t">Units</div><div class="v num">'+num(tUnits)+'</div></div>'
     +'<div class="ttotal"><div class="t">Revenue</div><div class="v num">'+money(tRev)+'</div></div>'
     +'<div class="ttotal"><div class="t">COGS</div><div class="v num">'+money(tCogs)+'</div></div>'
     +'<div class="ttotal"><div class="t">Profit</div><div class="v num '+marginClass(tMargin)+'">'+money(tProfit)+'</div></div>'
     +'<div class="ttotal"><div class="t">Margin</div><div class="v num '+marginClass(tMargin)+'">'+pct(tMargin)+'</div></div>';
    el("mgSaleCount").textContent = total
      ? ("Showing "+num(start+1)+"–"+num(start+rows.length)+" of "+num(total)+(total!==st.rows.length?(" (of "+num(st.rows.length)+" total)"):"")+" sales")
      : ("0 of "+num(st.rows.length)+" sales");
    if(!total){
      el("mgSaleTable").innerHTML='<div class="empty">No sales match. Try widening the date range, or record one with ＋ New sale.</div>';
      this.paintBulk(); return;
    }
    function pagerHtml(){
      if(pages<=1) return "";
      function pg(n,label,on,dis){ return '<button data-pg="'+n+'"'+(on?' class="on"':'')+(dis?' disabled':'')+'>'+(label||n)+'</button>'; }
      var out=[pg(st.page-1,"‹",false,st.page<=1)], nums=[];
      if(pages<=9){ for(var i=1;i<=pages;i++) nums.push(i); }
      else { nums.push(1); var lo=Math.max(2,st.page-2), hi=Math.min(pages-1,st.page+2);
        if(lo>2) nums.push("…"); for(var j=lo;j<=hi;j++) nums.push(j); if(hi<pages-1) nums.push("…"); nums.push(pages); }
      nums.forEach(function(n){ out.push(n==="…"?'<span class="gap">…</span>':pg(n,String(n),n===st.page,false)); });
      out.push(pg(st.page+1,"›",false,st.page>=pages));
      return '<div class="mg-pager">'+out.join("")+'</div>';
    }
    var body=rows.map(function(s){
      var cogs=+s.cogs_total_idr||0, total=+s.total_idr||0, profit=total-cogs;
      var m=total>0?(profit/total*100):null;
      var loc=MG.locById(s.from_location);
      var checked=self.st.sel[s.id]?' checked':'';
      var name=s.product_name||MG.prodLabelById(s.product_id);
      var by=s.entered_by||"";
      return '<tr class="mg-click'+(by?" by-staff":"")+'" data-id="'+s.id+'"'
        +(by?' title="Logged by '+esc(by)+' on the staff page"':'')+'>'
        +'<td onclick="event.stopPropagation()"><input type="checkbox" class="mg-cb" data-sel="'+s.id+'"'+checked+'></td>'
        +'<td>'+esc(MG.dstr(s.sale_date))+'</td>'
        +'<td style="max-width:230px;overflow:hidden;text-overflow:ellipsis;">🎴 '+esc(name)+'</td>'
        +'<td class="num">'+num(s.quantity)+'</td>'
        +'<td class="num">'+money(s.unit_price_idr)+'</td>'
        +'<td class="num">'+money(total)+'</td>'
        +'<td style="text-align:left;">'+MG.chChip(s.channel)+'</td>'
        +'<td style="text-align:left;">'+esc(s.customer_name||"—")
          +(by?' <span class="mg-chip staff">✍️ '+esc(by)+'</span>':'')+'</td>'
        +'<td style="text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;" title="'+esc(s.notes||"")+'">'+esc(s.notes||"—")+'</td>'
        +'<td title="'+esc(loc.label)+'">'+loc.icon+'</td>'
        +'<td class="num '+marginClass(m)+'">'+money(profit)+(m!=null?'<span style="display:block;font-size:11px;opacity:.7;">'+pct(m)+'</span>':'')+'</td>'
        +'<td><span class="mg-rowact">'
          +'<button class="mg-iconbtn" data-edit="'+s.id+'" title="Edit">✏️</button>'
          +'<button class="mg-iconbtn" data-del="'+s.id+'" title="Delete">🗑️</button>'
        +'</span></td></tr>';
    }).join("");
    el("mgSaleTable").innerHTML='<div class="tscroll"><table class="mg"><thead><tr>'
      +'<th style="text-align:center;"><input type="checkbox" class="mg-cb" id="mgSaleSelAll" title="Select all on this page"></th>'
      +'<th>Date</th><th>Product</th><th>Qty</th><th>Unit</th><th>Total</th><th>Channel</th><th>Customer</th><th>Notes</th><th>Loc</th><th>Profit</th><th></th>'
      +'</tr></thead><tbody>'+body+'</tbody></table></div>'+pagerHtml();
    var t=el("mgSaleTable");
    Array.prototype.forEach.call(t.querySelectorAll("[data-pg]"),function(b){
      b.addEventListener("click",function(){
        var n=+b.getAttribute("data-pg");
        if(n>=1&&n<=pages){ st.page=n; self.paint(); if(t.scrollIntoView) t.scrollIntoView({block:"start",behavior:"smooth"}); }
      });
    });
    var selAll=el("mgSaleSelAll");
    if(selAll){
      selAll.checked = rows.length>0 && rows.every(function(s){ return self.st.sel[s.id]; });
      selAll.addEventListener("change",function(){
        if(selAll.checked){ rows.forEach(function(s){ self.st.sel[s.id]=true; }); }
        else { rows.forEach(function(s){ delete self.st.sel[s.id]; }); }
        self.paint();
      });
    }
    Array.prototype.forEach.call(t.querySelectorAll("[data-edit]"),function(b){
      b.addEventListener("click",function(e){ e.stopPropagation(); self.editModal(+b.getAttribute("data-edit")); });
    });
    Array.prototype.forEach.call(t.querySelectorAll("[data-del]"),function(b){
      b.addEventListener("click",function(e){ e.stopPropagation(); self.del(+b.getAttribute("data-del")); });
    });
    Array.prototype.forEach.call(t.querySelectorAll("[data-sel]"),function(c){
      c.addEventListener("change",function(){
        var id=+c.getAttribute("data-sel");
        if(c.checked) self.st.sel[id]=true; else delete self.st.sel[id];
        self.paintBulk();
      });
    });
    Array.prototype.forEach.call(t.querySelectorAll("tr.mg-click"),function(r){
      r.addEventListener("click",function(){ self.editModal(+r.getAttribute("data-id")); });
    });
    this.paintBulk();
  },

  paintBulk:function(){
    var self=this, ids=Object.keys(this.st.sel);
    var box=el("mgSaleBulk");
    if(!ids.length){ box.innerHTML=""; return; }
    box.innerHTML='<div class="mg-bulk"><span class="bn">'+num(ids.length)+' selected</span>'
      +'<span class="bn" style="margin-left:6px;font-weight:600;color:var(--muted);">Set channel:</span>'
      +MG.CHANNELS.map(function(c){
        return '<button class="mg-btn sm" data-cls="'+c.id+'">'+c.icon+' '+esc(c.label)+'</button>';
      }).join("")
      +'<span class="spacer" style="flex:1;"></span>'
      +'<button class="mg-btn sm" id="mgSaleBulkDel" style="color:var(--red);">🗑️ Delete</button>'
      +'<button class="mg-btn sm" id="mgSaleSelClear">Clear</button></div>';
    Array.prototype.forEach.call(box.querySelectorAll("[data-cls]"),function(b){
      b.addEventListener("click",function(){
        var ch=b.getAttribute("data-cls");
        MG.api("sales.classify",{ ids: ids.map(Number), channel: ch }).then(function(d){
          MG.toast("Tagged "+num((d&&d.updated)||ids.length)+" sales as "+MG.chById(ch).label,"ok");
          self.st.sel={}; self.fetch(true);
        }).catch(MG.fail);
      });
    });
    box.querySelector("#mgSaleBulkDel").addEventListener("click",function(){
      MG.confirmBox("Delete "+num(ids.length)+" sale"+(ids.length===1?"":"s")+"?",
        "Each one's stock is returned via FIFO reversal and it vanishes from every report. This cannot be undone.")
        .then(function(yes){
          if(!yes) return;
          Promise.all(ids.map(function(id){ return MG.api("sales.delete",{id:Number(id)}); }))
            .then(function(){ MG.toast("Deleted "+num(ids.length)+" sales","ok"); self.st.sel={}; self.fetch(true); MG.loadCatalog(true); })
            .catch(MG.fail);
        });
    });
    box.querySelector("#mgSaleSelClear").addEventListener("click",function(){ self.st.sel={}; self.paint(); });
  },

  /* ---- add sale ---- */
  addModal:function(){
    var self=this;
    var chans=MG.CHANNELS.map(function(c){ return {id:c.id,label:c.label,icon:c.icon,color:c.color}; });
    var locs=MG.LOCATIONS.map(function(l){ return {id:l.id,label:l.label,icon:l.icon}; });
    MG.modal({
      title:"＋ New sale", sub:"FIFO consumes oldest stock first — COGS locks in at sale time.",
      body:'<div class="mg-form">'
        +'<div class="fld"><label>Product</label>'+MG.pickerHtml("mgNsProd")+'</div>'
        +'<div class="mg-grid2">'
          +MG.f.num("mgNsQty","Quantity",1)
          +MG.f.date("mgNsDate","Sale date")
        +'</div>'
        +MG.f.picks("mgNsLoc","Sell from",locs,"warehouse")
        +MG.f.sel("mgNsBatch","Cost batch (optional — blank uses FIFO)",[{v:"",l:"FIFO — oldest stock first"}],"")
        +'<div id="mgNsPlan" class="mg-plan" style="display:none;"></div>'
        +'<div class="mg-grid2">'
          +MG.f.num("mgNsPrice","Unit price (IDR)","",1000)
          +MG.f.num("mgNsTotal","Total (IDR)","",1000)
        +'</div>'
        +MG.f.text("mgNsCust","Customer","","optional")
        +MG.f.picks("mgNsCh","Channel",chans,"manual")
        +MG.f.text("mgNsNotes","Notes","","optional")
        +'<div class="mg-err" id="mgNsErr"></div>'
        +'<div class="mg-foot"><button class="mg-btn" id="mgNsCancel" type="button">Cancel</button>'
        +'<button class="mg-btn primary" id="mgNsSave" type="button">Record sale</button></div>'
      +'</div>',
      onMount:function(body, close){
        var lastEdited="price", planTimer=null, batchOpts=[];
        // Optional: pin the sale to one cost batch. Blank = FIFO (unchanged behaviour).
        function preferLines(){
          var v=MG.v(body,"mgNsBatch");
          if(v==="") return null;
          var o=batchOpts[+v];
          return o?o.lines:null;
        }
        function loadBatches(){
          var pid=MG.pickerVal(body,"mgNsProd"), sel=body.querySelector("#mgNsBatch");
          batchOpts=[]; sel.innerHTML='<option value="">FIFO — oldest stock first</option>';
          if(!pid) return;
          MG.api("sales.batches",{product_id:+pid}).then(function(d){
            batchOpts=arr((d||{}).options);
            sel.innerHTML='<option value="">FIFO — oldest stock first</option>'
              +batchOpts.map(function(o,i){
                return '<option value="'+i+'">'+esc(num(o.qty))+' × '+money(o.cost)+' each</option>';
              }).join("");
          }).catch(function(){});
        }
        function qty(){ return Math.max(0, MG.parseMoney(MG.v(body,"mgNsQty"))); }
        function price(){ return MG.parseMoney(MG.v(body,"mgNsPrice")); }
        function total(){ return MG.parseMoney(MG.v(body,"mgNsTotal")); }
        // Bidirectional: type unit price → total = qty×price; type total →
        // unit price = total/qty. Changing quantity recomputes the derived side.
        function sync(){
          var q=qty();
          if(lastEdited==="total") body.querySelector("#mgNsPrice").value = (q>0 ? Math.round(total()/q) : "") || "";
          else body.querySelector("#mgNsTotal").value = (q>0 ? q*price() : "") || "";
        }
        function plan(){
          var pid=MG.pickerVal(body,"mgNsProd"), q=qty(), loc=MG.pickVal(body,"mgNsLoc");
          var pb=body.querySelector("#mgNsPlan");
          if(!pid||!q){ pb.style.display="none"; return; }
          pb.style.display="block"; pb.className="mg-plan";
          pb.innerHTML="Checking stock…";
          clearTimeout(planTimer);
          planTimer=setTimeout(function(){
            var pf=preferLines();
            MG.api("sales.plan",{ product_id:pid, quantity:q, from_location:loc,
                                  prefer_shipment_line_ids:pf||undefined }).then(function(d){
              d=d||{};
              if(d.can){
                pb.className="mg-plan ok";
                pb.innerHTML='✓ '+num(q)+' available ('+num(d.available)+' in '+esc(MG.locById(loc).label.toLowerCase())+') · '
                  +'COGS <b>'+money(d.cogs_total_idr)+'</b> across '+num(arr(d.allocations).length)+' batch'+(arr(d.allocations).length===1?'':'es');
              } else {
                pb.className="mg-plan bad";
                pb.innerHTML='✗ Only <b>'+num(d.available)+'</b> available in '+esc(MG.locById(loc).label.toLowerCase())+' — reduce quantity or switch location.';
              }
            }).catch(function(err){ pb.className="mg-plan bad"; pb.textContent="Plan failed: "+err.message; });
          },250);
        }
        MG.wirePicker(body,"mgNsProd",function(p){
          if(p.sale_price_idr && !price()){ body.querySelector("#mgNsPrice").value=p.sale_price_idr; lastEdited="price"; sync(); }
          loadBatches(); plan();
        });
        body.querySelector("#mgNsBatch").addEventListener("change",plan);
        MG.wirePicks(body,"mgNsLoc",plan);
        MG.wirePicks(body,"mgNsCh");
        body.querySelector("#mgNsQty").addEventListener("input",function(){ sync(); plan(); });
        body.querySelector("#mgNsPrice").addEventListener("input",function(){ lastEdited="price"; sync(); });
        body.querySelector("#mgNsTotal").addEventListener("input",function(){ lastEdited="total"; sync(); });
        body.querySelector("#mgNsCancel").addEventListener("click",close);
        body.querySelector("#mgNsSave").addEventListener("click",function(){
          var err=body.querySelector("#mgNsErr"); err.textContent="";
          var pid=MG.pickerVal(body,"mgNsProd");
          if(!pid){ err.textContent="Pick a product."; return; }
          if(!qty()){ err.textContent="Quantity must be at least 1."; return; }
          var payload={
            product_id:pid, quantity:qty(),
            unit_price_idr:price(),
            from_location:MG.pickVal(body,"mgNsLoc"),
            sale_date:MG.v(body,"mgNsDate")||MG.today(),
            channel:MG.pickVal(body,"mgNsCh")||"manual"
          };
          var tot=total();
          if(tot) payload.total_idr=tot;
          var pfSave=preferLines();
          if(pfSave) payload.prefer_shipment_line_ids=pfSave;
          var cust=MG.v(body,"mgNsCust").trim(); if(cust) payload.customer_name=cust;
          var notes=MG.v(body,"mgNsNotes").trim(); if(notes) payload.notes=notes;
          var btn=body.querySelector("#mgNsSave"); btn.disabled=true; btn.textContent="Saving…";
          MG.api("sales.create",payload).then(function(){
            close(); MG.toast("Sale recorded 🎉","ok");
            self.fetch(true); MG.loadCatalog(true);
          }).catch(function(e2){ btn.disabled=false; btn.textContent="Record sale"; err.textContent=e2.message; });
        });
      }
    });
  },

  /* ---- multi-line sale: several products, one agreed total ----
     Lines are entered at list price; the agreed final total is spread back
     across them proportionally to line value (last line absorbs the rounding
     remainder), so the per-line totals always sum to exactly what was charged.
     Each line still becomes its own sale row (FIFO/COGS unchanged). */
  basketModal:function(){
    var self=this;
    var chans=MG.CHANNELS.map(function(c){ return {id:c.id,label:c.label,icon:c.icon,color:c.color}; });
    var locs=MG.LOCATIONS.map(function(l){ return {id:l.id,label:l.label,icon:l.icon}; });
    var lines=[]; // {product_id, qty, price, share}
    MG.loadCatalog().then(function(){
      MG.modal({
        title:"🧾 Multi-line sale", wide:true,
        sub:"Add each product at list price, then type the agreed total — the discount spreads across lines automatically.",
        body:'<div class="mg-form">'
          +'<div class="mg-grid3">'
            +MG.f.date("mgBsDate","Sale date")
            +MG.f.text("mgBsCust","Customer","","optional")
            +MG.f.text("mgBsNotes","Notes","","optional")
          +'</div>'
          +MG.f.picks("mgBsLoc","Sell from",locs,"warehouse")
          +MG.f.picks("mgBsCh","Channel",chans,"manual")
          +'<div class="ctl-lbl" style="margin:12px 0 6px;">Add a line</div>'
          +'<div class="fld">'+MG.pickerHtml("mgBsProd")+'</div>'
          +'<div class="mg-grid2">'+MG.f.num("mgBsQty","Quantity","",1)+MG.f.num("mgBsPrice","Unit price (IDR)","",1000)+'</div>'
          +MG.f.sel("mgBsBatch","Cost batch (optional — blank uses FIFO)",[{v:"",l:"FIFO — oldest stock first"}],"")
          +'<button class="mg-btn" id="mgBsAdd" type="button" style="margin-top:8px;">➕ Add line</button>'
          +'<div class="ctl-lbl" style="margin:14px 0 6px;">Lines</div>'
          +'<div class="tscroll"><table class="mg compact"><thead><tr><th>Product</th><th>Qty</th><th>Unit</th><th>Line total</th><th>After discount</th><th></th></tr></thead><tbody id="mgBsBody"></tbody></table></div>'
          +'<div class="mg-grid2" style="margin-top:12px;">'
            +MG.f.num("mgBsFinal","Agreed total (IDR) — leave blank for no discount","",1000)
            +'<div class="fld"><label>Summary</label><div id="mgBsSum" class="mg-plan">No lines yet.</div></div>'
          +'</div>'
          +'<div class="mg-err" id="mgBsErr"></div>'
          +'<div class="mg-foot"><button class="mg-btn" id="mgBsCancel" type="button">Cancel</button>'
          +'<button class="mg-btn primary" id="mgBsSave" type="button">Record sales</button></div>'
        +'</div>',
        onMount:function(body, close){
          function subtotal(){ return lines.reduce(function(s,l){ return s+l.qty*l.price; },0); }
          function finalTotal(){ return MG.parseMoney(MG.v(body,"mgBsFinal")); }
          // spread the agreed total across lines by line value
          function spread(){
            var sub=subtotal(), fin=finalTotal()||sub, assigned=0;
            lines.forEach(function(l,i){
              l.share = (i===lines.length-1)
                ? fin-assigned
                : (sub>0 ? Math.round(fin*(l.qty*l.price)/sub) : Math.round(fin/lines.length));
              assigned += l.share;
            });
          }
          function paint(){
            spread();
            var b=body.querySelector("#mgBsBody");
            b.innerHTML = lines.length ? lines.map(function(l,i){
              return '<tr><td style="text-align:left;">🎴 '+esc(MG.prodLabelById(l.product_id))
                +(l.batchLabel?'<span style="display:block;font-size:11px;color:var(--muted);">📌 '+esc(l.batchLabel)+'</span>':'')+'</td>'
                +'<td class="num">'+num(l.qty)+'</td>'
                +'<td class="num">'+money(l.price)+'</td>'
                +'<td class="num">'+money(l.qty*l.price)+'</td>'
                +'<td class="num"><b>'+money(l.share)+'</b><span style="display:block;font-size:11px;opacity:.7;">'+money(l.qty>0?Math.round(l.share/l.qty):0)+' /u</span></td>'
                +'<td><button class="mg-iconbtn" data-rm="'+i+'" title="Remove">🗑️</button></td></tr>';
            }).join("") : '<tr><td colspan="6" class="empty">No lines yet — add one above.</td></tr>';
            Array.prototype.forEach.call(b.querySelectorAll("[data-rm]"),function(btn){
              btn.addEventListener("click",function(){ lines.splice(+btn.getAttribute("data-rm"),1); paint(); });
            });
            var sub=subtotal(), fin=finalTotal()||sub, disc=sub-fin;
            var sm=body.querySelector("#mgBsSum");
            if(!lines.length){ sm.className="mg-plan"; sm.innerHTML="No lines yet."; return; }
            sm.className="mg-plan"+(disc<0?" bad":" ok");
            sm.innerHTML='Subtotal <b>'+money(sub)+'</b>'
              +(disc>0?' · discount <b class="warnc">−'+money(disc)+'</b> ('+pct(sub>0?disc/sub*100:0)+')':'')
              +(disc<0?' · <b class="neg">surcharge +'+money(-disc)+'</b>':'')
              +' · charge <b>'+money(fin)+'</b> across '+num(lines.length)+' line'+(lines.length===1?'':'s');
          }
          var batchOpts=[];
          function resetBatchSel(){
            batchOpts=[];
            body.querySelector("#mgBsBatch").innerHTML='<option value="">FIFO — oldest stock first</option>';
          }
          function loadBatches(){
            var pid=MG.pickerVal(body,"mgBsProd"), sel=body.querySelector("#mgBsBatch");
            resetBatchSel();
            if(!pid) return;
            MG.api("sales.batches",{product_id:+pid}).then(function(d){
              batchOpts=arr((d||{}).options);
              sel.innerHTML='<option value="">FIFO — oldest stock first</option>'
                +batchOpts.map(function(o,i){
                  return '<option value="'+i+'">'+esc(num(o.qty))+' × '+money(o.cost)+' each</option>';
                }).join("");
            }).catch(function(){});
          }
          MG.wirePicker(body,"mgBsProd",function(p){
            if(p && p.sale_price_idr && !MG.parseMoney(MG.v(body,"mgBsPrice"))) body.querySelector("#mgBsPrice").value=p.sale_price_idr;
            loadBatches();
          });
          MG.wirePicks(body,"mgBsLoc"); MG.wirePicks(body,"mgBsCh");
          body.querySelector("#mgBsFinal").addEventListener("input",paint);
          body.querySelector("#mgBsAdd").addEventListener("click",function(){
            var err=body.querySelector("#mgBsErr"); err.textContent="";
            var pid=MG.pickerVal(body,"mgBsProd"), q=MG.parseMoney(MG.v(body,"mgBsQty")), pr=MG.parseMoney(MG.v(body,"mgBsPrice"));
            if(!pid){ err.textContent="Pick a product."; return; }
            if(!q){ err.textContent="Quantity required."; return; }
            var bv=MG.v(body,"mgBsBatch"), bo=(bv==="")?null:batchOpts[+bv];
            var pref=bo?bo.lines:null, plabel=bo?(money(bo.cost)+" batch"):null;
            var found=null;
            lines.forEach(function(l){
              if(l.product_id===+pid && l.price===pr && String(l.batchKey||"")===String(bv)) found=l;
            });
            if(found) found.qty+=q;
            else lines.push({product_id:+pid, qty:q, price:pr, prefer:pref, batchLabel:plabel, batchKey:bv});
            body.querySelector("#mgBsQty").value=""; body.querySelector("#mgBsPrice").value="";
            resetBatchSel();
            paint();
          });
          body.querySelector("#mgBsCancel").addEventListener("click",close);
          body.querySelector("#mgBsSave").addEventListener("click",function(){
            var err=body.querySelector("#mgBsErr"); err.textContent="";
            if(!lines.length){ err.textContent="Add at least one line."; return; }
            spread();
            var loc=MG.pickVal(body,"mgBsLoc"), date=MG.v(body,"mgBsDate")||MG.today();
            var ch=MG.pickVal(body,"mgBsCh")||"manual";
            var cust=MG.v(body,"mgBsCust").trim(), notes=MG.v(body,"mgBsNotes").trim();
            var btn=body.querySelector("#mgBsSave"); btn.disabled=true; btn.textContent="Checking stock…";
            // pre-check every line so we don't half-write the basket
            Promise.all(lines.map(function(l){
              return MG.api("sales.plan",{product_id:l.product_id, quantity:l.qty, from_location:loc,
                                          prefer_shipment_line_ids:l.prefer||undefined});
            })).then(function(plans){
              var bad=[];
              plans.forEach(function(p,i){
                if(!p || !p.can) bad.push(MG.prodLabelById(lines[i].product_id)+" (only "+num((p&&p.available)||0)+")");
              });
              if(bad.length) throw new Error("Not enough stock in "+MG.locById(loc).label.toLowerCase()+": "+bad.join(", "));
              btn.textContent="Saving…";
              // sequential so FIFO allocations don't race each other
              return lines.reduce(function(chain,l){
                return chain.then(function(){
                  return MG.api("sales.create",{
                    product_id:l.product_id, quantity:l.qty,
                    unit_price_idr: l.qty>0?Math.round(l.share/l.qty):0,
                    total_idr: l.share,
                    from_location:loc, sale_date:date, channel:ch,
                    customer_name:cust||undefined, notes:notes||undefined,
                    prefer_shipment_line_ids:l.prefer||undefined
                  });
                });
              }, Promise.resolve());
            }).then(function(){
              close(); MG.toast(num(lines.length)+" sales recorded 🎉","ok");
              self.fetch(true); MG.loadCatalog(true);
            }).catch(function(e){
              btn.disabled=false; btn.textContent="Record sales"; err.textContent=e.message;
              self.fetch(true);
            });
          });
          paint();
        }
      });
    }).catch(MG.fail);
  },

  /* ---- edit sale ---- */
  editModal:function(id){
    var self=this, s=null;
    for(var i=0;i<this.st.rows.length;i++) if(this.st.rows[i].id===id) s=this.st.rows[i];
    if(!s) return;
    var chans=MG.CHANNELS.map(function(c){ return {id:c.id,label:c.label,icon:c.icon,color:c.color}; });
    var name=s.product_name||MG.prodLabelById(s.product_id);
    MG.modal({
      title:"✏️ Sale #"+s.id,
      sub:"🎴 "+esc(name)+(s.channel_order_id?(' · order <code style="font-size:11px;">'+esc(s.channel_order_id)+'</code>'):''),
      body:'<div class="mg-form">'
        +'<div class="mg-grid2">'
          +MG.f.num("mgEsQty","Quantity",s.quantity)
          +MG.f.date("mgEsDate","Sale date",MG.dstr(s.sale_date))
        +'</div>'
        +'<div class="mg-grid2">'
          +MG.f.num("mgEsPrice","Unit price (IDR)",s.unit_price_idr,1000)
          +MG.f.num("mgEsTotal","Total (IDR)",s.total_idr,1000)
        +'</div>'
        +MG.f.text("mgEsCust","Customer",s.customer_name||"")
        +MG.f.picks("mgEsCh","Channel",chans,s.channel||"manual")
        +MG.f.text("mgEsNotes","Notes",s.notes||"")
        +'<div class="ctl-lbl" style="margin:12px 0 6px;">Cost basis — batches this sale consumed</div>'
        +'<div id="mgEsAlloc" class="mg-plan">Loading…</div>'
        +'<div class="mg-err" id="mgEsErr"></div>'
        +'<div class="mg-foot">'
          +'<button class="mg-btn danger" id="mgEsDel" type="button">🗑 Delete</button>'
          +'<span class="grow"></span>'
          +'<button class="mg-btn" id="mgEsCancel" type="button">Cancel</button>'
          +'<button class="mg-btn primary" id="mgEsSave" type="button">Save changes</button>'
        +'</div>'
      +'</div>',
      onMount:function(body, close){
        // Which cost batches this sale was costed against (locked at sale time).
        MG.api("sales.allocations",{id:s.id}).then(function(d){
          var al=arr((d||{}).allocations), box=body.querySelector("#mgEsAlloc");
          if(!box) return;
          if(!al.length){ box.className="mg-plan bad"; box.textContent="No cost allocation recorded — COGS is 0 for this sale."; return; }
          var tot=0; al.forEach(function(a){ tot+=a.quantity*a.cogs_per_unit_idr; });
          box.className="mg-plan ok";
          box.innerHTML=al.map(function(a){
            return '🎴 '+esc(MG.prodLabelById(a.product_id))+' · '+num(a.quantity)+' × '+money(a.cogs_per_unit_idr)
              +'<span style="display:block;font-size:11px;color:var(--muted);">'
              +(a.invoice_id?('🧾 #'+esc(a.invoice_id)+(a.supplier?(' · '+esc(a.supplier)):'')+' · '):'')
              +'🚚 '+esc(a.shipment_label||('ship #'+a.shipment_id))+(a.shipment_date?(' · '+esc(MG.dstr(a.shipment_date))):'')
              +'</span>';
          }).join("")
            +'<div style="margin-top:6px;">Total COGS <b>'+money(tot)+'</b></div>';
        }).catch(function(e){
          var box=body.querySelector("#mgEsAlloc");
          if(box){ box.className="mg-plan bad"; box.textContent="Could not load cost basis: "+e.message; }
        });
        MG.wirePicks(body,"mgEsCh");
        var lastEdited="price";
        function eq(){ return Math.max(0, MG.parseMoney(MG.v(body,"mgEsQty"))); }
        function ep(){ return MG.parseMoney(MG.v(body,"mgEsPrice")); }
        function et(){ return MG.parseMoney(MG.v(body,"mgEsTotal")); }
        // Bidirectional: type unit price → total = qty×price; type total →
        // unit price = total/qty. Quantity changes recompute the derived side.
        function sync(){
          var q=eq();
          if(lastEdited==="total") body.querySelector("#mgEsPrice").value = (q>0 ? Math.round(et()/q) : "") || "";
          else body.querySelector("#mgEsTotal").value = (q>0 ? q*ep() : "") || "";
        }
        body.querySelector("#mgEsQty").addEventListener("input",sync);
        body.querySelector("#mgEsPrice").addEventListener("input",function(){ lastEdited="price"; sync(); });
        body.querySelector("#mgEsTotal").addEventListener("input",function(){ lastEdited="total"; sync(); });
        body.querySelector("#mgEsCancel").addEventListener("click",close);
        body.querySelector("#mgEsDel").addEventListener("click",function(){ close(); self.del(s.id); });
        body.querySelector("#mgEsSave").addEventListener("click",function(){
          var err=body.querySelector("#mgEsErr"); err.textContent="";
          var updates=[];
          function diff(field, val, old){ if(String(val)!==String(old==null?"":old)) updates.push({field:field, value:val}); }
          var qv=MG.parseMoney(MG.v(body,"mgEsQty"));
          if(qv<1){ err.textContent="Quantity must be at least 1."; return; }
          diff("quantity", qv, s.quantity);
          diff("unit_price_idr", MG.parseMoney(MG.v(body,"mgEsPrice")), s.unit_price_idr);
          diff("total_idr", MG.parseMoney(MG.v(body,"mgEsTotal")), s.total_idr);
          diff("sale_date", MG.v(body,"mgEsDate"), MG.dstr(s.sale_date));
          diff("customer_name", MG.v(body,"mgEsCust").trim(), s.customer_name||"");
          diff("channel", MG.pickVal(body,"mgEsCh"), s.channel||"manual");
          diff("notes", MG.v(body,"mgEsNotes").trim(), s.notes||"");
          if(!updates.length){ close(); return; }
          var btn=body.querySelector("#mgEsSave"); btn.disabled=true; btn.textContent="Saving…";
          var p=Promise.resolve();
          updates.forEach(function(u){
            p=p.then(function(){ return MG.api("sales.update",{ id:s.id, field:u.field, value:u.value }); });
          });
          p.then(function(){
            close(); MG.toast("Sale #"+s.id+" updated","ok");
            self.fetch(true); MG.loadCatalog(true);
          }).catch(function(e2){ btn.disabled=false; btn.textContent="Save changes"; err.textContent=e2.message; });
        });
      }
    });
  },

  del:function(id){
    var self=this;
    MG.confirmBox("Delete sale #"+id+"?",
      "Stock is returned via FIFO reversal and the sale disappears from every report. This cannot be undone.")
      .then(function(yes){
        if(!yes) return;
        MG.api("sales.delete",{id:id}).then(function(){
          MG.toast("Sale #"+id+" deleted","ok");
          self.fetch(true); MG.loadCatalog(true);
        }).catch(MG.fail);
      });
  }
};
