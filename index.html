/* ===================== IMPORT WIZARD (Shopee xlsx) ===================== */
MG.imp = {
  st:{ built:false, orders:null, ordersName:"", income:null, incomeName:"", items:null, summary:null,
       q:"", actionFilter:"", sortKey:"", sortDir:1, fromLocation:"warehouse", servicePct:null },

  // Shopee Biaya Layanan % — user-set (Shopee changes it per promo period), persisted.
  svcPct:function(){
    if(this.st.servicePct!=null) return this.st.servicePct;
    var v=parseFloat(localStorage.getItem("pokehit_shopee_svc_pct"));
    this.st.servicePct=(isFinite(v)&&v>=0)?v:12.5;
    return this.st.servicePct;
  },

  /* SheetJS is lazy-loaded only when the Import tab is used. */
  _libP:null,
  lib:function(){
    if(window.XLSX) return Promise.resolve(window.XLSX);
    if(this._libP) return this._libP;
    var self=this;
    this._libP=new Promise(function(resolve, reject){
      var s=document.createElement("script");
      s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
      s.onload=function(){ resolve(window.XLSX); };
      s.onerror=function(){ self._libP=null; reject(new Error("Could not load the xlsx parser — check your connection.")); };
      document.head.appendChild(s);
    });
    return this._libP;
  },

  readBook:function(file){
    var self=this;
    return this.lib().then(function(XLSX){
      return new Promise(function(resolve, reject){
        var fr=new FileReader();
        fr.onload=function(){
          try{ resolve(XLSX.read(new Uint8Array(fr.result),{type:"array"})); }
          catch(e){ reject(new Error("Could not parse "+file.name+" — is it an xlsx export?")); }
        };
        fr.onerror=function(){ reject(new Error("Could not read "+file.name)); };
        fr.readAsArrayBuffer(file);
      });
    });
  },

  render:function(){
    var sec=el("sec-mg-import"), self=this;
    if(!this.st.built){
      sec.innerHTML=
        '<div class="sec-title">Import — Shopee orders</div>'
       +'<div class="note"><b>How it works:</b> export the orders xlsx from Shopee Seller Centre (Pesanan Saya) — '
         +'optionally also the income xlsx (Penghasilan Saya) for exact payouts — drop them below, review the plan, then commit. '
         +'Cancelled, already-imported and manually-entered sales are detected: nothing is ever double-counted.</div>'
       +'<div class="card">'
         +'<div class="mg-grid2">'
           +'<div class="fld"><label>1 · Orders xlsx (required)</label>'
             +'<div class="mg-drop" id="mgImpDropO">📄 Drop or click to choose<br><span style="font-size:11.5px;">ekspor Pesanan Saya</span></div></div>'
           +'<div class="fld"><label>2 · Income xlsx (optional)</label>'
             +'<div class="mg-drop" id="mgImpDropI">💰 Drop or click to choose<br><span style="font-size:11.5px;">ekspor Penghasilan Saya — exact payouts</span></div></div>'
         +'</div>'
         +'<div class="mg-foot" style="justify-content:flex-start;">'
           +'<button class="mg-btn primary" id="mgImpPrev" type="button" disabled>🔎 Preview import</button>'
           +'<span class="mg-count" id="mgImpHint" style="margin:0;"></span>'
         +'</div>'
       +'</div>'
       +'<div id="mgImpStage"></div>';
      this.st.built=true;
      this.wireDrop("mgImpDropO",".xlsx,.xls",function(f){ self.onOrders(f); });
      this.wireDrop("mgImpDropI",".xlsx,.xls",function(f){ self.onIncome(f); });
      el("mgImpPrev").addEventListener("click",function(){ self.preview(); });
    }
  },

  wireDrop:function(id, accept, onFile){
    var zone=el(id);
    var input=document.createElement("input");
    input.type="file"; input.accept=accept; input.style.display="none";
    zone.parentNode.appendChild(input);
    zone.addEventListener("click",function(){ input.click(); });
    input.addEventListener("change",function(){ if(input.files && input.files[0]) onFile(input.files[0]); input.value=""; });
    zone.addEventListener("dragover",function(e){ e.preventDefault(); zone.classList.add("on"); });
    zone.addEventListener("dragleave",function(){ zone.classList.remove("on"); });
    zone.addEventListener("drop",function(e){
      e.preventDefault(); zone.classList.remove("on");
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
    });
  },

  onOrders:function(file){
    var self=this, zone=el("mgImpDropO");
    zone.textContent="Reading "+file.name+"…";
    this.readBook(file).then(function(wb){
      var XLSX=window.XLSX;
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{raw:false,defval:null});
      if(!rows.length || !("No. Pesanan" in rows[0])){
        throw new Error("No \u201cNo. Pesanan\u201d column — this does not look like a Shopee orders export.");
      }
      self.st.orders=rows; self.st.ordersName=file.name;
      zone.classList.add("loaded");
      zone.innerHTML="✓ "+esc(file.name)+"<br><span style='font-size:11.5px;'>"+num(rows.length)+" rows</span>";
      el("mgImpPrev").disabled=false;
      el("mgImpHint").textContent=self.st.income?"":"Tip: add the income xlsx for exact payouts.";
    }).catch(function(err){
      zone.classList.remove("loaded");
      zone.innerHTML="📄 Drop or click to choose<br><span style='font-size:11.5px;color:var(--red);'>"+esc(err.message)+"</span>";
    });
  },

  onIncome:function(file){
    var self=this, zone=el("mgImpDropI");
    zone.textContent="Reading "+file.name+"…";
    this.readBook(file).then(function(wb){
      var XLSX=window.XLSX;
      var ws=wb.Sheets[wb.SheetNames[0]];
      var grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null});
      var headIdx=-1, snCol=-1, payCol=-1;
      var snRe=/no\.?\s*pesanan/i;
      var payRe=/(total\s*penghasilan|penghasilan\s*bersih|total\s*pencairan|dana\s*pencairan)/i;
      for(var i=0;i<Math.min(grid.length,30);i++){
        var row=grid[i]||[];
        for(var j=0;j<row.length;j++){
          if(row[j] && snRe.test(String(row[j]))){ headIdx=i; snCol=j; break; }
        }
        if(headIdx>=0){
          for(var k=0;k<row.length;k++){
            if(row[k] && payRe.test(String(row[k]))){ payCol=k; break; }
          }
          break;
        }
      }
      if(headIdx<0 || payCol<0) throw new Error("Could not find order/payout columns — is this the income export?");
      var out=[];
      for(var r=headIdx+1;r<grid.length;r++){
        var line=grid[r]||[];
        var sn=line[snCol], pay=line[payCol];
        if(!sn) continue;
        out.push({ order_sn:String(sn).trim(), payout_idr:MG.parseMoney(pay) });
      }
      self.st.income=out; self.st.incomeName=file.name;
      zone.classList.add("loaded");
      zone.innerHTML="✓ "+esc(file.name)+"<br><span style='font-size:11.5px;'>"+num(out.length)+" payouts</span>";
      el("mgImpHint").textContent="";
    }).catch(function(err){
      zone.classList.remove("loaded");
      zone.innerHTML="💰 Drop or click to choose<br><span style='font-size:11.5px;color:var(--red);'>"+esc(err.message)+"</span>";
    });
  },

  preview:function(){
    var self=this, st=this.st;
    if(!st.orders) return;
    var btn=el("mgImpPrev"); if(btn){ btn.disabled=true; btn.textContent="Analyzing…"; }
    el("mgImpStage").innerHTML='<div class="card">'+MG.skel(6)+'</div>';
    var body={ channel:"shopee", orders:st.orders, from_location:st.fromLocation||"warehouse", service_pct:self.svcPct() };
    if(st.income && st.income.length) body.income=st.income;
    Promise.all([MG.loadCatalog(), MG.api("import.preview",body)]).then(function(res){
      var d=res[1]||{};
      st.summary=d.summary||{};
      st.items=arr(d.items).map(function(it){
        var includable = it.action==="insert" || it.action==="link_existing";
        var pid=it.mapped_product_id||null, saveAlias=false;
        // No saved alias? Pre-select the best fuzzy guess so the row isn't a blank
        // dropdown, and flag it to remember the mapping on commit — so the same
        // listing name never blocks again. Only auto-include confident guesses;
        // weaker ones are pre-filled but left unchecked for you to confirm.
        if(!pid){
          var sugg=arr(it.suggestions);
          if(sugg.length){
            pid=sugg[0].product_id;
            saveAlias=true;
            if((+sugg[0].score||0)>=0.6) includable=true;
          }
        }
        return {
          raw:it, include:includable,
          product_id:pid,
          payout:(+it.payout_idr||0),
          saveAlias:saveAlias
        };
      });
      if(btn){ btn.disabled=false; btn.textContent="🔎 Preview import"; }
      self.paintPreview();
    }).catch(function(err){
      if(btn){ btn.disabled=false; btn.textContent="🔎 Preview import"; }
      el("mgImpStage").innerHTML='<div class="card"><div class="empty">Preview failed — '+esc(err.message)+'</div></div>';
    });
  },

  actChip:function(action){
    var map={ insert:["insert","insert"], link_existing:["link","link"], skip_imported:["skip","already imported"],
      skip_cancelled:["skip","cancelled"], skip_unpaid:["skip","unpaid — skipped"], blocked:["blocked","blocked"] };
    var m=map[action]||["skip",action];
    return '<span class="mg-act '+m[0]+'">'+esc(m[1])+'</span>';
  },

  canToggle:function(d){
    var a=d.raw.action;
    return a==="insert" || a==="link_existing" || (a==="blocked" && d.product_id);
  },

  // filtered+sorted view over st.items; each entry keeps its absolute index.
  view:function(){
    var st=this.st, self=this;
    var q=(st.q||"").toLowerCase().trim(), af=st.actionFilter||"";
    var v=st.items.map(function(d,i){ return {d:d,i:i}; }).filter(function(x){
      var it=x.d.raw;
      if(af==="actionable" && !self.canToggle(x.d) && it.action!=="blocked") return false;
      else if(af && af!=="actionable" && it.action!==af) return false;
      if(!q) return true;
      var hay=(it.order_sn+" "+it.product_name+" "+(it.customer_name||"")+" "+it.sale_date+" "+it.action).toLowerCase();
      return hay.indexOf(q)>=0;
    });
    var k=st.sortKey, dir=st.sortDir===-1?-1:1;
    if(k){
      v.sort(function(a,b){
        var ia=a.d.raw, ib=b.d.raw, va, vb;
        if(k==="qty"){ va=+ia.qty; vb=+ib.qty; }
        else if(k==="payout"){ va=+a.d.payout||0; vb=+b.d.payout||0; }
        else if(k==="order"){ va=ia.order_sn; vb=ib.order_sn; }
        else if(k==="product"){ va=ia.product_name; vb=ib.product_name; }
        else if(k==="buyer"){ va=ia.customer_name||""; vb=ib.customer_name||""; }
        else if(k==="action"){ va=ia.action; vb=ib.action; }
        else { va=ia.sale_date; vb=ib.sale_date; }
        if(va<vb) return -1*dir; if(va>vb) return 1*dir; return a.i-b.i;
      });
    }
    return v;
  },

  paintPreview:function(){
    var self=this, st=this.st, s=st.summary||{};
    function chip(key,label,val,cls){
      var on=st.actionFilter===key?' style="border-color:var(--acc);"':'';
      return '<div class="ttotal mg-impchip" data-af="'+key+'"'+on+' title="Click to filter"><div class="t">'+label+'</div><div class="v num '+(cls||"")+'">'+val+'</div></div>';
    }
    var chips='<div class="ttotals" style="cursor:pointer;">'
      +chip("","Rows",num(s.total||st.items.length),"")
      +chip("insert","New sales",num(s.insert||0),"pos")
      +chip("link_existing","Link existing",num(s.link_existing||0),"")
      +chip("skip_imported","Already imported",num(s.skip_imported||0),"")
      +chip("skip_unpaid","Unpaid (skipped)",num(s.skip_unpaid||0),"")
      +chip("skip_cancelled","Cancelled",num(s.skip_cancelled||0),"")
      +chip("blocked","Blocked",num(s.blocked||0),(s.blocked||0)>0?"neg":"")
    +'</div>';

    var view=this.view();
    var eligible=view.filter(function(x){ return self.canToggle(x.d); });
    var allOn = eligible.length>0 && eligible.every(function(x){ return x.d.include; });

    function th(key,label){
      var arrow = st.sortKey===key ? (st.sortDir===-1?" ↓":" ↑") : "";
      return '<th class="mg-sorth" data-sort="'+key+'" style="cursor:pointer;white-space:nowrap;" title="Sort">'+label+arrow+'</th>';
    }

    var rows=view.map(function(x){
      var d=x.d, i=x.i, it=d.raw;
      var canToggle = self.canToggle(d);
      var mapCell;
      if(it.mapped_product_id){
        mapCell='🎴 '+esc(MG.prodLabelById(it.mapped_product_id));
      } else {
        var sugg=arr(it.suggestions);
        mapCell='<select class="dd mg-mapsel" data-map="'+i+'"><option value="">— map product —</option>'
          +sugg.map(function(g){
            return '<option value="'+g.product_id+'"'+(String(d.product_id)===String(g.product_id)?' selected':'')+'>★ '+esc(g.label)+' ('+Math.round((g.score||0)*100)+'%)</option>';
          }).join("")
          +MG.cat.products.filter(function(p){ return p.is_active!==false; }).map(function(p){
            var inSugg=false;
            for(var z=0;z<sugg.length;z++) if(String(sugg[z].product_id)===String(p.id)) inSugg=true;
            if(inSugg) return "";
            return '<option value="'+p.id+'"'+(String(d.product_id)===String(p.id)?' selected':'')+'>'+esc(MG.prodLabel(p))+'</option>';
          }).join("")
        +'</select>';
      }
      var html='<tr'+(arr(it.warnings).length?' style="border-bottom:none;"':'')+(canToggle?' class="mg-imp-row" data-row="'+i+'" style="cursor:pointer;"':'')+'>'
        +'<td onclick="event.stopPropagation()">'
          +(canToggle
            ? '<input type="checkbox" class="mg-cb" data-inc="'+i+'"'+(d.include?' checked':'')+'>'
            : '<span style="color:var(--muted);opacity:.5;" title="Nothing to do — this row is '+esc(it.action.split("_").join(" "))+'">–</span>')
        +'</td>'
        +'<td style="text-align:left;"><code style="font-size:11px;">'+esc(it.order_sn)+'</code></td>'
        +'<td style="text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis;" title="'+esc(it.product_name)+'">'+esc(it.product_name)+'</td>'
        +'<td style="text-align:left;">'+mapCell+'</td>'
        +'<td class="num">'+num(it.qty)+'</td>'
        +'<td>'+esc(it.sale_date)+'</td>'
        +'<td style="text-align:left;">'+esc(it.customer_name||"—")+'</td>'
        +'<td><input class="inp mg-payout num" data-pay="'+i+'" value="'+(d.payout||0)+'"></td>'
        +'<td style="text-align:left;"><span class="mg-chip">'+esc({order:"order subtotal",income:"income ✓","shopee_net":"net (Shopee fees)"}[it.payout_source]||it.payout_source||"—")+'</span></td>'
        +'<td style="text-align:left;">'+self.actChip(it.action)
          +(it.match_sale_id?(' <span style="font-size:11px;color:var(--muted);">#'+it.match_sale_id+'</span>'):'')+'</td>'
      +'</tr>';
      if(arr(it.warnings).length){
        html+='<tr class="mg-imp-row-x"><td></td><td colspan="9" style="text-align:left;">'
          +'<div class="mg-warnline">⚠ '+it.warnings.map(esc).join(" · ")+'</div></td></tr>';
      }
      return html;
    }).join("");

    el("mgImpStage").innerHTML='<div class="card">'
      +'<div class="sec-title" style="margin-top:0;">Review plan <span style="font-weight:400;color:var(--muted);font-size:12px;">— click a summary chip to filter, headers to sort</span></div>'
      +chips
      +'<div id="mgImpBar" style="position:sticky;top:6px;z-index:25;">'
        +'<div class="mg-bulk" style="margin:10px 0;">'
          +'<button class="mg-btn primary" id="mgImpGo" type="button"></button>'
          +'<span class="mg-count" id="mgImpSelInfo" style="margin:0;"></span>'
          +'<span class="spacer" style="flex:1;"></span>'
          +'<span class="bn" style="color:var(--muted);font-weight:600;">Shopee svc %:</span>'
          +'<input class="inp" id="mgImpSvc" type="number" min="0" step="0.5" value="'+esc(self.svcPct())+'" title="Biaya Layanan % on free-shipping orders. Change when Shopee changes it — remembered next time." style="width:64px;min-height:32px;font-size:13px;">'
          +'<span class="bn" style="color:var(--muted);font-weight:600;">Deduct from:</span>'
          +'<button class="mg-btn sm'+(st.fromLocation!=="store"?" primary":"")+'" id="mgImpLocWh" type="button">🏠 Warehouse</button>'
          +'<button class="mg-btn sm'+(st.fromLocation==="store"?" primary":"")+'" id="mgImpLocSt" type="button">🏬 Store</button>'
          +'<input class="inp" id="mgImpQ" type="search" autocomplete="off" placeholder="🔍 order, product, buyer…" value="'+esc(st.q||"")+'" style="max-width:200px;min-height:32px;font-size:13px;">'
          +'<button class="mg-btn sm" id="mgImpSelAll" type="button">'+(allOn?"Unselect":"Select")+' all eligible ('+num(eligible.length)+')</button>'
          +(st.actionFilter?'<button class="mg-btn sm" id="mgImpClearF" type="button">✕ Clear filter</button>':'')
        +'</div>'
      +'</div>'
      +'<div class="mg-count">'+num(view.length)+' of '+num(st.items.length)+' rows shown · disabled checkboxes = nothing to do (already imported / cancelled / unpaid)</div>'
      +'<div class="tscroll"><table class="mg"><thead><tr>'
        +'<th><input type="checkbox" class="mg-cb" id="mgImpSelHdr"'+(allOn?' checked':'')+(eligible.length?'':' disabled')+' title="Select all eligible shown"></th>'
        +th("order","Order")+th("product","Shopee product")+'<th>Maps to</th>'+th("qty","Qty")+th("date","Date")+th("buyer","Buyer")+th("payout","Payout")+'<th>Src</th>'+th("action","Action")
      +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div class="mg-count" style="margin-top:8px;">Inserts consume FIFO stock; links just tag the existing sale.</div>'
      +'<div id="mgImpResults"></div>'
    +'</div>';

    var stage=el("mgImpStage");
    Array.prototype.forEach.call(stage.querySelectorAll("[data-inc]"),function(c){
      c.addEventListener("change",function(){
        st.items[+c.getAttribute("data-inc")].include=c.checked;
        self.syncGo();
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll("tr.mg-imp-row"),function(r){
      r.addEventListener("click",function(e){
        if(e.target && (e.target.tagName==="SELECT"||e.target.tagName==="INPUT"||e.target.tagName==="OPTION")) return;
        var d=st.items[+r.getAttribute("data-row")];
        d.include=!d.include;
        var cb=r.querySelector("[data-inc]"); if(cb) cb.checked=d.include;
        self.syncGo();
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll("[data-map]"),function(sel){
      sel.addEventListener("change",function(){
        var d=st.items[+sel.getAttribute("data-map")];
        d.product_id=sel.value?+sel.value:null;
        d.saveAlias=!!sel.value;
        d.include=!!sel.value && d.raw.action!=="skip_imported" && d.raw.action!=="skip_cancelled";
        self.paintPreview();
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll("[data-pay]"),function(inp){
      inp.addEventListener("input",function(){
        st.items[+inp.getAttribute("data-pay")].payout=MG.parseMoney(inp.value);
        self.syncGo();
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll(".mg-impchip"),function(c){
      c.addEventListener("click",function(){
        var af=c.getAttribute("data-af");
        st.actionFilter = (st.actionFilter===af) ? "" : af;
        self.paintPreview();
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll(".mg-sorth"),function(h){
      h.addEventListener("click",function(){
        var k=h.getAttribute("data-sort");
        if(st.sortKey===k) st.sortDir=(st.sortDir===-1)?1:-1;
        else { st.sortKey=k; st.sortDir=1; }
        self.paintPreview();
      });
    });
    var qIn=el("mgImpQ");
    qIn.addEventListener("input",function(){
      st.q=qIn.value;
      clearTimeout(self._qt);
      self._qt=setTimeout(function(){
        var pos=qIn.selectionStart;
        self.paintPreview();
        var n=el("mgImpQ"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
      },250);
    });
    function setAll(on){
      self.view().forEach(function(x){ if(self.canToggle(x.d)) x.d.include=on; });
      self.paintPreview();
    }
    function setLoc(loc){ if(st.fromLocation===loc) return; st.fromLocation=loc; self.preview(); }
    var lw=el("mgImpLocWh"); if(lw) lw.addEventListener("click",function(){ setLoc("warehouse"); });
    var lst=el("mgImpLocSt"); if(lst) lst.addEventListener("click",function(){ setLoc("store"); });
    var sv=el("mgImpSvc"); if(sv) sv.addEventListener("change",function(){
      var v=parseFloat(sv.value);
      if(!isFinite(v)||v<0){ sv.value=self.svcPct(); return; }
      st.servicePct=v; try{ localStorage.setItem("pokehit_shopee_svc_pct",String(v)); }catch(e){}
      self.preview();
    });
    el("mgImpSelAll").addEventListener("click",function(){ setAll(!allOn); });
    var hdr=el("mgImpSelHdr"); if(hdr) hdr.addEventListener("change",function(){ setAll(hdr.checked); });
    var cf=el("mgImpClearF"); if(cf) cf.addEventListener("click",function(){ st.actionFilter=""; self.paintPreview(); });
    el("mgImpGo").addEventListener("click",function(){ self.commit(); });
    this.syncGo();
  },

  selected:function(){
    return (this.st.items||[]).filter(function(d){
      if(!d.include || !d.product_id) return false;
      var a=d.raw.action;
      return a==="insert" || a==="link_existing" || a==="blocked";
    });
  },

  syncGo:function(){
    var picked=this.selected();
    var n=picked.length, tot=0;
    picked.forEach(function(d){ tot+=(+d.payout||0); });
    var btn=el("mgImpGo"); if(!btn) return;
    btn.textContent="📥 Commit "+num(n)+" sale"+(n===1?"":"s");
    btn.disabled=!n;
    var info=el("mgImpSelInfo");
    if(info) info.textContent = n ? (num(n)+" selected · "+money(tot)) : "nothing selected";
  },

  commit:function(){
    var self=this, st=this.st;
    var picked=this.selected();
    if(!picked.length) return;
    var items=picked.map(function(d){
      var it=d.raw;
      var isLink = it.action==="link_existing" && it.match_sale_id;
      var out={
        mode:isLink?"link":"insert",
        order_sn:it.order_sn,
        product_id:d.product_id,
        qty:it.qty,
        sale_date:it.sale_date,
        customer_name:it.customer_name||null,
        total_idr:d.payout||0
      };
      if(isLink) out.sale_id=it.match_sale_id;
      else out.from_location=st.fromLocation||"warehouse";
      if(d.saveAlias) out.save_alias=it.product_name;
      return out;
    });
    var btn=el("mgImpGo"); btn.disabled=true; btn.textContent="Committing…";
    MG.api("import.commit",{ channel:"shopee", items:items }).then(function(d){
      var results=arr((d||{}).results);
      var ins=0, lnk=0, dup=0, errs=0;
      var lines=results.map(function(r){
        var icon, cls="";
        if(r.status==="inserted"){ ins++; icon="✓"; cls="pos"; }
        else if(r.status==="linked"){ lnk++; icon="🔗"; cls="pos"; }
        else if(r.status==="skipped_duplicate"){ dup++; icon="↷"; cls=""; }
        else { errs++; icon="✗"; cls="neg"; }
        return '<div class="sline"><span class="'+cls+'">'+icon+' <code style="font-size:11px;">'+esc(r.order_sn)+'</code> '
          +esc(r.status)+(r.sale_id?(" → sale #"+r.sale_id):"")+'</span>'
          +(r.error?'<span class="mg-warnline">'+esc(r.error)+'</span>':'')+'</div>';
      }).join("");
      el("mgImpResults").innerHTML='<div class="mg-stage" style="margin-top:14px;">'
        +'<div style="font-weight:700;margin-bottom:6px;">Done — '+num(ins)+' inserted · '+num(lnk)+' linked · '
        +num(dup)+' duplicates skipped'+(errs?' · <span class="neg">'+num(errs)+' failed</span>':'')+'</div>'
        +lines+'</div>';
      btn.textContent="📥 Committed";
      if((ins+lnk)>0 && !errs){ MG.toast("Import complete 🎉","ok"); self.confetti(); }
      else if(errs){ MG.toast(num(errs)+" rows failed — see details","err"); btn.disabled=false; btn.textContent="📥 Retry failed"; }
      else MG.toast("Nothing new — all rows were already in.","ok");
      MG.loadCatalog(true);
    }).catch(function(err){
      btn.disabled=false; self.syncGo();
      MG.fail(err);
    });
  },

  confetti:function(){
    var colors=["#4c9aff","#8b5cf6","#34d399","#fbbf24","#fb7185"];
    for(var i=0;i<46;i++){
      var d=document.createElement("div");
      d.className="mg-confetti";
      d.style.left=(Math.random()*100)+"vw";
      d.style.background=colors[i%colors.length];
      d.style.animationDuration=(2+Math.random()*1.6)+"s";
      d.style.animationDelay=(Math.random()*0.5)+"s";
      document.body.appendChild(d);
      (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },4200); })(d);
    }
  }
};

/* ===================== COMMAND PALETTE (Ctrl/Cmd+K) ===================== */
MG.palette = {
  _node:null, _idx:0, _matches:[],

  init:function(){
    var self=this;
    document.addEventListener("keydown",function(e){
      if((e.metaKey||e.ctrlKey) && String(e.key).toLowerCase()==="k"){
        e.preventDefault(); self.toggle();
      }
    });
  },

  commands:function(){
    var out=[];
    TABS.forEach(function(t){
      out.push({ icon:t[2], label:"Go to "+t[1], kind:"tab", run:function(){ setTab(t[0]); } });
    });
    function act(icon,label,fn){ out.push({ icon:icon, label:label, kind:"action", run:fn }); }
    act("🛍️","New sale",function(){ setTab("mg-sales"); MG.loadCatalog().then(function(){ MG.sales.addModal(); }).catch(MG.fail); });
    act("🎴","New product",function(){ setTab("mg-products"); MG.loadCatalog().then(function(){ MG.products.editModal(null); }).catch(MG.fail); });
    act("🧾","New invoice",function(){ setTab("mg-invoices"); MG.loadCatalog().then(function(){ MG.invoices.addModal(); }).catch(MG.fail); });
    act("🚚","New shipment",function(){ setTab("mg-ship"); MG.loadCatalog().then(function(){ MG.ship.addModal(); }).catch(MG.fail); });

    act("📥","Import Shopee orders",function(){ setTab("mg-import"); });
    act("⏻","Sign out",function(){ signOut(); });
    return out;
  },

  toggle:function(){ if(this._node) this.close(); else this.open(); },

  open:function(){
    var self=this;
    if(this._node) return;
    var wrap=document.createElement("div");
    wrap.className="mg-palette";
    wrap.innerHTML='<div class="mg-pal-card">'
      +'<input type="text" id="mgPalQ" placeholder="Type a command or page…" autocomplete="off" spellcheck="false">'
      +'<div class="mg-pal-list" id="mgPalList"></div>'
      +'<div class="mg-pal-hint"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span></div>'
    +'</div>';
    document.body.appendChild(wrap);
    this._node=wrap;
    this._idx=0;
    var input=wrap.querySelector("#mgPalQ");
    wrap.addEventListener("mousedown",function(e){ if(e.target===wrap) self.close(); });
    input.addEventListener("input",function(){ self._idx=0; self.paint(input.value); });
    input.addEventListener("keydown",function(e){
      if(e.key==="ArrowDown"){ e.preventDefault(); self._idx=Math.min(self._matches.length-1,self._idx+1); self.paint(input.value); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); self._idx=Math.max(0,self._idx-1); self.paint(input.value); }
      else if(e.key==="Enter"){ e.preventDefault(); self.run(self._matches[self._idx]); }
      else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); self.close(); }
    });
    this.paint("");
    setTimeout(function(){ input.focus(); },0);
  },

  close:function(){
    if(this._node && this._node.parentNode) this._node.parentNode.removeChild(this._node);
    this._node=null;
  },

  paint:function(q){
    var self=this;
    q=(q||"").toLowerCase().trim();
    var toks=q?q.split(/\s+/):[];
    this._matches=this.commands().filter(function(c){
      var hay=c.label.toLowerCase();
      for(var i=0;i<toks.length;i++) if(hay.indexOf(toks[i])<0) return false;
      return true;
    });
    if(this._idx>=this._matches.length) this._idx=Math.max(0,this._matches.length-1);
    var list=this._node.querySelector("#mgPalList");
    if(!this._matches.length){
      list.innerHTML='<div class="mg-pal-item" style="cursor:default;color:var(--muted);">No matching commands.</div>';
      return;
    }
    list.innerHTML=this._matches.map(function(c,i){
      var label=esc(c.label);
      if(q){
        var pos=c.label.toLowerCase().indexOf(q);
        if(pos>=0){
          label=esc(c.label.slice(0,pos))+"<b>"+esc(c.label.slice(pos,pos+q.length))+"</b>"+esc(c.label.slice(pos+q.length));
        }
      }
      return '<div class="mg-pal-item'+(i===self._idx?' sel':'')+'" data-i="'+i+'">'
        +'<span class="pi">'+c.icon+'</span><span class="pl">'+label+'</span>'
        +'<span class="pk">'+esc(c.kind)+'</span></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".mg-pal-item[data-i]"),function(n){
      n.addEventListener("mousedown",function(e){ e.preventDefault(); self.run(self._matches[+n.getAttribute("data-i")]); });
    });
    var selNode=list.querySelector(".mg-pal-item.sel");
    if(selNode && selNode.scrollIntoView) selNode.scrollIntoView({block:"nearest"});
  },

  run:function(cmd){
    if(!cmd) return;
    this.close();
    try{ cmd.run(); }catch(e){ MG.fail(e); }
  }
};

try{ var __rpLang=localStorage.getItem("pokehit_report_lang"); if(__rpLang==="en"||__rpLang==="id") RP.lang=__rpLang; }catch(e){}

RP.addI18n = function(o){
  for(var lg in o){ if(!RP._i18n[lg]) RP._i18n[lg]={}; for(var k in o[lg]) RP._i18n[lg][k]=o[lg][k]; }
};
RP.t = function(key, vars){
  var s=RP._i18n[RP.lang] ? RP._i18n[RP.lang][key] : null;
  if(s==null) s=RP._i18n.en[key];
  if(s==null) s=key;
  if(vars) for(var k in vars) s=s.split("{"+k+"}").join(vars[k]==null?"":String(vars[k]));
  return s;
};

/* ---------- date math on ISO strings (UTC so no DST drift) ---------- */
function rpPad(n){ return (n<10?"0":"")+n; }
function rpD(iso){ return new Date(Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10))); }
function rpIso(d){ return d.getUTCFullYear()+"-"+rpPad(d.getUTCMonth()+1)+"-"+rpPad(d.getUTCDate()); }
function rpAdd(iso,n){ var d=rpD(iso); d.setUTCDate(d.getUTCDate()+n); return rpIso(d); }
function rpDiff(a,b){ return Math.round((rpD(b)-rpD(a))/86400000); }
function rpMonthEnd(iso){ var d=rpD(iso.slice(0,8)+"01"); d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(0); return rpIso(d); }
function rpAddMonths(iso,k){
  var y=+iso.slice(0,4), m=+iso.slice(5,7)-1+k, day=+iso.slice(8,10);
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  var first=y+"-"+rpPad(m+1)+"-01", end=rpMonthEnd(first);
  return day>+end.slice(8,10) ? end : first.slice(0,8)+rpPad(day);
}
function rpWd(iso){ return (rpD(iso).getUTCDay()+6)%7; }          // 0 = Monday
function rpMonday(iso){ return rpAdd(iso,-rpWd(iso)); }
function rpToday(){ return MG.today(); }
RP.validIso = function(s){
  s=String(s||"");
  if(s.length!==10||s.charAt(4)!=="-"||s.charAt(7)!=="-") return false;
  var d=rpD(s); return !isNaN(d.getTime()) && rpIso(d)===s;
};
RP.fmtDate = function(iso, noYear){
  if(!iso) return "—";
  var s=(+iso.slice(8,10))+" "+RP.MON[RP.lang][+iso.slice(5,7)-1];
  return noYear ? s : s+" "+iso.slice(0,4);
};
RP.fmtDateWd = function(iso){ return RP.WD[RP.lang][rpWd(iso)]+", "+RP.fmtDate(iso); };
RP.rangeLabel = function(f,t){
  if(!f||!t) return "—";
  var M=RP.MON[RP.lang], ML=RP.MONL[RP.lang];
  var fy=f.slice(0,4), ty=t.slice(0,4), fm=+f.slice(5,7)-1, tm=+t.slice(5,7)-1;
  if(f===t) return RP.fmtDate(f);
  if(f.slice(8)==="01" && t===rpMonthEnd(t)){
    if(f.slice(0,7)===t.slice(0,7)) return ML[fm]+" "+fy;
    if(fm===0 && tm===11 && fy===ty) return fy;
    return M[fm]+(fy===ty?"":" "+fy)+" – "+M[tm]+" "+ty;
  }
  if(fy===ty && fm===tm) return (+f.slice(8))+"–"+(+t.slice(8))+" "+M[fm]+" "+fy;
  if(fy===ty) return RP.fmtDate(f,true)+" – "+RP.fmtDate(t);
  return RP.fmtDate(f)+" – "+RP.fmtDate(t);
};

/* ---------- periods ---------- */
RP.firstDate = function(){
  var f="";
  arr(typeof dailyPnl!=="undefined"?dailyPnl:[]).forEach(function(r){ var d=String(r.date||"").slice(0,10); if(d && (!f||d<f)) f=d; });
  return f||"2024-01-01";
};
// [from, to, unit] — unit drives both the ◀ ▶ stepper and the comparison period
RP.presetRange = function(p){
  var t=rpToday(), mon=rpMonday(t), m1=t.slice(0,8)+"01";
  if(p==="today") return [t,t,{days:1}];
  if(p==="this_week") return [mon,t,{days:7}];
  if(p==="last_week") return [rpAdd(mon,-7),rpAdd(mon,-1),{days:7}];
  if(p==="this_month") return [m1,t,{months:1}];
  if(p==="last_month"){ var lm=rpAddMonths(m1,-1); return [lm,rpMonthEnd(lm),{months:1}]; }
  if(p==="this_quarter"){ var qm=Math.floor((+t.slice(5,7)-1)/3)*3+1; return [t.slice(0,5)+rpPad(qm)+"-01",t,{months:3}]; }
  if(p==="ytd") return [t.slice(0,4)+"-01-01",t,{months:12}];
  if(p==="last_30") return [rpAdd(t,-29),t,{days:30}];
  if(p==="all") return [RP.firstDate(),t,null];
  return null;
};
RP.matchPreset = function(f,t){
  for(var i=0;i<RP.PRESETS.length;i++){ var r=RP.presetRange(RP.PRESETS[i]); if(r && r[0]===f && r[1]===t) return RP.PRESETS[i]; }
  return "custom";
};
RP.unitFor = function(f,t){
  if(f.slice(8)==="01" && t===rpMonthEnd(t))
    return { months:(+t.slice(0,4)-(+f.slice(0,4)))*12+(+t.slice(5,7)-(+f.slice(5,7)))+1 };
  return { days:rpDiff(f,t)+1 };
};
RP.shift = function(f,t,u,dir){
  if(u.months){
    var nt=(t===rpMonthEnd(t)) ? rpMonthEnd(rpAddMonths(t.slice(0,8)+"01",dir*u.months)) : rpAddMonths(t,dir*u.months);
    return [rpAddMonths(f,dir*u.months), nt];
  }
  return [rpAdd(f,dir*u.days), rpAdd(t,dir*u.days)];
};
RP.autoGran = function(f,t){ var n=rpDiff(f,t)+1; return n<=35?"day":(n<=190?"week":"month"); };
RP.hasCmp = function(){ return !!(RP.st.cmp && RP.st.prevFrom); };
RP.setRange = function(f,t,unit,preset){
  if(t<f){ var x=f; f=t; t=x; }
  var st=RP.st;
  st.from=f; st.to=t;
  st.preset=preset||RP.matchPreset(f,t);
  var pr=st.preset!=="custom" ? RP.presetRange(st.preset) : null;
  st.unit=unit||(pr&&pr[2])||RP.unitFor(f,t);
  if(st.preset==="all"){ st.prevFrom=""; st.prevTo=""; }
  else { var pv=RP.shift(f,t,st.unit,-1); st.prevFrom=pv[0]; st.prevTo=pv[1]; }
  st.gran=RP.autoGran(f,t); st.granManual=false;
  RP.save(); RP.syncHash();
};
RP.applyPreset = function(p, noFetch){
  var r=RP.presetRange(p); if(!r) return;
  RP.setRange(r[0],r[1],r[2],p);
  if(!noFetch) RP.refresh(true);
};
// ◀ ▶ move the window by its own unit; a partial window (this month so far)
// steps to the whole previous month, never past today.
RP.step = function(dir){
  var st=RP.st, u=st.unit, td=rpToday(), nf, nt;
  if(!u || st.preset==="all") return;
  if(u.months){ nf=rpAddMonths(st.from,dir*u.months); nt=rpMonthEnd(rpAddMonths(nf.slice(0,8)+"01",u.months-1)); }
  else { nf=rpAdd(st.from,dir*u.days); nt=rpAdd(nf,u.days-1); }
  if(nf>td) return;
  if(nt>td) nt=td;
  RP.setRange(nf,nt,u);
  RP.refresh(true);
};
RP.save = function(){
  var st=RP.st;
  try{ localStorage.setItem("pokehit_report_state", JSON.stringify({ preset:st.preset, from:st.from, to:st.to, gran:st.gran, granManual:st.granManual, cmp:st.cmp })); }catch(e){}
};
RP.readHash = function(){
  var h=location.hash||"";
  if(h.indexOf("#report")!==0) return null;
  var o={}, q=h.split("?")[1]||"";
  q.split("&").forEach(function(p){ var kv=p.split("="); if(kv[0]) o[kv[0]]=decodeURIComponent(kv[1]||""); });
  return o;
};
RP.syncHash = function(){
  if(!RP._active || !RP.st.from) return;
  var h="#report?from="+RP.st.from+"&to="+RP.st.to;
  if(location.hash!==h){ try{ history.replaceState(null,"",location.pathname+location.search+h); }catch(e){} }
};
RP.clearHash = function(){
  if((location.hash||"").indexOf("#report")!==0) return;
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
};
RP.initState = function(){
  var st=RP.st, h=RP.readHash(), s=null;
  try{ s=JSON.parse(localStorage.getItem("pokehit_report_state")||"null"); }catch(e){ s=null; }
  if(s && s.cmp===false) st.cmp=false;
  if(h && RP.validIso(h.from) && RP.validIso(h.to)) RP.setRange(h.from,h.to);
  else if(s && s.preset && s.preset!=="custom" && RP.presetRange(s.preset)) RP.applyPreset(s.preset,true);
  else if(s && RP.validIso(s.from) && RP.validIso(s.to)) RP.setRange(s.from,s.to);
  else RP.applyPreset("this_month",true);
  if(s && s.granManual && s.from===st.from && s.to===st.to && (s.gran==="day"||s.gran==="week"||s.gran==="month")){
    st.gran=s.gran; st.granManual=true; RP.save();
  }
};

/* ---------- small data helpers ---------- */
RP.fRev=function(s){ return +s.total_idr||0; };
RP.fCogs=function(s){ return +s.cogs_total_idr||0; };
RP.fQty=function(s){ return +s.quantity||0; };
RP.fAmt=function(e){ return +e.amount_idr||0; };
RP.fCh=function(s){ return s.channel||"manual"; };
RP.fCat=function(e){ return e.category_name||RP.t("pnl.uncat"); };
RP.fOpex=function(e){ return !!e.in_opex; };
RP.sum=function(rows,f){ var t=0; for(var i=0;i<rows.length;i++) t+=+f(rows[i])||0; return t; };
RP.group=function(rows,keyFn){ var m={}; rows.forEach(function(r){ var k=keyFn(r); (m[k]||(m[k]=[])).push(r); }); return m; };
// Some set names already carry the language/type ("30th Celebration Japanese
// Loose Pack"), so only append the parts the name doesn't already say.
RP.pname=function(s){
  var n=String(s.product_name||("#"+s.product_id)), lo=n.toLowerCase(), lg=String(s.language||""), ty=String(s.type_name||"");
  if(lg && lo.indexOf(lg.toLowerCase().slice(0,5))<0) n+=" "+lg;
  if(ty && lo.indexOf(ty.toLowerCase())<0) n+=" · "+ty;
  return n;
};
RP.chOrder=function(keys){
  function ix(k){ for(var i=0;i<MG.CHANNELS.length;i++) if(MG.CHANNELS[i].id===k) return i; return 99; }
  return keys.slice().sort(function(a,b){ return ix(a)-ix(b); });
};
RP.calc=function(sales, expenses){
  var m={ rev:0, cogs:0, units:0, orders:sales.length, opex:0, opexN:0, teamPaid:0, teamPaidN:0 };
  sales.forEach(function(s){ m.rev+=RP.fRev(s); m.cogs+=RP.fCogs(s); m.units+=RP.fQty(s); });
  expenses.forEach(function(e){ if(e.in_opex){ m.opex+=RP.fAmt(e); m.opexN++; } else { m.teamPaid+=RP.fAmt(e); m.teamPaidN++; } });
  m.gp=m.rev-m.cogs; m.np=m.gp-m.opex;
  m.gm=m.rev?m.gp/m.rev*100:null; m.nm=m.rev?m.np/m.rev*100:null;
  m.aov=m.orders?m.rev/m.orders:null;
  return m;
};
RP.bucketKey=function(iso,g){ return g==="month"?iso.slice(0,7):(g==="week"?rpMonday(iso):iso); };
RP.series=function(sales, expenses, f, t, g){
  var out=[], idx={}, d=f, guard=0;
  while(d<=t && guard<5000){
    var k=RP.bucketKey(d,g);
    if(!(k in idx)){ idx[k]=out.length; out.push({ key:k, from:d, to:d, rev:0, cogs:0, opex:0, orders:0, units:0 }); }
    else out[idx[k]].to=d;
    d=rpAdd(d,1); guard++;
  }
  out.idx=idx;
  sales.forEach(function(s){ var b=out[idx[RP.bucketKey(String(s.sale_date).slice(0,10),g)]]; if(!b) return;
    b.rev+=RP.fRev(s); b.cogs+=RP.fCogs(s); b.orders++; b.units+=RP.fQty(s); });
  expenses.forEach(function(e){ if(!e.in_opex) return; var b=out[idx[RP.bucketKey(String(e.date).slice(0,10),g)]]; if(b) b.opex+=RP.fAmt(e); });
  out.forEach(function(b){ b.gp=b.rev-b.cogs; b.np=b.gp-b.opex; b.gm=b.rev?b.gp/b.rev*100:null; b.nm=b.rev?b.np/b.rev*100:null; b.aov=b.orders?b.rev/b.orders:0; });
  return out;
};
RP.bLabel=function(b,long){
  var g=RP.st.gran;
  if(long) return g==="day" ? RP.fmtDateWd(b.from) : RP.rangeLabel(b.from,b.to);
  if(g==="month") return RP.MON[RP.lang][+b.key.slice(5,7)-1]+" '"+b.key.slice(2,4);
  return RP.fmtDate(b.from,true);
};
RP.prodAgg=function(S){
  var g=RP.group(S,function(s){ return s.product_id; });
  return Object.keys(g).map(function(k){
    var r=g[k], rev=RP.sum(r,RP.fRev), cogs=RP.sum(r,RP.fCogs);
    return { id:r[0].product_id, name:RP.pname(r[0]), rev:rev, cogs:cogs, gp:rev-cogs, gm:rev?(rev-cogs)/rev*100:null, units:RP.sum(r,RP.fQty), n:r.length };
  }).sort(function(a,b){ return b.rev-a.rev; });
};
RP.metrics=function(v){
  var st=RP.st, cmp=RP.hasCmp(), td=rpToday();
  var m={ cur:RP.calc(v.sales,v.expenses), prev:cmp?RP.calc(v.prevSales,v.prevExpenses):null };
  m.days=Math.max(1, rpDiff(st.from, st.to<td?st.to:td)+1);
  m.pdays=cmp?Math.max(1, rpDiff(st.prevFrom,st.prevTo)+1):1;
  m.cur.daily=m.cur.rev/m.days;
  if(m.prev) m.prev.daily=m.prev.rev/m.pdays;
  m.ser=RP.series(v.sales,v.expenses,st.from,st.to,st.gran);
  m.pser=cmp?RP.series(v.prevSales,v.prevExpenses,st.prevFrom,st.prevTo,st.gran):null;
  return m;
};

/* ---------- formatting ---------- */
RP.moneyC=function(n){
  if(privOn()) return "•••";
  n=+n||0;
  var a=Math.abs(n), s=n<0?"-":"", v=a, u="", id=RP.lang==="id";
  if(a>=1e9){ v=a/1e9; u=id?"M":"B"; } else if(a>=1e6){ v=a/1e6; u=id?"jt":"M"; } else if(a>=1e3){ v=a/1e3; u=id?"rb":"K"; }
  return s+"Rp"+(Math.round(v*10)/10).toLocaleString(id?"id-ID":"en-US")+u;
};
RP.fmtV=function(v,kind){
  if(v==null||isNaN(v)) return "—";
  if(privOn()) return "•••";
  return kind==="p"?pct(v):(kind==="n"?num(v):money(v));
};
RP.pctOf=function(x,base){ return base ? pct(x/base*100) : "—"; };
RP.signMoney=function(d){ return (d>0?"+":(d<0?"−":""))+money(Math.abs(d)); };
// Δ% pill. costly=true: an increase is bad (COGS, opex).
RP.delta=function(cur,prev,costly){
  if(!RP.hasCmp()) return "";
  if(cur==null||prev==null||(!prev&&!cur)) return '<span class="rp-d flat">—</span>';
  var tip=privOn()?"":' title="'+esc(RP.t("d.prev",{v:money(prev)}))+'"';
  if(!prev) return '<span class="rp-d '+((cur>0)!==!!costly?"good":"bad")+'"'+tip+'>'+esc(RP.t("d.new"))+'</span>';
  var d=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(d)<0.05) return '<span class="rp-d flat"'+tip+'>0%</span>';
  var up=d>0, good=costly?!up:up;
  return '<span class="rp-d '+(good?"good":"bad")+'"'+tip+'>'+(up?"▲ ":"▼ ")+pct(Math.abs(d))+'</span>';
};
RP.ppDelta=function(cur,prev){
  if(!RP.hasCmp()||cur==null||prev==null) return "";
  var d=cur-prev;
  return ' <span class="'+(d>=0?"pos":"neg")+'">('+(d>=0?"+":"−")+(Math.round(Math.abs(d)*10)/10).toLocaleString("id-ID")+' pp)</span>';
};
RP.spark=function(vals,color){
  var n=vals.length; if(n<2) return '<svg class="rp-spark"></svg>';
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(max===min){ max+=1; min-=1; }
  var pts=vals.map(function(v,i){ return (i/(n-1)*100).toFixed(2)+","+(26-(v-min)/(max-min)*24).toFixed(2); }).join(" ");
  return '<svg class="rp-spark" viewBox="0 0 100 28" preserveAspectRatio="none">'
    +'<polygon points="0,28 '+pts+' 100,28" fill="'+color+'" opacity=".12"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
};

/* ---------- CSV ---------- */
RP.csv=function(filename, headers, rows){
  var Q='"', NL=String.fromCharCode(13,10), LF=String.fromCharCode(10), CR=String.fromCharCode(13), TAB=String.fromCharCode(9);
  function cell(v){
    if(v==null) return "";
    if(typeof v==="number") return isFinite(v) ? String(Math.round(v*100)/100) : "";
    var s=String(v), c=s.charAt(0);
    if(c==="="||c==="+"||c==="@"||c===TAB) s="'"+s;   // no formula injection in spreadsheets
    if(s.indexOf(",")>=0||s.indexOf(Q)>=0||s.indexOf(LF)>=0||s.indexOf(CR)>=0) s=Q+s.split(Q).join(Q+Q)+Q;
    return s;
  }
  var lines=[headers||[]].concat(rows||[]).map(function(r){ return r.map(cell).join(","); });
  var name=String(filename||"report"); if(name.slice(-4).toLowerCase()!==".csv") name+=".csv";
  var blob=new Blob([String.fromCharCode(65279)+lines.join(NL)],{ type:"text/csv;charset=utf-8" });
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); },800);
};

/* ---------- filters ---------- */
RP.view=function(){
  var f=RP.filters, d=RP.st.data, q=String(f.q||"").toLowerCase().trim();
  function inL(list,v){ return !list.length || list.indexOf(v)>=0; }
  function txt(o,keys){ var s=""; for(var i=0;i<keys.length;i++) if(o[keys[i]]!=null) s+=" "+o[keys[i]]; return s.toLowerCase(); }
  var SK=["product_name","language","type_name","customer_name","notes","channel","channel_order_id","entered_by"];
  var EK=["category_name","description","notes","from_name","to_name"];
  function sOk(s){
    if(!inL(f.channels,RP.fCh(s))) return false;
    if(!inL(f.types,s.type_name||"")) return false;
    if(!inL(f.languages,s.language||"")) return false;
    if(f.product_id!=null && +s.product_id!==+f.product_id) return false;
    if(f.customer && String(s.customer_name||"").trim()!==f.customer) return false;
    if(q && txt(s,SK).indexOf(q)<0) return false;
    return true;
  }
  function eOk(e){
    if(!inL(f.categories,RP.fCat(e))) return false;
    if(q && txt(e,EK).indexOf(q)<0) return false;
    return true;
  }
  return { sales:d.cur.sales.filter(sOk), expenses:d.cur.expenses.filter(eOk), cashflow:d.cur.cashflow.filter(eOk),
           prevSales:d.prev.sales.filter(sOk), prevExpenses:d.prev.expenses.filter(eOk), prevCashflow:d.prev.cashflow.filter(eOk) };
};
RP.salesFiltered=function(){ var f=RP.filters; return !!(f.channels.length||f.types.length||f.languages.length||f.product_id!=null||f.customer||f.q); };
RP.prodLabel=function(id){

RP.chipList=function(withQ){

  f.types.forEach(function(v){ out.push(["types",v,RP.t("f.type"),v||RP.t("mix.unknown")]); });
  f.languages.forEach(function(v){ out.push(["languages",v,RP.t("f.language"),v||RP.t("mix.unknown")]); });
  f.categories.forEach(function(v){ out.push(["categories",v,RP.t("f.category"),v]); });
  if(f.product_id!=null) out.push(["product_id",String(f.product_id),RP.t("f.product"),RP.prodLabel(f.product_id)]);
  if(f.customer) out.push(["customer",f.customer,RP.t("f.customer"),f.customer]);

RP.isOn=function(dk,dv){
  var f=RP.filters;

  if(dk==="type") return f.types.indexOf(dv)>=0;
  if(dk==="language") return f.languages.indexOf(dv)>=0;
  if(dk==="category") return f.categories.indexOf(dv)>=0;
  if(dk==="product_id") return f.product_id!=null && +f.product_id===+dv;

// Cross-filter from a chart/insight. Same value again toggles it off.
RP.drill=function(o){
  o=o||{};
  var f=RP.filters;
  function tog(list,v){ return (list.length===1 && list[0]===v) ? [] : [v]; }
  if(o.channel!=null) f.channels=tog(f.channels,String(o.channel));
  if(o.type!=null) f.types=tog(f.types,String(o.type));
  if(o.language!=null) f.languages=tog(f.languages,String(o.language));
  if(o.category!=null) f.categories=tog(f.categories,String(o.category));
  if(o.product_id!=null) f.product_id=(f.product_id!=null && +f.product_id===+o.product_id) ? null : +o.product_id;
  if(o.customer!=null) f.customer=(f.customer===o.customer) ? "" : String(o.customer);
  if(window.innerWidth<900) MG.toast(RP.t("toast.drill"));
  if(o.from && o.to && RP.validIso(o.from) && RP.validIso(o.to)){ RP.setRange(o.from,o.to); RP.refresh(true); }
  else RP.rerender();
};
RP.drillKV=function(dk,dv){
  if(dk==="range"){ var p=String(dv).split("|"); RP.drill({ from:p[0], to:p[1] }); return; }
  var o={}; o[dk]=dv; RP.drill(o);
};
RP.options=function(){
  var d=RP.st.data, f=RP.filters;

    var m={}, out=[];

    sel.forEach(function(v){ if(!(v in m)) m[v]=0; });
    for(var k in m) out.push({ v:k, n:m[k] });
    return out;
  }
  var ch=cnt(d.cur.sales,RP.fCh,f.channels), chs=RP.chOrder(ch.map(function(x){ return x.v; }));
  ch=chs.map(function(k){ for(var i=0;i<ch.length;i++) if(ch[i].v===k) return { v:k, n:ch[i].n, label:MG.chById(k).icon+" "+MG.chById(k).label }; });
  function lab(list){ return list.map(function(x){ x.label=x.v||RP.t("mix.unknown"); return x; }).sort(function(a,b){ return b.n-a.n || a.label.localeCompare(b.label); }); }
  return {
    channels:ch,
    types:lab(cnt(d.cur.sales,function(s){ return s.type_name||""; },f.types)),
    languages:lab(cnt(d.cur.sales,function(s){ return s.language||""; },f.languages)),

  };
};

/* ---------- Chart.js (lazy) ---------- */
RP.css=function(name){ try{ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }catch(e){ return ""; } };
RP.loadChartJs=function(){
  if(RP._cjs) return RP._cjs;
  RP._cjs=new Promise(function(res,rej){
    if(window.Chart){ RP.chartDefaults(); res(); return; }
    var s=document.createElement("script"), done=false;
    s.src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"; s.async=true;
    var to=setTimeout(function(){ if(done) return; done=true; RP._cjsFail=true; rej(new Error("timeout")); },15000);
    s.onload=function(){
      clearTimeout(to);
      if(!window.Chart){ if(!done){ done=true; RP._cjsFail=true; rej(new Error("no Chart")); } return; }
      RP.chartDefaults();
      if(done){ RP._cjsFail=false; if(RP._active && RP._hasData) RP.rerender(); return; }   // late arrival after timeout
      done=true; res();
    };
    s.onerror=function(){ clearTimeout(to); if(done) return; done=true; RP._cjsFail=true; rej(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return RP._cjs;
};
RP.chartDefaults=function(){
  var C=window.Chart; if(!C||RP._cdef) return; RP._cdef=true;
  C.defaults.color=RP.css("--muted")||"#8499ad";

  C.defaults.font.family=getComputedStyle(document.body).fontFamily;
  C.defaults.font.size=11.5;
  C.defaults.maintainAspectRatio=false;
  C.defaults.animation.duration=350;
  var tt=C.defaults.plugins.tooltip;
  tt.backgroundColor="#0c1420"; tt.borderColor=RP.css("--border")||"#233246"; tt.borderWidth=1;
  tt.titleColor=RP.css("--text")||"#e8eef5"; tt.bodyColor=RP.css("--text")||"#e8eef5"; tt.footerColor=RP.css("--muted")||"#8499ad";
  tt.padding=10; tt.cornerRadius=8; tt.boxPadding=4; tt.usePointStyle=true;
  var lg=C.defaults.plugins.legend.labels; lg.boxWidth=9; lg.boxHeight=9; lg.usePointStyle=true; lg.pointStyle="rectRounded"; lg.padding=14;
};
// (Re)create a chart in host. Destroys the previous chart with the same key
// first; host=null just destroys it (section switched to an empty state).
RP.chart=function(key, host, cfg){
  if(RP._charts[key]){ try{ RP._charts[key].destroy(); }catch(e){} delete RP._charts[key]; }
  if(!host) return null;
  if(!window.Chart){
    host.classList.add("auto");
    host.innerHTML='<div class="rp-empty">'+esc(RP.t(RP._cjsFail?"chart.fail":"chart.loading"))+'</div>';
    return null;
  }
  host.innerHTML="<canvas></canvas>";
  try{ RP._charts[key]=new Chart(host.firstChild.getContext("2d"), cfg); }
  catch(e){ if(window.console) console.error(e); host.innerHTML='<div class="rp-empty">'+esc(RP.t("sec.err"))+'</div>'; }
  return RP._charts[key]||null;
};

/* ---------- data ---------- */
RP.split=function(d){
  var st=RP.st, cmp=RP.hasCmp();
  var cur={ sales:[], expenses:[], cashflow:[] }, prev={ sales:[], expenses:[], cashflow:[] };
  function put(list,field,name){
    arr(list).forEach(function(r){
      var x=String(r[field]||"").slice(0,10);
      if(x>=st.from && x<=st.to) cur[name].push(r);
      else if(cmp && x>=st.prevFrom && x<=st.prevTo) prev[name].push(r);
    });
  }
  put(d&&d.sales,"sale_date","sales"); put(d&&d.expenses,"date","expenses"); put(d&&d.cashflow,"date","cashflow");
  st.data={ cur:cur, prev:prev };
};
// One request covers [prevFrom, to]; stale responses (user moved on) are ignored.
RP.refresh=function(useCache){
  var st=RP.st;
  if(!st.from) return Promise.resolve();
  var ff=RP.hasCmp()?st.prevFrom:st.from, key=ff+"|"+st.to, seq=++RP._seq;
  if(!useCache) RP._cache={};
  st.error="";
  var hit=RP._cache[key];
  if(hit && (window.Chart||RP._cjsFail)){
    RP.split(hit); st.loading=false; RP._hasData=true; RP.rerender();
    return Promise.resolve();
  }
  st.loading=true; RP.rerender();
  return Promise.all([ MG.api("report.data",{ date_from:ff, date_to:st.to }), RP.loadChartJs().catch(function(){ return null; }) ])
    .then(function(r){
      if(seq!==RP._seq) return;
      if(Object.keys(RP._cache).length>8) RP._cache={};
      RP._cache[key]=r[0];
      RP.split(r[0]); st.loading=false; RP._hasData=true; RP.rerender();
    })
    .catch(function(err){
      if(seq!==RP._seq) return;
      st.loading=false; st.error=(err&&err.message)||"Error"; RP.rerender();
      if(err && err.code===401) MG.fail(err);
    });
};

  });

/* ---------- events ---------- */
RP.onClick=function(e){
  var t=e.target.closest ? e.target.closest("[data-rpa],[data-rpdk],[data-rpgo],[data-rpcsv],[data-rppnl],[data-rptm],[data-rptop]") : null;
  if(!t) return;
  if(t.hasAttribute("data-rpa")){ RP.act(t.getAttribute("data-rpa"),t); return; }
  if(t.hasAttribute("data-rpcsv")){ var fn=RP._csv[t.getAttribute("data-rpcsv")]; if(fn) fn(); return; }
  if(t.hasAttribute("data-rpgo")){ RP.go(t.getAttribute("data-rpgo")); return; }
  if(t.hasAttribute("data-rppnl")){ var k=t.getAttribute("data-rppnl"); RP.ui.pnlOpen[k]=!RP.ui.pnlOpen[k]; RP.renderSection("pnl"); return; }
  if(t.hasAttribute("data-rptm")){ RP.ui.trendM=t.getAttribute("data-rptm"); RP.renderSection("trend"); return; }
  if(t.hasAttribute("data-rptop")){ RP.ui.topM=t.getAttribute("data-rptop"); RP.renderSection("mix"); return; }
  if(t.hasAttribute("data-rpdk")) RP.drillKV(t.getAttribute("data-rpdk"),t.getAttribute("data-rpdv"));
};
RP.act=function(a,t){
  var st=RP.st, f=RP.filters, fk=t.getAttribute("data-fk"), fv=t.getAttribute("data-fv");
  if(a==="prev") RP.step(-1);
  else if(a==="next") RP.step(1);
  else if(a==="range"||a==="filters"){ RP.ui.panel=(RP.ui.panel===a)?"":a; RP.renderHead(); }
  else if(a==="close"){ RP.ui.panel=""; RP.renderHead(); }
  else if(a==="preset"){ RP.ui.panel=""; RP.applyPreset(t.getAttribute("data-v")); }
  else if(a==="apply"){
    var fr=(el("rpFrom")||{}).value, to=(el("rpTo")||{}).value;
    if(!RP.validIso(fr)||!RP.validIso(to)){ MG.toast(RP.t("rng.bad"),"err"); return; }
    RP.ui.panel=""; RP.setRange(fr,to); RP.refresh(true);
  }
  else if(a==="gran"){ st.gran=t.getAttribute("data-v"); st.granManual=true; RP.save(); RP.rerender(); }
  else if(a==="cmp"){ st.cmp=!st.cmp; RP.save(); RP.refresh(true); }
  else if(a==="lang") RP.setLang(t.getAttribute("data-v"));
  else if(a==="csv") RP.exportCsv();
  else if(a==="print") RP.print();
  else if(a==="fopt"){ var L=f[fk], i=L.indexOf(fv); if(i>=0) L.splice(i,1); else L.push(fv); RP.rerender(); }
  else if(a==="fclr"){ f[fk]=[]; RP.rerender(); }
  else if(a==="fx"){
    if(fk==="product_id") f.product_id=null;
    else if(fk==="customer") f.customer="";
    else if(f[fk] && f[fk].indexOf) f[fk]=f[fk].filter(function(x){ return x!==fv; });
    RP.rerender();
  }
  else if(a==="reset"){ RP.resetFilters(); RP.rerender(); }
  else if(a==="retry") RP.refresh();
  else if(a==="top") window.scrollTo({ top:0, behavior:"smooth" });
};
RP.onChange=function(e){
  var t=e.target;
  if(t && t.id==="rpMonth" && t.value && t.value.length===7){
    var f=t.value+"-01", td=rpToday(), to=rpMonthEnd(f);
    if(f>td) return;
    if(to>td) to=td;
    RP.ui.panel=""; RP.setRange(f,to,{ months:1 }); RP.refresh(true);
  }
};
RP.onInput=function(e){
  var t=e.target; if(!t || t.id!=="rpQ") return;
  clearTimeout(RP._qt);
  RP._qt=setTimeout(function(){
    RP.filters.q=t.value||"";
    RP.renderChips(); RP.renderPrintH(); RP.renderSections();
  },220);
};

  if(l!=="en" && l!=="id") return;

  RP.navLabel(); RP.rerender();

RP.navLabel=function(){

  for(var i=0;i<TABS.length;i++) if(TABS[i][0]==="report") TABS[i][1]=lbl;
  var d=document.querySelector('.navitem[data-tab="report"] span:last-child'); if(d) d.textContent=lbl;
  var m=document.querySelector('.mseg[data-tab="report"]'); if(m) m.textContent=lbl;

RP.print=function(){

RP.exportCsv=function(){
  if(!RP.M || RP.st.loading) return;
  var st=RP.st, M=RP.M, a=M.cur, p=M.prev, rows=[];
  rows.push([RP.t("csv.period"),RP.rangeLabel(st.from,st.to),st.from,st.to]);
  if(p) rows.push([RP.t("csv.prevPeriod"),RP.rangeLabel(st.prevFrom,st.prevTo),st.prevFrom,st.prevTo]);
  var ft=RP.filterText(); if(ft) rows.push([RP.t("csv.filters"),ft]);
  rows.push([]);
  function r(sec,label,cur,prev,kind){
    var ch=(p && cur!=null && prev!=null)?cur-prev:null;
    rows.push([sec,label,cur,(kind==="m" && a.rev)?cur/a.rev*100:null,p?prev:null,ch,(kind!=="p" && ch!=null && prev)?ch/Math.abs(prev)*100:null]);
  }
  var K=RP.t("csv.kpi");
  r(K,RP.t("kpi.rev"),a.rev,p&&p.rev,"m"); r(K,RP.t("kpi.cogs"),a.cogs,p&&p.cogs,"m"); r(K,RP.t("kpi.gp"),a.gp,p&&p.gp,"m");
  r(K,RP.t("pnl.gm")+" %",a.gm,p&&p.gm,"p"); r(K,RP.t("kpi.opex"),a.opex,p&&p.opex,"m"); r(K,RP.t("kpi.np"),a.np,p&&p.np,"m");
  r(K,RP.t("pnl.nm")+" %",a.nm,p&&p.nm,"p"); r(K,RP.t("kpi.orders"),a.orders,p&&p.orders,"n"); r(K,RP.t("kpi.units"),a.units,p&&p.units,"n");
  r(K,RP.t("kpi.aov"),a.aov,p&&p.aov,"n"); r(K,RP.t("kpi.daily"),a.daily,p&&p.daily,"n");
  var P=RP.t("csv.pnl");
  RP.pnlLines(RP._v).forEach(function(x){
    r(P,(x.op?x.op+" ":"")+x.label,x.cur,x.prev,x.mrg?"p":"m");
    (x.kids||[]).forEach(function(k){ r(P,"    "+k.name,k.cur,k.prev,"m"); });
  });
  if(a.teamPaid) rows.push([P,RP.t("pnl.team",{ v:Math.round(a.teamPaid), n:a.teamPaidN })]);
  RP.csv(RP.fname("summary"),[RP.t("csv.section"),RP.t("csv.line"),RP.t("pnl.cur"),RP.t("pnl.pctRev"),RP.t("pnl.prev"),RP.t("pnl.chg"),RP.t("pnl.chgPct")],rows);
};

/* 20 — P&L statement */
RP.pnlLines=function(v){
  var M=RP.M, a=M.cur, p=M.prev;
  function kids(cur,prev,keyFn,valFn,nameFn,order){
    var g=RP.group(cur,keyFn), pg=p?RP.group(prev,keyFn):{}, keys=Object.keys(g);
    Object.keys(pg).forEach(function(k){ if(!(k in g)) keys.push(k); });
    var out=(order?order(keys):keys).map(function(k){ return { name:nameFn(k), cur:RP.sum(g[k]||[],valFn), prev:p?RP.sum(pg[k]||[],valFn):null }; });
    if(!order) out.sort(function(x,y){ return y.cur-x.cur || (y.prev||0)-(x.prev||0); });
    return out;
  }
  function chName(k){ var ch=MG.chById(k); return ch.icon+" "+ch.label; }
  var ox=v.expenses.filter(RP.fOpex), pox=v.prevExpenses.filter(RP.fOpex);
  return [
    { id:"rev", label:RP.t("pnl.rev"), cur:a.rev, prev:p&&p.rev, kids:kids(v.sales,v.prevSales,RP.fCh,RP.fRev,chName,RP.chOrder) },
    { id:"cogs", op:"−", label:RP.t("pnl.cogs"), cur:a.cogs, prev:p&&p.cogs, cost:true, kids:kids(v.sales,v.prevSales,RP.fCh,RP.fCogs,chName,RP.chOrder) },
    { id:"gp", op:"=", label:RP.t("pnl.gp"), cur:a.gp, prev:p&&p.gp, tot:true },
    { id:"gm", label:RP.t("pnl.gm"), cur:a.gm, prev:p&&p.gm, mrg:true },
    { id:"opex", op:"−", label:RP.t("pnl.opex"), cur:a.opex, prev:p&&p.opex, cost:true, kids:kids(ox,pox,RP.fCat,RP.fAmt,function(k){ return k; }) },
    { id:"np", op:"=", label:RP.t("pnl.np"), cur:a.np, prev:p&&p.np, tot:true, big:true },
    { id:"nm", label:RP.t("pnl.nm"), cur:a.nm, prev:p&&p.nm, mrg:true }
  ];
};
RP.addSection({ id:"pnl", order:20, navKey:"nav.pnl", render:function(c,v){
  var M=RP.M, a=M.cur, cmp=RP.hasCmp(), L=RP.pnlLines(v);
  function pv(x,m){ return m ? (x==null?"—":pct(x)) : money(x); }
  function cells(x,cost,m){
    var h='<td class="num">'+pv(x.cur,m)+'</td><td class="num">'+(m?"":RP.pctOf(x.cur,a.rev))+'</td>';
    if(!cmp) return h;
    var d=(x.cur!=null && x.prev!=null)?x.cur-x.prev:null, cls="";
    if(d) cls=((d>0)!==!!cost)?"pos":"neg";
    var ds=d==null?"—":(m?((d>=0?"+":"−")+(Math.round(Math.abs(d)*10)/10).toLocaleString("id-ID")+" pp"):RP.signMoney(d));
    return h+'<td class="num">'+pv(x.prev,m)+'</td><td class="num '+cls+'">'+ds+'</td><td>'+(m?"":RP.delta(x.cur,x.prev,cost))+'</td>';
  }
  var body=L.map(function(x){
    var has=x.kids && x.kids.length, open=has && RP.ui.pnlOpen[x.id];
    var cls=(has?"par":"")+(open?" open":"")+(x.tot?" tot":"")+(x.big?" big":"")+(x.mrg?" mrg":"");
    var neg=(x.tot && x.cur<0)?' class="neg"':"";
    var h='<tr class="'+cls+'"'+(has?' data-rppnl="'+x.id+'"':'')+'><td'+neg+'>'+(has?'<span class="chev">▶</span>':'<span class="chev"></span>')
      +'<span class="op">'+(x.op||"")+'</span>'+esc(x.label)+'</td>'+cells(x,x.cost,x.mrg)+'</tr>';
    if(open) h+=x.kids.map(function(k){ return '<tr class="kid"><td>'+esc(k.name)+'</td>'+cells(k,x.cost,false)+'</tr>'; }).join("");
    return h;
  }).join("");
  var head='<tr><th>'+esc(RP.t("pnl.line"))+'</th><th>'+esc(RP.t("pnl.cur"))+'</th><th>'+esc(RP.t("pnl.pctRev"))+'</th>'
    +(cmp?'<th>'+esc(RP.t("pnl.prev"))+'</th><th>'+esc(RP.t("pnl.chg"))+'</th><th>'+esc(RP.t("pnl.chgPct"))+'</th>':'')+'</tr>';
  var notes="";
  if(a.teamPaid) notes+='<div class="rp-warnnote">🧾 '+RP.t("pnl.team",{ v:'<b class="num">'+money(a.teamPaid)+'</b>', n:'<b>'+num(a.teamPaidN)+'</b>' })+'</div>';
  if(RP.salesFiltered() && !RP.filters.q) notes+='<div class="rp-info">ⓘ '+esc(RP.t("pnl.scope"))+'</div>';
  // Overview's all-time net also books late shipping/FX on already-sold goods
  // (COGS is locked at sale time) so it equals Value Created — say so here.
  if(RP.st.preset==="all" && !RP.filterCount() && bal && bal.valueCreated!=null){
    var adj=a.np-(+bal.valueCreated||0);
    if(Math.abs(adj)>=1) notes+='<div class="rp-info">ⓘ '+RP.t("pnl.adj",{ v:'<b class="num">'+money(adj)+'</b>', n:'<b class="num">'+money(+bal.valueCreated||0)+'</b>' })+'</div>';
  }
  c.innerHTML=RP.secHead("h.pnl")+RP.card(RP.t("h.pnl"),RP.t("pnl.sub"),"pnl",
    '<div class="tscroll"><table class="rp-pnl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+notes);
  RP._csv.pnl=function(){
    var rows=[];
    L.forEach(function(x){
      var line=function(lbl,o,m){ var d=(o.cur!=null&&o.prev!=null)?o.cur-o.prev:null;
        rows.push([lbl,o.cur,m?null:(a.rev?o.cur/a.rev*100:null)].concat(cmp?[o.prev,d,(!m&&d!=null&&o.prev)?d/Math.abs(o.prev)*100:null]:[])); };
      line((x.op?x.op+" ":"")+x.label,x,x.mrg);
      (x.kids||[]).forEach(function(k){ line("    "+k.name,k,false); });
    });
    RP.csv(RP.fname("pnl"),[RP.t("pnl.line"),RP.t("pnl.cur"),RP.t("pnl.pctRev")].concat(cmp?[RP.t("pnl.prev"),RP.t("pnl.chg"),RP.t("pnl.chgPct")]:[]),rows);
  };
}});

  function prevLine(label,fn){ return { type:"line", label:label, _prev:true, data:ser.map(function(b,i){ return pser&&pser[i]?fn(pser[i]):null; }),
    borderColor:C.prev, backgroundColor:C.prev, borderDash:[5,4], borderWidth:1.5, pointRadius:0, pointHoverRadius:3, tension:.3, order:0 }; }
  if(m==="pnl"){
    ds=[ bar(RP.t("kpi.rev"),function(b){ return b.rev; },C.rev), bar(RP.t("kpi.cogs"),function(b){ return b.cogs; },C.cogs), bar(RP.t("kpi.opex"),function(b){ return b.opex; },C.opex),

    ds=[ bar(RP.t("kpi.rev"),function(b){ return b.rev; },C.rev) ]; if(pser) ds.push(prevLine(RP.t("s.prev"),function(b){ return b.rev; }));
  } else if(m==="profit"){

/* 60 — Insights */
RP.insights=function(v){
  var M=RP.M, a=M.cur, p=M.prev, S=v.sales, out=[];
  function B(x){ return '<b class="num">'+x+'</b>'; }
  function N(x){ return '<b>'+esc(x)+'</b>'; }
  function add(icon,tone,key,vars,dk,dv){ out.push({ icon:icon, tone:tone, html:RP.t(key,vars), dk:dk, dv:dv }); }
  if(!S.length && !a.opex) return out;
  if(p && p.rev>0 && S.length){
    var dr=(a.rev-p.rev)/p.rev*100;
    add(dr>=0?"📈":"📉",dr>=0?"good":"bad",dr>=0?"ins.revUp":"ins.revDown",{ d:B(pct(Math.abs(dr))), prev:B(money(p.rev)), cur:B(money(a.rev)) });
  }
  if(p && (a.np||p.np)){ var dn=a.np-p.np; add(dn>=0?"💹":"🔻",dn>=0?"good":"bad",dn>=0?"ins.npUp":"ins.npDown",{ d:B(money(Math.abs(dn))), cur:B(money(a.np)) }); }
  if(a.rev>0){
    if(a.np<0) add("🚨","bad","ins.npNeg",{ v:B(money(-a.np)) });
    else if(a.gm!=null && a.gm<8) add("⚠️","warn","ins.gmLow",{ p:B(pct(a.gm)) });
  }
  if(a.opex>0 && a.gp>0) add("🧮",a.opex/a.gp>0.5?"warn":"neutral","ins.opexShare",{ p:B(pct(a.opex/a.gp*100)) },"go","expenses");
  var days=RP.group(S,function(s){ return String(s.sale_date).slice(0,10); }), dks=Object.keys(days);
  if(dks.length){
    var dl=dks.map(function(k){ return { k:k, rev:RP.sum(days[k],RP.fRev), n:days[k].length }; }).sort(function(x,y){ return y.rev-x.rev; });
    var b=dl[0]; add("🏆","good","ins.best",{ day:N(RP.fmtDateWd(b.k)), v:B(money(b.rev)), n:B(num(b.n)) },"range",b.k+"|"+b.k);
    if(dl.length>2){ var w=dl[dl.length-1]; add("🐢","neutral","ins.worst",{ day:N(RP.fmtDateWd(w.k)), v:B(money(w.rev)), n:B(num(w.n)) },"range",w.k+"|"+w.k); }
    var nd=M.days-dks.length; if(nd>0 && M.days>1) add("📭",nd/M.days>0.3?"warn":"neutral","ins.noSale",{ n:B(num(nd)), d:B(num(M.days)) });
  }
  var P=RP.prodAgg(S);
  if(P.length && a.rev>0){
    var tp=P[0]; add("⭐","neutral","ins.top",{ name:N(tp.name), v:B(money(tp.rev)), share:B(pct(tp.rev/a.rev*100)), u:B(num(tp.units)) },"product_id",tp.id);
    if(P.length>=4){ var t3=(P[0].rev+P[1].rev+P[2].rev)/a.rev*100; add("🎯",t3>=60?"warn":"neutral","ins.top3",{ p:B(pct(t3)), n:B(num(P.length)) }); }
  }
  if(p){
    var pm={}; RP.prodAgg(v.prevSales).forEach(function(x){ pm[x.id]=x; });
    var mv=[]; P.forEach(function(x){ var y=pm[x.id]; if(!y||x.rev<=0||y.rev<=0||x.n<2||y.n<2) return; mv.push({ x:x, d:x.gm-y.gm, prev:y.gm }); });
    mv.sort(function(q,r){ return r.d-q.d; });
    if(mv.length && mv[0].d>=1) add("⬆️","good","ins.mUp",{ name:N(mv[0].x.name), from:B(pct(mv[0].prev)), to:B(pct(mv[0].x.gm)) },"product_id",mv[0].x.id);
    var lo=mv[mv.length-1];
    if(mv.length>1 && lo.d<=-1) add("⬇️","bad","ins.mDown",{ name:N(lo.x.name), from:B(pct(lo.prev)), to:B(pct(lo.x.gm)) },"product_id",lo.x.id);
  }
  if(a.rev>0){
    var cg=RP.group(S,RP.fCh), pcg=p?RP.group(v.prevSales,RP.fCh):{}, best=null, topc=null;
    var keys=Object.keys(cg); Object.keys(pcg).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); });
    keys.forEach(function(k){
      var sc=RP.sum(cg[k]||[],RP.fRev)/a.rev*100;
      if(!topc||sc>topc.s) topc={ k:k, s:sc };
      if(p && p.rev>0){ var sp=RP.sum(pcg[k]||[],RP.fRev)/p.rev*100, d=sc-sp; if(!best||Math.abs(d)>Math.abs(best.d)) best={ k:k, d:d, sc:sc, sp:sp }; }
    });
    if(best && Math.abs(best.d)>=2) add("🔀","neutral","ins.chShift",{ ch:N(MG.chById(best.k).label), from:B(pct(best.sp)), to:B(pct(best.sc)) },"channel",best.k);
    else if(topc && keys.length>1) add("🛒","neutral","ins.chTop",{ ch:N(MG.chById(topc.k).label), p:B(pct(topc.s)) },"channel",topc.k);
  }
  var ox=v.expenses.filter(RP.fOpex), eg=RP.group(ox,RP.fCat), ek=Object.keys(eg);
  if(p){
    var epg=RP.group(v.prevExpenses.filter(RP.fOpex),RP.fCat), up=null;
    ek.forEach(function(k){ var cv=RP.sum(eg[k],RP.fAmt), pv=RP.sum(epg[k]||[],RP.fAmt), d=cv-pv; if(d>0 && (!up||d>up.d)) up={ k:k, d:d, c:cv, q:pv }; });
    if(up) add("💸","warn",up.q>0?"ins.expUp":"ins.expNew",{ cat:N(up.k), d:B(money(up.d)), p:B(up.q>0?pct(up.d/up.q*100):"—"), v:B(money(up.c)) },"category",up.k);
  }
  if(ek.length && a.opex>0){
    var big=ek.map(function(k){ return { k:k, v:RP.sum(eg[k],RP.fAmt) }; }).sort(function(x,y){ return y.v-x.v; })[0];
    add("🏷️","neutral","ins.expTop",{ cat:N(big.k), v:B(money(big.v)), p:B(pct(big.v/a.opex*100)) },"category",big.k);
  }
  var bc=S.filter(function(s){ return RP.fCogs(s)>RP.fRev(s); });
  if(bc.length) add("🩸","bad","ins.below",{ n:B(num(bc.length)), u:B(num(RP.sum(bc,RP.fQty))), v:B(money(RP.sum(bc,RP.fCogs)-RP.sum(bc,RP.fRev))) });
  else if(S.length) add("✅","good","ins.belowNone",{});
  var sf=S.filter(function(s){ return s.entered_by; });
  if(sf.length && a.rev>0){
    var who=[]; sf.forEach(function(s){ if(who.indexOf(s.entered_by)<0) who.push(s.entered_by); });
    add("👥","neutral","ins.staff",{ n:B(num(sf.length)), p:B(pct(RP.sum(sf,RP.fRev)/a.rev*100)), who:esc(who.join(", ")) });
  }
  var cu=RP.group(S.filter(function(s){ return String(s.customer_name||"").trim(); }),function(s){ return String(s.customer_name).trim(); }), ck=Object.keys(cu);
  if(ck.length && a.rev>0){
    var tc=ck.map(function(k){ return { k:k, v:RP.sum(cu[k],RP.fRev) }; }).sort(function(x,y){ return y.v-x.v; })[0];
    add("🤝",tc.v/a.rev>=0.3?"warn":"neutral","ins.cust",{ name:N(tc.k), v:B(money(tc.v)), p:B(pct(tc.v/a.rev*100)), n:B(num(ck.length)) },"customer",tc.k);
  }
  if(a.teamPaid>0) add("🧾","neutral","ins.team",{ v:B(money(a.teamPaid)), n:B(num(a.teamPaidN)) });
  return out;
};
RP.addSection({ id:"insights", order:60, navKey:"nav.insights", render:function(c,v){

/* 95 — Cash flow */
RP.cashAgg=function(sales,cash){
  var o={ inG:{}, outG:{}, extG:{}, tin:0, tout:0, text:0 }, s=RP.sum(sales,RP.fRev);
  if(s){ o.inG[RP.t("cash.sales")]=s; o.tin+=s; }
  cash.forEach(function(r){
    var k=RP.fCat(r), amt=RP.fAmt(r), fP=r.from_name==="Pokehit", tP=r.to_name==="Pokehit";
    if(fP && tP) return;
    if(fP){ o.outG[k]=(o.outG[k]||0)+amt; o.tout+=amt; }

/* -----------------------------------------------------------------

RP.table=function(o){

  Object.keys(st.f).forEach(function(k){ if(!by[k]||!by[k].filter) delete st.f[k]; });

      +(fcols.length?'<button type="button" class="mg-btn sm rpt-fbtn'+(st.open?' on':'')+'" data-act="filters" aria-expanded="'+(st.open?"true":"false")+'">⚙️ '+esc(tx("rt.filters"))+' <span class="rpt-badge"></span></button>':'')
      +'<span class="rpt-count" aria-live="polite"></span>'

    hay=rows.map(function(r){
      var s="";

        if(isN(c)) return;

  function passF(r){
    for(var k in st.f){
      var f=st.f[k], c=by[k], v=c.get(r);

      if(blank(v)) return false;
      if(c.type==="date"){
        var d=d10(v);
        if(f.min&&d<f.min) return false;
        if(f.max&&d>f.max) return false;
      } else {
        if(f.min!==""&&+v<+f.min) return false;
        if(f.max!==""&&+v>+f.max) return false;
      }
    }
    return true;
  }
  function compute(){
    if(!hay) buildHay();
    var terms=fold(st.q).split(" ").filter(Boolean), out=[];
    for(var i=0;i<rows.length;i++){
      var h=hay[i], ok=true;
      for(var j=0;j<terms.length&&ok;j++) if(h.indexOf(terms[j])<0) ok=false;
      if(ok&&passF(rows[i])) out.push(i);
    }
    var s=st.sort, c=s&&by[s.key];
    if(c){
      var dir=s.dir==="asc"?1:-1, n=isN(c), kv=new Array(rows.length);
      out.forEach(function(i){

        else { var v=c.get(r); kv[i]=(c.flabel&&!blank(v))?c.flabel(v):v; }
      });
      out.sort(function(a,b){
        var x=kv[a], y=kv[b], xb=blank(x), yb=blank(y);
        if(xb||yb) return (xb&&yb)?a-b:(xb?1:-1);           // nulls last, both directions
        var d=n?(x-y):(c.type==="date"?(x<y?-1:(x>y?1:0)):cmpS(x,y));

            +'<span class="rpt-ar" aria-hidden="true">'+(on?(dir==="asc"?"▲":"▼"):"↕")+'</span></button>'
          :'<span class="rpt-thx">'+esc(lbl(c))+'</span>')

    });
    if(acts.length) h+='<th class="r"><span class="rpt-thx"></span></th>';
    h+='</tr></thead><tbody>';
    for(var k=0;k<shown;k++){
      var i=list[k], r=rows[i], rc=(o.onRowClick?'rpt-click ':'')+(o.rowClass?(o.rowClass(r)||""):"");
      h+='<tr data-ri="'+i+'"'+(o.onRowClick?' tabindex="0"':'')+(rc?' class="'+rc+'"':'')+(o.rowTitle?' title="'+esc(o.rowTitle(r))+'"':'')+'>';

        var c=cols[ci];
        h+='<td class="'+c.align+(isN(c)?' num':'')+(c.cls?' '+(c.cls(r)||''):'')+'">'+(c.render?c.render(r):fmtV(c,c.get(r)))+'</td>';
      }

  return { state:st, repaint:paint };

/* RP.tabs({id, el, tabs:[{key, labelKey, render(bodyEl)}]}) — remembers the active tab by id. */
RP.tabs=function(o){
  var cur=T.tabs[o.id], ks=o.tabs.map(function(x){ return x.key; });
  if(ks.indexOf(cur)<0) cur=ks[0];
  o.el.innerHTML='<div class="rpt-tabs" role="tablist">'+o.tabs.map(function(tb){
      return '<button type="button" role="tab" class="rpt-tab" data-tab="'+esc(tb.key)+'">'+esc(tx(tb.labelKey))+'</button>';
    }).join("")+'</div><div class="rpt-tabbody" role="tabpanel"></div>';
  var bar=o.el.firstChild, body=o.el.lastChild;
  function show(k,focus){
    T.tabs[o.id]=k;
    Array.prototype.forEach.call(bar.children,function(b){
      var on=b.getAttribute("data-tab")===k;
      b.classList.toggle("on",on); b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1;
      if(on&&focus) b.focus();
    });
    o.tabs[ks.indexOf(k)].render(body);
  }
  bar.addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("[data-tab]"):null;
    if(b) show(b.getAttribute("data-tab"));
  });
  bar.addEventListener("keydown",function(e){
    if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
    e.preventDefault();
    var i=ks.indexOf(T.tabs[o.id]);
    show(ks[(i+(e.key==="ArrowRight"?1:-1)+ks.length)%ks.length],true);
  });
  show(cur);
};

/* ---------- edit / delete through the Manage modals ----------
   MG.sales.editModal(id) looks the row up in MG.sales.st.rows, and both modules'
   fetch() write into their Manage-page tables (null until that page is opened —
   an unguarded call throws, and for sales leaves st.loading stuck at true).
   So: hand editModal the report row via a temporary st.rows swap, and wrap
   fetch() to skip the repaint when the page isn't built and to refresh the
   report when it is the visible tab. manage.ts is untouched. */
function hookMG(){
  if(T.hooked||typeof MG==="undefined") return;
  T.hooked=true;
  function wrap(mod,tableId){
    if(!mod||typeof mod.fetch!=="function") return;
    var base=mod.fetch;
    mod.fetch=function(){
      var r;
      if(el(tableId)) r=base.apply(mod,arguments);
      var sec=el("sec-report");
      if(sec&&sec.classList.contains("active")&&RP.refresh) RP.refresh();
      return r;
    };
  }
  wrap(MG.sales,"mgSaleTable");
  wrap(MG.expenses,"mgExTable");
}
hookMG();

  var keep=MG.sales.st.rows;

}

/* ---------- aggregation ---------- */
function rev(s){ return +s.total_idr||0; }
function cogs(s){ return +s.cogs_total_idr||0; }
// Group current + previous sales by key. Keys only in the previous period still get
// a (zero) row so the Δ footer over an unfiltered table equals the period change.
function groupSales(cur,prev,keyFn){
  var m={}, out=[], total=0;
  function g0(k,s){ var g=m[k]; if(!g){ g=m[k]={k:k,s:s,orders:0,units:0,rev:0,cogs:0,prev:0,first:"",last:""}; out.push(g); } return g; }
  cur.forEach(function(s){
    var g=g0(keyFn(s),s), d=d10(s.sale_date);
    g.orders++; g.units+=+s.quantity||0; g.rev+=rev(s); g.cogs+=cogs(s); total+=rev(s);
    if(d){ if(!g.first||d<g.first) g.first=d; if(!g.last||d>g.last) g.last=d; }
  });
  (prev||[]).forEach(function(s){ g0(keyFn(s),s).prev+=rev(s); });
  out.forEach(function(g){
    g.gross=g.rev-g.cogs;
    g.margin=g.rev?g.gross/g.rev*100:null;
    g.share=total?g.rev/total*100:null;
    g.avg=g.units?g.rev/g.units:null;
    g.aov=g.orders?g.rev/g.orders:null;
    g.delta=g.prev?(g.rev-g.prev)/g.prev*100:null;
    g.isNew=!g.prev&&g.rev>0;
  });
  return out;
}
function marginHtml(v){ return blank(v)?dash():'<span class="'+marginClass(v)+'">'+pct(v)+'</span>'; }
function deltaHtml(d,isNew){
  if(isNew) return '<span class="rpt-new">'+esc(tx("rt.new"))+'</span>';
  if(blank(d)) return dash();
  return '<span class="'+(d>0?"pos":(d<0?"neg":""))+'">'+(d>0?"+":"")+pct(d)+'</span>';
}
function ratio(a,b){ return b?a/b:null; }

// Column factories for grouped rows (fresh objects per render).

  orders:function(){ return {key:"orders",labelKey:"rt.c.orders",type:"num",get:function(g){ return g.orders; }}; },
  units:function(){ return {key:"units",labelKey:"rt.c.units",type:"num",get:function(g){ return g.units; }}; },
  rev:function(){ return {key:"rev",labelKey:"rt.c.revenue",type:"money",get:function(g){ return g.rev; }}; },
  avg:function(){ return {key:"avg",labelKey:"rt.c.avgPrice",type:"money",get:function(g){ return g.avg; },
    total:function(rs){ return ratio(sumBy(rs,function(g){ return g.rev; }),sumBy(rs,function(g){ return g.units; })); }}; },
  aov:function(){ return {key:"aov",labelKey:"rt.c.aov",type:"money",get:function(g){ return g.aov; },
    total:function(rs){ return ratio(sumBy(rs,function(g){ return g.rev; }),sumBy(rs,function(g){ return g.orders; })); }}; },
  cogs:function(){ return {key:"cogs",labelKey:"rt.c.cogs",type:"money",get:function(g){ return g.cogs; }}; },
  gross:function(){ return {key:"gross",labelKey:"rt.c.gross",type:"money",get:function(g){ return g.gross; },
    cls:function(g){ return g.gross<0?"neg":""; }}; },
  margin:function(){ return {key:"margin",labelKey:"rt.c.margin",type:"pct",hintKey:"rt.h.margin",
    get:function(g){ return g.margin; }, render:function(g){ return marginHtml(g.margin); },
    totalRender:function(rs){
      var r=sumBy(rs,function(g){ return g.rev; }), c=sumBy(rs,function(g){ return g.cogs; });
      return '<span class="num">'+marginHtml(r?(r-c)/r*100:null)+'</span>';
    }}; },
  share:function(){ return {key:"share",labelKey:"rt.c.share",type:"pct",hintKey:"rt.h.share",total:function(rs){ return sumBy(rs,function(g){ return g.share; }); },
    get:function(g){ return g.share; }}; },
  delta:function(){ return {key:"delta",labelKey:"rt.c.delta",type:"pct",hintKey:"rt.h.delta",
    get:function(g){ return g.delta; }, render:function(g){ return deltaHtml(g.delta,g.isNew); },
    csv:function(g){ return g.isNew?tx("rt.new"):(blank(g.delta)?"":Math.round(g.delta*100)/100); },
    totalRender:function(rs){
      var c=sumBy(rs,function(g){ return g.rev; }), p=sumBy(rs,function(g){ return g.prev; });
      return '<span class="num">'+deltaHtml(p?(c-p)/p*100:null,!p&&c>0)+'</span>';
    }}; },
  first:function(){ return {key:"first",labelKey:"rt.c.first",type:"date",get:function(g){ return g.first; },filter:"range"}; },
  last:function(k){ return {key:"last",labelKey:k||"rt.c.last",type:"date",get:function(g){ return g.last; },filter:"range"}; }
};

/* ---------- 55 · expense breakdown ---------- */
function amt(x){ return +x.amount_idr||0; }
function groupExp(cur,prev,keyFn){
  var m={}, out=[], tot=0;
  function g0(k,x){ var g=m[k]; if(!g){ g=m[k]={k:k,x:x,opex:0,team:0,n:0,prev:0,last:""}; out.push(g); } return g; }
  cur.forEach(function(x){
    var g=g0(keyFn(x),x), d=d10(x.date);
    g.n++; if(x.in_opex){ g.opex+=amt(x); tot+=amt(x); } else g.team+=amt(x);
    if(d&&d>g.last) g.last=d;
  });
  (prev||[]).forEach(function(x){ if(x.in_opex) g0(keyFn(x),x).prev+=amt(x); });
  out.forEach(function(g){
    g.share=tot?g.opex/tot*100:null;
    g.delta=g.prev?(g.opex-g.prev)/g.prev*100:null;
    g.isNew=!g.prev&&g.opex>0;
  });
  return out;
}
var EC={
  opex:function(){ return {key:"opex",labelKey:"rt.c.opex",type:"money",hintKey:"rt.h.opex",get:function(g){ return g.opex; }}; },
  team:function(){ return {key:"team",labelKey:"rt.c.teamPaid",type:"money",hintKey:"rt.h.team",get:function(g){ return g.team; },

var D = {};
(function(){
  var DATA_URL="https://klmiperlzdcsybgvudfd.supabase.co/functions/v1/dashboard?action=data";

  function showLogin(){ var l=el("login"); if(l) l.style.display="flex"; var g=el("gate"); if(g) g.style.display="none"; }
  function showGate(){ var l=el("login"); if(l) l.style.display="none"; var g=el("gate"); if(g) g.style.display="flex"; }

  function fetchData(token){
    // Resolves with parsed JSON, or rejects with Error("UNAUTHORIZED") / generic.
    // x-region pins the function next to the database — see MG.DB_REGION.
    return fetch(DATA_URL, { headers: { Authorization: "Basic " + token, "x-region": "ap-northeast-1" } })
      .then(function(r){
        if(r.status===401||r.status===403){ var e=new Error("UNAUTHORIZED"); e.code=401; throw e; }
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      });
  }

  function launch(json){ D = json||{}; var l=el("login"); if(l) l.style.display="none"; boot(); }

  function wireLogin(){
    var form=el("loginForm"), errEl=el("loginErr"), btn=el("loginBtn");
    if(!form) return;
    form.addEventListener("submit",function(ev){
      ev.preventDefault();
      var u=(el("loginUser")&&el("loginUser").value||"").trim();
      var p=(el("loginPass")&&el("loginPass").value)||"";
      if(errEl) errEl.textContent="";
      if(!u || !p){ if(errEl) errEl.textContent="Enter a username and password."; return; }
      var token = btoa(u + ":" + p);
      if(btn){ btn.disabled=true; btn.textContent="Signing in…"; }
      fetchData(token)
        .then(function(json){
          try{ localStorage.setItem("pokehit_auth", token); }catch(e){}
          launch(json);
        })
        .catch(function(err){
          if(btn){ btn.disabled=false; btn.textContent="Sign in"; }
          if(err && err.code===401){
            if(errEl) errEl.textContent="Invalid username or password.";
          } else {
            if(errEl) errEl.textContent="Couldn't reach server. Try again.";
          }
        });
    });
  }

  wireLogin();

  // Try a saved token first.
  var saved="";
  try{ saved=(localStorage.getItem("pokehit_auth")||"").trim(); }catch(e){}

  if(saved){
    showGate();
    fetchData(saved)
      .then(function(json){ launch(json); })
      .catch(function(err){
        if(err && err.code===401){
          try{ localStorage.removeItem("pokehit_auth"); }catch(e){}
          showLogin();
        } else {
          // Network/server error with a saved token: fall back to the login screen
          // so the user can retry, with a hint.
          var errEl=el("loginErr"); if(errEl) errEl.textContent="Couldn't reach server. Try again.";
          showLogin();
        }
      });
  } else {
    showLogin();
  }
})();

</script>
