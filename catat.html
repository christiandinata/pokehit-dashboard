<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#96581B">
<title>🎴 Catat Penjualan — PokeHit</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EFF1F6; --surface:#FFFFFF; --surface-2:#F7F8FC;
  --ink:#161A26; --muted:#5C6479; --line:#DCE0EB; --line-strong:#C3C9DA;
  --accent:#96581B; --accent-ink:#FFFFFF; --accent-soft:#FBEFDC;
  --ok:#1B6B47; --ok-soft:#E2F2EA; --danger:#A8241C; --danger-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(22,26,38,.06),0 8px 24px rgba(22,26,38,.07);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --surface:#191D2C; --surface-2:#212636;
    --ink:#EDEFF6; --muted:#9AA2B8; --line:#2C3245; --line-strong:#3D4459;
    --accent:#F2B45C; --accent-ink:#1B1405; --accent-soft:#332918;
    --ok:#5FD39B; --ok-soft:#163024; --danger:#F09189; --danger-soft:#3A1E1B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.shell{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* login + loading */
.center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:var(--bg);z-index:80}
.loginbox{width:100%;max-width:330px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.loginbox h1{font-family:"Instrument Sans",sans-serif;font-size:20px;font-weight:600;margin:0 0 4px}
.loginbox p{color:var(--muted);font-size:14px;margin:0 0 18px}
.loginbox label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin:0 0 6px}
.loginbox input{width:100%;margin-bottom:13px;border:1px solid var(--line-strong);background:var(--surface-2);
  color:var(--ink);border-radius:11px;padding:12px 13px;font:inherit;font-size:16px}
.loginbox input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--danger);font-size:13.5px;margin:0 0 12px;min-height:19px}
.spinner{color:var(--muted);font-size:14px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;flex:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:"Instrument Sans",sans-serif;font-weight:700;font-size:15px}
h1.title{font-family:"Instrument Sans",system-ui,sans-serif;font-weight:600;font-size:18px;
  letter-spacing:-.01em;margin:0;flex:1}
.datefield{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px}
.datefield label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:600;flex:none}
.datefield input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;
  font-variant-numeric:tabular-nums;padding:0;min-width:0}

main{flex:1;padding:16px 16px 132px;display:flex;flex-direction:column;gap:14px}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);
  padding:30px 22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{margin:0;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.card.bad{border-color:var(--danger)}
.card-head{display:flex;align-items:flex-start;gap:10px;padding:13px 13px 11px;border-bottom:1px solid var(--line)}
.card-title{flex:1;min-width:0}
.pname{font-family:"Instrument Sans",sans-serif;font-weight:600;font-size:16px;line-height:1.25;margin:0 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:999px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.warn{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.nego{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.xbtn{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--muted);font-size:17px;line-height:1;cursor:pointer}
.xbtn:hover{color:var(--danger);border-color:var(--danger)}

.field{padding:11px 13px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.flabel{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:7px}
.flabel .plain{text-transform:none;letter-spacing:0}
.stepper{display:flex;align-items:center;gap:12px}
.step{width:42px;height:42px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--ink);font-size:21px;line-height:1;cursor:pointer}
.step:disabled{opacity:.35;cursor:default}
.qty{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:20px;
  font-weight:600;min-width:40px;text-align:center}
.stock-note{font-size:13px;color:var(--muted);margin-left:auto;text-align:right}

.money-input{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:11px;padding:10px 12px}
.money-input:focus-within{border-color:var(--accent)}
.money-input .pfx{color:var(--muted);font-size:15px;font-weight:600}
.money-input input{flex:1;width:100%;border:0;background:none;color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:19px;
  font-weight:600;padding:0;min-width:0}
.money-input input:focus{outline:none}
.text-input{width:100%;font-family:"IBM Plex Sans",sans-serif;font-size:16px;font-weight:400;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line-strong);
  border-radius:11px;padding:11px 12px}
.text-input:focus{outline:none;border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:7px 0 0}
.hint b{color:var(--ink);font-weight:600}
.hint.down b{color:var(--danger)}
.hint.up b{color:var(--ok)}
.rowerr{margin:0;padding:10px 13px;background:var(--danger-soft);color:var(--danger);
  font-size:13.5px;font-weight:500}

.paymethods{display:flex;gap:7px}
.pm{flex:1;padding:10px 4px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.pm[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.addbtn{width:100%;padding:15px;border-radius:var(--radius);border:1.5px dashed var(--line-strong);
  background:var(--surface);color:var(--ink);font-family:"Instrument Sans",sans-serif;
  font-size:15px;font-weight:600;cursor:pointer}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}

.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
.bottom-in{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px}
.totals{flex:1;min-width:0}
.totals span{display:block;font-size:12px;color:var(--muted)}
.totals strong{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:20px;font-weight:600;letter-spacing:-.01em}
.primary{flex:none;padding:14px 22px;border-radius:12px;border:0;background:var(--accent);
  color:var(--accent-ink);font-family:"Instrument Sans",sans-serif;font-size:16px;font-weight:600;cursor:pointer}
.primary:disabled{background:var(--line-strong);color:var(--muted);cursor:default}

/* product picker */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet-top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;
  display:flex;flex-direction:column;gap:10px}
.sheet-titlerow{display:flex;align-items:center;gap:10px;max-width:460px;margin:0 auto;width:100%}
.sheet-titlerow h2{flex:1;font-family:"Instrument Sans",sans-serif;font-size:17px;font-weight:600;margin:0}
.ghost{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);
  border-radius:10px;padding:8px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.searchwrap{max-width:460px;margin:0 auto;width:100%}
#search{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);
  border-radius:11px;padding:12px 13px;font:inherit;font-size:16px}
#search:focus{outline:none;border-color:var(--accent)}
.sheet-list{flex:1;overflow-y:auto;padding:12px 16px 28px}
.sheet-list-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--ink);font:inherit;cursor:pointer}
.prow:hover{border-color:var(--accent)}
.prow-main{flex:1;min-width:0}
.prow-name{font-family:"Instrument Sans",sans-serif;font-weight:600;font-size:15px;margin-bottom:3px}
.prow-meta{font-size:12.5px;color:var(--muted)}
.prow-stock{flex:none;text-align:right}
.prow-stock b{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:600}
.prow-stock span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.noresult{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

/* saved screen */
.done{padding:34px 16px 40px;text-align:center}
.tick{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;background:var(--ok-soft);
  color:var(--ok);display:grid;place-items:center;font-size:29px}
.done h2{font-family:"Instrument Sans",sans-serif;font-size:21px;font-weight:600;margin:0 0 6px}
.done>p{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  text-align:left;overflow:hidden;margin-bottom:20px}
.rline{display:flex;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);align-items:baseline}
.rline:last-child{border-bottom:0;background:var(--surface-2)}
.rline-main{flex:1;min-width:0}
.rline-name{font-weight:600;font-size:14.5px}
.rline-sub{font-size:12.5px;color:var(--muted)}
.rline-amt{flex:none;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-weight:600;font-size:14.5px}
.rline.total .rline-name,.rline.total .rline-amt{font-size:16px}
footer.note{max-width:460px;margin:0 auto;padding:0 16px 26px;color:var(--muted);
  font-size:12.5px;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .card{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}}
}
</style>
</head>
<body>

<div class="center" id="loading"><p class="spinner">Membuka…</p></div>

<div class="center" id="login" style="display:none">
  <form class="loginbox" id="loginForm">
    <h1>Catat Penjualan</h1>
    <p>Masuk pakai user &amp; password yang dikasih.</p>
    <label for="loginUser">User</label>
    <input id="loginUser" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <p class="err" id="loginErr"></p>
    <button class="primary" type="submit" id="loginBtn" style="width:100%">Masuk</button>
  </form>
</div>

<div class="shell" id="app" style="display:none"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-top">
    <div class="sheet-titlerow">
      <h2>Pilih barang</h2>
      <button class="ghost" type="button" id="sheetClose">Tutup</button>
    </div>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Cari set atau tipe…" autocomplete="off">
    </div>
  </div>
  <div class="sheet-list"><div class="sheet-list-in" id="plist"></div></div>
</div>

<script>

var API="https://klmiperlzdcsybgvudfd.supabase.co/functions/v1/dashboard?action=";
var METHODS=["Transfer","Cash","QRIS"];
var nf=new Intl.NumberFormat("id-ID");
var TOKEN="";
var PRODUCTS=[];
var rows=[];
var seq=1;
var saved=null;
var sending=false;
var saleDate=new Date().toISOString().slice(0,10);

function el(id){return document.getElementById(id)}
function rp(n){return "Rp"+nf.format(n||0)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function prod(id){for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].id===id)return PRODUCTS[i]}return null}
function lineTotal(r){return r.qty*r.price}
function pieces(){var t=0;for(var i=0;i<rows.length;i++)t+=rows[i].qty;return t}
function grand(){var t=0;for(var i=0;i<rows.length;i++)t+=lineTotal(rows[i]);return t}
function onHand(p){return p.in_store>0?p.in_store:p.in_warehouse}
/* products.language is spelled out ("English" / "Japanese"). */
function isJp(p){return (p.language||"").toLowerCase().indexOf("jap")===0}

function call(action,body,token){
  return fetch(API+action,{
    method:"POST",
    headers:{"content-type":"application/json","Authorization":"Basic "+(token||TOKEN)},
    body:JSON.stringify(body||{})
  }).then(function(r){
    if(r.status===401||r.status===403){var e=new Error("UNAUTHORIZED");e.code=401;throw e}
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){
    if(!j.ok)throw new Error(j.error||"gagal");
    return j.data;
  });
}

/* ---------------- login ---------------- */
function showOnly(id){
  ["loading","login"].forEach(function(x){var n=el(x);if(n)n.style.display=(x===id?"flex":"none")});
  el("app").style.display=(id==="app"?"flex":"none");
}

function loadCatalog(token){
  return call("staff.catalog",{},token).then(function(d){
    PRODUCTS=d.products||[];
    TOKEN=token;
    showOnly("app");
    render();
  });
}

el("loginForm").addEventListener("submit",function(ev){
  ev.preventDefault();
  var u=(el("loginUser").value||"").trim();
  var p=el("loginPass").value||"";
  var errEl=el("loginErr"), btn=el("loginBtn");
  errEl.textContent="";
  if(!u||!p){errEl.textContent="User dan password harus diisi.";return}
  var token=btoa(u+":"+p);
  btn.disabled=true;btn.textContent="Sebentar…";
  loadCatalog(token).then(function(){
    try{localStorage.setItem("pokehit_staff_auth",token)}catch(e){}
  }).catch(function(err){
    btn.disabled=false;btn.textContent="Masuk";
    errEl.textContent=(err&&err.code===401)?"User atau password salah.":"Nggak bisa nyambung. Coba lagi.";
  });
});

el("sheetClose").onclick=closeSheet;
el("search").oninput=function(e){listProducts(e.target.value)};

(function(){
  var t="";
  try{t=(localStorage.getItem("pokehit_staff_auth")||"").trim()}catch(e){}
  if(!t){showOnly("login");return}
  loadCatalog(t).catch(function(err){
    if(err&&err.code===401){try{localStorage.removeItem("pokehit_staff_auth")}catch(e){}}
    else{el("loginErr").textContent="Nggak bisa nyambung. Coba lagi."}
    showOnly("login");
  });
})();

/* ---------------- main screen ---------------- */
function render(){
  if(saved)return renderDone();
  var todayStr=new Date().toISOString().slice(0,10);
  var body=rows.length?rows.map(card).join("")
    :'<div class="empty"><strong>Belum ada barang</strong><p>Tekan tombol di bawah tiap kali ada yang beli lewat WA atau datang langsung.</p></div>';

  el("app").innerHTML=
    '<div class="top">'+
      '<div class="brandrow"><div class="mark">P</div><h1 class="title">Catat Penjualan</h1>'+
      '<button class="ghost" type="button" id="out">Keluar</button></div>'+
      '<div class="datefield"><label for="d">Tanggal jual</label>'+
      '<input id="d" type="date" value="'+saleDate+'" max="'+todayStr+'"></div>'+
    '</div>'+
    '<main>'+body+
      '<button class="addbtn" type="button" id="add">+ Tambah barang terjual</button>'+
    '</main>'+
    '<footer class="note">Data langsung masuk ke stok PokeHit. Kalau ada yang salah, bilang aja — bisa dibatalkan.</footer>'+
    '<div class="bottom"><div class="bottom-in">'+
      '<div class="totals"><span>'+pieces()+' barang</span><strong>'+rp(grand())+'</strong></div>'+
      '<button class="primary" type="button" id="save"'+((rows.length&&!sending)?"":" disabled")+'>'+
      (sending?"Menyimpan…":"Simpan")+'</button>'+
    '</div></div>';

  el("d").onchange=function(e){saleDate=e.target.value};
  el("add").onclick=openSheet;
  el("save").onclick=save;
  el("out").onclick=function(){
    try{localStorage.removeItem("pokehit_staff_auth")}catch(e){}
    location.reload();
  };
  rows.forEach(bind);
}

function card(r){
  var p=prod(r.pid);
  var hand=onHand(p);
  var over=r.qty>hand;
  var listed=p.sale_price_idr||0;
  var diff=listed?(r.price-listed):0;
  var hint=!listed?'<p class="hint">Belum ada harga normal — isi manual.</p>'
    :diff===0?'<p class="hint">Harga normal <b>'+rp(listed)+'</b></p>'
    :'<p class="hint '+(diff<0?"down":"up")+'">Normal '+rp(listed)+' · <b>'+
      (diff<0?"turun ":"naik ")+rp(Math.abs(diff))+'</b></p>';

  return '<section class="card'+(r.error?" bad":"")+'" data-id="'+r.id+'">'+
    '<div class="card-head"><div class="card-title">'+
      '<p class="pname">'+esc(p.set_name)+'</p>'+
      '<div class="chips"><span class="chip">'+esc(p.type_name||"-")+'</span>'+
        (isJp(p)?'<span class="chip">JP</span>':"")+
        (diff!==0&&listed?'<span class="chip nego">nego</span>':"")+
        (over?'<span class="chip warn">lebih dari stok</span>':"")+
      '</div></div>'+
      '<button class="xbtn" type="button" data-act="del" title="Hapus">&times;</button></div>'+
    (r.error?'<p class="rowerr">'+esc(r.error)+'</p>':"")+

    '<div class="field"><span class="flabel">Jumlah</span><div class="stepper">'+
      '<button class="step" type="button" data-act="minus"'+(r.qty<=1?" disabled":"")+'>&minus;</button>'+
      '<span class="qty">'+r.qty+'</span>'+
      '<button class="step" type="button" data-act="plus">+</button>'+
      '<span class="stock-note">stok<br><b class="num">'+hand+'</b></span>'+
    '</div></div>'+

    '<div class="field"><span class="flabel">Harga jual satuan</span>'+
      '<div class="money-input"><span class="pfx">Rp</span>'+
      '<input inputmode="numeric" data-act="price" value="'+(r.price?nf.format(r.price):"")+'" aria-label="Harga jual satuan"></div>'+
      hint+
    '</div>'+

    '<div class="field"><span class="flabel">Dibayar pakai</span><div class="paymethods">'+
      METHODS.map(function(m){
        return '<button class="pm" type="button" data-act="pm" data-v="'+m+'" aria-pressed="'+(r.method===m)+'">'+m+'</button>';
      }).join("")+
    '</div></div>'+

    '<div class="field"><span class="flabel">Nama pembeli <span class="plain">(boleh kosong)</span></span>'+
      '<input class="text-input" data-act="buyer" value="'+esc(r.buyer)+'" placeholder="mis. Budi WA" aria-label="Nama pembeli">'+
    '</div>'+

    '<div class="field"><span class="flabel">Total baris</span>'+
      '<div class="num" style="font-size:19px;font-weight:600">'+rp(lineTotal(r))+'</div>'+
    '</div>'+
  '</section>';
}

function bind(r){
  var box=document.querySelector('.card[data-id="'+r.id+'"]');
  box.querySelector('[data-act="del"]').onclick=function(){
    rows=rows.filter(function(x){return x.id!==r.id});
    render();
  };
  box.querySelector('[data-act="minus"]').onclick=function(){r.qty=Math.max(1,r.qty-1);render()};
  box.querySelector('[data-act="plus"]').onclick=function(){r.qty=r.qty+1;render()};

  var price=box.querySelector('[data-act="price"]');
  price.oninput=function(){
    var digits=price.value.replace(/[^0-9]/g,"");
    r.price=digits?parseInt(digits,10):0;
    price.value=digits?nf.format(r.price):"";
    refreshLive(r,box);
  };
  price.onblur=render;

  var buyer=box.querySelector('[data-act="buyer"]');
  buyer.oninput=function(){r.buyer=buyer.value};

  var pms=box.querySelectorAll('[data-act="pm"]');
  for(var i=0;i<pms.length;i++){
    (function(b){b.onclick=function(){r.method=b.dataset.v;render()}})(pms[i]);
  }
}

/* Keep the line total + footer live while typing, without re-rendering the
   input the user is inside (that would eat the caret). */
function refreshLive(r,box){
  var fields=box.querySelectorAll(".field");
  fields[fields.length-1].querySelector(".num").textContent=rp(lineTotal(r));
  var t=document.querySelector(".totals");
  t.querySelector("span").textContent=pieces()+" barang";
  t.querySelector("strong").textContent=rp(grand());
}

/* ---------------- product picker ---------------- */
function openSheet(){
  el("sheet").hidden=false;
  el("search").value="";
  listProducts("");
  el("search").focus();
}
function closeSheet(){el("sheet").hidden=true}

function listProducts(q){
  q=(q||"").trim().toLowerCase();
  var hits=PRODUCTS.filter(function(p){
    if(!q)return true;
    var hay=(p.set_name||"")+" "+(p.type_name||"")+" "+(p.language||"")+(isJp(p)?" jp":" en");
    return hay.toLowerCase().indexOf(q)>-1;
  });

  el("plist").innerHTML=hits.length?hits.map(function(p){
    return '<button class="prow" type="button" data-pid="'+p.id+'">'+
      '<div class="prow-main"><div class="prow-name">'+esc(p.set_name)+'</div>'+
      '<div class="prow-meta">'+esc(p.type_name||"-")+(isJp(p)?" · JP":"")+
      (p.sale_price_idr?" · "+rp(p.sale_price_idr):" · harga belum diset")+'</div></div>'+
      '<div class="prow-stock"><b>'+onHand(p)+'</b><span>sisa</span></div>'+
    '</button>';
  }).join(""):'<p class="noresult">Nggak ketemu. Coba ketik nama set-nya aja, mis. “151”.</p>';

  var btns=el("plist").querySelectorAll(".prow");
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.onclick=function(){
        var p=prod(parseInt(b.dataset.pid,10));
        rows.push({id:seq++,pid:p.id,qty:1,price:p.sale_price_idr||0,buyer:"",method:"Transfer",error:null});
        closeSheet();
        render();
      };
    })(btns[i]);
  }
}

/* ---------------- save ---------------- */
function save(){
  if(sending)return;
  var missing=rows.filter(function(r){return !r.price});
  if(missing.length){alert("Ada harga yang masih kosong. Isi dulu ya.");return}

  sending=true;
  rows.forEach(function(r){r.error=null});
  render();

  var payload={sale_date:saleDate,lines:rows.map(function(r){
    return {product_id:r.pid,quantity:r.qty,unit_price_idr:r.price,
      customer_name:r.buyer||null,payment_method:r.method};
  })};

  call("staff.sale",payload).then(function(d){
    var results=d.results||[];
    var okRows=[],failed=[];
    rows.forEach(function(r,i){
      var res=results[i];
      if(res&&res.status==="created")okRows.push(r);
      else{r.error=(res&&res.error)||"gagal disimpan";failed.push(r)}
    });
    sending=false;
    if(failed.length===0){
      saved={date:saleDate,rows:okRows.slice(),total:grand(),pieces:pieces()};
      rows=[];
      render();
      window.scrollTo(0,0);
      // Stock moved — refresh so the next entry sees real numbers.
      call("staff.catalog",{}).then(function(c){PRODUCTS=c.products||PRODUCTS}).catch(function(){});
    }else{
      // Keep only what failed on screen, so a re-tap can't double-book the rest.
      rows=failed;
      render();
      alert(okRows.length+" tersimpan, "+failed.length+" gagal. Cek yang merah.");
    }
  }).catch(function(err){
    sending=false;
    render();
    alert(err&&err.code===401?"Sesi habis. Masuk ulang ya.":"Gagal simpan: "+(err.message||"coba lagi"));
  });
}

function renderDone(){
  var d=new Date(saved.date+"T00:00:00");
  var pretty=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  el("app").innerHTML=
    '<div class="top"><div class="brandrow"><div class="mark">P</div><h1 class="title">Tersimpan</h1></div></div>'+
    '<main><div class="done">'+
      '<div class="tick">&check;</div>'+
      '<h2>'+saved.pieces+' barang tercatat</h2>'+
      '<p>'+pretty+' — stok sudah dikurangi otomatis.</p>'+
      '<div class="receipt">'+
        saved.rows.map(function(r){
          var p=prod(r.pid);
          return '<div class="rline"><div class="rline-main">'+
            '<div class="rline-name">'+r.qty+'× '+esc(p.set_name)+'</div>'+
            '<div class="rline-sub">'+esc(p.type_name||"-")+' · '+rp(r.price)+'/pcs · '+esc(r.method)+
            (r.buyer?" · "+esc(r.buyer):"")+'</div></div>'+
            '<div class="rline-amt">'+rp(r.qty*r.price)+'</div></div>';
        }).join("")+
        '<div class="rline total"><div class="rline-main"><div class="rline-name">Total masuk</div></div>'+
        '<div class="rline-amt">'+rp(saved.total)+'</div></div>'+
      '</div>'+
      '<button class="primary" type="button" id="again" style="width:100%">Catat penjualan lagi</button>'+
    '</div></main>';

  el("again").onclick=function(){saved=null;rows=[];render()};
}

</script>
