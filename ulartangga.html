function project(bx,by,bz){
  var vp=window.StormViewport;
  var tilt=(vp.portrait?K.TILT_PORTRAIT_DEG:K.TILT_DEG)*Math.PI/180;
  var scale=parseFloat(getBoardScale())*camScale;
  var u=bx-K.BOARD_W/2, v=(K.BOARD_H/2-by), w=bz||0;
  var v2=v*Math.cos(tilt)-w*Math.sin(tilt);
  var w2=v*Math.sin(tilt)+w*Math.cos(tilt);
  var f=K.PERSP/(K.PERSP-w2*scale);
  /* perspective-origin is 50% 50%, i.e. the rig's own origin, so the whole
     offset from centre — the sky-reserve drop included — is multiplied by both
     the rig scale AND the perspective divide. */
  var cx=vp.w/2+parX, cy=vp.h/2+parY-(vp.portrait?92:0);
  return {x:cx+u*scale*f, y:cy+(boardDropCache+v2)*scale*f};

var tileEls=[], tilesHost=$('tiles'), linksHost=$('links'),
    shadowHost=$('shadow-plane'), pawnHost=$('pawn-layer');

function buildBoard(){

       every kind its own height so the bed has legible relief. An inline style

    div.innerHTML=
      '<i class="tile__skin"></i><i class="tile__side"></i>'+
      '<i class="tile__side tile__side--l"></i><i class="tile__side tile__side--r"></i>'+
      '<span class="tile__n num">'+(n<10?'0'+n:n)+'</span>'+
      '<span class="tile__kind">'+KIND_LABEL[kind]+'</span>'+
      (kind==='ladder'
        ? '<span class="tile__dest">&#8599;'+T.LADDER[n]+'</span>'
        : kind==='snake'
        ? '<span class="tile__dest">&#8600;'+T.SNAKE[n]+'</span>'
        : '<svg class="tile__badge" viewBox="0 0 24 24" aria-hidden="true">'+BADGE[kind]+'</svg>')+

  var s30=tileXY(30), glow=D.createElement('i'); glow.id='summit-glow';
  glow.style.setProperty('--tx',s30.x+'px');
  glow.style.setProperty('--ty',s30.y+'px');
  tilesHost.appendChild(glow);
  /* the Sky Pillar's beam: real vertical geometry in the board's own 3D space */
  var shaft=D.createElement('i'); shaft.id='summit-shaft';
  shaft.style.setProperty('--tx',(s30.x+K.TILE/2)+'px');
  shaft.style.setProperty('--ty',(s30.y+K.TILE/2)+'px');

function tileCenter(n){ var xy=tileXY(n); return {x:xy.x+K.TILE/2, y:xy.y+K.TILE/2} }

/* ── LADDERS AND SNAKES ─────────────────────────────────────────────────────
   They used to be drawn as a single free curve from tile centre to tile
   centre, which meant every one of the eight of them lay flat across three or
   four tile FACES, hiding numbers and payouts and making it genuinely unclear
   which two squares were connected.

   The rebuild routes them through the 8px SEAMS between tiles instead:
   leave the origin tile through the midpoint of its edge, run along a row
   seam, turn down a column seam, run along another row seam, enter the
   destination through the midpoint of its edge. Every leg lies in a gap, so a
   conduit physically CANNOT cover a tile's number or its payout — that is a
   property of the geometry now, not of careful tuning.

   And they are objects, not strokes: a dark channel carved into the bed, a
   raised rail lifted 30px above it in the board's own 3D space, a blurred
   copy of itself dropped back down into the groove as a cast shadow, and a
   travelling pulse. The corner radius is 12px because that is exactly the
   tile chamfer, so a turn nests into the notch where four corners meet.    */
var links=[];
var SEAM=4, STEP=K.TILE+K.GAP;          /* seam half-width, tile pitch */

/* Manhattan waypoints, entirely inside the gap lattice. */
function seamRoute(from,to){
  var A=tileXY(from), B=tileXY(to);
  var xA=A.x+K.TILE/2, xB=B.x+K.TILE/2;
  var up = (B.row>=A.row);
  var ys1 = up ? A.row*STEP+K.TILE+SEAM : A.row*STEP-SEAM;
  var ys2 = up ? B.row*STEP-SEAM        : B.row*STEP+K.TILE+SEAM;
  var wp=[];
  wp.push({x:xA, y: up ? A.y+K.TILE : A.y});          /* edge, never the centre */
  wp.push({x:xA, y: ys1});
  if(Math.abs(ys1-ys2)>1){
    /* a column seam adjacent to the DESTINATION, on the origin's side, so the
       two row-seam legs are the only horizontal travel. */
    var xs;
    if(B.col>A.col)      xs = B.col*STEP-SEAM;
    else if(B.col<A.col) xs = B.col*STEP+K.TILE+SEAM;
    else                 xs = (A.col<K.COLS-1) ? A.col*STEP+K.TILE+SEAM : A.col*STEP-SEAM;
    wp.push({x:xs, y:ys1});
    wp.push({x:xs, y:ys2});
  }
  wp.push({x:xB, y:ys2});
  wp.push({x:xB, y: up ? B.y : B.y+K.TILE});
  /* collapse duplicate waypoints so a zero-length arc never reaches the path */
  var out=[wp[0]];
  for(var i=1;i<wp.length;i++){
    var q=out[out.length-1];
    if(Math.abs(wp[i].x-q.x)>0.5 || Math.abs(wp[i].y-q.y)>0.5) out.push(wp[i]);
  }
  return out;
}

/* waypoints -> SVG path with quadratic corner fillets */
function roundPath(wp,r){
  if(wp.length<2) return '';
  var d='M'+wp[0].x.toFixed(1)+' '+wp[0].y.toFixed(1), i;
  for(i=1;i<wp.length-1;i++){
    var p0=wp[i-1], p1=wp[i], p2=wp[i+1];
    var l0=Math.hypot(p1.x-p0.x,p1.y-p0.y)||1;
    var l1=Math.hypot(p2.x-p1.x,p2.y-p1.y)||1;
    var k=Math.min(r, l0*0.48, l1*0.48);
    d+=' L'+(p1.x+(p0.x-p1.x)/l0*k).toFixed(1)+' '+(p1.y+(p0.y-p1.y)/l0*k).toFixed(1);
    d+=' Q'+p1.x.toFixed(1)+' '+p1.y.toFixed(1)+' '+
            (p1.x+(p2.x-p1.x)/l1*k).toFixed(1)+' '+(p1.y+(p2.y-p1.y)/l1*k).toFixed(1);
  }
  var last=wp[wp.length-1];
  d+=' L'+last.x.toFixed(1)+' '+last.y.toFixed(1);
  return d;
}

function buildLinks(){
  var NS='http://www.w3.org/2000/svg';
  var svg=D.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+K.BOARD_W+' '+K.BOARD_H);
  svg.setAttribute('width',K.BOARD_W); svg.setAttribute('height',K.BOARD_H);
  svg.style.overflow='visible';
  var defs=D.createElementNS(NS,'defs');
  defs.innerHTML=
    '<linearGradient id="lkMagma" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#FF7A3A"/><stop offset=".42" stop-color="#D0301E"/>'+
      '<stop offset="1" stop-color="#4A0D06"/></linearGradient>'+
    '<linearGradient id="lkOzone" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#F2FCFF"/><stop offset=".46" stop-color="#8FE0FF"/>'+
      '<stop offset="1" stop-color="#4A8FC4"/></linearGradient>';
  svg.appendChild(defs);
  var flip=D.createElementNS(NS,'g');
  flip.setAttribute('transform','translate(0,'+K.BOARD_H+') scale(1,-1)');
  svg.appendChild(flip);
  linksHost.appendChild(svg);

  function mk(t,cls){ var e=D.createElementNS(NS,t); if(cls)e.setAttribute('class',cls); return e }
  function path(cls,d){ var e=mk('path','lk-rail '+cls); e.setAttribute('d',d); return e }

  /* sampling uses the browser's own arc-length parameterisation, which is the
     only way to get evenly spaced points through the corner fillets. */
  function sample(pathEl,n){
    var out=[], L, i, p, q;
    try{ L=pathEl.getTotalLength() }catch(e){ L=0 }
    if(!L) return [{x:0,y:0,a:0}];
    for(i=0;i<=n;i++){
      p=pathEl.getPointAtLength(L*i/n);
      q=pathEl.getPointAtLength(Math.min(L,L*i/n+2));
      out.push({x:p.x,y:p.y,a:Math.atan2(q.y-p.y,q.x-p.x)});
    }
    return out;
  }

  /* one polyline offset off the sampled centreline by a constant, and one
     closed tapering ribbon around it. Both consume sample()'s per-point
     tangent angle, so both follow the corner fillets exactly. */
  function offsetD(pts,off){
    var d='',i,p,nx,ny;
    for(i=0;i<pts.length;i++){
      p=pts[i]; nx=-Math.sin(p.a); ny=Math.cos(p.a);
      d+=(i?' L':'M')+(p.x+nx*off).toFixed(1)+' '+(p.y+ny*off).toFixed(1);
    }
    return d;
  }
  /* lateral sine displacement of a sampled centreline, tangents recomputed
     from the displaced polyline so the ribbon and the belly line both follow
     the coil. The envelope starts at zero so the body still leaves the head
     cleanly, and peaks mid-route where there is the most seam to play in. */
  function coil(pts,amp,waves){
    var n=pts.length-1,i,p,nx,ny,w,out=[],A,B;
    if(n<2) return pts;
    for(i=0;i<=n;i++){
      p=pts[i]; nx=-Math.sin(p.a); ny=Math.cos(p.a);
      w=Math.sin((i/n)*Math.PI*2*waves)*amp*Math.sin(Math.PI*Math.min(1,(i/n)*1.25));
      out.push({x:p.x+nx*w,y:p.y+ny*w,a:p.a});
    }
    for(i=0;i<=n;i++){
      A=out[i>0?i-1:0]; B=out[i<n?i+1:n];
      out[i].a=Math.atan2(B.y-A.y,B.x-A.x);
    }
    return out;
  }
  function taperD(pts,w0,w1){
    var n=pts.length-1,i,p,nx,ny,w,d='';
    if(n<1) return '';
    for(i=0;i<=n;i++){
      p=pts[i]; nx=-Math.sin(p.a); ny=Math.cos(p.a); w=w0+(w1-w0)*(i/n);
      d+=(i?' L':'M')+(p.x+nx*w).toFixed(1)+' '+(p.y+ny*w).toFixed(1);
    }
    for(i=n;i>=0;i--){
      p=pts[i]; nx=-Math.sin(p.a); ny=Math.cos(p.a); w=w0+(w1-w0)*(i/n);
      d+=' L'+(p.x-nx*w).toFixed(1)+' '+(p.y-ny*w).toFixed(1);
    }
    return d+' Z';
  }
  function addLink(from,to,type){
    var wp=seamRoute(from,to);
    var dDraw=roundPath(wp,12);
    var g=mk('g','lk-'+type);

    /* the channel: a dark groove, so the rail has something to sit IN */
    g.appendChild(path('lk-chan',dDraw));
    g.appendChild(path('lk-glow',dDraw));
    var core=path('lk-core',dDraw); g.appendChild(core);

    if(type==='ladder'){
      /* TWO RAILS and the rungs between them. Sampled off the real curve, so
         both rails and every rung follow the corner fillets. */
      /* RUNGS YOU CAN COUNT. The rail gauge goes ±6 -> ±9.5 and the rung
         spacing from every 3rd sample to every 2nd, so a ladder leg carries
         6-9 evenly spaced bars between two clearly separated rails — which is
         the whole of "a player recognises this as snakes and ladders at a
         glance". Each rung also gets a shorter white lip on top, which is
         what stops a 6px bar reading as a flat pill. */
      var GAUGE=16;
      var rp=sample(core,Math.max(10,Math.round(pathLen(core)/7)));
      /* each rail twice: a dark outer bar, then the lit inner face on top of
         it. Two extra paths per ladder, and it is the whole difference
         between a rail and a hairline. */
      g.appendChild(path('lk-side-dk',offsetD(rp, GAUGE)));
      g.appendChild(path('lk-side-dk',offsetD(rp,-GAUGE)));
      g.appendChild(path('lk-side',offsetD(rp, GAUGE)));
      g.appendChild(path('lk-side',offsetD(rp,-GAUGE)));
      /* the rungs start and end TWO samples in, so the rails overhang. */
      for(var i=2;i<rp.length-2;i+=3){
        var p=rp[i], nx=-Math.sin(p.a), ny=Math.cos(p.a);
        var r=mk('line','lk-rail lk-rung');
        r.setAttribute('x1',(p.x+nx*GAUGE).toFixed(1)); r.setAttribute('y1',(p.y+ny*GAUGE).toFixed(1));
        r.setAttribute('x2',(p.x-nx*GAUGE).toFixed(1)); r.setAttribute('y2',(p.y-ny*GAUGE).toFixed(1));
        g.appendChild(r);
        var rl=mk('line','lk-rail lk-rung-lit');
        rl.setAttribute('x1',(p.x+nx*GAUGE*0.62).toFixed(1)); rl.setAttribute('y1',(p.y+ny*GAUGE*0.62-1.4).toFixed(1));
        rl.setAttribute('x2',(p.x-nx*GAUGE*0.62).toFixed(1)); rl.setAttribute('y2',(p.y-ny*GAUGE*0.62-1.4).toFixed(1));
        g.appendChild(rl);
      }
    }else{
      /* THE BODY, tapering. sample()[0] is the ORIGIN of the route, which for
         a snake is the HIGH tile: the mouth you fall into. So the thick end is
         the head and the thin end is the tail on the destination tile, and
         which way the link runs is readable from ten feet away without a
         badge. (Snakes-and-ladders convention, not the reviewer's note: you
         are swallowed at the top and come out at the bottom.) */
      /* 17 -> 3.2, not 8.6 -> 2.0: the taper is the DIRECTION cue and at 8.6
         the whole coil was thinner than the tile borders around it. */
      var sp=coil(sample(core,Math.max(20,Math.round(pathLen(core)/5))),9.0,2.2);
      var body=mk('path','lk-body');
      body.setAttribute('d',taperD(sp,15,3.0));
      g.appendChild(body);
      /* the coil's own scale banding, plus a dark ventral line offset to one
         side of the centre — a coil lit from above has a shaded underside,
         and that is the cue that turns a flat ribbon into a round body. */
      g.appendChild(path('lk-scale',offsetD(sp,0)));
      g.appendChild(path('lk-belly',offsetD(sp, 5.5)));
      /* THE HEAD, at the HIGH tile — the mouth you fall into, which is where
         the eye needs to start. Twice the old size, with a brow, a lower jaw
         drawn as its own dark part, and eyes set back behind the snout. */
      var h0=sp[0], ha=h0.a;
      var hx=Math.cos(ha), hy=Math.sin(ha), nx2=-hy, ny2=hx;
      function hpt(f,r){ return (h0.x+hx*f+nx2*r).toFixed(1)+' '+(h0.y+hy*f+ny2*r).toFixed(1) }
      var jaw=mk('path','lk-jaw');
      jaw.setAttribute('d','M'+hpt(27,2.0)+' L'+hpt(8,9.5)+' L'+hpt(-11,6.8)+' L'+hpt(-11,-1.4)+' L'+hpt(11,-2.7)+' Z');
      g.appendChild(jaw);
      var head=mk('path','lk-head');
      head.setAttribute('d',
        'M'+hpt(30,0)+
        ' L'+hpt(19,9.0)+
        ' L'+hpt(3,15.0)+
        ' L'+hpt(-13,11.5)+
        ' L'+hpt(-23,6.0)+
        ' L'+hpt(-23,-6.0)+
        ' L'+hpt(-13,-11.5)+
        ' L'+hpt(3,-15.0)+
        ' L'+hpt(19,-9.0)+' Z');
      g.appendChild(head);
      /* the brow: a dark shelf over both eyes, which is what turns a hexagon
         into a head at the size a tile seam allows. */
      var brow=mk('path','lk-brow');
      brow.setAttribute('d','M'+hpt(14,10.0)+' L'+hpt(-4,13.6)+' L'+hpt(-16,9.6)+
                            ' L'+hpt(-16,-9.6)+' L'+hpt(-4,-13.6)+' L'+hpt(14,-10.0)+
                            ' L'+hpt(6,-6.0)+' L'+hpt(6,6.0)+' Z');
      g.appendChild(brow);
      /* two fangs at the front of the jaw */
      var fang=mk('path','lk-fang');
      fang.setAttribute('d','M'+hpt(24,4.2)+' L'+hpt(15,6.6)+' L'+hpt(18,2.4)+' Z'+
                            ' M'+hpt(24,-4.2)+' L'+hpt(15,-6.6)+' L'+hpt(18,-2.4)+' Z');
      g.appendChild(fang);
      [[8,7.2],[8,-7.2]].forEach(function(o){
        var eye=mk('circle','lk-eye');
        eye.setAttribute('r','4.0');
        eye.setAttribute('cx',(h0.x+hx*o[0]+nx2*o[1]).toFixed(1));
        eye.setAttribute('cy',(h0.y+hy*o[0]+ny2*o[1]).toFixed(1));
        g.appendChild(eye);
      });
    }

    /* the pawn's own travel path DOES start and end at the tile centres; it is
       a separate, never-rendered path so the drawn conduit can stay in the
       seams while the pawn still walks on and off the squares properly. */
    var cA=tileCenter(from), cB=tileCenter(to);
    var mp=[cA].concat(wp).concat([cB]);
    var mpath=D.createElementNS(NS,'path');
    mpath.setAttribute('d',roundPath(mp,12));
    svg.appendChild(mpath);                      /* must be in the tree to measure */
    var pts=sample(mpath,72);
    svg.removeChild(mpath);

    links.push({g:g,path:core,type:type,from:from,to:to,pts:pts,
                ph:Math.random(),pulse:addPulse(mk,g,type==='ladder'?3.2:3.8)});
    flip.appendChild(g);
  }
  function pathLen(el){ try{ return el.getTotalLength() }catch(e){ return 200 } }
  function addPulse(mkf,g,r){
    var pg=mkf('g','lk-pulse'), c=mkf('circle');
    c.setAttribute('r',r); c.setAttribute('cx',0); c.setAttribute('cy',0);
    pg.appendChild(c); g.appendChild(pg); return pg;
  }

  Object.keys(T.LADDER).forEach(function(k){ addLink(+k,T.LADDER[k],'ladder') });
  Object.keys(T.SNAKE ).forEach(function(k){ addLink(+k,T.SNAKE[k], 'snake' ) });

  /* a static, blurred, fully desaturated copy dropped back into the groove.
     The travelling pulse is emissive and correctly does NOT appear in it. */
  var sh=$('links-shadow');
  if(sh){ var clone=svg.cloneNode(true); clone.setAttribute('aria-hidden','true');
          /* the clone brought a second copy of <defs> with it, so lkMagma and
             lkOzone each existed twice in the document. url(#id) resolves to
             the first match, so the shadow still paints — but duplicate ids
             are a bug waiting for the next person who queries one. */
          var cd=clone.querySelector('defs'); if(cd) cd.parentNode.removeChild(cd);
          sh.appendChild(clone) }

  /* Real vertical geometry at each ladder's destination: an ozone light column
     standing upright out of the board, same rotateX(-90deg) trick as the
     summit shaft. This is the "you go UP there" payoff, and being screen-
     blended it brightens the tile it stands on instead of hiding it. */
  Object.keys(T.LADDER).forEach(function(k){
    var c=tileCenter(T.LADDER[k]);
    var col=D.createElement('i');
    col.className='lk-column';
    col.style.setProperty('--tx',c.x+'px');
    col.style.setProperty('--ty',c.y+'px');
    col.style.animationDelay=(-(+k)*0.37).toFixed(2)+'s';
    tilesHost.appendChild(col);
  });
}
function linkAt(link,t){
  var pts=link.pts, n=pts.length-1;
  var f=Math.max(0,Math.min(1,t))*n, i=Math.floor(f), fr=f-i;
  var a=pts[i], b=pts[Math.min(n,i+1)];
  return {x:a.x+(b.x-a.x)*fr, y:a.y+(b.y-a.y)*fr, a:a.a};
}
function linkPulse(dt){
  for(var i=0;i<links.length;i++){
    var L=links[i];
    /* ambient drift; ladders climb, snakes fall. sped up while live. */
    var live=L.g.getAttribute('data-live')==='1';
    var spd=(L.type==='ladder'?0.00018:0.00026)*(live?4.5:1);
    L.ph=(L.ph+dt*spd)%1;
    var t=L.type==='ladder' ? L.ph : 1-L.ph;
    var p=linkAt(L,t);
    L.pulse.style.transform='translate('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px)';
    L.pulse.style.opacity=(live?1:0.34+0.3*Math.sin(L.ph*6.28)).toFixed(2);
  }
}
function findLink(from){ for(var i=0;i<links.length;i++) if(links[i].from===from) return links[i]; return null }

   PAWNS
   ───────────────────────────────────────────────────────────────────────────── */
var pawns={};      /* id -> {el,bill,body,cs,as,tile,fan} */
function buildPawn(p){
  var e=entryOf(p.sir);
  var el2=D.createElement('div');
  el2.className='pawn'; el2.id='pawn-'+p.id;
  el2.setAttribute('data-sir',e.key);
  el2.setAttribute('data-tier',e.tier);
  el2.innerHTML=
    '<i class="pawn__base"></i>'+
    '<div class="pawn__billboard">'+
      '<div class="pawn__body m-emerald">'+
        '<canvas class="pawn__emblem" width="188" height="188"></canvas>'+
        '<i class="pawn__band">'+esc(e.sigil)+'</i>'+
      '</div>'+
      '<span class="pawn__tag"><span>'+esc(p.name)+'</span></span>'+
    '</div>';
  pawnHost.appendChild(el2);
  emblem(el2.querySelector('.pawn__emblem'), e.key, 120);

  var cs=D.createElement('i'); cs.className='gshadow gshadow--contact h0'; cs.setAttribute('data-for','pawn-'+p.id);
  var as=D.createElement('i'); as.className='gshadow gshadow--ambient h0'; as.setAttribute('data-for','pawn-'+p.id);
  if(e.apex) as.setAttribute('data-apex','true');
  shadowHost.appendChild(cs); shadowHost.appendChild(as);

  var rec={el:el2,bill:el2.querySelector('.pawn__billboard'),cs:cs,as:as,h:0};
  pawns[p.id]=rec;
  placePawn(p.id,p.pos,0);
  el2.classList.add('is-drop');

function destroyPawn(id){

/* ══ FAN-OUT — A GRID IN THE TILE'S BACK-RIGHT QUADRANT ═══════════════════
   MEASURED FIX (blocker, 6+ players). The old fan was a RING of radius
   min(40, 14+5n) around the tile centre. At an 8-player start — everybody on
   tile 1, which is the state the stream opens on — that put eight 43px cards
   on a 40x21 ellipse: adjacent cards were 30px apart at 43px wide, so the
   cluster was one illegible heap, and half the ring sat LEFT of and IN FRONT
   OF the tile centre, which is exactly where tile 1 keeps its numeral
   (back-left) and its payout label (front-left).
   The replacement is a grid, and it grows only in the two directions a tile
   face carries no type: RIGHT (x >= 0, so no card ever reaches left of the
   tile centre, and the numeral — which ends at the centre — is always clear)
   and BACK (y >= 0, so no card's base drops toward the payout label). One
   card per cell, up to 4 per row, so the cards touch instead of stacking.
   Direction flips and placePawn's clamp keep the whole cluster on the bed.
   Board units throughout — this runs on placement, never per frame. */
function fanOffset(id){
  var G=window.StormGame; if(!G) return {x:0,y:0,k:1};
  var me=null, here=[], ps=G.state.players, i;
  for(i=0;i<ps.length;i++) if(ps[i].id===id) me=ps[i];
  if(!me) return {x:0,y:0,k:1};
  for(i=0;i<ps.length;i++) if(ps[i].pos===me.pos) here.push(ps[i].id);
  var n=here.length;
  /* THE STEP OFF THE TYPE, and it applies to a LONE standee too — the old
     code returned {0,0} for one player and the card, sitting on the tile
     centre with only the billboard's own 24px nudge, still clipped the
     numeral's lower-right corner (measured 176px² of tile 1's "01", 14% of
     the glyph box). Board units, applied in whichever direction the cluster
     grows. */
  var BX=16, BY=12;
  if(n<2) return {x:BX,y:BY,k:1};
  var k=here.indexOf(id);
  /* the crowd factor: the standee is already 0.62 of the card (--pawn-k), so
     these multiply down from there. 8 players = 0.56*0.62*112 = 39px cards. */
  var fk = n>=7 ? 0.56 : n>=5 ? 0.64 : n>=3 ? 0.76 : 0.88;
  var cw = 112*0.62*fk;                       /* the standee's own width      */
  var sx = cw*0.98, sy = 34 + 22*fk;          /* one cell: cards touch, not stack */
  var c = tileCenter(me.pos);
  /* COLUMNS ARE CUT TO THE ROOM ON THE RIGHT, never mirrored to the left.
     Mirroring is what puts a card back on the numeral — measured 584px² of
     tile 6's "06" when the grid was allowed to flip — so a tile with no room
     to its right gets a DEEPER stack instead of a wider one, and x stays
     positive for every standee on the board. 24 + cw*0.5 is the card's own
     right reach off its anchor (the billboard's 24px nudge plus half a card). */
  var roomX = K.BOARD_W - 6 - (c.x + BX + 24 + cw*0.5);
  var cols = n<=3 ? n : (n<=6 ? 3 : 4);
  while(cols>1 && (cols-1)*sx > roomX) cols--;
  var rows = Math.ceil(n/cols), row = (k/cols)|0;
  var ox = BX + (k%cols)*sx + ((row%2) ? sx*0.38 : 0);
  /* PAINT ORDER IS DOM ORDER inside #pawn-layer, so the rows are laid out
     BACK TO FRONT: player 1 gets the furthest row, and every card in front
     of another is drawn after it. Laid out front-first, the back row painted
     OVER the row in front of it and the whole cluster read as noise.
     The stack starts one step BEHIND the tile centre (clear of the payout
     label, which is at the tile's front edge) and grows backward; if it runs
     out of bed it SLIDES FORWARD as a group. Sliding, not per-card clamping:
     the clamp in placePawn is a bound, and a bound applied per card piles
     several of them on one spot (measured occ 1.00 — one standee completely
     inside another — on an 8-deep stack at tile 18). */
  var span = (rows-1)*sy, yb = c.y + BY + span;
  if(yb > K.BOARD_H-34) yb = K.BOARD_H-34;
  if(yb - span < 34)    yb = 34 + span;
  return {x:ox, y:(yb - row*sy) - c.y, k:fk};
}
/* Every kind of tile now has its own extrusion depth, so "the top of the bed"
   is no longer one number. A pawn standing on the 42px gold tile or the 86px
   summit used to sink into it up to the knees. tileTopZ is the per-tile top
   surface, memoised because it is a computed-style read and must never happen
   inside the frame loop. */
var tileZ={}, BED_Z=0;
function tileTopZ(n){
  if(tileZ[n]!==undefined) return tileZ[n];
  var el=tileEls[n], v=BED_Z;
  if(el){ v=parseFloat(getComputedStyle(el).getPropertyValue('--h'))||BED_Z }
  tileZ[n]=v; return v;
}
function placePawn(id,tileN,h){
  var r=pawns[id]; if(!r) return;
  var c=tileCenter(tileN), o=fanOffset(id);
  r.zbase=tileTopZ(tileN);
  /* --fan-k lives on the PAWN, not the billboard, so the footprint ring
     inherits it too and eight rings stop merging into one smear. */
  r.el.style.setProperty('--fan-k',String(o.k===undefined?1:o.k));
  /* THE HARD BOUND: nothing leaves the bed. The grid above picks a direction
     that fits, this is the guarantee when even that cannot (eight arrivals on
     a corner tile). 28 board units of margin holds the whole standee in. */
  var px=c.x+o.x, py=c.y+o.y, M=28;
  if(px<M) px=M; else if(px>K.BOARD_W-M) px=K.BOARD_W-M;
  if(py<M) py=M; else if(py>K.BOARD_H-M) py=K.BOARD_H-M;

}

  r.as.style.setProperty('--tx',x.toFixed(1)+'px');
  r.as.style.setProperty('--ty',y.toFixed(1)+'px');

  r.cs.style.opacity=(0.55-0.33*k).toFixed(3);
  r.as.style.setProperty('--sq-x',(1+0.22*k).toFixed(3));

function refanAll(){

/* ─────────────────────────────────────────────────────────────────────────────
   MOTION — hops, ladder climbs, snake slides
   ───────────────────────────────────────────────────────────────────────────── */
function squash(id,sx,sy){
  var r=pawns[id]; if(!r) return;
  r.bill.style.setProperty('--sq-x',String(sx));
  r.bill.style.setProperty('--sq-y',String(sy));
}
function lean(id,deg){

/* landing recovery is SPR_LAND: k=520 c=26 m=1 -> ζ=26/(2*√520)=0.570 */
function landRecover(id){
  return tween(70,E.emph,function(v){ squash(id, 1+0.14*v, 1-0.22*v) })
    .then(function(){ return tween(90,E.backSharp,function(v){ squash(id, 1.14-0.17*v, 0.78+0.28*v) }) })
    .then(function(){ return tween(120,E.expo,function(v){ squash(id, 0.97+0.03*v, 1.06-0.06*v) }) })
    .then(function(){ squash(id,1,1) });
}
function hopPath(pos,d){
  var out=[], p=pos, i;
  for(i=0;i<d;i++){ p+=1; if(p>30) p-=30; out.push(p) }
  return out;
}
function travel(id,fromTile,path,onLand){
  var r=pawns[id]; if(!r) return Promise.resolve();
  if(FX.reducedMotion){
    placePawn(id,path[path.length-1],0);
    if(onLand) onLand(path.length-1,path[path.length-1],true);
    return tween(220,E.expo,function(){});
  }
  /* per-hop duration decays with hop index; total travel capped at 1.4s */
  /* accelerate through the chain, then STRETCH the last hop: the hop that
     decides the outcome used to be the fastest and shortest in the sequence. */
  var last0=path.length-1;
  var durs=path.map(function(_,i){ return i===last0 ? 280 : Math.max(128,205*Math.pow(0.90,i)) });
  var total=durs.reduce(function(a,b){return a+b},0);

  var chain=tween(90,E.easeIn,function(v){       /* anticipation: dip + squash */
    squash(id, 1+0.08*v, 1-0.12*v);
    setPawnXY(id, tileCenter(fromTile).x, tileCenter(fromTile).y, -3*v);
  });
  var prev=fromTile;
  path.forEach(function(to,i){
    chain=chain.then(function(){
      var a=tileCenter(prev), b=tileCenter(to);
      var wrap = (prev===30 && to===1);
      var lastHop = (i===path.length-1);
      var apex = wrap ? 290 : K.TILE*K.HOP_APEX_RATIO*(lastHop?1.45:1);
      var dur  = wrap ? 660 : durs[i];
      if(wrap) FX.punch(1.06,120);
      r.zbase=tileTopZ(to);
      var dirLean = (b.x-a.x)>2 ? 6 : ((b.x-a.x)<-2 ? -6 : 0);
      lean(id,dirLean);
      squash(id,1,1);
      sfx('hop',i);
      return tween(dur,E.lin,function(_,p){
        var px=p;                       /* linear: no sideways force in flight */
        var x=a.x+(b.x-a.x)*px, y=a.y+(b.y-a.y)*px;
        /* split curves: rise on --e-riseY, fall on --e-grav */
        var h = p<0.5 ? apex*E.riseY(p/0.5) : apex*(1-E.grav((p-0.5)/0.5));
        setPawnXY(id,x,y,h);
        var s=project(x,y,h);
        if(p>0.06 && p<0.94) FX.trail(id,s.x,s.y,wrap?260:150);
      });
    }).then(function(){
      var last = (i===path.length-1);
      var c=tileCenter(to); setPawnXY(id,c.x,c.y,0);
      var sc=project(c.x,c.y,4);
      var kh=KIND_HUE[kindOf(to)]||[169,190,180];
      FX.trailHue(id,kh);
      FX.burst(sc.x,sc.y,{n: last?22:7, speed: last?340:170, hue:kh});
      FX.shake.apply(null, last ? K.SHAKE.land.concat([0,1,0.35]) : [3.5,95,0,1,0.2]);
      if(tileEls[to]){ tileEls[to].classList.remove('is-hit'); void tileEls[to].offsetWidth;
                       tileEls[to].classList.add('is-hit') }
      if(onLand) onLand(i,to,last);

}
/* ladder: stepped per rung, discrete tick each rung, pawn tilts 8° back */
function climb(id,fromTile,toTile){
  var L=findLink(fromTile);
  if(FX.reducedMotion || !L){ placePawn(id,toTile,0); return tween(220,E.expo,function(){}) }
  L.g.setAttribute('data-live','1');
  var rungs=Math.max(4,Math.min(9,Math.round(Math.hypot(
      tileCenter(toTile).x-tileCenter(fromTile).x,
      tileCenter(toTile).y-tileCenter(fromTile).y)/34)));

  var durs=[], i;

  }
  lean(id,-8);
  var chain=tween(90,E.easeIn,function(v){ squash(id,1-0.06*v,1+0.09*v) });
  for(i=0;i<rungs;i++){

        var t0=k/rungs, t1=(k+1)/rungs;

          var p=linkAt(L,t0+(t1-t0)*v);

          var s=project(p.x,p.y,40);

/* snake: ONE continuous tangent-following traversal, never a hop chain */
/* was bez(.55,0,.45,1) — a symmetric ease-in-out, so the pawn DECELERATED for

  var L=findLink(fromTile);

  L.g.setAttribute('data-live','1');
  var len=0, i;
  for(i=1;i<L.pts.length;i++) len+=Math.hypot(L.pts[i].x-L.pts[i-1].x, L.pts[i].y-L.pts[i-1].y);
  var dur=Math.max(620,Math.min(1050, len/1400*1000));

      var wob=Math.sin(p*Math.PI*3)*(3+5*vel);

    });
  })
  .then(function(){
    L.g.removeAttribute('data-live');

  });
}

/* ─────────────────────────────────────────────────────────────────────────────

   ───────────────────────────────────────────────────────────────────────────── */
var TGT={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};

var dice={rx:-26,ry:-31,rz:0,dx:0,dy:0,sx:1,sy:1};

writeDice();
function rollDice(value){
  dRead.classList.remove('is-in');
  var tgt=TGT[value], APEX=230;                 /* airborne apex px            */

      dice.rx=s0.rx+(tgt[0]-s0.rx)*v; dice.ry=s0.ry+(tgt[1]-s0.ry)*v;

    });

  return tween(90,E.easeIn,function(v){         /* 1 wind-up                   */

    })
    .then(function(){
      sfx('dice'); FX.shake(4,90,0,-1,0.3);
      return tween(520,E.lin,function(_,p){     /* 2 airborne, 3 free axes     */
        dice.dy = -APEX*4*p*(1-p);
        dice.dx = -58 + 116*p;                  /* a real lateral throw        */
        dice.rx = r0.rx + 560*p;                /* 21.6deg/frame at 60Hz —     */
        dice.ry = r0.ry + 400*p;                /* under the strobe threshold  */
        dice.rz = r0.rz + 260*p;

      });
    })
    .then(function(){                           /* 3 bounce-settle             */
      /* converge onto the nearest equivalent target orientation */

      var ty=tgt[1]+360*Math.round((dice.ry-tgt[1])/360);
      var tz=360*Math.round(dice.rz/360);

          dice.dy=-APEX*0.03*Math.sin(p*Math.PI); writeDice();
        });
      }).then(function(){
        /* the die lands ON the altar, so the altar answers: one ozone flare in
           the inlay ring, a spark burst off the contact point, and a short
           shake along the impact normal. Without this the settle just stopped. */
        var st=$('dice-stage'), r=st.getBoundingClientRect();
        FX.burst(r.left+r.width/2, r.bottom-52, {n:14,speed:210,hue:[190,239,255],angle:-Math.PI/2});
        FX.shake(3.4,120,0,-1,0.18);
        st.classList.remove('is-land'); void st.offsetWidth; st.classList.add('is-land');
        return tween(110,E.expo,function(v){         /* micro-wobble ±1.5°     */
          dice.rz=tz+1.5*Math.sin(v*Math.PI*3)*(1-v); dice.dy=0; writeDice();
        });
      }).then(function(){
        dice.rx=tx; dice.ry=ty; dice.rz=tz; dice.dy=0; dice.dx=0; dice.sx=1; dice.sy=1; writeDice();
      });
    });
}

   ───────────────────────────────────────────────────────────────────────────── */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
var rngFn=mulberry32((Date.now()^0x9E3779B9)>>>0);
function rng(){ return rngFn() }

var pid=0;
var state={
  players:[], activeIdx:0,
  paidRolls:0, packsOut:0, boxesOut:0, boxWinner:null,
  chainLandings:0, boxCapSpent:false,
  phase:'idle', _landings:0
};
var listeners={};
function on(ev,cb){ (listeners[ev]||(listeners[ev]=[])).push(cb);
  return function(){ var a=listeners[ev], i=a.indexOf(cb); if(i>=0)a.splice(i,1) } }
function emit(ev,payload){
  var a=listeners[ev]; if(!a) return;
  for(var i=0;i<a.length;i++){ try{ a[i](payload) }catch(e){} }
}
/* INTERNAL ONLY. never rendered — the screen is broadcast live. reachable from
   the console via window.__ops(). see also UI.setScore() for what IS on screen. */
function economics(){
  var revenue=state.paidRolls*RULES.PRICE_PER_ROLL_IDR;
  var cost=state.packsOut*RULES.PACK_COST_IDR + state.boxesOut*RULES.BOX_COST_IDR;
  var profit=revenue-cost;
  return {rolls:state.paidRolls, packs:state.packsOut, boxes:state.boxesOut,
          revenue:revenue, cost:cost, profit:profit,
          marginPct: revenue? 100*profit/revenue : 0,
          effIdrPerPack: state.packsOut ? revenue/state.packsOut : 0};
}
/* what the audience is allowed to see. no money except the public roll price. */
function scoreboard(){
  return {packs:state.packsOut, boxes:state.boxesOut, boxWinner:state.boxWinner,
          players:state.players};
}
function active(){ return state.players[state.activeIdx] }

/* ── the resolver. THE FROZEN ALGORITHM (§9.2). identical for sync + animated. ─ */
function resolveRoll(){
  var p=active(); if(!p) return [];
  state.chainLandings=0;
  state.paidRolls+=1; p.rolls+=1;
  var steps=[], d=1+Math.floor(rng()*6), i;
  for(;;){
    steps.push({t:'dice',value:d});
    var from=p.pos, pos=p.pos+d;
    if(pos>30) pos-=30;                                  /* circular board     */
    p.pos=pos; state._landings+=1; state.chainLandings+=1;
    steps.push({t:'move',from:from,to:pos,d:d});

    if(T.LADDER[pos]!==undefined){
      var lto=T.LADDER[pos]; p.pos=lto;                  /* destination NOT resolved */
      steps.push({t:'ladder',from:pos,to:lto});
      if(state.chainLandings>=RULES.CHAIN_CAP_LANDINGS){
        /* the chain is cut, but a paid roll never pays nothing: floor applies. */
        p.packs+=1; state.packsOut+=1;
        steps.push({t:'chaincap',landings:state.chainLandings,packs:1}); break;
      }
      steps.push({t:'free'});                            /* one free extra roll */
      d=1+Math.floor(rng()*6);
      continue;
    }
    if(T.SNAKE[pos]!==undefined){
      var nxt=state.players[(state.activeIdx+1)%state.players.length];
      p.packs+=RULES.snake.roller_packs;                  /* the roller still pays */
      state.packsOut+=RULES.snake.roller_packs;
      nxt.packs+=RULES.snake.gift_to_next_player_packs;   /* and gifts the next up */
      state.packsOut+=RULES.snake.gift_to_next_player_packs;
      var sto=T.SNAKE[pos]; p.pos=sto;                   /* destination NOT resolved */
      steps.push({t:'snake',from:pos,to:sto,toPlayerId:nxt.id,
                  packs:RULES.snake.roller_packs,gift:RULES.snake.gift_to_next_player_packs,
                  sameName:nxt.id===p.id});
      break;
    }
    var kind=kindOf(pos);
    if(kind==='pack1'||kind==='pack2'||kind==='pack3'){
      var n=(kind==='pack1')?1:((kind==='pack2')?2:3);
      p.packs+=n; state.packsOut+=n;
      steps.push({t:'pack',tile:pos,packs:n,kind:kind});
      break;
    }
    if(kind==='hitzone'){
      var hzp=RULES.hitzone.packs;                        /* floor 2, never 1    */
      p.packs+=hzp; state.packsOut+=hzp;
      var hit=rng()<RULES.P_HIT;                          /* opened live         */
      if(hit){ p.packs+=RULES.hitzone.bonus_on_hit; state.packsOut+=RULES.hitzone.bonus_on_hit }
      steps.push({t:'hitzone',tile:pos,hit:hit,
                  packs:hzp+(hit?RULES.hitzone.bonus_on_hit:0)});
      break;
    }
    /* JACKPOT — tile 30 */
    if(!state.boxCapSpent){
      p.packs+=RULES.jackpot.packs; state.packsOut+=RULES.jackpot.packs;
      var tops=0;
      for(i=0;i<RULES.jackpot.box_draws;i++) if(rng()<RULES.P_TOP) tops++;
      var box=false;
      if(tops>0 && state.boxesOut<RULES.BOX_CAP){
        state.boxesOut+=1; state.boxCapSpent=true; box=true;
        state.boxWinner=p.name;
      }
      steps.push({t:'jackpot',tile:30,packs:RULES.jackpot.packs,tops:tops,boxAwarded:box});
    }else{
      p.packs+=RULES.jackpot.packs_after_cap_spent;       /* cap spent -> 4 packs */
      state.packsOut+=RULES.jackpot.packs_after_cap_spent;
      steps.push({t:'jackpot',tile:30,packs:RULES.jackpot.packs_after_cap_spent,
                  tops:0,boxAwarded:false});
    }
    break;
  }
  steps.push({t:'end'});
  return steps;
}
function endTurn(){
  var prev=active();
  if(state.players.length) state.activeIdx=(state.activeIdx+1)%state.players.length;
  state.phase='idle';
  return {playerId:prev?prev.id:null, nextPlayerId:active()?active().id:null};
}

  /* ── the economics guard. must return ok:true. ───────────────────────────── */
  selfTest:function(nights,rollsPerNight){
    nights=nights||200000; rollsPerNight=rollsPerNight||105;
    var keep={players:state.players.slice(),activeIdx:state.activeIdx,
      paidRolls:state.paidRolls,packsOut:state.packsOut,boxesOut:state.boxesOut,
      boxCapSpent:state.boxCapSpent,boxWinner:state.boxWinner,landings:state._landings};
    var L=0,P=0,B=0,Rr=0,i,r,minPacks=Infinity,before;
    for(i=0;i<nights;i++){
      state.players=[{id:'t',name:'T',sir:'golisopod',pos:1,packs:0,rolls:0}];
      state.activeIdx=0; state.paidRolls=0; state.packsOut=0; state.boxesOut=0;
      state.boxCapSpent=false; state.boxWinner=null; state._landings=0; state.chainLandings=0;
      GAME._seed(i+1);
      for(r=0;r<rollsPerNight;r++){
        before=state.packsOut;
        resolveRoll(); endTurn();
        if(state.packsOut-before<minPacks) minPacks=state.packsOut-before;
      }
      L+=state._landings; P+=state.packsOut; B+=state.boxesOut; Rr+=state.paidRolls;
    }
    state.players=keep.players; state.activeIdx=keep.activeIdx;
    state.paidRolls=keep.paidRolls; state.packsOut=keep.packsOut;
    state.boxesOut=keep.boxesOut; state.boxCapSpent=keep.boxCapSpent;
    state.boxWinner=keep.boxWinner;
    state._landings=keep.landings; state.chainLandings=0;
    rngFn=mulberry32((Date.now()^0x9E3779B9)>>>0);
    var landings=L/Rr, packs=P/Rr,
        cost=(P*RULES.PACK_COST_IDR+B*RULES.BOX_COST_IDR)/Rr,
        profit=RULES.PRICE_PER_ROLL_IDR-cost;
    var ok = Math.abs(landings-RULES.expected.landings_per_paid_roll)<RULES.expected.landings_tol
          && Math.abs(packs-RULES.expected.packs_per_paid_roll)<RULES.expected.packs_tol
          && minPacks===1;   /* 1, never 0. a paid roll always pays. */
    return {ok:ok, landings:landings, packs:packs, minPacks:minPacks,
            rolls_per_box:B?Rr/B:Infinity,
            cost:cost, profit:profit, margin:100*profit/RULES.PRICE_PER_ROLL_IDR,
            effIdrPerPack:RULES.PRICE_PER_ROLL_IDR*Rr/P};
  }
};

});
/* a second, diegetic route to the same action. the labelled CTA keeps the price. */
$('dice-stage').addEventListener('pointerdown',function(){
  if(btnRoll.disabled) return;
  sfx('ui','tap'); UI.noteInput(performance.now()); GAME.roll();
});
$('btn-free').addEventListener('pointerdown',function(e){
  try{ this.setPointerCapture(e.pointerId) }catch(err){}
  sfx('ui','tap');
});
/* tiles: a tap names the pijakan for the operator. non-destructive. */
$('tiles').addEventListener('pointerup',function(e){
  var t=e.target.closest ? e.target.closest('.tile') : null;
  if(!t) return;
  sfx('ui','tick');
  UI.toast('PIJAKAN '+t.getAttribute('data-n')+' · '+tileName(+t.getAttribute('data-n')));
});
D.addEventListener('pointerdown',function(){ UI.noteInput(performance.now()) },{passive:true});

/* #stage is overflow:hidden, which is still programmatically scrollable —
   a focus or scroll-into-view can shift the whole scene. pin it at 0. */
(function(){
  var st=$('stage');
  st.addEventListener('scroll',function(){ st.scrollLeft=0; st.scrollTop=0 },{passive:true});
  st.scrollLeft=0; st.scrollTop=0;
})();

/* the intro: storm establishes, board assembles, title resolves, UI settles.  */
var introDone=false, introTimers=[];
function finishIntro(){
  if(introDone) return; introDone=true;
  introTimers.forEach(clearTimeout); introTimers.length=0;
  H.removeAttribute('data-intro');
  LOOP.timeScale=1;
  for(var n=1;n<=30;n++) if(tileEls[n]){ tileEls[n].classList.remove('is-assemble');
                                         tileEls[n].classList.add('is-in') }
  camScale=1;
  R.setProperty('--board-tilt',(window.StormViewport.portrait?K.TILT_PORTRAIT_DEG:K.TILT_DEG)+'deg');
}
function runIntro(){
  H.setAttribute('data-intro','1');
  var portrait=window.StormViewport.portrait;
  var tilt0=portrait?20:26, tilt1=portrait?K.TILT_PORTRAIT_DEG:K.TILT_DEG;
  R.setProperty('--board-tilt',tilt0+'deg');
  camScale=1.06;

  /* 0–300: title resolves, distant pre-flash at 250 */
  introTimers.push(setTimeout(function(){ H.removeAttribute('data-intro') },40));
  introTimers.push(setTimeout(function(){ FX.flash(0.34,220) },250));

  /* 300–900: distance-derived wavefront from tile 1 */
  var o=tileCenter(1);
  for(var n=1;n<=30;n++){
    (function(k){
      var c=tileCenter(k), dist=Math.hypot(c.x-o.x,c.y-o.y);
      var delay=300+(dist/1200)*1000;                 /* 8–14ms apart in practice */
      var el3=tileEls[k];
      el3.style.animationDelay=delay.toFixed(0)+'ms';
      el3.classList.add('is-assemble');
      introTimers.push(setTimeout(function(){ el3.classList.add('is-in') }, delay+500));
    })(n);
  }
  /* 900–1400: one slow camera settle. buys more than any particle system. */
  introTimers.push(setTimeout(function(){
    tween(1100,E.expo,function(v){
      R.setProperty('--board-tilt',(tilt0+(tilt1-tilt0)*v).toFixed(2)+'deg');
      camScale=1.06+(1-1.06)*v;
    });
  },900));
  /* 1400–1800: pawns drop in, staggered 90ms */
  introTimers.push(setTimeout(function(){ GAME.addPlayer('ANDI','rayquaza_mur') },1400));
  introTimers.push(setTimeout(function(){ GAME.addPlayer('BUDI','raikou')      },1490));
  /* 1800–2000: the CTA arrives last, with one foil sweep */
  introTimers.push(setTimeout(function(){
    FX.sweep(btnRoll);
    UI.banner('BADAI ZAMRUD · SIAP');
    UI.log('SETIAP PIJAKAN BAYAR PACK · MINIMAL <b>1</b> PACK · TIDAK ADA KOSONG','sys');
    UI.log('MEJA DIBUKA · <b class="num">'+money(RULES.PRICE_PER_ROLL_IDR)+'</b> PER ROLL','sys');
    UI.setScore(scoreboard());
    finishIntro();
  },1800));
}
/* any input fast-forwards the intro; never ignored, never queued */
function fastForward(){
  if(introDone) return;
  LOOP.timeScale=3;
  setTimeout(finishIntro,180);
}
D.addEventListener('pointerdown',fastForward,{passive:true});
D.addEventListener('keydown',fastForward,{passive:true});

FX.setIntensity(0.52);
LOOP.start();
window.StormBoot.onReady(runIntro);
window.StormViewport.on(function(){ refanAll() });
})();
/* ===== /JS:LOOP+GAME ===== */
</script>
