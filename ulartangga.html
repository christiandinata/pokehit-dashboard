<title>Storm Emeralda · pindah</title>

<script>
/* The game moved to storm-emeralda.vercel.app. Browser storage is per domain, so
   the saved table on THIS domain is forwarded in the hash; the new page takes it
   only if it has no table of its own. */
(function(){
  var to = 'https://storm-emeralda.vercel.app/';
  try { var d = localStorage.getItem('pokehit.storm'); if (d) { JSON.parse(d); to += '#import=' + encodeURIComponent(d); } } catch (e) {}
  location.replace(to);
})();
</script>
