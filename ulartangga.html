<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BADAI ZAMRUD · ULAR TANGGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Saira+Semi+Condensed:wght@500;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
</head>
<body>
<!-- ===== SKELETON (B1) ===== -->
<div id="stage">

  <canvas id="sky-canvas" aria-hidden="true"></canvas>

  <div id="far" aria-hidden="true">
    <div class="par" id="par-exo"    data-depth="0.02"></div>
    <div class="par" id="par-tower"  data-depth="0.12">
      <!-- WET ANCIENT STONE, not a black blob. The pillars were a flat #04100C
           fill, which magnified as an amorphous silhouette with a rim light
           drawn round it. One gradient per tower gives the shaft a lit left
           flank (same upper-left key as the sky and the board), a darker
           core and a base that sinks into the haze; a second, banded overlay
           at low alpha reads as courses of masonry. Original geometry, no
           asset, two <defs>. -->
      <svg class="pil pil--far" viewBox="0 0 100 400" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="pilF" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A5A50"/><stop offset=".28" stop-color="#14332C"/><stop offset=".62" stop-color="#071811"/><stop offset="1" stop-color="#03100C"/></linearGradient><linearGradient id="pilFC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1E1A" stop-opacity=".62"/><stop offset=".46" stop-color="#123A44" stop-opacity=".14"/><stop offset="1" stop-color="#1E5FA8" stop-opacity=".46"/></linearGradient></defs><path fill="url(#pilF)" d="M8 400 L14 300 L20 210 L26 140 L31 84 L24 78 L26 62 L34 58 L36 44 L30 40 L32 30 L68 30 L70 40 L64 44 L66 58 L74 62 L76 78 L69 84 L74 140 L80 210 L86 300 L92 400 Z"/><path fill="url(#pilFC)" d="M8 400 L14 300 L20 210 L26 140 L31 84 L24 78 L26 62 L34 58 L36 44 L30 40 L32 30 L68 30 L70 40 L64 44 L66 58 L74 62 L76 78 L69 84 L74 140 L80 210 L86 300 L92 400 Z"/></svg>
      <svg class="pil pil--near" viewBox="0 0 100 400" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="pilN" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#31665A"/><stop offset=".26" stop-color="#173C33"/><stop offset=".60" stop-color="#081B14"/><stop offset="1" stop-color="#02100B"/></linearGradient><linearGradient id="pilNC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1E1A" stop-opacity=".58"/><stop offset=".42" stop-color="#123A44" stop-opacity=".12"/><stop offset="1" stop-color="#1E5FA8" stop-opacity=".40"/></linearGradient></defs><path fill="url(#pilN)" d="M8 400 L14 300 L20 210 L26 140 L31 84 L24 78 L26 62 L34 58 L36 44 L30 40 L32 30 L68 30 L70 40 L64 44 L66 58 L74 62 L76 78 L69 84 L74 140 L80 210 L86 300 L92 400 Z"/><path fill="url(#pilNC)" d="M8 400 L14 300 L20 210 L26 140 L31 84 L24 78 L26 62 L34 58 L36 44 L30 40 L32 30 L68 30 L70 40 L64 44 L66 58 L74 62 L76 78 L69 84 L74 140 L80 210 L86 300 L92 400 Z"/></svg>
    </div>
      <div class="par" id="par-haze"   data-depth="0.18"></div>
  </div>

  <div id="shake">
    <div id="camera">
      <div id="camera-rig">
        <div id="ground" aria-hidden="true"></div>
        <div id="board-plane">
          <div id="board-contact" aria-hidden="true"></div>
          <div id="board-ao" aria-hidden="true"></div>
          <div id="tiles"></div>
          <div id="shadow-plane" aria-hidden="true"></div>
          <div id="links-shadow" aria-hidden="true"></div>
          <div id="links" aria-hidden="true"></div>
          <div id="pawn-layer"></div>
          <div id="board-haze" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <div id="hud">
    <header id="hud-top">
      <div id="brand"><svg id="brand-mark" viewBox="0 0 18 18" aria-hidden="true"></svg><span>BADAI ZAMRUD</span></div>
      <svg id="set-mark" viewBox="0 0 16 16" aria-hidden="true"></svg>
      <div id="set-id">M6 · STORM EMERALDA<b>ROLL <span id="econ-price"></span></b></div>
      <div id="econ" class="panel m-glass js-flashable">
        <div class="econ__row is-turn">
          <span class="lbl">GILIRAN</span>
          <b class="nm" id="hud-turn">—</b>
          <span class="sub" id="hud-turn-sub"></span>
        </div>
        <div class="econ__row is-group is-last">
          <span class="lbl">HASIL TERAKHIR</span>
          <b class="nm" id="hud-last">—</b>
        </div>
        <div class="econ__row is-group is-box">
          <span class="lbl">BOX SEGEL</span>
          <b class="nm" id="econ-box">MASIH DI MEJA</b>
        </div>
        <div class="econ__row is-total">
          <span class="lbl">TOTAL PACK</span>
          <b class="num" id="econ-packs">0</b>
        </div>
      </div>
    </header>

    <aside id="rail-left" class="rail">
      <h2 class="rail__h">PEMAIN</h2>
      <ol id="roster"></ol>
      <div id="roster-actions">
        <button id="btn-add"  class="btn btn--ghost" type="button">TAMBAH</button>
        <button id="btn-edit" class="btn btn--ghost" type="button">UBAH</button>
      </div>
    </aside>

    <aside id="rail-right" class="rail">
      <h2 class="rail__h">CATATAN BADAI</h2>
      <ol id="log" aria-live="polite"></ol>
      <div id="dice-stage">
        <div id="dice">
          <div class="die__face" data-face="1"></div>
          <div class="die__face" data-face="2"></div>
          <div class="die__face" data-face="3"></div>
          <div class="die__face" data-face="4"></div>
          <div class="die__face" data-face="5"></div>
          <div class="die__face" data-face="6"></div>
        </div>
        <output id="dice-read" class="num"></output>
      </div>
      <button id="btn-roll" class="btn btn--primary m-emerald" type="button">
        <span class="btn__face">LEPAS BADAI</span>
        <span class="btn__sub">1 ROLL · <b class="num" id="btn-roll-price"></b></span>
      </button>
      <button id="btn-free" class="btn btn--gold" type="button" hidden>ROLL GRATIS</button>
    </aside>

    <div id="turn-banner" class="js-flashable" aria-live="polite"></div>
  </div>

  <div id="flash-plane" aria-hidden="true"></div>
  <div id="lens" aria-hidden="true">
    <div id="lens-vignette"></div><div id="lens-rain"></div>
    <div id="lens-rain-near"></div><div id="lens-dirt"></div>
  </div>

  <div id="scrim" aria-hidden="true"></div>

  <div id="modal-layer">
    <div id="reveal" class="modal" hidden>
      <div id="reveal-cards"></div>
      <div id="reveal-verdict" class="display"></div>
      <button id="reveal-close" class="btn btn--ghost" type="button">LANJUT</button>
    </div>
    <div id="jackpot" class="modal" hidden>
      <div id="jackpot-title" class="display"></div>
      <div id="jackpot-sub"></div>
    </div>
    <div id="editor" class="modal" hidden>
      <div id="editor-body"></div>
      <button id="editor-close" class="btn btn--ghost" type="button">TUTUP</button>
    </div>
  </div>

  <div id="gate">
    <div id="gate-art" aria-hidden="true"></div>
    <div id="gate-progress"><i id="gate-bar"></i></div>
    <button id="btn-start" class="btn btn--primary" type="button">SENTUH UNTUK MEMBUKA LANGIT</button>
    <p id="gate-credit">PokeHit · skin siaran buatan fan · tidak berafiliasi dengan pemegang hak mana pun</p>
  </div>

  <div id="toasts" aria-live="polite"></div>
</div>
<!-- ===== /SKELETON ===== -->

<style>
/* ===== CSS:TOKENS (B1) ===== */
:root{
  /* grounds */
  --c-ground-0:#050A08; --c-ground-1:#0A1410; --c-ground-2:#101C18; --c-ground-3:#16241F;
  /* thunderhead */
  --c-thunder-900:#1B2129; --c-thunder-700:#2A2F38; --c-thunder-500:#4B5563;
  --c-thunder-300:#8A96A3; --c-anvil:#E8EDF2;
  /* emerald */
  --c-emerald-900:#04150F; --c-emerald-800:#0B2B22; --c-emerald-700:#0E7A4F;
  --c-emerald-600:#12A15F; --c-emerald-500:#1DBE72; --c-emerald-400:#3EE08A;
  --c-emerald-200:#9CF5C8;
  /* draco */
  --c-draco-700:#1B3A2A; --c-draco-900:#0A1410;
  /* gold */
  --c-gold-700:#9A6F1E; --c-gold-600:#C9922B; --c-gold-500:#F2C438; --c-gold-200:#FFE9A3;
  /* lightning */
  --c-bolt-core:#EAF6FF; --c-bolt-halo:#7FD7FF;
  /* ozone */
  --c-ozone-600:#6B4FB0; --c-ozone-400:#A98CE8; --c-ozone-200:#D7C8FF;
  /* opposed accents */
  --c-magma-600:#C0392B; --c-magma-800:#8E1F14;
  --c-tide-600:#1E5FA8;  --c-tide-800:#0B2B52;
  /* semantic */
  --c-bg:            var(--c-ground-0);
  --c-surface:       #0C1714;
  --c-surface-2:     #122019;
  --c-surface-raised:#17291F;
  --c-edge:          #1F3A2C;
  --c-edge-hi:       #3A6B52;
  --c-edge-gold:     var(--c-gold-700);
  --c-ink:           #EAF3EC;
  --c-ink-dim:       #C3D8CC;
  /* was #6E8A7C — about 4.6:1 on the dark panels, and it carried .sub,
     .rail__h and every scoreboard label. ~8:1 now. */
  --c-ink-mute:      #A6C4B3;
  --c-ink-invert:    var(--c-emerald-900);
  --c-accent:        var(--c-emerald-400);
  --c-accent-hot:    var(--c-emerald-200);
  --c-focus:         var(--c-bolt-halo);
  --c-scrim:         rgba(5,10,8,.72);
  --c-shadow-hue:    #04150F;
  /* tile semantics */
  --c-tile-pack1:    var(--c-emerald-800);
  --c-tile-pack2:    var(--c-emerald-700);
  --c-tile-pack3:    var(--c-gold-600);
  --c-tile-ladder:   var(--c-bolt-halo);
  --c-tile-snake:    var(--c-magma-600);
  --c-tile-hitzone:  var(--c-ozone-400);
  --c-tile-jackpot:  var(--c-gold-500);
  /* status */
  --c-good:var(--c-emerald-400); --c-warn:var(--c-gold-500);
  --c-bad:var(--c-magma-600);    --c-info:var(--c-tide-600);

  /* type */
  --ff-display:"Chakra Petch","Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --ff-ui:"Saira Semi Condensed","Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --ff-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --fs-display-xl:4.5rem; --fs-display-l:3rem; --fs-display-m:2rem; --fs-display-s:1.3125rem;
  --fs-num-xl:3.5rem; --fs-num-l:1.75rem; --fs-num-m:1.1875rem; --fs-num-s:0.875rem;
  /* nothing in this build is allowed below 13px: the panel is read from a
     couch, through a phone camera, at 1280x800 on a 11in tablet. */
  /* SECONDARY TYPE FLOOR. 13px on a 1280-wide 11in panel is ~2.4mm: fine for
     the operator at 45cm, marginal for the room at a live sale, and every
     scoreboard label in the build was sitting on it. Nothing secondary now
     goes below 15px. */
  --fs-label-l:1rem; --fs-label:0.9375rem; --fs-label-s:0.9375rem;
  --fs-tile:1.0625rem; --fs-body:0.875rem;
  --tr-label:.08em; --tr-label-l:.08em; --tr-display:.01em;
  --tr-display-tight:-.02em; --tr-num:-.02em; --tr-body:.012em;

  /* motion */
  --e-expo:cubic-bezier(.16,1,.3,1);
  --e-emph:cubic-bezier(.2,0,0,1);
  --e-back:cubic-bezier(.34,1.56,.64,1);
  --e-back-sharp:cubic-bezier(.22,1.4,.36,1);
  --e-in:cubic-bezier(.4,0,1,1);
  --e-grav:cubic-bezier(.6,0,.8,.4);
  --e-riseY:cubic-bezier(.2,.6,.4,1);
  --e-axisX:cubic-bezier(.4,0,.6,1);
  --d-tap:70ms; --d-anticip:90ms; --d-flash-in:60ms; --d-flash-out:180ms;
  --d-impact:160ms; --d-hop-max:200ms; --d-hop-min:120ms; --d-land:70ms;
  --d-settle:120ms; --d-rung:120ms; --d-dice:900ms; --d-slide:1100ms;
  --d-panel:380ms; --d-count:600ms; --d-camera:1100ms; --d-reveal:520ms;
  --d-ambient:18s;
  --bloom-1:.60; --bloom-2:.35; --bloom-3:.18;

  /* texture */
  --tex-noise:none;
  --tex-noise-fallback:
    repeating-radial-gradient(circle at 3px 5px, rgba(234,243,236,.10) 0 .5px, transparent .5px 3px),
    repeating-radial-gradient(circle at 11px 2px, rgba(4,21,15,.12) 0 .5px, transparent .5px 4px);

  /* geometry */
  --vw:0px; --vh:0px; --dpr:1;
  --safe-l:48px; --safe-r:48px;
  --rail-w:232px; --hud-top-h:56px;
  --tile:104px; --tile-gap:8px;
  --board-w:664px; --board-h:552px;
  --board-tilt:34deg;
  --scene-persp:860px;
  --board-scale:1;
  --board-drop:0px;
  /* the bed's own thickness. the tile top face, the pawn's standing height and
     the pawn shadow plane all derive from this ONE number so they can never
     drift apart again. */
  --bed-z:26px;

  /* per-frame channels */
  --shake-x:0px; --shake-y:0px; --shake-rot:0deg;
  --cam-scale:1; --cam-persp:860px;
  --par-x:0px; --par-y:0px;
  --foil-angle:0deg;
  --flash:0;

  /* per-element channels */
  --tx:0px; --ty:0px; --h:0px;
  --lean:0deg;
  --sq-x:1; --sq-y:1;

  /* settings */
  --shake-intensity:1;
  /* ── STACKING ORDER — declared once, in one place, top of file to bottom of
        screen. The serpent STRADDLES the board (15 / 20) for depth, and its
        near half sits in the ONE slot that satisfies all three constraints:
        above the scrim, below the chrome, below the cards.
          0   sky          the WebGL thunderhead
          10  far          Sky Pillar silhouettes
          15  ray-back     serpent's deep half — the tile bed occludes it
          20  scene #shake the tile bed, pawns, dice (opaque: the occluder)
          50  flash        full-frame flash plane
          60  lens         vignette, rain, dirt
          62  scrim        modal backdrop — a VIGNETTE, never a black wash
          63  fx           particle canvas
          65  ray-front    serpent's near half
          66  hud          scoreboard strip, player rail, log, CTA
          70  modal        reveal cards, verdict, summit panel
          80  gate         entry gate
          90  toast        banners

        DERIVATION of ray-front = 65, from the three hard constraints:
          (a) it must never cover the HUD, the rail or the CTA  →  z < 66
          (b) it must never cover the reveal cards              →  z < 70
          (c) it must read clearly during a reveal              →  z > 62
        62 < 65 < 66 is the whole solution space, and (c) is only satisfiable
        at all because #scrim is now a VIGNETTE — opaque under the cards,
        alpha 0 at the frame edges (see #scrim) — so a body below the chrome
        is still fully visible where it flies. The old order put ray-front at
        65 over a --z-hud of 40, which is constraint (a) inverted: the CTA
        measured 91-100% opaque-covered on 3 of 12 flybys and the scoreboard
        strip was eaten on roughly a third of all landings. Moving the CHROME
        up rather than the serpent down keeps (c) intact.
        --z-fx sits at 63 for the mirror-image reason: the summit's crown
        burst is drawn on the fx canvas, and at 30 it was under #scrim's 0.55
        alpha over tile 30 — the one beat the whole set-piece pays off.
        #ray-front keeps its own rail mask on top of this (16% ink over the
        two rails, 46px feather) so the body reads as passing BEHIND the
        panels instead of being sliced by an invisible wall. */
  --z-sky:0; --z-far:10; --z-scene:20; --z-hud:66;
  --z-flash:50; --z-lens:60; --z-scrim:62; --z-fx:63; --z-ray:65; --z-modal:70;
  --z-ray-back:15;
  --z-gate:80; --z-toast:90;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ /* storm theme is the default look; grounds unchanged */ }
}
:root[data-theme="dark"]{ /* identical to the block above */ }
:root[data-theme="light"]{
  --c-bg:#DFE7E4; --c-surface:#F1F5F2; --c-surface-2:#E5EDE7; --c-surface-raised:#FBFDFB;
  --c-edge:#B9CCC0; --c-edge-hi:#7FAF95;
  --c-ink:#0A1F17; --c-ink-dim:#33564A; --c-ink-mute:#5F7E71; --c-ink-invert:#F1F5F2;
  --c-accent:var(--c-emerald-700); --c-accent-hot:var(--c-emerald-600);
  --c-scrim:rgba(223,231,228,.78); --c-shadow-hue:#26463A;
  --bloom-1:.24; --bloom-2:.14; --bloom-3:.07;
}
@media (prefers-reduced-motion: reduce){
  :root{--shake-intensity:0}
}
@property --shake-x{syntax:"<length>";inherits:false;initial-value:0px}
@property --shake-y{syntax:"<length>";inherits:false;initial-value:0px}
@property --shake-rot{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --cam-scale{syntax:"<number>";inherits:false;initial-value:1}
@property --flash{syntax:"<number>";inherits:false;initial-value:0}
@property --par-x{syntax:"<length>";inherits:true;initial-value:0px}
@property --par-y{syntax:"<length>";inherits:true;initial-value:0px}
@property --foil-angle{syntax:"<angle>";inherits:true;initial-value:0deg}
@property --foil-shift{syntax:"<length>";inherits:true;initial-value:0px}
@property --board-tilt{syntax:"<angle>";inherits:true;initial-value:30deg}
@property --cam-persp{syntax:"<length>";inherits:true;initial-value:860px}
@property --tx{syntax:"<length>";inherits:false;initial-value:0px}
@property --ty{syntax:"<length>";inherits:false;initial-value:0px}
@property --h{syntax:"<length>";inherits:false;initial-value:0px}
@property --lift{syntax:"<length>";inherits:false;initial-value:0px}
@property --lean{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --sq-x{syntax:"<number>";inherits:false;initial-value:1}
@property --sq-y{syntax:"<number>";inherits:false;initial-value:1}
/* ===== /CSS:TOKENS ===== */

/* ===== CSS:SHELL (B1) ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;background:var(--c-bg)}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{
  font-family:var(--ff-ui); color:var(--c-ink); background:var(--c-bg);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#stage{
  position:fixed;inset:0;overflow:hidden;
  touch-action:none;
  background:
    radial-gradient(140% 90% at 50% 108%, #16241F 0%, transparent 58%),
    linear-gradient(180deg,#070312 0%,#0C0A22 14%,#1B2129 42%,#101C18 74%,#050A08 100%);
}
img,svg,canvas{display:block;max-width:100%}

/* ── decorative sky / parallax ─────────────────────────────────────────────── */
#sky-canvas{
  position:absolute;inset:0;width:100%;height:100%;z-index:var(--z-sky);pointer-events:none;
  /* static CSS gradient is the StormSky mode:"off" fallback */
  background:
    radial-gradient(120% 44% at 50% 6%, rgba(107,79,176,.55), transparent 66%),
    radial-gradient(90% 26% at 50% 22%, rgba(30,190,114,.20), transparent 70%),
    linear-gradient(180deg,#08051A 0%,#141032 18%,#2A2F38 44%,#1B2129 62%,#0A1410 84%,#050A08 100%);
}
#far{position:absolute;inset:0;z-index:var(--z-far);pointer-events:none;overflow:hidden}
.par{
  position:absolute;left:-6%;right:-6%;pointer-events:none;
  transform:translate3d(calc(var(--par-x) * var(--_d,1)),calc(var(--par-y) * var(--_d,1)),0);
}
#par-exo{--_d:.02;top:0;height:34%;
  background:radial-gradient(120% 100% at 50% 0%, rgba(215,200,255,.16), transparent 62%)}
/* the Sky Pillar. two silhouettes, one far one near, both clear of the board's
   screen footprint so they read as landmarks and give the sky a scale
   reference instead of hiding behind an opaque tile bed. */
#par-tower{--_d:.12;bottom:0;height:96%;left:0;right:0}
.pil{position:absolute;bottom:0;height:100%;width:auto}
/* the towers carry their own SVG gradients now (see the markup); this stays as
   the fallback fill for any path that does not name one. */
.pil path{fill:#04100C}
.pil--far{left:18%;width:146px;height:80%;opacity:.76;
  filter:blur(1.5px) drop-shadow(0 0 30px rgba(127,215,255,.20)) drop-shadow(-2px 0 0 rgba(190,239,255,.30))}
.pil--near{right:23%;left:auto;width:206px;height:86%;opacity:.96;
  filter:blur(.6px) drop-shadow(0 0 44px rgba(127,215,255,.26)) drop-shadow(-2px 0 0 rgba(214,255,236,.34))}
#par-tower::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, transparent 34%, rgba(30,95,168,.10) 72%, rgba(5,10,8,.5))}
#par-haze{--_d:.18;bottom:0;height:34%;filter:blur(1.5px);
  background:linear-gradient(180deg, transparent, rgba(30,95,168,.14) 46%, rgba(192,57,43,.12) 72%, rgba(5,10,8,.62))}

/* ── fx canvas ─────────────────────────────────────────────────────────────── */
#fx-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:var(--z-fx);pointer-events:none}

/* ── shared material recipes ───────────────────────────────────────────────── */
.m-emerald{
  position:relative;
  background:
    radial-gradient(80% 60% at 30% 12%, rgba(156,245,200,.35), transparent 60%),
    linear-gradient(160deg,#0F3B2E 0%,#12634A 40%,#0A2B22 100%);
  box-shadow:
    inset 0 1px 0 rgba(190,255,230,.35),
    inset 1px 0 0 rgba(200,235,255,.28),
    inset 0 -2px 4px rgba(4,21,15,.55),
    0 1px 2px rgba(4,21,15,.55),
    0 18px 30px -12px rgba(4,21,15,.45);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
.m-emerald::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:128px 128px;mix-blend-mode:overlay;opacity:.11}
.m-emerald::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(24deg,transparent 42%,rgba(214,255,236,.30) 50%,transparent 58%),
    radial-gradient(2px 2px at 22% 68%, rgba(234,246,255,.9), transparent 70%),
    radial-gradient(1.5px 1.5px at 74% 34%, rgba(234,246,255,.8), transparent 70%);
  mix-blend-mode:color-dodge;opacity:.28}

.m-obsidian{
  position:relative;
  background:
    radial-gradient(120% 90% at 26% 8%, rgba(200,235,255,.10), transparent 55%),
    linear-gradient(168deg,#101C18 0%,#0A1410 55%,#050A08 100%);
  box-shadow:
    inset 0 1px 0 rgba(200,235,255,.10),
    inset 0 -3px 6px rgba(4,21,15,.6),
    0 1px 2px rgba(4,21,15,.55),
    0 18px 30px -12px rgba(4,21,15,.45);
}
.m-obsidian::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:96px 96px;mix-blend-mode:overlay;opacity:.16}
.m-obsidian::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(30% 12% at 34% 14%, rgba(234,246,255,.62), transparent 70%),
    linear-gradient(96deg,transparent 30%,rgba(127,215,255,.14) 31%,transparent 32%),
    linear-gradient(96deg,transparent 61%,rgba(127,215,255,.10) 62%,transparent 63%);
  mix-blend-mode:screen;opacity:.85}

.m-foil{position:relative;isolation:isolate;overflow:hidden}
/* HOLOGRAPHIC FOIL.
   Wide, fully saturated bands under color-dodge do not look like foil; they
   look like a test pattern, and that is what the reveal packs were. Real foil
   is a FINE diffraction grating that only shows where the light already is —
   so the bands are 2.2% instead of 6%, the blend is overlay instead of
   color-dodge, and a radial mask concentrates the whole effect into the
   upper-left quadrant the single key light comes from. */
.m-foil::before{content:"";position:absolute;inset:-40%;pointer-events:none;
  background:repeating-linear-gradient(11deg,
    #3EE08A 0 2.2%, #7FD7FF 2.2% 4.3%, #A98CE8 4.3% 6.4%, #F2C438 6.4% 8.2%,
    #1DBE72 8.2% 10.4%, #7FD7FF 10.4% 12.5%, #FF6A4A 12.5% 13.9%, #3EE08A 13.9% 16.2%);
  mix-blend-mode:overlay;opacity:.66;
  background-position:var(--foil-shift,0px) 0;
  transform:rotate(var(--foil-angle,0deg));
  -webkit-mask-image:radial-gradient(130% 105% at 26% 6%, #000 0 22%, rgba(0,0,0,.45) 54%, transparent 82%);
  mask-image:radial-gradient(130% 105% at 26% 6%, #000 0 22%, rgba(0,0,0,.45) 54%, transparent 82%)}
.m-foil::after{content:"";position:absolute;top:-40%;left:-60%;width:36%;height:180%;pointer-events:none;
  background:linear-gradient(24deg,transparent,rgba(255,255,255,.42) 48%,transparent);
  mix-blend-mode:screen;opacity:0;
  transform:translate3d(var(--foil-sweep,0px),0,0) rotate(18deg)}
.m-foil.is-sweep::after{animation:foil-sweep 1200ms var(--e-expo) 1 both}
/* the sweep's tilt comes off the CARD, not off this rule: two reveal packs
   with the sheen streak in the same place at the same angle read as one
   sprite drawn twice, which is exactly what the magnified pair measured. */
@keyframes foil-sweep{
  0%{opacity:0;transform:translate3d(-40%,0,0) rotate(var(--holo-rot,18deg))}
  18%{opacity:1}
  100%{opacity:0;transform:translate3d(320%,0,0) rotate(var(--holo-rot,18deg))}
}

.m-glass{
  position:relative;isolation:isolate;
  background:
    linear-gradient(135deg, rgba(234,243,236,.10), rgba(234,243,236,.02) 46%, rgba(18,32,25,.30)),
    linear-gradient(180deg, rgba(16,28,24,.955), rgba(10,20,16,.975));
  box-shadow:
    inset 0 1px 0 rgba(214,255,236,.34),
    inset 0 -1px 0 rgba(4,21,15,.66),
    inset 0 -10px 18px -10px rgba(4,21,15,.6),
    0 1px 2px rgba(4,21,15,.5),
    0 22px 38px -16px rgba(4,21,15,.5);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.m-glass::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:140px;mix-blend-mode:overlay;opacity:.09}
.m-glass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,transparent 34%,rgba(234,243,236,.14) 40%,transparent 47%);
  mix-blend-mode:screen;opacity:.8}

.ao-cap{background-image:radial-gradient(120% 120% at 50% 0%, transparent 58%, rgba(4,21,15,.35))}
.rim-key{box-shadow:inset 1px 0 0 rgba(200,235,255,.35)}

.bloom{position:relative;isolation:isolate}
.bloom>.bloom__l1,.bloom>.bloom__l2,.bloom>.bloom__l3{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.bloom>.bloom__l1{filter:blur(4px); opacity:var(--bloom-1)}
.bloom>.bloom__l2{filter:blur(12px);opacity:var(--bloom-2)}
.bloom>.bloom__l3{filter:blur(32px);opacity:var(--bloom-3)}

/* ── HUD frame ─────────────────────────────────────────────────────────────── */
#hud{position:absolute;inset:0;z-index:var(--z-hud);pointer-events:none}
#hud-top{
  position:absolute;top:0;left:var(--safe-l);right:var(--safe-r);height:var(--hud-top-h);
  display:flex;align-items:center;gap:14px;pointer-events:none;
}
#brand{
  display:flex;align-items:center;gap:8px;position:relative;padding-bottom:4px;
  font-family:var(--ff-display);font-weight:700;font-style:italic;
  font-size:var(--fs-display-m);letter-spacing:var(--tr-display-tight);text-transform:uppercase;
  line-height:1;
}
#brand>span{
  background:linear-gradient(180deg, var(--c-emerald-200) 0%, var(--c-emerald-700) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 0 var(--c-ground-0), 0 1px 0 var(--c-ground-0), 0 2px 8px rgba(4,21,15,.9);
}
#brand::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:1px;background:var(--c-gold-600);opacity:.85}
#brand-mark{width:18px;height:18px;color:var(--c-gold-500);align-self:flex-start;margin-top:2px;flex:0 0 18px}
#set-mark{width:38px;height:38px;color:var(--c-gold-500);opacity:1;flex:0 0 38px;
  filter:drop-shadow(0 1px 0 #5A3D0C) drop-shadow(0 0 10px rgba(242,196,56,.35))}
#set-id{font-family:var(--ff-num);font-size:var(--fs-label-s);font-weight:700;
  letter-spacing:.02em;color:var(--c-gold-500);line-height:1.2;white-space:nowrap;
  text-shadow:0 1px 0 rgba(1,8,6,.95), 0 0 10px rgba(1,8,6,.85)}
#set-id b{display:block;color:#FFF2C6;font-weight:700}

#econ{
  margin-left:auto;pointer-events:auto;touch-action:manipulation;
  display:flex;align-items:stretch;height:62px;padding:0 4px;
}
.econ__row{
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:0 11px;min-width:82px;
}
.econ__row.is-group{box-shadow:inset 2px 0 0 var(--c-edge)}
.econ__row .lbl{
  font-size:var(--fs-label-s);font-weight:800;letter-spacing:var(--tr-label);
  text-transform:uppercase;color:var(--c-ink-mute);white-space:nowrap;
}
.econ__row .num{
  font-family:var(--ff-num);font-weight:600;font-size:var(--fs-num-m);
  font-variant-numeric:tabular-nums lining-nums;letter-spacing:var(--tr-num);
  color:var(--c-ink);text-align:left;white-space:nowrap;
  transform:scale(var(--sq-x,1));transform-origin:0 50%;
}
.econ__row .nm{
  font-family:var(--ff-display);font-weight:800;font-size:var(--fs-label-l);
  letter-spacing:var(--tr-label-l);text-transform:uppercase;color:var(--c-ink);
  line-height:1.08;white-space:nowrap;max-width:28ch;overflow:hidden;text-overflow:ellipsis;
  transform:scale(var(--sq-x,1));transform-origin:0 50%;
}
.econ__row .sub{font-size:var(--fs-label-s);font-weight:800;letter-spacing:var(--tr-label);
  text-transform:uppercase;color:var(--c-ink-mute);white-space:nowrap;
  max-width:30ch;overflow:hidden;text-overflow:ellipsis}
.econ__row.is-turn{min-width:172px;box-shadow:inset 3px 0 0 var(--c-emerald-400)}
.econ__row.is-turn .lbl{color:var(--c-emerald-400)}
.econ__row.is-turn .nm{font-size:var(--fs-display-s);color:var(--c-emerald-200);
  text-shadow:0 0 16px rgba(62,224,138,.45), 0 1px 0 var(--c-ground-0)}
.econ__row.is-last{min-width:238px}
/* HASIL TERAKHIR carries the longest sentence in the build ("1 PACK · TURUN KE
   8 · 1 PACK UNTUK HARI"). It needed 472px in a 274px cell and ellipsised the
   payout away. #econ cannot widen — #set-id is 14px to its left — so this one
   row wraps to two lines inside the 62px band it already owns. */
.econ__row.is-last .nm{white-space:normal;line-height:1.06;max-height:2.2em;
  overflow:hidden;text-overflow:clip;
  /* pinned to is-last's own 238px min-width (216 + 2*11 padding) so wrapping
     cannot grow #econ and squeeze GILIRAN / BOX SEGEL out of the band. */
  max-width:216px}
.econ__row.is-last .nm{color:var(--c-gold-200)}
/* the two figures the room is actually reading are no longer the smallest
   type on screen. */
.econ__row.is-box .nm{color:var(--c-emerald-200);font-size:1.0625rem}
.econ__row.is-box.is-claimed .lbl{color:var(--c-gold-500)}
.econ__row.is-box.is-claimed .nm{color:var(--c-gold-200);
  text-shadow:0 0 16px rgba(242,196,56,.5), 0 1px 0 var(--c-ground-0)}
.econ__row.is-total{min-width:118px;padding:0 14px;
  box-shadow:inset 2px 0 0 var(--c-gold-700), inset 0 0 26px -10px rgba(242,196,56,.4)}
.econ__row.is-total .lbl{color:var(--c-gold-500)}
.econ__row.is-total .num{font-size:2rem;font-weight:700;color:var(--c-emerald-200);line-height:1}
.num.is-punch{transition:transform 180ms var(--e-back)}
/* ROOT FIX, not a patch: .num marks every figure in the build, and no figure
   ever wants a parent's text-transform. .btn is uppercase, so the CTA's price
   rendered the Rupiah symbol in all caps. It is "Rp" — mixed case, always,
   never uppercased by an ancestor. A rule on
   the element beats an inherited value regardless of source order, so this
   covers every current and future .num nested inside uppercased type. */
.num{text-transform:none}

/* ── rails ─────────────────────────────────────────────────────────────────── */
.rail{
  position:absolute;top:var(--hud-top-h);width:var(--rail-w);
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
#rail-left{left:var(--safe-l);bottom:16px;
  padding-left:10px;box-shadow:inset 3px 0 0 rgba(30,95,168,.55)}
#rail-right{right:var(--safe-r);bottom:16px;align-items:stretch;
  padding-right:10px;box-shadow:inset -3px 0 0 rgba(192,48,28,.55)}
.rail__h{
  margin:0 0 2px;font-size:var(--fs-label-l);font-weight:800;letter-spacing:var(--tr-label-l);
  text-transform:uppercase;color:var(--c-ink-mute);
  padding-left:2px;border-left:2px solid var(--c-emerald-700);
}
/* EIGHT MUST FIT. StormConst.MAX_PLAYERS is 8 and the 8th player is a paying
   customer on a live stream — "scroll to see them" is not an answer, because
   nobody scrolls a broadcast.
   MEASURED FIX. The old arithmetic (72px chip, 6px gap, "the rail gives 633")
   was wrong about the rail: at 1280x800 #roster's own client height is 609px,
   so 8*72 + 7*6 + 4 = 622 OVERFLOWED by 13px. That put a 4px scrollbar in the
   list, the scrollbar took 11px off every chip's inner width (150 -> 139), and
   the name line started ellipsising again at exactly 8 players — the "fixed at
   8, broken at 6" report is this, seen from the other side. 70px on a 4px gap:
   8*70 + 7*4 + 4 = 592, 17px of slack, no scrollbar, 150px name line.
   The overflow below stays as a pure safety net for short viewports
   (tiny/squat), never for 8-at-800. */
#roster{list-style:none;margin:0;padding:2px 0;display:flex;flex-direction:column;gap:4px;
  pointer-events:auto;flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-color:var(--c-edge) transparent}
#roster::-webkit-scrollbar{width:4px}
#roster::-webkit-scrollbar-thumb{background:var(--c-edge)}

.chip{
  position:relative;height:70px;padding:4px 8px 4px 48px;pointer-events:auto;
  touch-action:manipulation;cursor:pointer;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;
  column-gap:6px;row-gap:2px;align-content:center;
  opacity:0;transform:translate3d(-14px,0,0);
  transition:transform 260ms var(--e-expo), opacity 260ms var(--e-expo);
}
.chip.is-in{opacity:1;transform:translate3d(0,0,0)}
.chip.is-press{transform:translate3d(0,0,0) scale(.975)}
.chip.is-active{box-shadow:
  inset 0 0 0 3px var(--c-emerald-400),
  inset 0 0 26px -6px rgba(62,224,138,.42),
  0 0 0 1px rgba(62,224,138,.30),
  0 26px 44px -16px rgba(4,21,15,.6);
  transform:translate3d(7px,0,0)}
.chip.is-active.is-press{transform:translate3d(7px,0,0) scale(.975)}
.chip.is-active::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--c-emerald-400),var(--c-emerald-700))}
.chip[data-apex="true"]{
  box-shadow:
    inset 0 1px 0 rgba(255,233,163,.4),
    inset 0 0 0 1px rgba(201,146,43,.55),
    inset 0 -10px 18px -10px rgba(4,21,15,.6),
    0 1px 2px rgba(4,21,15,.5),
    0 22px 38px -16px rgba(4,21,15,.5);
  clip-path:polygon(14px 0, 42% 0, 50% 7px, 58% 0, 100% 0,
    100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
}
.chip[data-tier="sar"]:not([data-apex="true"]){box-shadow:
  inset 0 1px 0 rgba(214,255,236,.4),
  inset 0 0 0 1.5px var(--c-emerald-700),
  inset 0 -10px 18px -10px rgba(4,21,15,.6),
  0 1px 2px rgba(4,21,15,.5),
  0 22px 38px -16px rgba(4,21,15,.5)}
/* the left gutter is the card: emblem art on top, rarity term stamped under it
   like the rarity mark on a real SIR. Moving the rarity out of the text column
   is what buys the SIR name a whole legible line. */
/* ══ THE EMBLEM BOX HOLDS THE EMBLEM ══════════════════════════════════════
   MEASURED FIX. Three labels were stacked on top of a 42px canvas of
   character art: a rank badge over its top-left, an opaque 2-letter code
   across its centre and a rarity term under it — at 5.5x the art was
   effectively invisible, and the badge and the rarity both reached past the
   chip's own left border onto the panel edge. The code is deleted (it is
   already on the pawn, where it is the only label), the rarity moves into the
   text column beside PETAK, the rank badge moves to the right gutter and only
   the leader gets one, and the canvas grows into the space they leave. */
.chip__emblem{position:absolute;left:3px;top:10px;width:44px;height:44px;pointer-events:none}
.chip__sigil{display:none}
.chip__rar{
  grid-column:1;grid-row:3;justify-self:end;align-self:center;pointer-events:none;
  font-family:var(--ff-ui);font-size:var(--fs-label-s);font-weight:800;letter-spacing:.05em;
  color:var(--c-gold-600);text-shadow:0 1px 2px var(--c-shadow-hue);
}
/* the PLAYER's name is the one string on the chip that is a person, so it gets
   the chip's FULL inner width (150px) — row 1 spans both columns. In the old
   two-row grid it shared row 1 with the pack count and got 98px, which
   ellipsised every real Indonesian name on the board ("ARDI SA...", "GILANG
   ..."). Row 1 spanning + shortName() in buildChip is what makes them fit. */
.chip__name{grid-column:1/-1;grid-row:1;font-size:1.125rem;font-weight:800;line-height:1.05;
  letter-spacing:var(--tr-label-l);text-transform:uppercase;color:var(--c-ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:end}
/* the SIR identity line. "Mega Golisopod ex" ellipsised to "Mega Golis..."
   destroyed the one thing that makes a chip a person, and no rail width at
   1280 can hold the long form (see measure(): 216 is a ceiling). So the roster
   shows a measured short form — 98px in a 107px cell — and the FULL card name
   rides the header band, the log and the editor, where the room exists. */
.chip__sir{grid-column:1;grid-row:2;font-size:1rem;font-weight:600;
  color:var(--c-ink-dim);letter-spacing:var(--tr-body);line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip__pos,.chip__packs{
  font-family:var(--ff-num);font-variant-numeric:tabular-nums lining-nums;
  line-height:1;
}
/* HIERARCHY: packs won is what the customer paid for, so it is the biggest
   number on the chip. It owns the whole right column across rows 2-3. Board
   position is navigation, and rides small on row 3 under the card name. */
.chip__packs{grid-column:2;grid-row:2/span 2;justify-self:end;align-self:center;
  font-size:var(--fs-num-l);font-weight:700;color:var(--c-gold-500);
  letter-spacing:var(--tr-num);min-width:2.2ch;text-align:right}
.chip__packs::after{content:" P";font-family:var(--ff-ui);font-size:var(--fs-label-s);
  font-weight:800;color:var(--c-ink-mute)}
.chip__pos{grid-column:1;grid-row:3;justify-self:start;
  font-size:1rem;font-weight:700;color:var(--c-emerald-200);
  letter-spacing:var(--tr-num);text-align:left}
.chip__pos::before{content:"PETAK ";font-family:var(--ff-ui);font-weight:800;
  letter-spacing:0;color:var(--c-ink-mute)}
.chip__rank{
  position:absolute;right:6px;top:3px;padding:1px 5px;pointer-events:none;
  font-family:var(--ff-num);font-weight:700;font-size:var(--fs-label-s);
  letter-spacing:var(--tr-label);color:var(--c-ink-mute);background:rgba(5,10,8,.78);
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px);
}
.chip__rank:empty{display:none}
.chip[data-rank="1"] .chip__rank{color:var(--c-ink-invert);background:var(--c-gold-500)}
.chip[data-apex="true"] .chip__rar{color:var(--c-gold-200)}

/* 13px grey-on-dark at 60cm on an 11-inch panel is guesswork, and these two
   buttons sat at the 44px floor directly under the pawn cluster. They now have
   their own ground so the pawns cannot read as part of them, and 56px of it. */
#roster-actions{display:flex;gap:6px;pointer-events:auto;
  padding:5px;background:linear-gradient(180deg,rgba(12,23,20,.955),rgba(5,10,8,.975));
  box-shadow:inset 0 1px 0 rgba(214,255,236,.14), 0 2px 8px rgba(4,21,15,.55)}
#roster-actions .btn{flex:1;min-height:56px}

/* ── log ───────────────────────────────────────────────────────────────────── */
#log{
  list-style:none;margin:0;padding:6px 8px;pointer-events:auto;touch-action:pan-y;
  height:296px;flex:1 1 auto;min-height:132px;overflow:hidden;
  overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:3px;
  /* WHOLE ROWS ONLY. A row is one to three wrapped lines, so no fixed row
     COUNT can fit the box: six rows overflowed it and the sixth was sliced
     through the middle of a line, and the bottom fade that used to live here
     only made the slice softer. UI.log now measures and hides the rows that
     do not fit whole (see trimLog), so there is nothing left to fade. */
  background:linear-gradient(180deg, rgba(12,23,20,.955), rgba(5,10,8,.975));
  box-shadow:inset 0 1px 0 rgba(214,255,236,.16), inset 0 -1px 0 rgba(4,21,15,.7),
             inset 0 -12px 18px -12px rgba(4,21,15,.7), 0 1px 2px rgba(4,21,15,.5);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  scrollbar-width:thin;scrollbar-color:var(--c-edge) transparent;
}
#log::-webkit-scrollbar{width:4px}
#log::-webkit-scrollbar-thumb{background:var(--c-edge)}
.logrow{
  display:flex;gap:6px;align-items:baseline;
  font-size:1rem;line-height:1.25;letter-spacing:var(--tr-body);color:var(--c-ink);
  padding:2px 0 3px;border-bottom:1px solid rgba(31,58,44,.5);
  opacity:0;transform:translate3d(10px,0,0);
  transition:transform 300ms var(--e-expo), opacity 300ms var(--e-expo);
}
.logrow.is-in{opacity:1;transform:translate3d(0,0,0)}
/* .logrow sets display:flex, and an AUTHOR display beats the UA's
   [hidden]{display:none} — so trimLog's `hidden` did nothing until this rule
   existed and the rows it had "hidden" were still being clipped by #log. */
.logrow[hidden]{display:none}
.logrow__k{
  flex:0 0 auto;font-size:1rem;font-weight:800;letter-spacing:var(--tr-label);
  text-transform:uppercase;padding:1px 5px;color:var(--c-ink-invert);background:#9CF5C8;
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
}
.logrow[data-kind="roll"]  .logrow__k{background:var(--c-thunder-300)}
.logrow[data-kind="pack"]  .logrow__k{background:var(--c-emerald-500)}
.logrow[data-kind="ladder"] .logrow__k{background:var(--c-bolt-halo)}
.logrow[data-kind="snake"] .logrow__k{background:var(--c-gold-500);color:var(--c-ink-invert)}
.logrow[data-kind="hit"]   .logrow__k{background:var(--c-ozone-400)}
.logrow[data-kind="box"]   .logrow__k{background:var(--c-gold-500)}
.logrow[data-kind="sys"]   .logrow__k{background:#9CF5C8}
.logrow__t{flex:1 1 auto;min-width:0}
.logrow__t b{font-family:var(--ff-num);font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;color:var(--c-ink)}

/* ── buttons ───────────────────────────────────────────────────────────────── */
.btn{
  position:relative;appearance:none;border:0;margin:0;font-family:var(--ff-display);
  color:var(--c-ink);pointer-events:auto;touch-action:manipulation;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;
  min-height:44px;padding:10px 14px;
  font-weight:700;text-transform:uppercase;letter-spacing:var(--tr-label-l);
  transition:transform var(--d-tap) var(--e-back-sharp), opacity var(--d-tap) var(--e-expo);
  transform:translate3d(0,0,0);
}
.btn:focus{outline:none}
.btn:focus-visible{box-shadow:0 0 0 2px var(--c-focus), 0 0 0 5px rgba(127,215,255,.24)}
.btn.is-press{transform:translate3d(0,2px,0) scale(.955)}
.btn[disabled]{opacity:.42;pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translate3d(0,-1px,0)}
}
.btn--ghost{
  font-family:var(--ff-ui);font-weight:800;font-size:var(--fs-label);letter-spacing:var(--tr-label);
  color:var(--c-ink-dim);
  background:linear-gradient(170deg, rgba(23,41,31,.92), rgba(10,20,16,.94));
  box-shadow:inset 0 1px 0 rgba(200,235,255,.16), inset 0 -1px 0 rgba(4,21,15,.7),
             inset 1px 0 0 rgba(200,235,255,.10), 0 1px 2px rgba(4,21,15,.6),
             0 10px 18px -12px rgba(4,21,15,.5);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.btn--gold{
  font-size:var(--fs-display-s);color:var(--c-emerald-900);
  background:
    radial-gradient(80% 60% at 30% 10%, rgba(255,255,255,.5), transparent 62%),
    linear-gradient(168deg,#FFE9A3 0%,#F2C438 42%,#9A6F1E 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 5px rgba(4,21,15,.4),
             0 1px 2px rgba(4,21,15,.6), 0 14px 26px -12px rgba(154,111,30,.7);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.btn--primary{
  color:var(--c-accent-hot);
  background:
    radial-gradient(84% 62% at 28% 8%, rgba(156,245,200,.34), transparent 60%),
    linear-gradient(162deg,#0F3B2E 0%,#12634A 42%,#08251C 100%);
  box-shadow:
    inset 0 1px 0 rgba(190,255,230,.4),
    inset 1px 0 0 rgba(200,235,255,.3),
    inset 0 -3px 7px rgba(4,21,15,.6),
    inset 0 0 0 1px rgba(31,58,44,.9),
    0 2px 3px rgba(4,21,15,.6),
    0 20px 34px -14px rgba(4,21,15,.6);
  clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
}
#btn-start::before{ /* noise / micro-detail. scoped so it cannot shadow .m-foil::before */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:128px;mix-blend-mode:overlay;opacity:.11;
}
#btn-roll{
  height:96px;min-height:96px;padding:0 16px;
  background:
    radial-gradient(84% 62% at 28% 8%, rgba(156,245,200,.20), transparent 60%),
    linear-gradient(160deg,#0E7A4F 0%,#0B4A32 46%,#07231A 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
#btn-roll .btn__face{
  font-size:var(--fs-display-m);line-height:1;letter-spacing:var(--tr-display-tight);
  color:var(--c-accent-hot);text-shadow:0 1px 2px var(--c-shadow-hue), 0 0 12px rgba(5,10,8,.6);
}
#btn-roll .btn__sub{
  font-family:var(--ff-ui);font-size:var(--fs-label);font-weight:800;letter-spacing:var(--tr-label);
  color:var(--c-ink-dim);
}
#btn-roll .btn__sub .num{font-family:var(--ff-num);font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;color:var(--c-gold-500)}
/* the attract pulse scales from the button's OUTER edge so the 3% growth
   pushes inward — never into the 48px MIUI gesture gutter (§1.3.14). */
#btn-roll.is-attract{animation:attract 2400ms var(--e-expo) infinite alternate;
  transform-origin:100% 50%}
html[data-portrait] #btn-roll.is-attract{transform-origin:50% 100%}
@keyframes attract{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,0,0) scale(1.03)}}
#btn-roll.is-busy .btn__face{color:var(--c-ink-mute)}
/* the free-roll button overlays ROLL instead of joining the flow, so showing it
   cannot shift the rail. ROLL is disabled while a free roll is owed anyway. */
#btn-free{position:absolute;left:0;right:0;bottom:0;height:96px;min-height:96px;z-index:2}
html[data-portrait] #btn-free{height:auto;min-height:56px}

/* ── turn banner / toasts ──────────────────────────────────────────────────── */
/* Moved OUT of the bottom of the frame. Down there it landed on top of the
   near row's labels — the most perspective-magnified type on screen — and the
   collision of two unrelated pieces of uppercase text at low contrast is what
   read to reviewers as leftover debug output at the bottom-left. Up here it
   sits in the sky reserve, over the storm, where a title card belongs. */
#turn-banner{
  position:absolute;top:calc(var(--hud-top-h) + 14px);left:50%;
  transform:translate3d(-50%,-14px,0) scale(.96);opacity:0;
  padding:9px 34px 11px;pointer-events:none;
  font-family:var(--ff-display);font-weight:700;font-size:var(--fs-display-m);
  letter-spacing:var(--tr-label-l);text-transform:uppercase;color:var(--c-accent-hot);
  text-shadow:0 1px 2px var(--c-shadow-hue), 0 0 12px rgba(5,10,8,.6);
  background:
    radial-gradient(70% 160% at 50% 50%, rgba(5,10,8,.86), transparent 78%),
    linear-gradient(180deg, rgba(18,32,25,.7), rgba(5,10,8,.72));
  box-shadow:inset 0 1px 0 rgba(214,255,236,.24), inset 0 -1px 0 rgba(4,21,15,.7);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:transform 380ms var(--e-back), opacity 380ms var(--e-expo);
}
#turn-banner.is-in{opacity:1;transform:translate3d(-50%,0,0) scale(1)}
/* portrait has no sky reserve — the board is already at the top there. */
html[data-portrait] #turn-banner{top:auto;bottom:246px;font-size:1.5rem;
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toasts{position:absolute;left:50%;bottom:22px;z-index:var(--z-toast);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate3d(-50%,0,0)}
.toast{
  padding:8px 16px;font-size:var(--fs-label-l);font-weight:800;letter-spacing:var(--tr-label);
  text-transform:uppercase;color:var(--c-ink);
  background:linear-gradient(170deg, rgba(23,41,31,.96), rgba(5,10,8,.96));
  box-shadow:inset 0 1px 0 rgba(214,255,236,.2), 0 10px 22px -10px rgba(4,21,15,.8);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  opacity:0;transform:translate3d(0,10px,0) scale(.96);
  transition:transform 360ms var(--e-back), opacity 360ms var(--e-expo);
}
.toast.is-in{opacity:1;transform:translate3d(0,0,0) scale(1)}
.toast[data-kind="bad"]{color:var(--c-bad)}
.toast[data-kind="gold"]{color:var(--c-gold-500)}

/* ── flash + lens ──────────────────────────────────────────────────────────── */
#flash-plane{
  position:absolute;inset:0;z-index:var(--z-flash);pointer-events:none;
  mix-blend-mode:screen;opacity:var(--flash);
  background:
    radial-gradient(120% 70% at 44% 4%, rgba(234,246,255,.92), transparent 62%),
    linear-gradient(180deg, rgba(127,215,255,.42), rgba(156,245,200,.10) 56%, transparent);
}
.js-flashable{position:relative}
/* strength-driven, so a 0.16 landing and a 0.9 jackpot no longer look alike */
.js-flashable.is-flash{
  filter:brightness(calc(1 + var(--flash-k,.4) * 1.15))
         saturate(calc(1 + var(--flash-k,.4) * 0.55))}
#lens{position:absolute;inset:0;z-index:var(--z-lens);pointer-events:none;overflow:hidden}
/* the focal funnel: near-clear over the board and the sky window, heavy in
   the corners, plus a warm bloom low-centre so the eye is pulled to the bed. */
#lens-vignette{position:absolute;inset:0;
  background:
    radial-gradient(58% 40% at 50% 84%, rgba(62,224,138,.055), transparent 70%),
    radial-gradient(132% 118% at 50% 52%, transparent 44%, rgba(3,14,10,.30) 76%, rgba(2,9,7,.92) 100%),
    linear-gradient(180deg, rgba(2,9,7,.42) 0%, transparent 12%)}
/* the streaks are foreground rain on the LENS, not the storm. At .34 they
   were a grey scrim over the whole thunderhead; two finer, faster passes at
   low opacity read as rain without flattening what is behind them. */
/* MEASURED FIX. One repeating-linear-gradient at a single 21px pitch moved by
   one translate: every streak identical in length, angle and opacity, i.e. a
   texture sheet, not weather. Three layers now, each with its own pitch,
   angle, alpha and SPEED, and each gradient's period carries four different
   streak lengths so no two neighbours match. The near layer is wider, blurrier
   and twice as fast — that differential is what parallax is. */
#lens-rain{position:absolute;inset:-14%;mix-blend-mode:screen;opacity:.30;filter:blur(.7px);
  background:
    repeating-linear-gradient(74deg,
      transparent 0 19px, rgba(214,246,255,.30) 19px 20px,
      transparent 20px 44px, rgba(214,246,255,.16) 44px 45px,
      transparent 45px 63px, rgba(214,246,255,.24) 63px 64px,
      transparent 64px 97px, rgba(214,246,255,.11) 97px 98px, transparent 98px 131px),
    repeating-linear-gradient(78deg,
      transparent 0 33px, rgba(200,235,255,.15) 33px 34px,
      transparent 34px 71px, rgba(200,235,255,.09) 71px 72px, transparent 72px 119px);
  animation:rainfall var(--d-ambient) linear infinite}
#lens-rain-near{position:absolute;inset:-22%;mix-blend-mode:screen;opacity:.20;
  filter:blur(2.4px);pointer-events:none;
  background:repeating-linear-gradient(70deg,
    transparent 0 44px, rgba(226,250,255,.46) 44px 47px,
    transparent 47px 108px, rgba(226,250,255,.28) 108px 110px, transparent 110px 191px);
  animation:rainfall-near calc(var(--d-ambient) / 2.4) linear infinite}
@keyframes rainfall{from{transform:translate3d(0,-8%,0)}to{transform:translate3d(-6%,8%,0)}}
@keyframes rainfall-near{from{transform:translate3d(2%,-16%,0)}to{transform:translate3d(-9%,18%,0)}}
#lens-dirt{position:absolute;inset:0;mix-blend-mode:screen;opacity:.09;
  background:
    radial-gradient(2px 2px at 18% 26%, rgba(234,246,255,.9), transparent 70%),
    radial-gradient(3px 2px at 71% 62%, rgba(234,246,255,.7), transparent 70%),
    radial-gradient(2px 3px at 44% 81%, rgba(234,246,255,.6), transparent 70%),
    radial-gradient(1.5px 1.5px at 88% 17%, rgba(234,246,255,.8), transparent 70%)}

/* ── the serpent's near layer is MASKED to the board window ────────────────
   z 65 bought legibility over the scrim and paid for it with every panel
   underneath: the LEPAS BADAI button measured 91-100% opaque-covered, the
   roster 30-47%, the log 34-46%. The straddle needed a third dimension, not a
   higher z. The front canvas now carries a static mask: full ink between the
   two rails, a 46px feather, and 16% residual over the rails so the body still
   reads as passing BEHIND the panels instead of being sliced by an invisible
   wall. Mask only — no layout property, no per-frame cost, nothing animated. */
#ray-front{
  --ray-clip-l:calc(var(--safe-l) + var(--rail-w));
  --ray-clip-r:calc(var(--safe-r) + var(--rail-w));
  /* the feather lives INSIDE the board window, not straddling the rail edge:
     #btn-roll's left edge IS the rail edge, so a ramp centred on it left the
     button's first 10px at full ink and it measured 15% covered. */
  -webkit-mask-image:linear-gradient(90deg,
    rgba(0,0,0,.16) 0, rgba(0,0,0,.16) var(--ray-clip-l),
    #000 calc(var(--ray-clip-l) + 46px), #000 calc(100% - var(--ray-clip-r) - 46px),
    rgba(0,0,0,.16) calc(100% - var(--ray-clip-r)), rgba(0,0,0,.16) 100%);
  mask-image:linear-gradient(90deg,
    rgba(0,0,0,.16) 0, rgba(0,0,0,.16) var(--ray-clip-l),
    #000 calc(var(--ray-clip-l) + 46px), #000 calc(100% - var(--ray-clip-r) - 46px),
    rgba(0,0,0,.16) calc(100% - var(--ray-clip-r)), rgba(0,0,0,.16) 100%);
}
/* portrait moves the rails out of the side columns, so the window would be
   wrong; the flyby gets the whole frame back there. */
html[data-portrait] #ray-front{-webkit-mask-image:none;mask-image:none}

/* ── modals ────────────────────────────────────────────────────────────────── */
/* The backdrop is its OWN layer at 62, under the serpent at 65, because a
   72%-black full-frame curtain painted over the signature animation. It is now
   a vignette: opaque enough under the cards to keep them legible, clear at the
   edges where the flyby lives. */
#scrim{
  position:absolute;inset:0;z-index:var(--z-scrim);pointer-events:none;opacity:0;
  transition:opacity var(--d-panel) var(--e-expo);
  /* MEASURED. The old outer ramp (.24 at 80% -> 0 at 100%) still left ~0.17
     of black on the mid LEFT and RIGHT edges, because the ellipse is 116%
     wide: the frame's side edge lands at ~86% of the gradient, inside the
     ramp. The corners and the top/bottom edges were already 0. The ramp now
     completes at 88%, so every edge of the frame is clear to within 0.03 and
     the serpent at --z-ray reads against the live scene there. The 0.90/0.66
     core stops are untouched, so the cards keep exactly the backdrop they
     were legible against. */
  background:radial-gradient(116% 96% at 50% 52%,
    rgba(5,10,8,.90) 0 26%, rgba(5,10,8,.66) 54%,
    rgba(5,10,8,.24) 72%, rgba(5,10,8,0) 88%);
}
#scrim.is-on{opacity:1}
/* the summit: the panel lives in the top third, so the darkness does too — the
   lower half of the frame, where tile 30 and the crown are, stays clear. */
#scrim.is-crown{
  background:linear-gradient(180deg,
    rgba(5,10,8,.90) 0%, rgba(5,10,8,.70) 30%,
    rgba(5,10,8,.20) 62%, rgba(5,10,8,0) 84%);
}
#modal-layer{position:absolute;inset:0;z-index:var(--z-modal);pointer-events:none}
.modal{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px var(--safe-l);
  pointer-events:auto;background:none;
  opacity:0;transform:scale(.985);
  transition:transform var(--d-panel) var(--e-expo), opacity var(--d-panel) var(--e-expo);
}
.modal[hidden]{display:none}
.modal.is-in{opacity:1;transform:scale(1)}
.display{
  font-family:var(--ff-display);font-weight:700;font-size:var(--fs-display-l);
  letter-spacing:var(--tr-display-tight);text-transform:uppercase;color:var(--c-accent-hot);
  text-align:center;line-height:1.02;
  text-shadow:0 1px 2px var(--c-shadow-hue), 0 0 12px rgba(5,10,8,.6);
}
/* a real perspective, so the entry can SWING the pack into the frame instead
   of sliding a rectangle up it. */
#reveal-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:840px;
  perspective:1100px;perspective-origin:50% 42%}
/* the verdict overlapped the card bottoms at 1x — the row carries a 40px
   ambient shadow that .modal's 16px gap does not clear. */
#reveal-verdict{margin-top:26px}
.rcard{
  /* 63x88mm is the real card ratio (0.716); 148x207 keeps it and is 38% more
     area than the old 126x176 — this is the moment the customer learns what
     they won, so it gets the most pixels in the UI. */
  position:relative;width:148px;height:207px;
  background:
    radial-gradient(80% 50% at 30% 10%, rgba(156,245,200,.32), transparent 62%),
    linear-gradient(162deg,#0F3B2E 0%,#0B2B22 46%,#050A08 100%);
  box-shadow:inset 0 1px 0 rgba(190,255,230,.34), inset 1px 0 0 rgba(200,235,255,.24),
             inset 0 -3px 6px rgba(4,21,15,.6), 0 2px 3px rgba(4,21,15,.6),
             0 26px 40px -18px rgba(4,21,15,.7);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  opacity:0;transform:translate3d(0,22px,0) rotateY(-78deg) rotate(-4deg) scale(.92);
  transform-origin:12% 50%;transform-style:preserve-3d;
  transition:transform 620ms var(--e-back), opacity 300ms var(--e-expo);
}
/* THE FLIP. The pack comes in edge-on and swings to face the room: the reveal
   is a turn, not a slide. One transform, no second face to mis-cull. */
.rcard.is-in{opacity:1;transform:translate3d(0,0,0) rotateY(0deg) rotate(0deg) scale(1)}
/* MILLED EDGE — 3px of dark on the two away sides plus a lit lip on the near
   ones. This is the whole of "it has thickness", and it costs one shadow. */
.rcard{
  box-shadow:inset 0 1px 0 rgba(190,255,230,.34), inset 1px 0 0 rgba(200,235,255,.24),
             inset -3px 0 0 rgba(1,9,7,.82), inset 0 -3px 0 rgba(1,9,7,.72),
             inset -4px -4px 5px -3px rgba(1,9,7,.9),
             /* the CUT PLY, 2px of lit card stock just inside the dark away
                edges — listed after them so they overpaint the outer 3px and
                only the ply shows. This is "the cards are flat rectangles
                with no edge". */
             inset -5px 0 0 rgba(168,232,202,.20), inset 0 -5px 0 rgba(168,232,202,.16),
             /* and the LIT ply on the two near sides, 2px rather than 1: the
                magnified pair read as "no card edge, no white core, no
                thickness", and one pixel of rim at 34% is under the noise
                floor of a re-encoded stream. */
             inset 0 2px 0 rgba(226,255,242,.42), inset 2px 0 0 rgba(214,244,255,.30),
             /* the CONTACT shadow, tight and dark under the bottom edge —
                the 26px ambient one alone reads as a glow, not as an object
                sitting in front of something. */
             0 3px 4px -1px rgba(1,8,6,.85), 0 26px 40px -18px rgba(4,21,15,.7);
}
/* THE FOIL, as its own child. It used to be .m-foil::before — the SAME
   pseudo-element slot .rcard::before uses for the crimp, and .rcard wins on
   source order, so the holographic grating this build already contains has
   never once rendered on a reveal pack. That is the whole reason the money
   moment measured as "three flat grey-green rectangles". */
/* z 0, UNDER the art and the text. Foil is under ink on a real card: a
   grating at constant opacity running straight across the art window and the
   name bar is the single clearest tell that this is a texture pasted on top,
   and it is what "foil-textured token, not a TCG card" was looking at. The
   angle also moves 11deg -> 62deg so it runs with the set lattice instead of
   as horizontal candy stripes. */
.rcard__foil{content:"";position:absolute;inset:-45%;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(62deg,
    #3EE08A 0 2.2%, #7FD7FF 2.2% 4.3%, #A98CE8 4.3% 6.4%, #F2C438 6.4% 8.2%,
    #1DBE72 8.2% 10.4%, #7FD7FF 10.4% 12.5%, #FF6A4A 12.5% 13.9%, #3EE08A 13.9% 16.2%);
  /* BLOCKER FIX — `overlay` is a CONTRAST operator: over a base darker than
     50% grey it darkens, so a rainbow grating laid in overlay over a
     #0F3B2E..#050A08 card face produced, to within a couple of levels,
     #0F3B2E..#050A08. The grating has been in this file for three rounds and
     has never been visible; that is the whole of "three flat grey-green
     rectangles". `screen` is the operator a diffraction foil actually is —
     light ADDED by the grating — and it reads on a dark base. */
  mix-blend-mode:screen;opacity:.34;
  background-position:var(--foil-shift,0px) 0;
  transform:rotate(var(--foil-angle,0deg));
  -webkit-mask-image:radial-gradient(130% 105% at 26% 6%, #000 0 22%, rgba(0,0,0,.45) 54%, transparent 82%);
  mask-image:radial-gradient(130% 105% at 26% 6%, #000 0 22%, rgba(0,0,0,.45) 54%, transparent 82%)}
/* the set's own pattern, pressed into the wrapper under the foil: a lattice of
   ozone chevrons. Original geometry, two gradients, no asset. */
.rcard__grain{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.30;
  background:
    repeating-linear-gradient(58deg, rgba(198,255,228,.20) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(-58deg, rgba(198,255,228,.14) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(0deg, rgba(2,12,9,.30) 0 1px, transparent 1px 6px)}
/* the specular sweep — light travelling across a grating. */
.rcard__holo{content:"";position:absolute;top:-30%;left:-70%;width:42%;height:170%;
  pointer-events:none;z-index:2;
  background:linear-gradient(24deg,transparent,rgba(255,255,255,.52) 48%,transparent);
  mix-blend-mode:screen;opacity:0;transform:translate3d(0,0,0) rotate(var(--holo-rot,18deg))}
.rcard.is-in .rcard__holo{animation:foil-sweep 1150ms var(--e-expo) 300ms 1 both}
/* TIER BY MATERIAL, not by border colour: a PACK is matte-grated, a SAMBAR is
   a full rainbow prism that dodges instead of overlaying. */
.rcard[data-tier="top"] .rcard__foil{opacity:.72;mix-blend-mode:color-dodge;filter:saturate(1.45)}
.rcard[data-tier="top"] .rcard__grain{opacity:.46}
.rcard[data-tier="top"] .rcard__holo{animation-duration:900ms}
/* the crimp: a sealed booster is welded shut along the top edge */
.rcard::before{content:"";position:absolute;left:0;right:0;top:0;height:17px;pointer-events:none;
  z-index:4;
  background:repeating-linear-gradient(90deg,
    rgba(226,255,242,.26) 0 2px, rgba(2,12,9,.42) 2px 5px);
  box-shadow:inset 0 -1px 0 rgba(2,12,9,.8), inset 0 1px 0 rgba(226,255,242,.30)}
/* the set stamp, bottom-centre, where a real pack carries its block code */
.rcard::after{content:"M6";position:absolute;left:0;right:0;bottom:5px;text-align:center;z-index:3;
  font-family:var(--ff-num);font-weight:700;font-size:var(--fs-label-s);letter-spacing:.16em;
  color:rgba(214,255,236,.52);pointer-events:none}
.rcard__n{position:absolute;right:10px;top:21px;text-align:right;
  font-family:var(--ff-num);font-weight:700;font-size:var(--fs-label-s);color:var(--c-ink-dim);
  font-variant-numeric:tabular-nums lining-nums;z-index:3}
/* ══ THE ART WINDOW ═══════════════════════════════════════════════════════
   A trading card is a FRAME AROUND A PICTURE, and the reveal pack had no
   picture: one flat gradient, a word and an invisible foil. This is the
   picture — an ORIGINAL abstract sigil, nothing traced, nothing approximating
   any real card face: a faceted emerald lozenge (the set's cut-gem motif) with
   an ozone ring behind it and a gold keystone under it. Four gradients, no
   asset, and mid-value on purpose so the grating above it has something to
   modulate. */
/* == THE ART ===========================================================
   A conic gradient under a polygon clip is a PINWHEEL, whatever the stops
   say - that is what two attempts at a "faceted gem" produced, and at 100px
   a pinwheel is the only thing anybody sees. So the emblem is not a gem: it
   is the SET'S OWN MOTIF, a serpent's eye, which is legible at any size a
   card face allows and needs no facets to be read.
   ORIGINAL geometry throughout - an almond, a slit pupil, a starburst and a
   pressed chevron ground, all from gradients. Nothing traced, nothing
   approximating any real card face or logo. */
.rcard__sigil{position:absolute;left:13px;right:13px;top:22px;height:112px;z-index:1;
  pointer-events:none;
  background:
    radial-gradient(72% 62% at 50% 46%, rgba(96,226,166,.34), rgba(4,26,20,0) 76%),
    repeating-linear-gradient(62deg, rgba(198,255,228,.10) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-62deg, rgba(198,255,228,.07) 0 1px, transparent 1px 9px),
    linear-gradient(168deg, rgba(16,74,56,.92), rgba(4,24,18,.96));
  box-shadow:inset 0 0 0 1px rgba(126,248,190,.22), inset 0 8px 18px rgba(2,14,10,.55);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
/* the starburst BEHIND the eye: four wide lobes, hollow at the centre so it
   radiates instead of covering the iris. */
.rcard__sigil::after{content:"";position:absolute;inset:-6%;
  background:conic-gradient(from 22deg at 50% 47%,
    rgba(214,255,236,.34) 0 5%, rgba(0,0,0,0) 5% 25%,
    rgba(127,215,255,.26) 25% 30%, rgba(0,0,0,0) 30% 50%,
    rgba(214,255,236,.34) 50% 55%, rgba(0,0,0,0) 55% 75%,
    rgba(169,140,232,.26) 75% 80%, rgba(0,0,0,0) 80% 100%);
  -webkit-mask-image:radial-gradient(closest-side, transparent 0 26%, #000 46%, transparent 92%);
  mask-image:radial-gradient(closest-side, transparent 0 26%, #000 46%, transparent 92%)}
/* THE EYE: an almond, a vertical slit pupil, a gold orbital rim. */
.rcard__sigil::before{content:"";position:absolute;left:15%;right:15%;top:27%;height:42%;
  z-index:1;
  clip-path:polygon(50% 0%, 84% 22%, 100% 50%, 84% 78%, 50% 100%, 16% 78%, 0% 50%, 16% 22%);
  background:
    linear-gradient(90deg, rgba(3,16,12,0) 0 45.5%, rgba(3,16,12,.96) 45.5% 54.5%,
                           rgba(3,16,12,0) 54.5%),
    radial-gradient(76% 76% at 44% 34%, rgba(255,246,214,.98) 0 12%,
                    rgba(255,214,110,.96) 34%, rgba(206,146,26,.92) 62%,
                    rgba(88,50,4,.88) 100%);
  box-shadow:0 0 0 2px rgba(255,233,163,.62), 0 0 14px rgba(255,206,84,.34),
             inset 0 -6px 10px rgba(60,32,2,.5)}
.rcard[data-tier="top"] .rcard__sigil::before{
  box-shadow:0 0 0 2.5px rgba(255,248,222,.92), 0 0 22px rgba(255,233,163,.62),
             inset 0 -6px 10px rgba(60,32,2,.5)}
.rcard[data-tier="top"] .rcard__sigil{
  background:
    radial-gradient(72% 62% at 50% 46%, rgba(255,226,140,.34), rgba(30,18,2,0) 76%),
    repeating-linear-gradient(62deg, rgba(255,246,214,.12) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-62deg, rgba(255,246,214,.08) 0 1px, transparent 1px 9px),
    linear-gradient(168deg, rgba(82,54,6,.94), rgba(22,14,2,.96));
  box-shadow:inset 0 0 0 1px rgba(255,233,163,.34), inset 0 8px 18px rgba(14,8,1,.6)}
/* THE RARITY FRAME. A double bezel — an inner hairline in the rarity's own
   metal plus the milled outer edge already on .rcard. This is the cue that
   separates a SAMBAR from a PACK from across a room, before either word is
   readable. */
.rcard__frame{position:absolute;inset:5px;z-index:2;pointer-events:none;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  box-shadow:inset 0 0 0 1.5px rgba(126,248,190,.52),
             inset 0 0 0 3.5px rgba(2,14,10,.62),
             inset 0 0 0 4.5px rgba(126,248,190,.20),
             inset 0 0 16px rgba(4,21,15,.6)}
/* corner keystones — the rarity's own metal, pressed into all four corners.
   One element, four gradients, and it is what a frame is FOR. */
.rcard__frame::after{content:"";position:absolute;inset:0;
  background:
    linear-gradient(135deg, rgba(126,248,190,.62) 0 9px, transparent 9px) left top/16px 16px no-repeat,
    linear-gradient(225deg, rgba(126,248,190,.62) 0 9px, transparent 9px) right top/16px 16px no-repeat,
    linear-gradient(45deg,  rgba(126,248,190,.62) 0 9px, transparent 9px) left bottom/16px 16px no-repeat,
    linear-gradient(315deg, rgba(126,248,190,.62) 0 9px, transparent 9px) right bottom/16px 16px no-repeat}
.rcard[data-tier="top"] .rcard__frame{
  box-shadow:inset 0 0 0 2px rgba(255,233,163,.90),
             inset 0 0 0 4.5px rgba(46,28,2,.66),
             inset 0 0 0 6px rgba(255,233,163,.34),
             inset 0 0 20px rgba(154,111,30,.46)}
.rcard[data-tier="top"] .rcard__frame::after{
  background:
    linear-gradient(135deg, rgba(255,240,190,.85) 0 11px, transparent 11px) left top/19px 19px no-repeat,
    linear-gradient(225deg, rgba(255,240,190,.85) 0 11px, transparent 11px) right top/19px 19px no-repeat,
    linear-gradient(45deg,  rgba(255,240,190,.85) 0 11px, transparent 11px) left bottom/19px 19px no-repeat,
    linear-gradient(315deg, rgba(255,240,190,.85) 0 11px, transparent 11px) right bottom/19px 19px no-repeat}
/* RARITY PIPS, bottom-left, where a card carries its rarity mark: one for a
   PACK, three for a SAMBAR. Readable before either word is. */
.rcard__pips{position:absolute;left:10px;bottom:5px;z-index:3;display:flex;gap:3px;
  pointer-events:none}
.rcard__pips i{width:8px;height:8px;background:rgba(126,248,190,.85);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  box-shadow:0 0 4px rgba(126,248,190,.6)}
.rcard[data-tier="top"] .rcard__pips i{background:rgba(255,240,190,.95);
  box-shadow:0 0 6px rgba(255,233,163,.8)}
/* the name plate, under the art where a card carries its name — not floating
   across the middle of the picture, which is where it used to sit. */
/* THE THREE REGIONS THAT MAKE A CARD A CARD: name bar, art window, text box.
   The art window and the name bar were already here; the TYPE LINE and the
   bottom TEXT BOX were the missing pair, and without them the face is a frame
   round a glyph. Both are static plates — no layout property is animated. */
/* ONE LINE. At 15px with .12em of tracking, "BOOSTER - OZON" is wider than
   the 136px plate and wrapped, leaving a dangling middot on the second line
   — measured on both cards of a two-card reveal. */
.rcard__t{position:absolute;left:6px;right:6px;bottom:23px;z-index:3;
  text-align:center;padding:3px 0 4px;
  white-space:nowrap;overflow:hidden;text-overflow:clip;
  font-family:var(--ff-num);font-weight:700;font-size:13px;
  letter-spacing:.055em;color:rgba(206,246,226,.66);
  background:linear-gradient(180deg, rgba(2,12,9,.62), rgba(2,12,9,.90));
  box-shadow:inset 0 1px 0 rgba(214,255,236,.16), inset 0 -1px 0 rgba(1,8,6,.85)}
.rcard[data-tier="top"] .rcard__t{color:rgba(255,238,186,.74)}
.rcard__l{position:absolute;left:8px;right:8px;top:138px;text-align:center;z-index:3;
  padding:4px 0 5px;
  font-family:var(--ff-display);font-size:var(--fs-display-s);font-weight:800;
  letter-spacing:var(--tr-label-l);color:var(--c-emerald-200);
  background:linear-gradient(180deg, rgba(2,12,9,.20), rgba(2,12,9,.86) 42%, rgba(2,12,9,.20));
  box-shadow:inset 0 1px 0 rgba(214,255,236,.22), inset 0 -1px 0 rgba(1,8,6,.9);
  text-shadow:0 -1px 0 rgba(1,8,6,.95), 0 1px 0 rgba(214,255,236,.20)}
.rcard[data-tier="top"] .rcard__l{color:var(--c-gold-200)}
.rcard[data-tier="top"]{
  box-shadow:inset 0 1px 0 rgba(255,233,163,.5), inset 0 0 0 1.5px var(--c-gold-600),
             inset 0 -3px 6px rgba(4,21,15,.6), 0 2px 3px rgba(4,21,15,.6),
             0 26px 44px -16px rgba(154,111,30,.6)}
.rcard[data-tier="top"] .rcard__n{color:var(--c-gold-200)}
.rcard[data-tier="top"]::after{content:"M6 \00B7 SIR";color:rgba(255,233,163,.72)}
.rcard[data-tier="top"]::before{
  background:repeating-linear-gradient(90deg,
    rgba(255,246,220,.34) 0 2px, rgba(46,28,2,.44) 2px 5px)}
