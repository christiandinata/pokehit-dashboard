/* ===== /CSS:SHELL ===== */

/* ===== CSS:SCENE (B2) ===== */
/* --- the 3D chain. NO overflow/filter/mask/clip-path/opacity on these. --- */
#shake{
  position:absolute;inset:0;z-index:var(--z-scene);pointer-events:none;
  transform:translate3d(var(--shake-x),var(--shake-y),0) rotate(var(--shake-rot));
  transform-style:preserve-3d;
}
#camera{
  position:absolute;inset:0;pointer-events:none;
  /* the eye sits above the board and looks DOWN at it: with the bed dropped
     into the lower third, an origin at 26% put the vanishing point far above
     the far edge and sheared the whole bed. 40% aims the camera at the board. */
  /* 50% 50% keeps the projection centre on the rig's own transform origin,
     which is what lets measure() solve the board's screen footprint in closed
     form instead of guessing at it. */
  perspective:var(--cam-persp);perspective-origin:50% 50%;
  transform-style:preserve-3d;
}
#camera-rig{
  position:absolute;inset:0;pointer-events:none;
  transform:translate3d(var(--par-x),var(--par-y),0) scale(var(--cam-scale)) scale(var(--board-scale));
  transform-style:preserve-3d;
}
#board-plane{
  position:absolute;
  left:calc(50% - (var(--board-w) / 2));
  top:calc(50% - (var(--board-h) / 2) + var(--board-drop));
  width:var(--board-w);height:var(--board-h);
  transform:rotateX(var(--board-tilt));
  transform-style:preserve-3d;
  pointer-events:none;
}
html[data-portrait] #board-plane{top:calc(50% - (var(--board-h) / 2) - 92px)}

/* a receding floor. at 30deg a 3200px-deep quad reaches a visible far edge —
   that far edge IS the horizon, and it now meets the sky. */
#ground{
  position:absolute;left:50%;top:50%;
  width:4400px;height:2000px;
  margin:calc(-1000px + var(--board-drop)) 0 0 -2200px;
  transform:rotateX(var(--board-tilt)) translate3d(0,0,-56px);
  transform-style:flat;pointer-events:none;
  /* THIS is what made the board "float in a dead grey void": a 4400x3200
     OPAQUE quad, tilted back, whose far half rises off the top of the frame —
     it covered the entire sky with a near-black wash, so no amount of work in
     the sky shader could ever have shown. The far third now dissolves, and
     what the eye reads instead is a wet stone floor receding into storm haze
     and meeting the rain shaft at a real horizon.
     A mask is legal here only because this element is a preserve-3d LEAF that
     already declares transform-style:flat. */
  -webkit-mask-image:linear-gradient(180deg, transparent 0 16%, rgba(0,0,0,.55) 28%, #000 38%);
  mask-image:linear-gradient(180deg, transparent 0 16%, rgba(0,0,0,.55) 28%, #000 38%);
  background:
    /* wet ancient stone catching the storm: a cool sky-bounce pool under the
       board, a warm magma bleed at the right edge, a tide bleed at the left. */
    radial-gradient(38% 26% at 50% 44%, rgba(24,74,58,.30), transparent 72%),
    radial-gradient(24% 18% at 12% 40%, rgba(30,95,168,.20), transparent 74%),
    radial-gradient(24% 18% at 88% 40%, rgba(150,44,30,.18), transparent 74%),
    radial-gradient(72% 62% at 50% 48%, rgba(4,12,9,0) 20%, rgba(3,9,7,.80) 60%, rgba(2,6,5,.99) 100%),
    linear-gradient(0deg,#07201A 0%,#051612 26%,#03100C 56%,#020806 100%);
}
#ground::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:320px;
  mix-blend-mode:overlay;opacity:.10}

/* the board's own cast shadow, dropped down-right of the upper-left key.
   two lobes: a tight, dark core hugging the plinth (contact occlusion) and a
   wide soft one further out (the storm's ambient bounce). Without the tight
   lobe a blurred blob reads as "floating"; it is the hard edge at the plinth
   line that makes something look like it is TOUCHING. */
#board-contact{
  position:absolute;inset:-4px -14px -26px -14px;pointer-events:none;
  transform:translate3d(13px,0,-28px);
  filter:blur(14px);
  background:radial-gradient(56% 54% at 48% 60%,
    rgba(0,0,0,.98), rgba(0,0,0,.72) 56%, rgba(0,0,0,.16) 82%, transparent 92%);
}
#board-contact::after{
  content:"";position:absolute;inset:-70px -120px -150px -120px;pointer-events:none;
  filter:blur(58px);
  background:radial-gradient(54% 52% at 50% 62%,
    rgba(0,0,0,.72), rgba(2,10,8,.30) 58%, transparent 86%);
}

/* aerial perspective ON the board. the top of the plane is the far edge, so
   this fades the far rows toward the sky's value — the strongest depth cue
   available after occlusion, and it was entirely absent. */
#board-haze{
  /* it was lifted 86px and inset -40, so the perspective divide magnified it
     well past the board's far edge and it painted a light grey slab across the
     bottom of the storm. Sitting just above the tile tops it does its actual
     job -- fading the far rows toward the sky value -- and nothing else. */
  position:absolute;inset:-6px -18px -22px -18px;pointer-events:none;
  transform:translate3d(0,0,44px);
  mix-blend-mode:screen;
  background:linear-gradient(180deg,
    rgba(138,182,208,.40) 0%,
    rgba(130,174,202,.20) 22%,
    rgba(122,166,196,.075) 42%,
    rgba(112,158,190,.02) 58%,
    transparent 72%);
}

#board-ao{
  /* the ground slab the tiles are set into. corners < edges < centre in
     brightness, plus the two opposed rim lights (tide left, magma right). */
  position:absolute;inset:-34px;pointer-events:none;
  transform:translate3d(0,0,-2px);
  background:
    radial-gradient(78% 74% at 50% 46%, rgba(10,20,16,.20) 30%, rgba(4,21,15,.72) 82%, rgba(4,21,15,.9) 100%),
    linear-gradient(90deg, rgba(30,95,168,.40), transparent 22%, transparent 78%, rgba(192,57,43,.36)),
    linear-gradient(168deg, rgba(16,28,24,.94), rgba(10,20,16,.96) 56%, rgba(5,10,8,.98));
  box-shadow:
    inset 0 1px 0 rgba(200,235,255,.14),
    inset 1px 0 0 rgba(200,235,255,.08),
    inset 0 -3px 8px rgba(4,21,15,.75),
    0 8px 0 #04150F,
    0 40px 70px -24px rgba(4,21,15,.9);
}
#board-ao::after{ /* basalt grain on the slab */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:180px;mix-blend-mode:overlay;opacity:.13;
}
#board-ao::before{ /* the emerald-and-black serpent, engraved into the slab */
  content:"";position:absolute;inset:8%;pointer-events:none;opacity:.13;
  mix-blend-mode:overlay;
  background:
    radial-gradient(closest-side at 50% 50%, transparent 61%, rgba(62,224,138,.9) 62%, transparent 66%),
    radial-gradient(closest-side at 32% 34%, transparent 40%, rgba(62,224,138,.8) 41.5%, transparent 45%),
    radial-gradient(closest-side at 70% 66%, transparent 40%, rgba(62,224,138,.8) 41.5%, transparent 45%),
    radial-gradient(closest-side at 50% 50%, transparent 24%, rgba(62,224,138,.7) 25.5%, transparent 29%);
}
/* lifted onto the tile TOPS. 27px above a flat tile is a 3% perspective error
   at --cam-persp 860 — invisible — and it is what makes every pawn's
   height-tracking contact ellipse actually render. */
#shadow-plane{position:absolute;inset:0;pointer-events:none;
  transform:translate3d(0,0,calc(var(--bed-z) + 1px));transform-style:preserve-3d}
#tiles{position:absolute;inset:0;transform-style:preserve-3d}
#pawn-layer{position:absolute;inset:0;transform-style:preserve-3d}
/* the conduits ride 60px above the bed and drop a blurred, desaturated copy of
   themselves at 44px — parallax buys real elevation for six lines of CSS. */
#links{
  position:absolute;left:0;bottom:0;width:var(--board-w);height:var(--board-h);
  pointer-events:none;transform:translate3d(0,0,30px);overflow:visible;
}
#links-shadow{
  position:absolute;left:0;bottom:0;width:var(--board-w);height:var(--board-h);
  pointer-events:none;transform:translate3d(13px,-7px,2px);overflow:visible;
  filter:blur(4px) brightness(0) saturate(0);opacity:.82;
}

/* --- tiles: 5 layers (base form, positional highlight, kind rim, water specular, noise) --- */
.tile{
  position:absolute;left:0;bottom:0;width:var(--tile);height:var(--tile);
  /* 24px on a 104px tile is 23% — a slab, not a card. This is the number the
     whole "is it flat?" verdict turns on, and per-kind overrides below give
     the bed real relief so the tile TYPES are legible as silhouette. */
  --th:var(--bed-z);
  transform:translate3d(var(--tx), calc(-1 * var(--ty)), var(--h,var(--bed-z)));
  transform-style:preserve-3d;   /* a flat leaf threw away the whole 3D chain */
  pointer-events:auto;touch-action:manipulation;
  --_k1:#101C18; --_k2:#050A08; --_kg:rgba(200,235,255,.10); --_ki:var(--c-ink-dim);
  background:none;
  box-shadow:
    0 14px 12px -6px rgba(1,6,4,.94),
    0 30px 40px -16px rgba(2,10,8,.72);
  opacity:0;
}
/* the visible top face. carries the chamfer and all five original layers. */
.tile__skin{
  position:absolute;inset:0;pointer-events:none;
  clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
  background:
    radial-gradient(112% 88% at 26% 6%, rgba(214,242,255,.24), transparent 56%),
    linear-gradient(166deg, var(--_k1) 0%, var(--_k1) 26%, var(--_k2) 86%, #04100C 100%);
  box-shadow:
    /* the bevel: a bright chamfer along the two key-facing edges, a dark
       one along the two away edges. Reading this pair is how the eye
       decides a surface is raised. */
    inset 0 2px 0 rgba(226,255,242,.42),
    inset 2px 0 0 rgba(206,238,255,.30),
    inset 0 -2px 0 rgba(1,7,5,.85),
    inset -2px 0 0 rgba(1,7,5,.62),
    inset 0 0 0 1px var(--_kg),
    inset 0 -9px 14px -4px rgba(2,12,9,.72);
}
.tile__skin::before{ /* emerald facets + water specular, key upper-left */
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.9;
  background:
    conic-gradient(from 218deg at 34% 8%, rgba(255,255,255,.34) 0 6%, transparent 6% 22%,
                   rgba(200,235,255,.18) 22% 29%, transparent 29% 62%,
                   rgba(255,255,255,.22) 62% 68%, transparent 68%),
    radial-gradient(30% 12% at 32% 12%, rgba(234,246,255,.66), transparent 70%),
    linear-gradient(96deg,transparent 30%,rgba(127,215,255,.13) 31%,transparent 32%),
    linear-gradient(96deg,transparent 61%,rgba(127,215,255,.09) 62%,transparent 63%);
}
.tile__skin::after{ /* basalt grain */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:var(--tex-noise);background-size:96px 96px;mix-blend-mode:overlay;opacity:.16;
}
/* the near side face — a real quad standing out of the plane. it splays with
   perspective the way a fixed +4px screen-space shadow never could. */
.tile__side{
  position:absolute;left:0;right:0;top:100%;height:var(--th);pointer-events:none;
  transform-origin:50% 0;transform:rotateX(-90deg);
  /* wet obsidian cut face: a bright top lip where the chamfer catches the key,
     a mid band of the tile's own hue at half value, then near-black in the
     ambient occlusion at the foot of the slab. */
  background:linear-gradient(180deg,
    color-mix(in oklab, var(--_k1) 46%, #DCF4FF 20%) 0%,
    color-mix(in oklab, var(--_k1) 62%, #000 34%) 26%,
    color-mix(in oklab, var(--_k2) 72%, #000 28%) 62%,
    #010806 100%);
  box-shadow:
    inset 0 2px 0 rgba(230,255,244,.52),          /* the lip that sells it */
    inset 0 -3px 6px rgba(0,0,0,.7);
}
.tile__side::after{ /* vertical tool marks: quarried stone, not extruded plastic */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.30;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.10) 0 1px, transparent 1px 5px,
    rgba(0,0,0,.22) 5px 6px, transparent 6px 11px);
}
.tile__side--r,.tile__side--l{
  left:auto;right:0;top:0;bottom:0;width:var(--th);height:auto;
  transform-origin:100% 50%;transform:rotateY(90deg);
  /* exactly one of the pair is front-facing for any given tile; the GPU culls
     the other for free, so no JS ever has to decide which side to draw. */
  backface-visibility:hidden;
  /* the away-facing side. dark, but never a silhouette: it carries a cold
     rim from the storm behind the board so the slab keeps its corner. */
  background:linear-gradient(90deg,
    color-mix(in oklab, var(--_k2) 62%, #000 38%) 0%, #010705 76%,
    color-mix(in oklab, #0B2B52 60%, #000 40%) 100%);
  box-shadow:
    inset 2px 0 0 rgba(190,228,255,.20),
    inset -1px 0 0 rgba(127,215,255,.16);
}
.tile__side--l{
  left:0;right:auto;transform-origin:0 50%;transform:rotateY(-90deg);
  background:linear-gradient(270deg,
    color-mix(in oklab, var(--_k1) 52%, #DCF4FF 14%) 0%,
    color-mix(in oklab, var(--_k1) 58%, #000 30%) 34%,
    color-mix(in oklab, var(--_k2) 70%, #000 26%) 74%, #020A07 100%);
  box-shadow:
    inset -2px 0 0 rgba(230,255,244,.44),
    inset 1px 0 0 rgba(127,215,255,.10);
}
.tile__side--r::after,.tile__side--l::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;
  background:repeating-linear-gradient(0deg,
    rgba(255,255,255,.08) 0 1px, transparent 1px 6px);
}
.tile.is-in{opacity:1}
/* intro assembly: rise 12px + scale .94 -> 1, wavefront-delayed from JS via animation-delay */
.tile.is-assemble{animation:tile-in 480ms var(--e-expo) both}
@keyframes tile-in{
  0%{opacity:0;transform:translate3d(var(--tx), calc(-1 * var(--ty)), calc(var(--h,var(--bed-z)) + 90px)) scale(.94)}
  70%{opacity:1}
  100%{opacity:1;transform:translate3d(var(--tx), calc(-1 * var(--ty)), var(--h,var(--bed-z))) scale(1)}
}
/* ── kind identities ─────────────────────────────────────────────────────────
   Every kind differs on THREE axes at once, because colour alone was reading
   as one muddy teal field:
     hue      — what element of Hoenn it belongs to
     value    — how loud it is allowed to be (pack2 is the quiet 13/30 floor)
     HEIGHT   — the silhouette. snake tiles sit BELOW the bed, gold sits above
                it, so the board's relief tells you the odds before you read
                a single word.                                               */
.tile[data-kind="pack1"]  {--_k1:#0A3A2C;--_k2:#02140F;--_kg:rgba(62,224,138,.30); --_ki:#8FC9AF;
                           --h:20px; --th:20px}
.tile[data-kind="pack2"]  {--_k1:#0E4E3C;--_k2:#03201A;--_kg:rgba(62,224,138,.55); --_ki:#BFF3D8;
                           --h:26px; --th:26px}
.tile[data-kind="pack3"]  {--_k1:#FFCF5C;--_k2:#7A4E09;--_kg:rgba(255,245,208,1);  --_ki:#2B1B01;
                           --h:42px; --th:42px}
.tile[data-kind="ladder"] {--_k1:#3FB6EC;--_k2:#052A3A;--_kg:rgba(178,234,255,1);  --_ki:#F2FCFF;
                           --h:32px; --th:32px}
.tile[data-kind="snake"]  {--_k1:#A62916;--_k2:#1C0503;--_kg:rgba(255,146,108,.95);--_ki:#FFDCD1;
                           --h:14px; --th:14px}
.tile[data-kind="hitzone"]{--_k1:#9C71FF;--_k2:#190A3C;--_kg:rgba(232,222,255,1);  --_ki:#F9F6FF;
                           --h:38px; --th:38px}
.tile[data-kind="jackpot"]{--_k1:#FFDD6A;--_k2:#8A5B0A;--_kg:rgba(255,255,255,1);  --_ki:#231400}
/* snake tiles are cut INTO the bed: a sunken trap with the wall shadow falling
   inward. reads as danger without a word of copy. */
.tile[data-kind="snake"] .tile__skin{
  box-shadow:
    inset 0 -2px 0 rgba(255,168,138,.30),
    inset 0 3px 0 rgba(1,7,5,.9),
    inset 3px 0 0 rgba(1,7,5,.72),
    inset 0 0 0 1px var(--_kg),
    inset 0 12px 18px -4px rgba(0,0,0,.82);
}
/* pack3 / hitzone are raised, so they get a stronger key highlight */
.tile[data-kind="pack3"] .tile__skin,
.tile[data-kind="hitzone"] .tile__skin{
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.58),
    inset 2px 0 0 rgba(230,248,255,.40),
    inset 0 -2px 0 rgba(1,7,5,.8),
    inset -2px 0 0 rgba(1,7,5,.6),
    inset 0 0 0 1.5px var(--_kg),
    inset 0 -10px 16px -4px rgba(2,12,9,.6);
}

.tile__n{
  position:absolute;left:9px;top:5px;
  font-family:var(--ff-num);font-weight:700;font-size:1.6875rem;
  font-variant-numeric:tabular-nums lining-nums;letter-spacing:var(--tr-num);
  color:var(--_ki);opacity:1;line-height:1;
  /* engraved: dark above, light below */
  text-shadow:0 -1.5px 0 rgba(1,8,6,.95), 0 1.5px 0 rgba(226,255,242,.22);
}
.tile__kind{
  position:absolute;left:7px;right:5px;bottom:7px;
  font-size:var(--fs-tile);font-weight:800;letter-spacing:.045em;
  text-transform:uppercase;color:var(--_ki);opacity:1;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;
  text-shadow:0 -1.5px 0 rgba(1,8,6,.95), 0 1.5px 0 rgba(226,255,242,.18),
              0 0 8px rgba(1,8,6,.7);
}
/* a hairline gold rule over the label: rarity stamping, and it separates the
   type from the stone so a 17px label survives the perspective squash. */
.tile__kind::before{
  content:"";position:absolute;left:0;right:22%;bottom:100%;margin-bottom:4px;height:1px;
  background:linear-gradient(90deg, currentColor, transparent);opacity:.42;
}
.tile__badge{
  position:absolute;right:6px;top:6px;width:40px;height:40px;color:var(--_ki);
  opacity:.82;pointer-events:none;
  filter:drop-shadow(0 1.5px 0 rgba(1,8,6,.9));
}
.tile__here{
  position:absolute;left:50%;top:50%;width:82px;height:82px;margin:-41px 0 0 -41px;
  pointer-events:none;opacity:0;
  background:
    radial-gradient(closest-side, transparent 62%, rgba(156,245,200,.42) 74%, transparent 80%),
    radial-gradient(closest-side, transparent 76%, rgba(234,246,255,.5) 84%, transparent 88%);
  transform:scale(.7);
}
.tile.is-here .tile__here{opacity:1;animation:here-pulse 1800ms var(--e-expo) infinite alternate}
@keyframes here-pulse{from{transform:scale(.86);opacity:.55}to{transform:scale(1.04);opacity:1}}
/* the struck tile takes the impact: driven down hard, rebounds past its rest
   height, then micro-overshoots the other way before settling. */
.tile.is-hit{animation:tile-hit 340ms var(--e-emph) 1}
@keyframes tile-hit{
  0%{transform:translate3d(var(--tx),calc(-1 * var(--ty)),var(--h,var(--bed-z))) scale(1)}
  14%{transform:translate3d(var(--tx),calc(-1 * var(--ty)),calc(var(--h,var(--bed-z)) - 13px)) scale(.958)}
  48%{transform:translate3d(var(--tx),calc(-1 * var(--ty)),calc(var(--h,var(--bed-z)) + 11px)) scale(1.030)}
  74%{transform:translate3d(var(--tx),calc(-1 * var(--ty)),calc(var(--h,var(--bed-z)) - 3px)) scale(.992)}
  100%{transform:translate3d(var(--tx),calc(-1 * var(--ty)),var(--h,var(--bed-z))) scale(1)}
}

/* ── tile 30 · THE SKY PILLAR SUMMIT ────────────────────────────────────────
   The prize tile was a gold rectangle 30px taller than its neighbours. It is
   now the tallest object on the board by a factor of two: a stepped monolith
   of gold-veined stone with a foil cap, a rotating rarity halo, a vertical
   light shaft and a ring of four ozone finials. You should want to reach it
   from across the room, before you can read the word PUNCAK.                */
.tile[data-kind="jackpot"]{
  /* 128px. At the far row a 74px extrusion bought only 27px of screen rise —
     the perspective divide eats most of a far tile's height — so the prize
     square still read as "a gold rectangle". At 128 it clears the bed by 62px
     of screen and its cap pierces the sky band above the board: the Sky Pillar
     summit standing in the storm, which is the thing you are chasing. */
  --h:128px; --th:128px;
  /* scale 1.16 cancels the distance penalty: the apex must not render smaller
     than the start square. purely visual — --tx/--ty and the map are untouched. */
  transform:translate3d(var(--tx), calc(-1 * var(--ty)), var(--h)) scale(1.16);
  box-shadow:
    0 26px 22px -8px rgba(1,6,4,.92),
    0 60px 80px -22px rgba(154,111,30,.60),
    0 0 120px -10px rgba(242,196,56,.30);
}
.tile[data-kind="jackpot"] .tile__skin{
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  background:
    radial-gradient(110% 84% at 26% 4%, rgba(255,255,255,.62), transparent 54%),
    linear-gradient(162deg,#FFF0B8 0%,#F3C63C 34%,#B5811C 72%,#6B4409 100%);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.85),
    inset 3px 0 0 rgba(255,255,255,.46),
    inset 0 -3px 0 rgba(58,36,3,.8),
    inset 0 0 0 2.5px var(--_kg),
    inset 0 -12px 20px rgba(74,48,6,.62);
}
/* the monolith's face is COURSED: a stepped stack of gold-veined ashlar, so a
   74px extrusion reads as masonry rather than one extruded block. */
.tile[data-kind="jackpot"] .tile__side{
  background:linear-gradient(180deg,
    #FFF4CC 0%, #D39C24 5%,
    #8A5B0A 6%, #E8B733 15%, #7A4E08 16%,
    #6E4709 27%, #D2A227 37%, #5F3C07 38%,
    #563405 48%, #B8891A 58%, #4A2E04 59%,
    #3E2603 70%, #94690F 79%, #2E1C02 80%,
    #22150F 100%);
  box-shadow:inset 0 3px 0 rgba(255,247,214,.85), inset 0 -3px 8px rgba(0,0,0,.72);
}
.tile[data-kind="jackpot"] .tile__side--r{
  background:linear-gradient(90deg, #6B4409 0%, #2E1C02 62%, #120A00 100%);
  box-shadow:inset 2px 0 0 rgba(255,233,163,.42), inset -1px 0 0 rgba(127,215,255,.20);
}
.tile[data-kind="jackpot"] .tile__n{font-size:2rem;top:0}
.tile[data-kind="jackpot"] .tile__kind{
  font-size:1.1875rem;letter-spacing:.10em;bottom:6px;
  text-shadow:0 -1.5px 0 rgba(46,28,2,.95), 0 1.5px 0 rgba(255,255,255,.5);
}
#summit-glow{
  position:absolute;left:0;bottom:0;width:420px;height:420px;margin:-154px 0 0 -154px;
  pointer-events:none;mix-blend-mode:screen;
  transform:translate3d(calc(var(--tx) - 154px), calc(-1 * var(--ty) + 154px), 132px);
  /* MEASURED FIX — THIS was the "hard-edged light shaft parked on the summit
     tile", not #summit-shaft. A conic-gradient with four narrow lobes and no
     blur draws four straight-edged WEDGES, 420px across, screen-blended over
     the prize; magnified it read as a folded paper fan lying on tile 30.
     Three changes: the lobes are widened so no stop is narrower than 14deg,
     the whole layer is blurred (a rotating volumetric shaft has no edges), and
     a radial mask keeps the wedges away from the tile face itself — the halo
     is behind and above the monolith, never on its cap. */
  filter:blur(16px);
  background:
    radial-gradient(closest-side, rgba(255,222,120,.44), rgba(180,130,34,.18) 44%, transparent 72%),
    conic-gradient(from 0deg at 50% 50%,
      transparent 0 2%, rgba(255,233,163,.42) 12%, transparent 26%,
      transparent 30%, rgba(156,245,200,.22) 40%, transparent 52%,
      transparent 54%, rgba(255,255,255,.30) 64%, transparent 76%,
      transparent 78%, rgba(127,215,255,.22) 88%, transparent 99%);
  -webkit-mask-image:radial-gradient(closest-side, transparent 0 16%, #000 34%, rgba(0,0,0,.55) 62%, transparent 88%);
  mask-image:radial-gradient(closest-side, transparent 0 16%, #000 34%, rgba(0,0,0,.55) 62%, transparent 88%);
  /* a rarity halo turns at a CONSTANT rate. ease-in-out on an infinite spin
     made it visibly stutter twice per revolution. */
  animation:summit 16s linear infinite;
}
@keyframes summit{
  from{transform:translate3d(calc(var(--tx) - 154px), calc(-1 * var(--ty) + 154px), 132px) rotate(0)}
  to{transform:translate3d(calc(var(--tx) - 154px), calc(-1 * var(--ty) + 154px), 132px) rotate(360deg)}
}
/* real vertical geometry: an 820px light shaft standing upright OUT of tile 30.
   rotateX(-90deg) with origin 50% 100% puts it in the board's own 3D space. */
/* Z BUDGET. --cam-persp is 860px: that is the distance from the eye to the
   projection plane, and any vertex whose z approaches it is magnified by
   f = P/(P - z) without bound. An 820px shaft standing on a base at z=126 put
   its tip at z=946 -- PAST the camera -- and the element rendered as a giant
   distorted quad smeared across the sky. Nothing in this scene may exceed
   ~0.4 * P; 126 + 200 = 326 gives f = 1.6, which is dramatic but sane. */
#summit-shaft{
  position:absolute;left:0;bottom:0;width:300px;height:230px;margin:0 0 0 -150px;
  transform-origin:50% 100%;
  transform:translate3d(var(--tx), calc(-1 * var(--ty)), 126px) rotateX(-90deg);
  transform-style:flat;pointer-events:none;mix-blend-mode:screen;
  /* MEASURED FIX. This read as "a pale hard-edged quadrilateral, static, with
     a dead-straight edge terminating directly on PUNCAK" — because a 150px-wide
     element with a full-bleed vertical gradient and 7px of blur has hard left
     and right edges, and its brightest stop sat ON the tile face. Three
     changes: a radial mask feathers both flanks to nothing, the bottom 16% of
     the column is transparent so the light stands ABOVE the summit instead of
     bleaching it, and the shaft now leans — the angle animates, so it reads as
     weather rather than as a card left on the board. */
  /* MEASURED FIX #2 — it still screenshotted as "a hard-edged light shaft
     parked on the summit tile". Two causes the first cut missed:
       (1) CSS applies `filter` BEFORE `mask`, so a 13px blur cannot soften a
           mask edge — and the old mask's ellipse (58% of a 150px box) still
           carried ~0.13 alpha where it met the box wall, which is a visible
           vertical cut. The box is now 300px wide and the mask closes to zero
           at 74% of it, so the feather ends in air, not on an edge.
       (2) A full-bleed linear gradient is a WEDGE. The light is now a radial
           cone whose brightest point sits ABOVE the tile face (at 50% 78%,
           with the bottom 22% empty), so the beam stands over the summit
           instead of bleaching it, and volumetric falloff runs in two axes
           rather than one. Peak alpha is also down a third: this reads as
           light in air, not as a card left on the board. */
  filter:blur(22px);
  background:
    /* the rays. Wide, soft, non-harmonic stops — a beam seen through moving
       air has striation, and striation is the difference between "volumetric
       light" and "a pale wedge". Blurred 22px with everything else, so no stop
       can present an edge. */
    repeating-linear-gradient(93deg,
      rgba(255,247,220,.10) 0 3%, rgba(255,247,220,0) 3% 7.5%,
      rgba(255,233,163,.07) 7.5% 10%, rgba(255,233,163,0) 10% 16%),
    radial-gradient(56% 78% at 50% 84%,
      rgba(255,247,220,.34) 0%,
      rgba(255,233,163,.24) 22%,
      rgba(242,196,56,.13) 46%,
      rgba(156,245,200,.06) 68%,
      rgba(127,215,255,0) 88%),
    linear-gradient(0deg,
      rgba(255,251,232,0) 0%,
      rgba(255,245,214,.20) 22%,
      rgba(255,233,163,.15) 42%,
      rgba(156,245,200,.07) 66%,
      transparent 92%);
  -webkit-mask-image:radial-gradient(42% 88% at 50% 82%, #000 0 10%, rgba(0,0,0,.34) 44%, transparent 74%);
  mask-image:radial-gradient(42% 88% at 50% 82%, #000 0 10%, rgba(0,0,0,.34) 44%, transparent 74%);
  animation:shaft-breathe 9s var(--e-expo) infinite alternate;
}
@keyframes shaft-breathe{
  from{opacity:.58;transform:translate3d(var(--tx), calc(-1 * var(--ty)), 126px) rotateX(-90deg) rotate(-3.2deg) scaleX(.92)}
  to{opacity:.86;transform:translate3d(var(--tx), calc(-1 * var(--ty)), 126px) rotateX(-90deg) rotate(3.2deg) scaleX(1.08)}
}

/* --- links: conduits routed through the seams, lifted out of the bed --------
   #links rides 30px above the tile bed (the bed itself is 24px), so a rail is
   a raised object with air under it; #links-shadow drops a blurred, fully
   desaturated copy back down into the groove at 3px, offset toward the same
   down-right as every other shadow in the build. Because every leg of the
   route lies in an 8px gap, none of this can ever cover tile content.      */
#links .lk-rail{fill:none;stroke-linejoin:round}

/* LADDER — a rising ozone conduit. Dark channel, cold glow, hot core, a thin
   specular along the top of the rail, ozone rungs. */
/* AT ARM'S LENGTH the two link types have to differ in SHAPE, not in hue: at
   the 800x500 downscale a salmon pipe and a blue pipe are the same object and
   nobody can tell which way either one goes without reading a 13px badge.
   So the ladder is now literally a ladder — two parallel rails with rungs
   between them, no centre line — and the snake is a tapering body, thick at
   the head end and thin at the tail. Direction reads off the taper; the badge
   is confirmation, not the only signal. */
/* MEASURED FIX — "snakes and ladders are PCB traces with numeric badges",
   "snakes are bead pipes, ladders are pills". The geometry was right and the
   WEIGHT was wrong: a 4.4px rail and a 3.2px rung on a board whose far rows
   project at roughly half scale measure under two screen pixels, which is a
   circuit trace. Every stroke below is roughly doubled, the rail gauge is
   pushed out from ±6 to ±9.5 (see addLink) so there is real air between the
   rails, and each rung gets a lit top edge so it reads as a bar with a round
   section rather than as a hairline. All of it still lives in the 8px tile
   seams, so no tile number or payout is covered. */
/* ══ THE RAILS HAVE TO OUT-WEIGH THE RUNGS ═══════════════════════════════
   MEASURED FIX. The geometry was already right — two rails 28 units apart
   with sampled rungs between them — and it still read as a zipper, a bandage
   or a barcode at true scale, because a 28-wide cyan GLOW pipe was filling
   the whole space between the rails and 7.2px white rungs were the brightest
   thing in the group. So the eye saw a white capsule with dark bars across
   it, which is a zipper.
   The centreline pipe is deleted outright (it was lighting the space a ladder
   is supposed to have air in), each rail is doubled — a dark outer stroke
   under a lit inner one, which is what makes a rail a round bar seen from the
   side — and the rungs come down to 5px of a dimmer blue so they read as
   treads between two rails rather than as the ladder itself. Butt caps plus
   an inset first/last rung leave the rails OVERHANGING at both ends, which
   is the stile of a real ladder and the cue a round cap was destroying. */
#links .lk-ladder .lk-chan{stroke:#03141C;stroke-width:30;stroke-linecap:butt}
#links .lk-ladder .lk-glow{stroke:none}
/* no core: a bright line down the middle of a ladder is the one thing that
   stops it reading as two rails. */
#links .lk-ladder .lk-core{stroke:none}
#links .lk-ladder .lk-side-dk{stroke:#04222E;stroke-width:12.5;
  stroke-linecap:butt;stroke-linejoin:round}
#links .lk-ladder .lk-side{stroke:url(#lkOzone);stroke-width:7.2;
  stroke-linecap:butt;stroke-linejoin:round}
/* the treads are DARKER than the rails and there are half as many of them:
   a rung every 14 units at 5px wide is a 1:2 duty cycle, which is a barcode.
   Every 21 units at 3.6px is a tread you can count. */
#links .lk-ladder .lk-rung{stroke:#3C6B88;stroke-width:3.6;opacity:.95;stroke-linecap:butt}
#links .lk-ladder .lk-rung-lit{stroke:#BFE2F5;stroke-width:1.3;opacity:.62;stroke-linecap:butt}

/* SNAKE — a descending storm coil, tapering head-to-tail. The body is 17px at
   the head against the old 8.6, the coil banding is a real scale rhythm
   (7 on / 6 off) rather than a bead chain, and the head is a wedge with a
   brow, a jaw and two eyes at nearly twice the size. */
#links .lk-snake .lk-chan{stroke:#150402;stroke-width:30;stroke-linecap:round}
#links .lk-snake .lk-glow{stroke:#FF5A2C;stroke-width:24;opacity:.13;stroke-linecap:round}
#links .lk-snake .lk-core{stroke:none}
#links .lk-snake .lk-body{fill:url(#lkMagma);stroke:#5E1206;stroke-width:2.0}
#links .lk-snake .lk-scale{stroke:#FFC9A8;stroke-width:9;opacity:.40;
  stroke-dasharray:7 6;stroke-linecap:butt}
/* the ventral half: twice the gauge and darker, so the body has a lit top and
   a shadowed underside instead of one constant candy stripe. */
#links .lk-snake .lk-belly{stroke:#1C0402;stroke-width:10;opacity:.72;
  stroke-linecap:round}
#links .lk-head{fill:url(#lkMagma);stroke:#FFD3C4;stroke-width:1.8}
#links .lk-jaw{fill:#3A0A04;stroke:#FFB08A;stroke-width:1.2;opacity:.9}
#links .lk-eye{fill:#FFE9A3;stroke:#2A0703;stroke-width:.9}
#links .lk-brow{fill:#2E0803;opacity:.86}
#links .lk-fang{fill:#FFF3E4;stroke:#5E1206;stroke-width:.6}

/* at rest the conduits are quiet; on traversal they light up. opacity and
   filter only — no stroke-width or geometry is ever animated. */
#links g{opacity:.96;transition:opacity 220ms var(--e-expo), filter 220ms var(--e-expo)}
#links g[data-live="1"]{opacity:1;
  filter:drop-shadow(0 0 6px rgba(127,215,255,.85)) drop-shadow(0 0 18px rgba(127,215,255,.45))}
#links g.lk-snake[data-live="1"]{
  filter:drop-shadow(0 0 6px rgba(255,106,44,.9)) drop-shadow(0 0 20px rgba(192,57,43,.5))}
#links .lk-pulse{fill:none;stroke-width:0}
#links .lk-pulse circle{opacity:.9}
#links .lk-ladder .lk-pulse circle{fill:var(--c-bolt-core)}
#links .lk-snake  .lk-pulse circle{fill:var(--c-gold-200)}

/* the ladder payoff: a vertical ozone light column standing out of the
   destination tile, in the board's own 3D space. screen-blended, so it
   brightens the tile it stands on rather than hiding it. */
.lk-column{
  position:absolute;left:0;bottom:0;width:86px;height:210px;margin:0 0 0 -43px;
  transform-origin:50% 100%;
  transform:translate3d(var(--tx), calc(-1 * var(--ty)), 26px) rotateX(-90deg);
  transform-style:flat;pointer-events:none;mix-blend-mode:screen;
  filter:blur(6px);
  background:linear-gradient(0deg,
    rgba(190,239,255,.46) 0%,
    rgba(127,215,255,.24) 26%,
    rgba(169,140,232,.11) 58%,
    transparent 92%);
  animation:lk-column 5.5s var(--e-expo) infinite alternate;
}
@keyframes lk-column{
  from{opacity:.55;transform:translate3d(var(--tx), calc(-1 * var(--ty)), 26px) rotateX(-90deg) scale(.90,.86)}
  to{opacity:1;transform:translate3d(var(--tx), calc(-1 * var(--ty)), 26px) rotateX(-90deg) scale(1.06,1.04)}
}

/* the destination stamp. A ladder or snake tile now says exactly where it
   sends you, in brushed metal, in the corner the badge used to waste. */
.tile__dest{
  position:absolute;right:6px;top:6px;padding:2px 7px 3px;pointer-events:none;
  font-family:var(--ff-num);font-weight:700;font-size:1.0625rem;
  font-variant-numeric:tabular-nums lining-nums;line-height:1.05;
  color:#04141C;background:linear-gradient(168deg,#EAF9FF 0%,#8FD8F5 46%,#3E7FA6 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(4,20,28,.5),
             0 1.5px 0 rgba(1,8,6,.9);
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
.tile[data-kind="snake"] .tile__dest{
  color:#210603;background:linear-gradient(168deg,#FFE0D2 0%,#FF9A6E 44%,#9E2413 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 -1px 0 rgba(33,6,3,.55),
             0 1.5px 0 rgba(1,8,6,.9);
}
/* rarity surfaces carry the foil. UI controls do not. */
.tile[data-kind="jackpot"] .tile__skin,
.pawn[data-tier="mur"] .pawn__body,
.chip[data-apex="true"]{isolation:isolate}
.tile[data-kind="jackpot"] .tile__skin::after{
  background-image:var(--tex-noise),
    repeating-linear-gradient(14deg,
      rgba(62,224,138,.5) 0 6%, rgba(127,215,255,.5) 6% 12%, rgba(169,140,232,.5) 12% 18%,
      rgba(255,255,255,.6) 18% 24%, rgba(29,190,114,.5) 24% 30%, rgba(127,215,255,.5) 30% 36%,
      rgba(242,196,56,.6) 36% 40%, rgba(62,224,138,.5) 40% 46%);
  background-position:0 0, var(--foil-shift,0px) 0;
  background-size:96px 96px, 300% 100%;
  mix-blend-mode:color-dodge;opacity:.34}
#links .lk-pulse{fill:none;stroke-width:0}
#links .lk-pulse circle{opacity:.9}
#links .lk-ladder .lk-pulse circle{fill:var(--c-bolt-core)}
#links .lk-snake  .lk-pulse circle{fill:var(--c-gold-200)}
#links g[data-live="1"] .lk-glow{opacity:.5}
#links g[data-live="1"] .lk-core{opacity:1}

/* --- ground shadows: elements on the shadow plane, never box-shadow on the pawn --- */
.gshadow{
  position:absolute;left:0;bottom:0;display:block;pointer-events:none;
  transform:translate3d(var(--tx), calc(-1 * var(--ty)), 0) scale(var(--sq-x,1));
  transform-origin:50% 50%;
}
.gshadow--contact{
  width:54px;height:23px;margin:0 0 -9px -23px;opacity:.72;
  background:radial-gradient(closest-side at 42% 44%,
    rgba(2,8,6,.9) 30%, rgba(4,21,15,.54) 60%, transparent 78%);
}
.gshadow--ambient{
  width:104px;height:48px;margin:0 0 -18px -42px;opacity:.45;
  background:radial-gradient(closest-side at 44% 46%, rgba(4,21,15,.64) 20%, rgba(4,21,15,.22) 58%, transparent 76%);
}
/* three discrete height classes — blur is a static per-state class, never animated */
.gshadow.h0{filter:blur(2px)}
.gshadow.h1{filter:blur(6px)}
.gshadow.h2{filter:blur(10px)}
.gshadow--ambient.h0{filter:blur(8px)}
.gshadow--ambient.h1{filter:blur(12px)}
.gshadow--ambient.h2{filter:blur(16px)}
/* the apex pawn alone gets a second, taller ambient shadow */
.gshadow--ambient[data-apex="true"]{
  width:132px;height:58px;margin:0 0 -29px -66px;opacity:.5;
  background:radial-gradient(closest-side, rgba(60,40,6,.5) 18%, rgba(4,21,15,.22) 56%, transparent 76%);
}

/* --- pawns: zero-size anchor + billboard that counter-rotates the board tilt --- */
.pawn{
  position:absolute;left:0;bottom:0;width:0;height:0;pointer-events:none;
  /* --lift is a SCREEN-SPACE rise, immune to the tilt+perspective cancellation
     that reduced a 57px hop apex to 5.4px of visible movement on row 0. */
  transform:translate3d(var(--tx), calc(-1 * var(--ty) - var(--lift,0px)), calc(var(--h) + var(--bed-z)));
  transform-style:preserve-3d;
}
/* the footprint ring. NOT inside the billboard — it must stay in the board
   plane and foreshorten with it. cheapest possible "standing on something". */
.pawn__base{
  position:absolute;left:-10px;bottom:-11px;width:44px;height:44px;
  pointer-events:none;border-radius:50%;
  /* the ring shrinks with the standee it belongs to, or eight of them merge
     into one continuous mint smear on the opening tile. transform only. */
  transform:scale(var(--fan-k,1));
  background:radial-gradient(closest-side,
    rgba(156,245,200,.26), rgba(156,245,200,.05) 58%, transparent 76%);
  box-shadow:inset 0 0 0 1.5px rgba(156,245,200,.34);
}
.pawn[data-tier="mur"] .pawn__base{
  background:radial-gradient(closest-side,
    rgba(255,233,163,.32), rgba(242,196,56,.06) 58%, transparent 76%);
  box-shadow:inset 0 0 0 1.5px rgba(242,196,56,.44);
}
/* ══ THE STANDEE STEPS OFF THE NUMERAL ══════════════════════════════════
   MEASURED FIX. A 112x180 card standing on the CENTRE of a 104px tile covers
   the tile it is standing on: the numeral (left 9, top 5), the kind label and
   the summit badge all measured gone under it, and six of them on tile 1
   covered tiles 01 and 02 entirely and spilled past the board edge behind the
   roster rail. In a game whose whole payload is which tile you landed on, the
   marker was hiding the answer.
   --pawn-k scales the whole standee to 0.62 and it is translated 24px toward
   the tile's back-right, which is the one corner of the face that carries no
   type — the numeral sits front-left, the label bottom-left, the badge
   top-right and small. Nothing about the card's own construction changes, so
   the SIR is still the SIR; it is a 69x112 card instead of a 112x180 one. */
.pawn__billboard{
  position:absolute;left:-56px;bottom:0;width:112px;height:180px;
  --pawn-k:.62;
  /* --fan-k shrinks the standee further when several players share a square,
     which is always true on the opening frame: everyone starts on tile 1. */
  transform:rotateX(calc(-1 * var(--board-tilt))) rotate(var(--lean))
            translateX(24px)
            scale(calc(var(--fan-k,1) * var(--pawn-k)))
            scale(var(--sq-x),var(--sq-y));
  transform-origin:50% 100%;
  transform-style:preserve-3d;
}
/* the active player's standee stands at full height: the room should be able
   to find whose turn it is without reading the rail. */
.pawn.is-turn .pawn__billboard{--pawn-k:.78}
/* THE STANDEE.
   A hexagonal token with a small gem inside it read, at board scale, as "a
   little gold ring" -- the SIR identity, which is the entire premise of the
   game, did not come across. It is now a CARD: the same silhouette as the
   thing the player is actually playing for, standing upright on the square,
   with the emblem filling its upper two thirds and a foil-stamped sigil band
   across the bottom. Two players are now tellable apart across a room. */
.pawn__body{
  position:absolute;left:4px;top:0;width:104px;height:134px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:5px 5px 0;
  clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,100% calc(100% - 11px),
    calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px);
}
/* the sigil band: brushed gold for the apex, ozone for SR, emerald for SAR */
.pawn__band{
  position:absolute;left:5px;right:5px;bottom:5px;height:26px;z-index:3;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-display);font-weight:700;font-size:1rem;font-style:normal;
  letter-spacing:.12em;color:#04150F;
  background:linear-gradient(168deg,#D6FFEC 0%,#3EE08A 46%,#0B4A32 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(4,21,15,.5),
             0 1px 2px rgba(1,8,6,.9);
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
}
.pawn[data-tier="mur"] .pawn__band{
  background:linear-gradient(168deg,#FFF6DC 0%,#F2C438 44%,#8A5B0A 100%)}
.pawn[data-tier="sr"] .pawn__band{
  background:linear-gradient(168deg,#DCF4FF 0%,#7FD7FF 46%,#0B2B52 100%)}
.pawn__body::before{background-size:110px 110px}
/* the SIR is the player's identity: at 72px inside a foreshortened board it
   was an illegible gold ring. 88px is the smallest size at which StormEmblem's
   gem facets, sigil plate and rarity band actually resolve on the tablet. */
/* the SIR is the player's identity: at 72px inside a foreshortened board it
   was an illegible ring. 94px is the smallest size at which StormEmblem's gem
   facets, sigil plate and rarity band actually resolve on the tablet. */
.pawn__emblem{position:relative;width:94px;height:94px;z-index:2;pointer-events:none;flex:0 0 auto}
/* the sigil used to be painted straight across the artwork. StormEmblem's own
   sigilPlate draws it at this size now, so this becomes a name plate only. */
.pawn__sigil{display:none}
/* the stem: reads as a standee foot, keeps the base at 50% 100% */
.pawn__billboard::after{
  content:"";position:absolute;left:50%;bottom:0;width:26px;height:44px;margin-left:-13px;
  background:linear-gradient(180deg, rgba(23,41,31,.98), rgba(5,10,8,.98));
  box-shadow:inset 1px 0 0 rgba(200,235,255,.2), 0 1px 2px rgba(4,21,15,.8);
  clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);
}
.pawn__tag{display:none}
.pawn.is-turn .pawn__tag{
  display:block;
  position:absolute;left:-26px;right:-26px;top:140px;text-align:center;
  font-size:var(--fs-label);font-weight:800;letter-spacing:var(--tr-label);
  text-transform:uppercase;color:var(--c-ink);
  text-shadow:0 -1px 0 rgba(4,21,15,.95);
  white-space:nowrap;
}
.pawn__tag>span{display:inline-block;padding:3px 8px 4px;
  background:rgba(4,12,9,.86);
  box-shadow:inset 0 0 0 1px rgba(58,107,82,.6);
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.pawn[data-tier="mur"] .pawn__body{
  box-shadow:
    inset 0 0 0 2px #FFD24A,
    inset 0 2px 0 rgba(255,255,255,.6),
    inset 0 -3px 8px rgba(4,21,15,.6),
    0 0 30px rgba(255,210,74,.42), 0 2px 4px rgba(4,21,15,.7);
  background:
    conic-gradient(from 200deg at 32% 10%, rgba(255,255,255,.55) 0 4%, transparent 4% 30%,
                   rgba(255,210,74,.40) 30% 36%, transparent 36%),
    linear-gradient(158deg,#FFD24A 0%,#C9922B 34%,#0A1410 78%,#04150F 100%);
}
.pawn[data-tier="mur"] .pawn__sigil{color:var(--c-gold-200)}
/* crown: three-point delta crest, apex only */
.pawn[data-tier="mur"] .pawn__body::after{
  content:"";position:absolute;left:50%;top:-16px;width:54px;height:19px;margin-left:-27px;
  background:var(--c-gold-500);opacity:.95;mix-blend-mode:normal;
  clip-path:polygon(0 100%,16% 22%,32% 100%,50% 0,68% 100%,84% 22%,100% 100%);
}
.pawn[data-tier="sar"] .pawn__body{
  box-shadow:
    inset 0 1px 0 rgba(190,255,230,.4),
    inset 0 0 0 1.2px var(--c-emerald-500),
    inset 0 -2px 4px rgba(4,21,15,.55),
    0 1px 2px rgba(4,21,15,.55);
}
.pawn.is-drop{animation:pawn-drop 620ms var(--e-back-sharp) both}
@keyframes pawn-drop{
  0%{opacity:0;transform:translate3d(var(--tx), calc(-1 * var(--ty) - 210px), 300px)}
  55%{opacity:1}
  74%{transform:translate3d(var(--tx), calc(-1 * var(--ty)), var(--bed-z))}
  86%{transform:translate3d(var(--tx), calc(-1 * var(--ty) - 12px), 26px)}
  100%{opacity:1;transform:translate3d(var(--tx), calc(-1 * var(--ty)), calc(var(--h) + var(--bed-z)))}
}

/* --- dice: its own 3D context, never inherits board tilt --- */
/* THE DIE'S DAIS.
   The die used to be a small green square floating in the rail with nothing
   under it: no ground, no context, and no reason to believe it belonged to the
   same world as the board. It now sits on a carved obsidian altar with a lit
   top rim, an ozone inlay ring and its own contact shadow, so throwing it
   reads as an act inside the scene rather than a widget being poked. */
#dice-stage{
  position:relative;height:206px;
  pointer-events:auto;touch-action:manipulation;cursor:pointer;
  perspective:460px;perspective-origin:50% 38%;
  /* the die sits ABOVE the altar, not centred over it: flex centring put the
     cube's magnified front face on top of the slab and left only a 20px sliver
     of it showing, which is why the altar read as nothing at all. */
  display:flex;align-items:flex-start;justify-content:center;padding-top:4px;
  isolation:isolate;
}
#dice-stage::before{        /* the altar slab */
  content:"";position:absolute;left:6%;right:6%;bottom:8px;height:56px;z-index:0;
  background:
    radial-gradient(80% 120% at 34% 0%, rgba(206,238,255,.26), transparent 62%),
    linear-gradient(180deg,#2A4739 0%,#163025 34%,#0A1B15 72%,#050F0C 100%);
  box-shadow:
    inset 0 2px 0 rgba(226,255,242,.34),
    inset 2px 0 0 rgba(206,238,255,.16),
    inset 0 -3px 8px rgba(0,0,0,.7),
    0 2px 0 rgba(1,7,5,.9),
    0 16px 26px -12px rgba(1,6,4,.9);
  clip-path:polygon(16px 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
}
#dice-stage::after{         /* the ozone inlay the die lands inside */
  content:"";position:absolute;left:22%;right:22%;bottom:44px;height:18px;z-index:0;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(127,215,255,.20), transparent 74%);
  box-shadow:inset 0 0 0 1.5px rgba(127,215,255,.30);
}
#dice,#dice-read,#dice-shadow{z-index:1}
/* the altar's answer to the landing. filter + transform only. */
#dice-stage.is-land::after{animation:dais-flare 420ms var(--e-expo) 1}
@keyframes dais-flare{
  0%{filter:brightness(1);transform:scale(1)}
  12%{filter:brightness(3.4) saturate(1.4);transform:scale(1.30)}
  100%{filter:brightness(1);transform:scale(1)}
}
#dice{
  position:relative;width:124px;height:124px;transform-style:preserve-3d;
  transform:translate3d(var(--_dx,0px),var(--_dy,0px),0)
            rotateX(var(--_rx,-26deg)) rotateY(var(--_ry,-31deg)) rotateZ(var(--_rz,0deg))
            scale3d(var(--_sx,1),var(--_sy,1),1);
}
.die__face{
  position:absolute;left:0;top:0;width:124px;height:124px;
  --f1:#0F3B2E;--f2:#12634A;--f3:#0A2B22;
  background:
    radial-gradient(84% 62% at 28% 10%, rgba(156,245,200,.34), transparent 60%),
    linear-gradient(160deg,var(--f1) 0%,var(--f2) 42%,var(--f3) 100%);
  box-shadow:
    inset 0 1px 0 rgba(190,255,230,.4),
    inset 1px 0 0 rgba(200,235,255,.3),
    inset 0 -2px 5px rgba(4,21,15,.6),
    inset 0 0 0 1px rgba(31,58,44,.9);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  backface-visibility:hidden;
}
/* per-face luminance. done through the gradient stops, never `filter` — a
   filter on a preserve-3d child creates a containing block and flattens. */
.die__face[data-face="2"]{--f1:#2A7F63;--f2:#3FBF8C;--f3:#1B5B45}  /* top    +42% */
.die__face[data-face="1"]{--f1:#0F3B2E;--f2:#12634A;--f3:#0A2B22}  /* front   base */
.die__face[data-face="4"]{--f1:#0C2E24;--f2:#0F4838;--f3:#07201A}  /* left    -26% */

<script>
/* ===== JS:VIEWPORT+UI (B1) ===== */
(function(){
"use strict";
var D=document, H=D.documentElement, R=H.style;
var $=function(id){return D.getElementById(id)};
var el=function(t,c){var n=D.createElement(t); if(c)n.className=c; return n};

/* ── Indonesian rupiah, always dot-grouped, always tabular ─────────────────── */
function money(n){
  var neg = n<0; n = Math.round(Math.abs(n));
  return (neg?'-Rp':'Rp') + String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ── the frozen 11-entry roster. StormEmblem (B4) owns the real copy; this is
      the data-only fallback so the file is playable with that region stubbed. ── */
var ROSTER_FALLBACK=[
 {key:"golisopod",   name:"Mega Golisopod ex", short:"M-Golisopod ex", rarity:"SAR 107/076", sigil:"GL", primary:"#A9BDC9", secondary:"#0E7A4F", element:"STEEL", tier:"sar", apex:false},
 {key:"raikou",      name:"Raikou ex", short:"Raikou ex",         rarity:"SAR 108/076", sigil:"RK", primary:"#F2C438", secondary:"#1E5FA8", element:"VOLT",  tier:"sar", apex:false},
 {key:"golurk",      name:"Mega Golurk ex", short:"M-Golurk ex",    rarity:"SAR 109/076", sigil:"GK", primary:"#A98CE8", secondary:"#C9922B", element:"MECHA", tier:"sar", apex:false},
 {key:"rayquaza_sar",name:"Mega Rayquaza ex", short:"M-Rayquaza ex",  rarity:"SAR 110/076", sigil:"RQ", primary:"#3EE08A", secondary:"#04150F", element:"DRACO", tier:"sar", apex:false},
 {key:"aarune",      name:"Aarune", short:"Aarune",            rarity:"SAR 111/076", sigil:"AR", primary:"#12A15F", secondary:"#FFE9A3", element:"CARTO", tier:"sar", apex:false},
 {key:"zinnia",      name:"Zinnia's Trust", short:"Zinnia's Trust",    rarity:"SAR 112/076", sigil:"ZT", primary:"#6B4FB0", secondary:"#C0392B", element:"LORE",  tier:"sar", apex:false},
 {key:"rayquaza_mur",name:"Mega Rayquaza ex", short:"M-Rayquaza ex",  rarity:"MUR 113/076", sigil:"AU", primary:"#F2C438", secondary:"#0A1410", element:"APEX",  tier:"mur", apex:true},
 {key:"heat_rotom",  name:"Heat Rotom ex", short:"Heat Rotom ex",     rarity:"SR 090/076",  sigil:"HR", primary:"#C0392B", secondary:"#F2C438", element:"EMBER", tier:"sr",  apex:false},
 {key:"wishiwashi",  name:"Wishiwashi ex", short:"Wishiwashi ex",     rarity:"SR 091/076",  sigil:"WW", primary:"#1E5FA8", secondary:"#7FD7FF", element:"TIDE",  tier:"sr",  apex:false},
 {key:"malamar",     name:"Mega Malamar ex", short:"M-Malamar ex",   rarity:"SR 094/076",  sigil:"MM", primary:"#6B4FB0", secondary:"#0B2B52", element:"ABYSS", tier:"sr",  apex:false},
 {key:"talonflame",  name:"Talonflame ex", short:"Talonflame ex",     rarity:"SR 096/076",  sigil:"TF", primary:"#C9922B", secondary:"#C0392B", element:"GALE",  tier:"sr",  apex:false}
];
function roster(){
  try{ if(window.StormEmblem && StormEmblem.roster && StormEmblem.roster.length===11) return StormEmblem.roster; }catch(e){}
  return ROSTER_FALLBACK;
}
function entry(key){var r=roster(); for(var i=0;i<r.length;i++) if(r[i].key===key) return r[i]; return r[0]}
function emblem(host,key,size){
  try{ if(window.StormEmblem && StormEmblem.draw) return StormEmblem.draw(host,key,size); }catch(e){}
  /* fallback: the two-letter sigil carries identity until B4's region lands */
  return null;
}

/* ── viewport ──────────────────────────────────────────────────────────────── */
var subs=[], rafPending=false;
var VP={
  w:0,h:0,dpr:1,rawDpr:1,portrait:false,squat:false,narrow:false,
  on:function(cb){subs.push(cb); return function(){var i=subs.indexOf(cb); if(i>=0)subs.splice(i,1)}},
  measure:measure
};
function measure(){
  var vv = window.visualViewport;
  var w = Math.round(vv ? vv.width  : window.innerWidth);
  var h = Math.round(vv ? vv.height : window.innerHeight);
  var raw = window.devicePixelRatio || 1;
  VP.w=w; VP.h=h; VP.rawDpr=raw; VP.dpr=Math.min(raw,2);
  VP.portrait = h > w;
  VP.squat    = !VP.portrait && (w/h < 1.42);             /* 4:3-ish landscape */
  VP.narrow = w < 1100;
  var tiny = !VP.portrait && w < 900;

  H.toggleAttribute('data-portrait', VP.portrait);
  H.toggleAttribute('data-squat', VP.squat);
  H.toggleAttribute('data-narrow', VP.narrow && !VP.portrait);
  H.toggleAttribute('data-tiny', tiny);

  /* rails: 280 wide desk / 216 reference / 196 squat / 200 narrow / 176 tiny.
     216 IS A HARD CEILING at 1280 — do not widen it to buy rail space. The
     board's NEAR row is perspective-magnified well outside BOARD_W, and at
     scale 0.926 tile 1's left edge lands at x=249 against a rail edge of 244.
     A 272 rail (tried, reverted) puts the near row 51px underneath the roster.
     Rail content has to fit 216; it does — see the .chip layout. */
  var rail = VP.portrait ? 0 : (tiny ? 176 : (VP.squat ? 196 : (VP.narrow ? 200 : (w>=1600 ? 280 : 216))));
  var tilt = VP.portrait ? 22 : 34;                       /* StormConst.TILT_*_DEG  */
  var HUD  = 62, BOTTOM_BAR = 240, BW = 664, BH = 552;
  var SAFE = (w>=1240) ? 28 : 48;
  var K_PERSP = 860;      /* mirrors StormConst.PERSP / --cam-persp initial */

  /* THE SKY RESERVE.
     The board used to be fitted to (viewport - HUD), so it grew until it
     filled the frame and pushed its own near row off the bottom edge — which
     meant the entire storm, the thing the whole build is about, was hidden
     behind a slab of tiles. The composition is now explicit: the top third of
     the frame belongs to the thunderhead and nothing else may enter it, and
     the board is dropped toward the lower third so it reads as sitting IN a
     world rather than floating on a backdrop. */
  var SKY  = VP.portrait ? 0 : Math.round(h*0.29);
  var PAD  = 40;   /* the near row's labels are the most magnified type on
                      screen; they need room before the frame edge. */
  var regionW = VP.portrait ? (w - SAFE*2) : (w - SAFE*2 - rail*2);
  var rad = tilt*Math.PI/180, cos = Math.cos(rad), sin = Math.sin(rad);

  /* The old fit was `regionH / (BH*cos)`: it ignored the perspective divide
     entirely, so the near half of the bed — magnified by f = P/(P - z) — always
     overshot the bottom edge and the near row was permanently guillotined.
     This solves the real projection instead.

     #camera has perspective-origin 50% 50%, which is also the rig's transform
     origin, so for a board-local offset v the screen Y is simply
         Y(v) = h/2 + f(v) * (drop + v*cos) * S ,  f(v) = P / (P - v*sin*S)
     span(S) pins the NEAR edge PAD above the bottom and reports where the far
     edge lands; bisection then finds the largest S whose far edge still clears
     the sky reserve. Everything the fit gives back goes to the storm.       */
  var v2 = (BH/2)*cos, w2 = (BH/2)*sin;
  function span(S){
    var zN = w2*S;
    var fN = K_PERSP/(K_PERSP - zN), fF = K_PERSP/(K_PERSP + zN);
    var d  = ((h - PAD - h/2)/fN)/S - v2;
    return { S:S, drop:d, top: h/2 + fF*(d - v2)*S };
  }
  var scale, drop = 0;
  if(VP.portrait){
    scale = Math.max(0.55, Math.min(1.18,
      Math.min(regionW/(BW+52), (h - HUD - BOTTOM_BAR)/(BH*cos))));
  }else{
    var lo = 0.55, hi = Math.max(0.56, Math.min(1.18, regionW/(BW+52)));
    var best = span(lo);
    for(var it=0; it<14; it++){
      var mid = (lo+hi)/2, r = span(mid);
      if(r.top >= HUD + SKY){ lo = mid; best = r } else { hi = mid }
    }
    scale = best.S; drop = Math.round(best.drop);
  }
  R.setProperty('--board-drop', drop+'px');

  R.setProperty('--vw', w+'px');
  R.setProperty('--vh', h+'px');
  R.setProperty('--dpr', String(VP.dpr));
  R.setProperty('--rail-w', rail+'px');
  R.setProperty('--safe-l', SAFE+'px');
  R.setProperty('--safe-r', SAFE+'px');
  R.setProperty('--hud-top-h', HUD+'px');
  R.setProperty('--board-tilt', tilt+'deg');
  R.setProperty('--board-scale', scale.toFixed(4));

  /* canvas backing stores are resized HERE — never inside the frame loop */
  var fx=$('fx-canvas');
  if(fx){
    var d=VP.dpr, cw=Math.round(w*d), ch=Math.round(h*d);
    if(fx.width!==cw||fx.height!==ch){fx.width=cw;fx.height=ch}
  }
  try{ if(window.StormSky && StormSky.resize) StormSky.resize(); }catch(e){}
  for(var i=0;i<subs.length;i++){ try{subs[i]({w:w,h:h,dpr:VP.dpr,portrait:VP.portrait,narrow:VP.narrow})}catch(e){} }
}
function queueMeasure(){
  if(rafPending) return; rafPending=true;
  requestAnimationFrame(function(){ rafPending=false; measure(); });
}
window.addEventListener('resize', measure, {passive:true});
window.addEventListener('orientationchange', measure, {passive:true});
if(window.visualViewport){
  visualViewport.addEventListener('resize', measure, {passive:true});
  visualViewport.addEventListener('scroll', queueMeasure, {passive:true});
}
try{ if(screen.orientation) screen.orientation.addEventListener('change', queueMeasure, {passive:true}); }catch(e){}
window.StormViewport = VP;
/* the rail's height changes with the viewport, so how many WHOLE log rows fit
   changes with it too. Re-run the fit on the same signal the rest of the
   layout listens to, and re-fit the roster's name lines while we are here. */
VP.on(function(){ try{ trimLog(); refitNames(); }catch(e){} });

/* ── press feedback: first pixel change inside one frame, transform only ───── */
function pressable(node, cls){
  cls = cls||'is-press';
  node.addEventListener('pointerdown', function(e){
    try{ node.setPointerCapture(e.pointerId); }catch(err){}
    node.classList.add(cls);
  });
  var up=function(){ node.classList.remove(cls) };
  node.addEventListener('pointerup', up);
  node.addEventListener('pointercancel', up);
  node.addEventListener('lostpointercapture', up);
}

/* ── animated counters ─────────────────────────────────────────────────────── */
var counters=[];
function counter(id,fmt){
  var node=$(id); var c={el:node,fmt:fmt,from:0,to:0,cur:0,t:0,ms:600,live:false};
  counters.push(c); return c;
}
var EXPO=function(p){ /* --e-expo sampled analytically: 1-2^(-10p) is within 1% */
  return p>=1?1:1-Math.pow(2,-10*p);
};
function setCounter(c,v){
  if(c.to===v && c.live===false) { if(c.el) c.el.textContent=c.fmt(v); c.cur=v; c.to=v; return; }
  if(c.to===v) return;
  c.from=c.cur; c.to=v; c.t=0; c.live=true;
  if(c.el){
    c.el.classList.add('is-punch');
    c.el.style.setProperty('--sq-x','1.12');
    setTimeout(function(){ if(c.el) c.el.style.setProperty('--sq-x','1') },90);
    setTimeout(function(){ if(c.el) c.el.classList.remove('is-punch') },320);
  }
}
var cPacks=counter('econ-packs',function(v){return String(Math.round(v))});

/* ── log ───────────────────────────────────────────────────────────────────── */
var LOGK={roll:'DADU',pack:'PACK',ladder:'TANGGA',snake:'BERKAH',
          hit:'SAMBAR',box:'BOX',sys:'SISTEM'};
var LOGN=$('log');
/* the feed's history cap. Sixteen rows is far more than the box can show; it
   exists so a resize or a longer box has something to reveal, and so the DOM
   cannot grow to the 56 rows the audit found. */
var LOG_KEEP=16;
/* SHOW WHOLE ROWS. Walks newest-first, accumulating measured row heights, and
   hides the first row that would not fit and everything behind it. Two layout
   reads per log line — a log line is a user-paced event, never a frame. */
function trimLog(){
  if(!LOGN) return;
  var c=LOGN.children, i, y=0, H=LOGN.clientHeight-12;   /* 6px padding, twice */
  for(i=0;i<c.length;i++) c[i].hidden=false;
  for(i=0;i<c.length;i++){
    var h=c[i].offsetHeight;
    if(i>0 && y+h>H){ for(;i<c.length;i++) c[i].hidden=true; return }
    y+=h+3;                                              /* the flex gap        */
  }
}

/* ── toasts ────────────────────────────────────────────────────────────────── */
var TOASTS=$('toasts');

/* ── one-frame class-flip queue. flushed at the top of StormUI.frame so the
      file keeps a single rAF loop (plus the sanctioned resize coalescer). ──── */
var nextQ=[];
function onNextFrame(fn){ nextQ.push(fn) }
function flushNext(){
  if(!nextQ.length) return;
  var q=nextQ; nextQ=[];
  for(var i=0;i<q.length;i++){ try{ q[i]() }catch(e){} }
}

/* ── modal helper ──────────────────────────────────────────────────────────── */
function openModal(node){
  node.hidden=false;
  var sc=$('scrim');
  if(sc){ sc.classList.toggle('is-crown', node.id==='jackpot'); sc.classList.add('is-on') }
  onNextFrame(function(){node.classList.add('is-in')});
}
function closeModal(node){
  node.classList.remove('is-in');
  var sc=$('scrim'); if(sc) sc.classList.remove('is-on');
  setTimeout(function(){node.hidden=true},400);
}

/* ── roster chips ──────────────────────────────────────────────────────────── */
var ROSTER=$('roster'), chipMap={};
/* "SAR 107/076" -> "SAR". TCG rarity terms are shown verbatim. */
function rarCode(r){ return String(r||'').split(' ')[0] }
/* ROSTER DISPLAY NAME. The chip's name line is 150px; a real name like
   "GILANG PERMANA" measures 159px and "CINDY WIJAYANTI" 154px, so every
   two-word name on the board was ellipsised to "GILANG ...". Broadcast
   rosters solve this the way scoreboards do: first name in full, the rest as
   initials — "GILANG P.", 103px. The FULL name still rides the header band,
   the banner, the log and the editor, where the room exists. */
function shortName(n){
  var w=String(n||'').trim().split(/\s+/);
  if(w.length<2) return w[0]||'';
  /* ONE trailing initial, never a stack of them: "MUHAMMAD A.N." measured
     154px against the 150px line, "MUHAMMAD N." measures 126px. */
  return w[0]+' '+w[w.length-1].charAt(0)+'.';
}
/* AND THE GUARANTEE. shortName is a rule, not a fit: "CHRISTIANTO W."
   measures 147px and the line is 150px — 139px when the roster scrolls — so
   one long FIRST name still ellipsised, and a character budget cannot decide
   it because W is 40% wider than I. So the fit is MEASURED, once per chip at
   build time (never in the frame loop), against the line the chip actually
   got, and it steps down the same first-name/trailing-initial mechanism:
   "CHRISTIANTO W." -> "C. WIJAYA" -> a marked slice. The FULL name is on
   data-name throughout and still rides the header band untouched. */
function fitName(li){
  var nm=li.querySelector('.chip__name'); if(!nm) return;
  var full=String(li.getAttribute('data-name')||'').trim();
  var w=full.split(/\s+/), forms=[shortName(full)], i;
  if(w.length>1) forms.push(w[0].charAt(0)+'. '+w[w.length-1]);
  forms.push((w[0]||'').slice(0,11)+'.');
  forms.push((w[0]||'').slice(0,8)+'.');
  for(i=0;i<forms.length;i++){
    nm.textContent=forms[i];
    if(nm.scrollWidth<=nm.clientWidth) return;
  }
}
/* the scrollbar the 8th chip can summon changes EVERY chip's line width, so
   the fit is re-run for the whole list once it is populated. */
function refitNames(){
  for(var k in chipMap) if(chipMap.hasOwnProperty(k)) fitName(chipMap[k]);
}
function buildChip(p,i){
  var e=entry(p.sir);
  var li=el('li','chip m-glass js-flashable');
  li.id='chip-'+p.id;
  li.setAttribute('data-sir',e.key);
  li.setAttribute('data-tier',e.tier);
  li.setAttribute('data-sir-name',e.name);
  li.setAttribute('data-name',p.name);
  li.setAttribute('data-rarity',e.rarity);
  if(e.apex) li.setAttribute('data-apex','true');
  /* the chip is 72px tall so eight players fit an 800px frame. The rarity term
     stamps the left gutter, the SIR name owns its own line, and the FULL card
     name + rarity ride on data-* for the header band. */
  li.innerHTML=
    '<canvas class="chip__emblem" width="72" height="72"></canvas>'+
    '<span class="chip__sigil">'+esc(e.sigil)+'</span>'+
    '<span class="chip__rar">'+esc(rarCode(e.rarity))+'</span>'+
    '<span class="chip__name">'+esc(shortName(p.name))+'</span>'+
    '<span class="chip__sir">'+esc(e.short||e.name)+'</span>'+
    '<b class="chip__packs num">'+p.packs+'</b>'+
    '<b class="chip__pos num">'+p.pos+'</b>'+
    '<b class="chip__rank num"></b>';
  pressable(li);
  /* the chip IS the control that changes whose turn it is, so it has to be one
     to a keyboard and to a screen reader, not just to a finger. */
  li.setAttribute('role','button');
  li.setAttribute('tabindex','0');
  li.setAttribute('aria-label',p.name+' · petak '+p.pos);
  function pick(){
    try{ if(window.StormSfx) StormSfx.ui('toggle'); }catch(err){}
    try{ if(window.StormGame) StormGame.setActive(p.id); }catch(err){}
  }
  li.addEventListener('pointerup',pick);
  li.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'||ev.key===' '||ev.key==='Spacebar'){ ev.preventDefault(); pick() }
  });
  emblem(li.querySelector('.chip__emblem'), e.key, 46);
  ROSTER.appendChild(li);
  chipMap[p.id]=li;
  fitName(li);
  /* stagger 28ms/item — inside the ≤300ms window for ≤8 items */
  setTimeout(function(){li.classList.add('is-in')}, 40+i*28);
  return li;
}

/* ── leaderboard by packs. the chips keep turn order; the badge carries rank. ─ */
var rosterRef=[];
function applyRanks(players){
  if(players) rosterRef=players;
  var arr=rosterRef.slice().sort(function(a,b){return b.packs-a.packs});
  var rank=0, prev=null, i, li, n, show;
  for(i=0;i<arr.length;i++){
    if(arr[i].packs!==prev){ rank=i+1; prev=arr[i].packs }
    li=chipMap[arr[i].id]; if(!li) continue;
    /* ONLY THE LEADER. Measured: five of six chips showed "#3" at once,
       because five players were tied — a badge every chip carries says
       nothing, and it was sitting on the emblem art to say it. */
    show = rosterRef.length>1 && arr[i].packs>0 && rank===1;
    n=li.querySelector('.chip__rank');
    if(n) n.textContent = show ? '#'+rank : '';
    li.setAttribute('data-rank', show ? String(rank) : '');
  }
}

/* ── the public UI surface ─────────────────────────────────────────────────── */
var attractTimer=0, lastInput=0;
var UI={
  frame:function(dt,t){
    flushNext();
    for(var i=0;i<counters.length;i++){
      var c=counters[i]; if(!c.live) continue;
      c.t+=dt; var p=Math.min(1,c.t/c.ms);
      c.cur=c.from+(c.to-c.from)*EXPO(p);
      if(c.el) c.el.textContent=c.fmt(c.cur);
      if(p>=1){c.cur=c.to;c.live=false; if(c.el) c.el.textContent=c.fmt(c.to)}
    }
    /* attract pulse engages only after 3.4s of inactivity */
    var idle = t-lastInput;
    var roll=$('btn-roll');
    if(roll){
      var want = idle>3400 && !roll.classList.contains('is-busy') && !roll.disabled;

/* ── 128x128 tileable noise, generated at boot; CSS stipple is the fallback ── */
function makeNoise(){
  try{
    var c=D.createElement('canvas'); c.width=c.height=128;
    var x=c.getContext('2d'); if(!x) throw 0;
    var img=x.createImageData(128,128), d=img.data, s=1337;
    function rnd(){ s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%1000)/1000 }
    for(var i=0;i<d.length;i+=4){
      var v=128+(rnd()-0.5)*104;
      d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
    }
    x.putImageData(img,0,0);
    var url=c.toDataURL('image/png');
    if(!url || url.length<64) throw 0;
    /* verify it decodes before committing; strict CSP can veto data: images */
    var probe=new Image();
    probe.onload=function(){ R.setProperty('--tex-noise','url("'+url+'")') };
    probe.onerror=function(){ R.setProperty('--tex-noise','var(--tex-noise-fallback)') };
    probe.src=url;
  }catch(e){
    R.setProperty('--tex-noise','var(--tex-noise-fallback)');
  }
}

  start:startGate,

  _setProgress:function(p){

var started=false;
function startGate(){
  if(started) return Promise.resolve(); started=true;
  var stage=$('stage'), gate=$('gate');
  /* Both audio-unlock and requestFullscreen must be ISSUED SYNCHRONOUSLY here:
     Chrome discards transient user activation across an await, so chaining
     fullscreen behind the unlock promise made it reject every time. Orientation
     lock genuinely has to wait for fullscreen, so it stays chained. Each of the
     three device requests may fail independently and the game is unaffected. */
  var audio;
  try{ audio = StormSfx.unlock() }catch(e){ audio = false }
  var fs = null;
  try{ if(stage.requestFullscreen) fs = stage.requestFullscreen() }catch(e){}
  Promise.resolve(fs)['catch'](function(){})
    .then(function(){ try{ return screen.orientation.lock('landscape')['catch'](function(){}) }catch(e){} })
    .then(function(){ try{ return navigator.wakeLock.request('screen').then(function(l){wakeLock=l})['catch'](function(){}) }catch(e){} });
  var chain = Promise.resolve(audio)
    /* ambient storm/rain bed intentionally NOT started: owner found it annoying
       under a live stream, where it fights the host's voice. Discrete SFX only. */
    .then(function(){ measure(); try{ StormSky.resize() }catch(e){} });
  gate.classList.add('is-out');
  setTimeout(function(){ if(gate.parentNode) gate.parentNode.removeChild(gate) },400);
  return chain;
}
