/* ===== JS:SKY (B3) =====================================================
 * window.StormSky — the living storm behind the board.
 *
 * Two-pass raw WebGL (WebGL2 opportunistic, WebGL1 shader source):
 *   pass A  storm shader → low-res FBO   (the expensive fragment work)
 *   pass B  FBO → screen, full-res       (bilinear upsample + dither + vignette)
 *   pass C  forked lightning geometry, additive, full-res, 1 draw call
 *
 * Everything else about this file is defensive: no rAF of its own, no layout
 * reads inside frame(), no backing-store resize inside frame(), a frame-time
 * watchdog that walks quality down a ladder, a Canvas2D fallback that is still
 * worth looking at, and a hard no-throw contract on every public method.
 * --------------------------------------------------------------------- */
(function (global) {
  'use strict';

  /* ── budgets and quality ladders ──────────────────────────────────────
   * DPR_CAP is mandated by §1.3.2 (Math.min(devicePixelRatio, 2)), it is not
   * a device guess. Nothing here hardcodes a viewport size.               */
  var DPR_CAP      = 2;
  var MPIX_CAP     = 2.1e6;    // §1.3.2 — total backing store, shader path
  var MPIX_CAP_2D  = 1.2e6;    // §6.3  — Canvas2D fallback
  var DPR_LADDER   = [1, 1.25, 1.5, 1.75, DPR_CAP];
  var DPR_START    = 2;        // → 1.5, per §1.3.3
  var INNER_LADDER = [0.42, 0.50, 0.62, 0.75, 0.88];
  var INNER_START  = 3;        // → 0.75. the anvil rim does not survive below 0.42
  var WATCH_WINDOW = 60;       // rolling median window, §1.3.3
  var STEP_UP_HOLD = 120;      // frames of headroom before we spend it again

  /* 256, not 128. The finest octave uses 32 lattice cells, which at 128 was
     only FOUR texels per cell: inside a cell the shape came from the bilinear
     filter (C0, faceted) rather than from lattice()'s smoothstep, and under a
     high density contrast those facets read as blocky mottle. Eight texels per
     cell removes it. Costs 262KB and ~10ms once, at boot. */
  var NOISE_SIZE   = 256;      // tileable, power of two, REPEAT-safe
  var FLASH_LIFE   = 0.60;     // s — internal cloud illumination falloff
  var BOLT_LIFE    = 0.42;     // s — geometry visible only during strikes
  var AMB_MIN      = 2.2;      // s — ambient strike interval at intensity 1
  var AMB_MAX      = 9.0;      // s — ...and at intensity 0

  /* ── tiny deterministic PRNG (the sky must not look scripted, but it
   *    must be debuggable) ─────────────────────────────────────────────── */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ── tileable value noise ─────────────────────────────────────────────
   * `cells` must divide `size` so the lattice wraps; that is what makes the
   * texture seamless under GL_REPEAT.                                     */
  function lattice(size, cells, rng) {
    var g = new Float32Array(cells * cells), i;
    for (i = 0; i < g.length; i++) g[i] = rng();
    var out = new Float32Array(size * size), s = cells / size;
    for (var y = 0; y < size; y++) {
      var fy = y * s, y0 = Math.floor(fy), ty = fy - y0;
      ty = ty * ty * (3 - 2 * ty);
      var y1 = (y0 + 1) % cells; y0 = y0 % cells;
      for (var x = 0; x < size; x++) {
        var fx = x * s, x0 = Math.floor(fx), tx = fx - x0;
        tx = tx * tx * (3 - 2 * tx);
        var x1 = (x0 + 1) % cells; x0 = x0 % cells;
        var a = g[y0 * cells + x0], b = g[y0 * cells + x1];
        var c = g[y1 * cells + x0], d = g[y1 * cells + x1];
        var top = a + (b - a) * tx, bot = c + (d - c) * tx;
        out[y * size + x] = top + (bot - top) * ty;
      }
    }
    return out;
  }

  function fbmChannel(size, cells, octaves, rng) {
    var out = new Float32Array(size * size), amp = 1, tot = 0, o, i;
    for (o = 0; o < octaves; o++) {
      var n = lattice(size, cells << o, rng);
      for (i = 0; i < out.length; i++) out[i] += n[i] * amp;
      tot += amp; amp *= 0.5;
    }
    for (i = 0; i < out.length; i++) out[i] /= tot;
    return out;
  }

  /* Four decorrelated channels in one texture so a single sample yields a
   * 2D warp vector plus two scalar fields. This is the whole reason the
   * shader stays inside its texture-sample budget.                        */
  function buildNoise(size) {
    var rng = mulberry32(0x5E17);
    var ch = [
      fbmChannel(size, 8, 3, rng),   // R — cloud base
      fbmChannel(size, 16, 2, rng),  // G — cloud mid
      fbmChannel(size, 32, 1, rng),  // B — cloud detail / rain striation
      fbmChannel(size, 8, 2, rng)    // A — warp field / grain
    ];
    var px = new Uint8Array(size * size * 4);
    for (var i = 0; i < size * size; i++) {
      px[i * 4    ] = (ch[0][i] * 255) | 0;
      px[i * 4 + 1] = (ch[1][i] * 255) | 0;
      px[i * 4 + 2] = (ch[2][i] * 255) | 0;
      px[i * 4 + 3] = (ch[3][i] * 255) | 0;
    }
    return { px: px, ch: ch, size: size };
  }

  /* ── shaders ─────────────────────────────────────────────────────────── */

  var VS_QUAD = [
    'attribute vec2 aPos;',
    'varying vec2 vUv;',
    'void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  /* PASS A — the storm.
   *
   * Sample budget: exactly 4 texture fetches, no dependent reads beyond the
   * one domain-warp hop (t0 → t1/t2/t3), no loops at all.
   * ALU: ~120 ops, but this pass runs at INNER_LADDER scale (0.5 default =
   * a quarter of the pixels), i.e. ~30 ops per full-screen pixel equivalent.
   * Tuning knobs are grouped per numbered section below.                   */
  var FS_SKY = [
    'precision mediump float;',
    'varying vec2 vUv;',
    'uniform sampler2D uNoise;',
    'uniform float uTime;      // storm-seconds (already scaled by intensity)',
    'uniform float uAspect;    // w/h',
    'uniform float uIntensity; // 0..1 storm violence',
    'uniform float uFlash;     // 0..1 current lightning energy',
    'uniform vec2  uFlashPos;  // strike origin, normalised, y up',
    '',
    '/* palette - section 2 tokens inlined as consts (zero uniform cost) */',
    'const vec3 C_EXO      = vec3(0.016,0.020,0.055); // exosphere, black-violet',
    'const vec3 C_VIOLET   = vec3(0.086,0.067,0.180); // upper stratosphere',
    'const vec3 C_OZONE    = vec3(0.663,0.549,0.910); // --c-ozone-400',
    'const vec3 C_EM400    = vec3(0.243,0.878,0.541); // --c-emerald-400',
    'const vec3 C_EM200    = vec3(0.612,0.961,0.784); // --c-emerald-200',
    'const vec3 C_BELLY    = vec3(0.052,0.053,0.082); // cloud underside, tide-biased',
    /* MEASURED FIX — "overcast stock weather, not a storm". readPixels across
       the unobstructed sky band came back rgb(205,216,220): a bright neutral
       grey. That single value is why (a) the sky read as an overcast Tuesday
       and (b) a white-cored lightning bolt was INVISIBLE, because it was
       white-on-white. The cloud body is now a deep ozone-tinted slate and the
       lit flank tops out around 0.50 luminance, which leaves the silver
       lining, the aurora and the bolt somewhere to go. */
    'const vec3 C_TH_MID   = vec3(0.086,0.148,0.192); // slate body, ozone-tinted',
    'const vec3 C_CLOUD_LIT= vec3(0.352,0.470,0.548); // lit flank, ceiling',
    'const vec3 C_ANVIL    = vec3(0.980,0.988,1.000); // silver lining',
    'const vec3 C_MAGMA_UP = vec3(0.816,0.220,0.118); // Groudon underlight',
    'const vec3 C_TIDE_SHAD= vec3(0.043,0.196,0.400); // Kyogre shadow',
    'const vec3 C_GROUND   = vec3(0.020,0.039,0.031); // --c-ground-0',
    'const vec3 C_TIDE     = vec3(0.043,0.169,0.322); // --c-tide-800',
    'const vec3 C_BOLT_HAL = vec3(0.498,0.843,1.000); // --c-bolt-halo',
    'const vec3 C_BOLT_COR = vec3(0.918,0.965,1.000); // --c-bolt-core',
    '',
    '/* one key light, upper-left, for the WHOLE composition (board matches) */',
    'const vec2 LDIR = vec2(-0.64, 0.77);',
    '',
    '/* smoothstep with edge0 > edge1 is UNDEFINED per the GLSL ES spec, and',
    '   half the ramps below are descending. sstep() is the explicit two-way',
    '   version so Adreno and desktop drivers agree. Same ALU cost. */',
    'float sstep(float a, float b, float x){',
    '  float t = clamp((x - a) / (b - a), 0.0, 1.0);',
    '  return t * t * (3.0 - 2.0 * t);',
    '}',
    'float gauss(float d, float k){ return exp(-d * d * k); }',
    '',
    'void main(){',
    '  // aspect-corrected sky space; vUv.y == 0 at the BOTTOM of frame.',
    '  // the board occupies roughly vUv.y < 0.55, so every structural feature',
    '  // of the storm is composed into the 0.50..1.00 band on purpose.',
    '  vec2 p = vec2(vUv.x * uAspect, vUv.y);',
    '  float y = vUv.y;',
    '',
    '  /* == 1. ALTITUDE GRADIENT ======================================',
    '     wet ground -> tide horizon -> storm body -> stratosphere ->',
    '     exosphere. five stops, no texture, and the two mid stops are',
    '     what gives the frame a sense of how far up we are.          */',
    '  vec3 grad = mix(C_GROUND, C_TIDE * 0.62, sstep(0.00, 0.20, y));',
    '  grad = mix(grad, vec3(0.072,0.076,0.108), sstep(0.16, 0.52, y));',
    '  grad = mix(grad, C_VIOLET,  sstep(0.50, 0.80, y));',
    '  grad = mix(grad, C_EXO,     sstep(0.80, 1.00, y));',
    '',
    '  /* == 2. DOMAIN-WARPED fBm ======================================',
    '     t0 is the warp field (RG) + striation (B) + grain (A). t1..t3',
    '     are three octaves at warped coordinates, each reading a',
    '     different channel so the octaves stay decorrelated.',
    '     Drift speeds are non-harmonic - no visible repeat.          */',
    '  vec4 t0 = texture2D(uNoise, p * 0.33 + vec2(uTime * 0.0085, uTime * 0.0026));',
    '  vec2 w  = (t0.ra * 2.0 - 1.0);',
    '  vec4 t1 = texture2D(uNoise, p * 0.78 + w * 0.34 + vec2(uTime * 0.0135,  0.0));',
    '  vec4 t2 = texture2D(uNoise, p * 1.85 + w * 0.24 + vec2(uTime * 0.0235, -uTime * 0.005));',
    '  vec4 t3 = texture2D(uNoise, p * 2.15 + w * 0.15 + vec2(uTime * 0.0200,  uTime * 0.002));',
    '  /* the top octave is weighted down hard: at p*4.3 one of its cells is',
    '     six screen pixels, and under a high density contrast that reads as',
    '     blocky mottle rather than as detail. */',
    '  float fbm = t1.r * 0.60 + t2.g * 0.29 + t3.b * 0.11;',
    '  /* micro-form. two DIFFERENT octaves, not one octave sampled twice at an',
    '     offset: at this frequency a spatial offset large enough to matter is',
    '     already decorrelated, so a fetch-difference is white noise and the',
    '     cloud comes out as binary black-and-white mottle.               */',
    '  float micro = (t1.r - t2.g) * 1.35;',
    '',
    '  /* == 3. THE ANVIL ==============================================',
    '     At the reference layout only vUv.y 0.60..0.92 is unobstructed',
    '     sky: a 1280x240 letterbox. Nothing "towers" in 240px, so the',
    '     composition is what you actually see standing under a supercell',
    '     -- the ANVIL, edge on. Its sheared flat top sits near the frame',
    '     top, its scalloped mammatus underbelly hangs into the middle of',
    '     the strip, and the updraft core burns brighter behind it. The',
    '     fact that you only ever see the underside is exactly what',
    '     implies the 14km of storm you cannot.                        */',
    '  float cx = 0.400 * uAspect + 0.058 * sin(uTime * 0.019);',
    '  float hw = 0.078 + 0.165 * sstep(0.20, 0.74, y);',
    '  float core = gauss((p.x - cx) / max(hw, 0.02), 1.00);',
    '',
    '  // the sheared tropopause lid. flat, because the storm cannot rise',
    '  // through it -- that flatness IS the cue that reads as "enormous".',
    '  // two scales of raggedness: t0 is the very low frequency field, so the',
    '  // lid undulates over hundreds of pixels instead of reading as a rule.',
    /* THE OVERSHOOTING TOP — the fix for "the composition has a dead
       top-centre" and for "no verticality". A supercell strong enough to
       matter punches its updraft core THROUGH the tropopause lid, and that
       dome is the one feature that gives a flat anvil a vertical axis. It is
       one gauss on the updraft centreline added to topY, so the existing lid
       specular, silhouette rim and cloud density all follow it for free: the
       lid rises from 0.836 at the flanks to ~0.93 over the core, punching
       into the aurora band at 0.893 and putting a lit dome exactly where the
       frame was empty. Verticality for four lines and no new fetches. */
    /* TWO overshooting domes, not one: a supercell's updraft splits at the
       tropopause, and a twin-dome lid is what gives a flat anvil a legible
       vertical axis at the top of the visible band. The second is narrower,
       lower and offset, so the pair reads as one mass with a shoulder rather
       than as two clouds. */
    '  float over = gauss((p.x - cx) / 0.115, 1.0) * (0.66 + 0.34 * t1.r)',
    '             + gauss((p.x - cx + 0.175) / 0.070, 1.0) * (0.44 + 0.30 * t2.g) * 0.72;',
    '  float topY = 0.790 + (t1.r - 0.5) * 0.046 + (t0.r - 0.5) * 0.034',
    '             + over * 0.118;',
    '  // mammatus: two non-harmonic scallops so the lobes never tile, each',
    '  // pushing the underside DOWN into the frame.',
    '  float scal = 0.5 * sin(p.x * 27.0 + t2.g * 4.2) + 0.5 * sin(p.x * 10.3 + 1.7);',
    '  float undY = 0.622 + (t1.r - 0.5) * 0.098 + (t0.g - 0.5) * 0.052',
    '             - 0.030 * (0.40 + 0.60 * t3.b) * max(scal, 0.0)',
    '             + core * 0.062;',
    '  float shelf = sstep(undY, undY + 0.050, y) * sstep(topY + 0.026, topY - 0.032, y);',
    '',
    '  /* a SECOND, smaller cell further right and further away: two masses',
    '     at different scales is the cheapest sense of vast depth there is. */',
    '  float cx2 = 0.760 * uAspect - 0.028 * sin(uTime * 0.014 + 1.9);',
    '  float hw2 = 0.048 + 0.092 * sstep(0.34, 0.72, y);',
    '  float core2 = gauss((p.x - cx2) / max(hw2, 0.02), 1.15);',
    '  float top2 = 0.754 + (t2.g - 0.5) * 0.030;',
    '  float und2 = 0.664 - 0.016 * max(scal, 0.0) + core2 * 0.040;',
    '  float shelf2 = sstep(und2, und2 + 0.034, y) * sstep(top2 + 0.018, top2 - 0.024, y);',
    '',
    '  float contrast = mix(1.62, 2.25, uIntensity);',
    '  float thr = mix(0.560, 0.505, uIntensity);',
    '  float cloud = clamp(shelf * 1.22 + (fbm - thr) * contrast + core * 0.10, 0.0, 1.0);',
    '  float far   = clamp(shelf2 * 1.05 + (fbm - thr - 0.03) * contrast * 0.9, 0.0, 1.0) * 0.70;',
    '',
    '  /* a low, distant bank on the horizon, heavily hazed, so it reads as',
    '     tens of kilometres out and gives the anvil something to scale to. */',
    '  float bank = clamp((t2.g - 0.500) * 2.30 + 0.30, 0.0, 1.0)',
    '             * sstep(0.568, 0.635, y) * sstep(0.728, 0.656, y);',
    '',
    '  /* == 4. CLOUD LIGHTING =========================================',
    '     The shelf has an ANALYTIC normal, which is the whole reason this',
    '     stopped being grey fog: vert runs 0 at the mammatus underside to',
    '     1 at the lid, so the normal genuinely flips over, and one dot',
    '     product against the single upper-left key gives silver lids,',
    '     black bellies and a lit left flank. The fbm only adds relief on',
    '     top -- big shapes from geometry, small detail from noise.     */',
    '  float vert = sstep(undY, topY, y);',
    '  float flank = clamp((p.x - cx) / max(hw, 0.02), -1.6, 1.6);',
    '  vec2  nrm = normalize(vec2(flank * 0.58, vert * 2.0 - 1.0));',
    '  float big = clamp(dot(nrm, LDIR), -1.0, 1.0);',
    '  float lit = clamp(0.10 + 0.50 * big + 0.20 * micro + 0.16 * vert, 0.0, 1.0);',
    '  vec3 cloudCol = mix(C_BELLY, C_TH_MID, lit);',
    '  cloudCol = mix(cloudCol, C_CLOUD_LIT, pow(lit, 2.70) * 0.60);',
    '  cloudCol = mix(cloudCol, C_TIDE_SHAD, (1.0 - lit) * 0.30);',
    '  cloudCol += C_MAGMA_UP * pow(sstep(0.62, 0.30, y), 2.0) * 0.34 * cloud;',
    '',
    '  vec3 col = grad;',
    '  // aerial perspective: the far cell and the bank never reach full',
    '  // contrast, they are mixed toward the sky value behind them.',
    '  col = mix(col, mix(grad, cloudCol, 0.58), bank);',
    '  col = mix(col, mix(grad, cloudCol, 0.78), far);',
    '  col = mix(col, cloudCol, cloud);',
    '',
    '  /* == 5. SILVER LINING ==========================================',
    '     The rim only fires where the density edge FACES the light. That',
    '     one condition is the whole difference between a lit thunderhead',
    '     and a smudge. Three separate rims: the outer silhouette, a hard',
    '     specular along the sheared lid, and the light leaking around the',
    '     mammatus lobes -- the last is the detail that sells the scale. */',
    '  float edge = sstep(0.10, 0.44, cloud) * sstep(0.86, 0.46, cloud);',
    '  float face = pow(clamp(big, 0.0, 1.0), 1.30);',
    '  float rim  = edge * (0.22 + 1.15 * face);',
    '  col += C_ANVIL * rim * 0.86;',
    '  col += C_ANVIL * gauss((y - (topY - 0.015)) / 0.013, 1.0) * sstep(0.14, 0.5, cloud) * 0.92;',
    '  col += mix(C_ANVIL, C_OZONE, 0.30)',
    '       * gauss((y - (undY + 0.017)) / 0.015, 1.0) * sstep(0.18, 0.55, cloud) * 0.44;',
    '  col += C_ANVIL * sstep(0.12, 0.46, far) * sstep(0.82, 0.44, far) * face * 0.26;',
    '',
    '  /* == 6. OZONE AURORA ===========================================',
    '     a curtain, not a stripe: two harmonics on the centreline, hard',
    '     vertical striation from the detail octave, a faint second',
    '     ribbon above it, and a broad bloom filling the exosphere.   */',
    '  float ay = 0.845 + 0.034 * sin(p.x * 2.05 - uTime * 0.100)',
    '                   + 0.017 * sin(p.x * 4.70 + uTime * 0.062);',
    '  float ad = y - ay;',
    '  /* two tight lobes plus a bounded halo. A single hot core clips to white',
    '     through the tone curve and loses the emerald this ribbon exists to',
    '     deliver, and a very wide lobe leaks across the whole frame.       */',
    /* the HALO was 0.22 * gauss(ad, 26) — a lobe 0.3 uv tall, i.e. 240px of
       lifted sky on a 800px frame. Measured, it put rgb(131,188,179) at
       screen y 110, which is a mint wash covering the exact band the
       lightning channel has to be legible in. Tightened to a 0.13-uv lobe and
       the lost energy given back to the two tight cores, so the curtain is
       BRIGHTER where it is and no longer floods the sky under it. */
    '  float aCore = 0.70 * gauss(ad, 520.0) + 0.52 * gauss(ad, 90.0);',
    '  float aHalo = 0.09 * gauss(ad, 190.0);',
    '  /* the rays. An aurora is a curtain seen edge on, and vertical striation',
    '     is the one feature that separates it from a coloured smear. The phase',
    '     modulation is DELIBERATELY small: t0.b is a smooth field, so a large',
    '     coefficient sweeps the sine through many cycles across a gradient and',
    '     the result is contour moire across the entire sky. And the rays are',
    '     applied to the core only, never to the halo, for the same reason. */',
    '  float ray = 0.60 + 0.40 * sin(p.x * 30.0 + t0.b * 4.5);',
    '  float curtain = (aCore * (0.40 + 0.72 * ray) + aHalo) * (0.52 + 0.58 * t0.b);',
    '  float ay2 = 0.906 + 0.019 * sin(p.x * 3.30 + uTime * 0.078);',
    '  float ad2 = y - ay2;',
    '  curtain += (gauss(ad2, 900.0) + 0.34 * gauss(ad2, 120.0))',
    '           * (0.35 + 0.70 * t3.b) * 0.42;',
    '  vec3 auroraCol = mix(C_OZONE, C_EM400, 0.50 + 0.40 * sin(p.x * 1.62 + uTime * 0.045));',
    '  // occluded by the cloud in front of it, which is what puts it BEHIND',
    '  col += auroraCol * curtain * (0.92 + 0.74 * uIntensity) * (1.0 - cloud * 0.86);',
    '  col += mix(C_OZONE, C_EM200, 0.35) * 0.055 * sstep(0.52, 1.00, y) * (1.0 - cloud * 0.6);',
    /* THE BOUNCE. A curtain that bright standing over a cloud deck lights the
       deck's own lid, and that shared light is the only thing that ties the
       two halves of the composition together. Without it the aurora is a
       sticker laid over a grey photograph, which is what "overcast stock
       weather" was describing. */
    '  col += auroraCol * sstep(topY - 0.115, topY - 0.005, y)',
    '       * sstep(0.10, 0.46, cloud) * (0.09 + 0.15 * uIntensity);',
    '',
    '  /* == 7. SERPENTINE COIL ========================================',
    '     a filament of emerald light on a sinuous vertical path plus a',
    '     second strand half a wavelength behind it; where they cross,',
    '     the eye reads a coil. Gated by cloud density so it lives',
    '     INSIDE the storm. No head, no scales, never literal.        */',
    '  float ph = y * 13.0 - uTime * 0.230;',
    '  float cxA = cx + sin(ph) * 0.155 + sin(ph * 0.53 + 1.7) * 0.072;',
    '  float cxB = cx + sin(ph + 3.14159) * 0.120;',
    '  float dA = p.x - cxA, dB = p.x - cxB;',
    '  float coil = gauss(dA, 300.0) + 0.55 * gauss(dB, 480.0);',
    '  coil *= sstep(0.53, 0.65, y) * sstep(0.826, 0.720, y);',
    '  coil *= 0.22 + 0.78 * cloud;',
    '  col += mix(C_EM400, C_EM200, 0.55) * coil * (0.30 + 0.22 * uIntensity);',
    '',
    '  /* == 8. LIGHTNING: INTERNAL ILLUMINATION =======================',
    '     the strike lights the cloud from WITHIN - the radial term is',
    '     multiplied by density, so lit cloud blooms and clear sky',
    '     barely lifts. The rim term is boosted too: a real strike',
    '     re-lights every edge it can see.                            */',
    '  vec2 fp = vec2(uFlashPos.x * uAspect, uFlashPos.y);',
    '  float fd = length(p - fp);',
    /* MEASURED FIX — 1.75 is a falloff that reaches the whole frame: at the
       peak of a full-strength strike readPixels across the sky band came back
       with a MEAN of 185/255 and the bolt's own maximum only 1.37x above it,
       which is the arithmetic behind "a pale haze and no bolt". 5.5 keeps the
       same peak energy but confines it to a ~0.25-radius bloom around the
       channel — which is what internal cloud illumination actually looks like,
       and it leaves the rest of the sky dark for the bolt to sit against. */
    '  float ill = uFlash * exp(-fd * 5.50);',
    /* the internal illumination is what lights the cloud from within, and it
       is kept: 2.9x density is a cloud that genuinely glows. What is cut is
       the CLEAR-SKY term (0.30 -> 0.10) and the flat full-frame add
       (0.15 -> 0.05), because those two lifted the whole sky by the same
       amount as the channel and are precisely why a full-strength strike
       screenshotted as "a colour wash with no visible bolt". */
    '  col += C_BOLT_HAL * ill * (0.08 + 2.40 * (cloud + far * 0.6));',
    '  col += C_ANVIL * ill * rim * 2.40;',
    '  col += C_BOLT_COR * uFlash * 0.05;',
    '',
    '  /* == 9. RAIN SHAFT + HORIZON ===================================',
    '     a downdraft smear hanging under the tower, then the wet-rock',
    '     ground band, then a thin emerald-tide horizon line that marries',
    '     the sky to the board bed below it.                          */',
    '  float shaft = gauss((p.x - cx) / 0.36, 1.0) * sstep(0.63, 0.14, y) * (0.36 + 0.64 * t3.b);',
    '  col = mix(col, mix(C_GROUND, C_TIDE, 0.44), shaft * 0.50);',
    '  float haze = sstep(0.34, 0.00, y);',
    '  col = mix(col, mix(C_GROUND, C_TIDE, 0.32), haze * 0.55);',
    '  col += vec3(0.05, 0.10, 0.085) * haze * (0.35 + 0.65 * t3.b);',
    '  col += mix(C_TIDE_SHAD, C_EM400, 0.28) * gauss((y - 0.170) / 0.052, 1.0) * 0.26;',
    '',
    '  /* == 10. FILMIC ROLL-OFF =======================================',
    '     Additive rim + additive aurora + additive lightning all landing',
    '     on the same pixel clipped to flat white and destroyed every',
    '     highlight in the anvil. The ACES fit (Narkowicz) rolls those',
    '     highlights off instead of guillotining them, and leaves the',
    '     blacks alone. ~10 ALU for the single biggest quality jump in',
    '     this shader.                                                 */',
    '  col = max(col, 0.0) * 0.72;                 // exposure',
    '  col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);',
    '',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* PASS B — composite. Bilinear upsample of the low-res storm plus a grain
   * fetch that doubles as dither (an 8-bit sky at this contrast bands badly
   * without it) and a static vignette. 2 fetches, ~20 ALU.                */
  var FS_COMP = [
    'precision mediump float;',
    'varying vec2 vUv;',
    'uniform sampler2D uScene;',
    'uniform sampler2D uNoise;',
    'uniform vec2 uGrain;',
    'void main(){',
    '  vec3 c = texture2D(uScene, vUv).rgb;',
    '  float g = texture2D(uNoise, vUv * uGrain).a;',
    '  c += (g - 0.5) * 0.020;              // dither + grain, kills banding',

  /* PASS C — lightning geometry. Additive, tapered quads. aEdge is the
   * across-the-stroke coordinate (-1..1), aEnergy separates the wide halo
   * layer from the hot core layer.                                        */
  var VS_BOLT = [
    'attribute vec2 aPos;',
    'attribute vec2 aEdgeEnergy;',
    'varying float vEdge;',
    'varying float vEnergy;',
    'void main(){',
    '  vEdge = aEdgeEnergy.x; vEnergy = aEdgeEnergy.y;',
    '  gl_Position = vec4(aPos, 0.0, 1.0);',
    '}'

    'precision mediump float;',
    'varying float vEdge;',
    'varying float vEnergy;',
    'uniform float uFlash;',
    'void main(){',
    '  float a = 1.0 - abs(vEdge);',
    /* pow 1.5 rather than 2.0 on the CORE layer (vEnergy 1.0): squaring put
       the hot channel's own falloff so steep that only the centre line was
       opaque and the bolt read as a hairline. The halo layers keep the square,
       so the bloom stays soft while the core stays a solid white filament. */
    '  a = a * pow(a, mix(1.0, 0.5, vEnergy)) * vEnergy * uFlash;',
    /* the core is pushed past white so the ACES-free additive pass cannot
       leave it grey against a lit cloud. */

       colour and read as a generic camera flare. Emerald air glow at the
       outside, ozone halo in the middle, white-hot filament at the core. */

    '    ? mix(vec3(0.180,1.000,0.620), vec3(0.420,0.940,0.980), vEnergy / 0.20)',

  /* ── lightning geometry: midpoint displacement with real branching ───── */
  function makePath(rng, x0, y0, x1, y1, iters, jitter) {

      for (i = 0; i < pts.length - 1; i++) {

        var dx = b[0] - a[0], dy = b[1] - a[1];

  function makeBolt(rng) {

    /* MEASURED FIX. The previous band (origin uv-y 0.76-0.83, dying at 0.545)

       roster and the log — a forced full-strength strike screenshotted as a
       pale haze and NO bolt, twice, at two different phases. The band is now
       the clear sky above the board: uv-y 0.945 down to 0.735, which is screen
       y 5.5% to 26.5% — the dead top-centre third of the frame, which is also
       the one place a bolt can actually be seen. Trunk width nearly doubled
       (0.0018 -> 0.0034, so a ~4.4px channel with a ~40px additive bloom at
       1280) because a 2px channel is lost to the cloud layer no matter where
       you put it. Verified by screenshotting the COMPOSITE, not the geometry. */

       0.87 the aurora's own core is the brightest thing in the frame and a
       white channel is white-on-white there; below 0.64 the board's own
       stacking context (#shake, z 20) is in front of the sky canvas and eats
       the lower half of the bolt. This is the one strip where a strike is both
       unobstructed and against a dark ground — measured, not chosen. */

       channel ran further across the frame than down it, which is why it read
       as a crack in glass rather than as a strike. +-0.15 over the same drop
       is a bolt with a direction. */

       so the channel crosses the anvil's own underside and its bloom lights
       the cloud it comes out of instead of hanging in clear air above it. */
    var trunk = makePath(rng, x0, y0, x1, y1, 6, 0.34);
    /* 0.0058, not 0.0042: at 1280 the old core measured a 4.6px channel and a
       branch 2.9px, which a bitrate ladder deletes. This is a ~8px hot core
       with a ~55px additive halo — a bolt you cannot miss. */
    var strokes = [{ pts: trunk, w: 0.0082 }];
    // 2–4 branches off interior nodes, each shorter and thinner.
    /* 2-4 forks, not 3-6. Twelve strokes fanning off one trunk is a vein
       diagram; the eye reads a strike as a trunk with a few forks. */
    var nb = 2 + ((rng() * 3) | 0);
    for (var b = 0; b < nb; b++) {
      var i = 4 + ((rng() * (trunk.length - 8)) | 0);
      var root = trunk[i];
      var dirX = (rng() * 2 - 1) * 0.30;
      /* ONE-SIDED, and always with the discharge. A branch that ran back UP
         the trunk closed a loop with it, and a closed loop is the one thing
         real lightning never does — it is also exactly what read as
         "cracked glass". Every fork now terminates downward. */
      var drop = 0.07 + rng() * 0.13;
      var bpts = makePath(rng, root[0], root[1], root[0] + dirX,
                          Math.min(0.930, Math.max(0.640, root[1] - drop)), 4, 0.46);

      /* ══ A THIRD WIDTH GENERATION ═══════════════════════════════════════
         MEASURED FIX (finding 8). Trunk 0.0082 and branch 0.0040 is a 2:1
         hierarchy, but every TERMINAL twig was also 0.0040 — so the outer
         half of the discharge was drawn at one constant width and the whole
         cluster read as a vein diagram. Each branch now forks once more at
         half its own width again, which is the 4:2:1 taper the eye reads as
         electricity. Two extra strokes on a bolt that already has seven. */
      if (rng() < 0.50 && bpts.length > 6) {
        var bi2 = 2 + ((rng() * (bpts.length - 4)) | 0);
        var rt2 = bpts[bi2];

          pts: makePath(rng, rt2[0], rt2[1],
                        rt2[0] + (rng() * 2 - 1) * 0.15,
                        Math.min(0.935, Math.max(0.636, rt2[1] - (0.03 + rng() * 0.07))),
                        3, 0.52),

       brightest core is never crossed by a twig drawn over it. */
    strokes.sort(function (a, b) { return a.w - b.w; });

  }

  /* scratch for the joined ribbon. makePath's widest output is 2^6+1 = 65

      BNX = new Float64Array(80), BNY = new Float64Array(80), BVW = new Float64Array(80);

  /* ══ ONE CONTINUOUS RIBBON PER STROKE, NOT 64 LOOSE SLABS ══════════════
     BLOCKER FIX. The strike screenshotted as a closed honeycomb of constant-
     width filaments with hard triangular spikes radiating from the joins —
     "cracked glass", "a wireframe error over the cloud deck". It was not the
     path: makePath produces an open jittered polyline with no loops in it.
     It was this function. Each of the 64 trunk SEGMENTS was emitted as its
     own independent quad, using its own segment normal, at a bloom half-width
     of st.w * 11.5 = 0.094 uv — 120px at 1280 — against a segment length of

     local jitter and summed additively, is a honeycomb by construction: the
     union boundary of overlapping rotated rectangles IS a mesh of cells, and
     the mitre gaps at the joins ARE the spikes. No alpha tuning reaches it.

       1  PER-VERTEX normals — the average of the two adjacent segment
          normals — so consecutive quads share an edge EXACTLY. The ribbon is
          continuous: no gap to read as a spike, no overlap to read as a cell.
       2  every layer follows the SAME polyline. The first cut of this fix
          decimated the wide layers to smooth them, and that is what the
          honeycomb actually was: on a 9-point twig, every 8th point is TWO
          points, so the bloom flew the straight chord while the core flew
          the jagged path, and a straight edge closing against a jagged edge
          is a closed cell. Isolated by drawing the four thinnest strokes
          alone and screenshotting them: four closed hairline lozenges, one
          per twig. Shared vertex normals already remove the reason to
          decimate — the quads tile exactly at any segment length.

           glow around a channel, and at 11.5 it was eleven times the width of
           the thing it was meant to be glowing around. */

                 /* a floor on the CORE: at st.w 0.0019 a terminal twig's

          else              { ax = BVX[i - 1]; ay = BVY[i - 1]; bx = BVX[i + 1]; by = BVY[i + 1]; }

          out.push(apx, apy,  1, en,  amx, amy, -1, en,  bpx, bpy,  1, en,

        }

    }
    return new Float32Array(out);
  }

  /* ── flash envelope: strike, two restrikes, ~600 ms tail ──────────────
   * Three exponentials (hot core, cloud glow, afterglow) plus two restrike
   * bumps, all closed out by a window term so the tail reaches exactly 0 at
   * FLASH_LIFE instead of snapping off with 0.14 still on screen.         */
  function flashEnv(t, s) {

          + 0.22 * Math.exp(-t / 0.60);

    if (t > 0.24 && t < 0.30) e += 0.35 * (1 - (t - 0.24) / 0.06);

  /* ── viewport reads (never inside frame()) ───────────────────────────── */
  function readSize(canvas) {

         0.22 -> loop gain 0.88 < 1: stable, ~1.6 s RT60 over the ~30 ms ring. */
      var g = ctx.createGain(); g.gain.value = 0.22;              // ring gain
      delays.push(d); fb.push(g);
      input.connect(d);
      d.connect(out);
    }
    for (i = 0; i < 4; i++) {
      delays[i].connect(fb[i]);
      fb[i].connect(damp);
      damp.connect(delays[(i + 1) % 4]);                          // rotation
    }
    out.connect(dest);
    return input;
  }

  function build() {
    var AC = root.AudioContext || root.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC({ latencyHint: 'interactive' }); }
    catch (e) { try { ctx = new AC(); } catch (e2) { return false; } }

    var lim = ctx.createDynamicsCompressor();
    param(lim.threshold, -6); param(lim.knee, 0); param(lim.ratio, 20);
    param(lim.attack, 0.003); param(lim.release, 0.15);

    var sat = ctx.createWaveShaper();
    sat.curve = softClipCurve();
    try { sat.oversample = '2x'; } catch (e) {}

    var master = ctx.createGain(); master.gain.value = muted ? 0.0001 : vol.master;
    master.connect(sat); sat.connect(lim); lim.connect(ctx.destination);

    var sfx = ctx.createGain(); sfx.gain.value = vol.sfx; sfx.connect(master);
    var uiG = ctx.createGain(); uiG.gain.value = vol.ui; uiG.connect(master);
    var ambG = ctx.createGain(); ambG.gain.value = 0.0001; ambG.connect(master);

    var verbIn = buildReverb(master);

    bus = { master: master, sat: sat, lim: lim, sfx: sfx, ui: uiG, amb: ambG, verbIn: verbIn };
    noiseBuf = makeNoise();
    return true;
  }

  /* ── voice plumbing ─────────────────────────────────────────────────── */
  function T() { return ctx.currentTime; }

  function cleanup(src, nodes) {
    src.onended = function () {
      try { src.disconnect(); } catch (e) {}
      for (var i = 0; i < nodes.length; i++) { try { nodes[i].disconnect(); } catch (e) {} }
      src.onended = null;
    };
  }

  function envelope(p, t0, peak, attack, decay) {
    var pk = Math.max(peak, 0.0002);
    p.setValueAtTime(0.0001, t0);
    p.exponentialRampToValueAtTime(pk, t0 + Math.max(attack, 0.001));
    p.exponentialRampToValueAtTime(0.0001, t0 + Math.max(attack, 0.001) + Math.max(decay, 0.006));
  }

  function tap(node, amount, extra) {
    if (!amount) return;
    var s = ctx.createGain(); s.gain.value = amount;
    node.connect(s); s.connect(bus.verbIn);
    extra.push(s);
  }

  /* filtered noise layer — transients, air, whooshes, rumble */
  function nburst(o) {
    var t0 = o.t0, dur = Math.max(o.dur, 0.008), att = o.attack == null ? 0.003 : o.attack;
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = rnd(0.9, 1.1);
    var flt = ctx.createBiquadFilter();
    flt.type = o.type || 'bandpass';
    flt.frequency.setValueAtTime(Math.max(o.f0, 20), t0);
    if (o.f1 && o.f1 !== o.f0) flt.frequency.exponentialRampToValueAtTime(Math.max(o.f1, 20), t0 + dur);
    param(flt.Q, o.q == null ? 1 : o.q);
    var g = ctx.createGain();
    envelope(g.gain, t0, o.peak, att, dur);
    var extra = [flt, g];
    src.connect(flt); flt.connect(g); g.connect(o.dest || bus.sfx);
    tap(g, o.send, extra);
    src.start(t0, rnd(0, 1.2));
    src.stop(t0 + dur + att + 0.08);
    cleanup(src, extra);
    return g;
  }

  /* pitched layer — bodies, bells, chords. optional FM operator. */
  function tone(o) {
    var t0 = o.t0, dur = Math.max(o.dur, 0.01), att = o.attack == null ? 0.002 : o.attack;
    var osc = ctx.createOscillator();
    osc.type = o.wave || 'triangle';
    osc.frequency.setValueAtTime(Math.max(o.freq, 20), t0);
    if (o.glideTo) {
      osc.frequency.exponentialRampToValueAtTime(
        Math.max(o.glideTo, 20), t0 + Math.max(o.glideDur || dur, 0.01));
    }
    if (o.cents) param(osc.detune, o.cents);
    var g = ctx.createGain();
    envelope(g.gain, t0, o.peak, att, dur);
    var extra = [g], out = g;
    osc.connect(g);
    if (o.lp) {
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(o.lp, t0);
      if (o.lpTo) lp.frequency.exponentialRampToValueAtTime(Math.max(o.lpTo, 40), t0 + dur);
      param(lp.Q, o.lpQ || 0.8);
      g.connect(lp); out = lp; extra.push(lp);
    }
    if (o.fm) {
      var mod = ctx.createOscillator(); mod.type = 'sine';
      mod.frequency.value = Math.max(o.freq * o.fm.ratio, 20);
      var mg = ctx.createGain();
      envelope(mg.gain, t0, o.freq * o.fm.index, 0.001, o.fm.decay || dur * 0.5);
      mod.connect(mg); mg.connect(osc.frequency);
      mod.start(t0); mod.stop(t0 + dur + 0.1);
      cleanup(mod, [mg]);
    }
    out.connect(o.dest || bus.sfx);
    tap(out, o.send, extra);
    osc.start(t0); osc.stop(t0 + dur + att + 0.12);
    cleanup(osc, extra);
    return out;
  }

  /* gate: readiness, mute, retrigger floor, per-id voice cap */
  function gate(id) {
    if (!ctx || muted) return false;
    var t = T(), floor = GAP[id] || 0.030;
    if (last[id] != null && t - last[id] < floor) return false;
    if ((live[id] || 0) >= VOICE_CAP) return false;               // voice stealing
    last[id] = t;
    live[id] = (live[id] || 0) + 1;
    var hold = ctx.createGain(); hold.gain.value = 0.0001;
    var s = ctx.createBufferSource();
    s.buffer = noiseBuf; s.connect(hold); hold.connect(bus.sfx);
    s.start(t); s.stop(t + 0.05);
    s.onended = function () {
      live[id] = Math.max(0, (live[id] || 1) - 1);
      try { s.disconnect(); hold.disconnect(); } catch (e) {}
      s.onended = null;
    };
    return true;
  }

  /* ── the palette ────────────────────────────────────────────────────── */

  /* stone-on-stone clatter: 5-8 impacts, randomised spacing + pitch */
  function dice() {
    var t0 = T() + 0.005, n = 5 + ((Math.random() * 4) | 0), i, t = t0, mag;
    for (i = 0; i < n; i++) {
      mag = 0.9 - i * (0.55 / n) + rnd(-0.08, 0.08);
      clack(t, Math.max(mag, 0.22));
      t += rnd(0.055, 0.145) * (1 + i * 0.18);                    // decelerating tumble
    }
    // tail: room bloom under the whole tumble
    nburst({ t0: t0, dur: 0.42, type: 'bandpass', f0: jf(700), f1: 260, q: 0.7,
             peak: 0.05, attack: 0.02, send: 0.5 });
  }

  function clack(t, mag) {
    // transient: hard grit
    nburst({ t0: t, dur: 0.014, type: 'highpass', f0: jf(2600), q: 0.7,
             peak: 0.22 * mag, attack: 0.001, send: 0.10 });
    // body: damped resonator on noise (the "stone" ring)
    nburst({ t0: t, dur: rnd(0.045, 0.085), type: 'bandpass',
             f0: detune(rnd(900, 2400)), q: 9, peak: 0.30 * mag, attack: 0.001, send: 0.18 });
    // body 2: pitched knock
    tone({ t0: t, dur: rnd(0.05, 0.09), freq: detune(rnd(210, 380)), wave: 'square',
           lp: jf(1400), peak: 0.16 * mag, attack: 0.001, send: 0.12 });
  }

  /* airy whoosh + light stone tick on landing, pentatonic tick per hop */
  function hop(index) {
    var t0 = T() + 0.004;
    var i = (typeof index === 'number' && index >= 0 ? index : 0) | 0;
    var step = PENTA[i % PENTA.length] + 12 * Math.floor(i / PENTA.length);
    // transient/air: swept whoosh
    nburst({ t0: t0, dur: 0.15, type: 'bandpass', f0: jf(420), f1: jf(1500), q: 1.1,
             peak: 0.10, attack: 0.02, send: 0.16 });
    // body: pentatonic tick, bell-ish FM
    tone({ t0: t0 + 0.02, dur: 0.16, freq: detune(semi(392, step)), wave: 'triangle',
           peak: 0.14, attack: 0.004, send: 0.28, fm: { ratio: 3.01, index: 1.4, decay: 0.05 } });
    // tail: stone tick at touchdown
    nburst({ t0: t0 + 0.115, dur: 0.035, type: 'bandpass', f0: detune(1750), q: 7,
             peak: 0.13, attack: 0.001, send: 0.14 });
  }

  var CHIME = { pack1: [0], pack2: [0, 7], pack3: [0, 7, 12] };

  function chord(t0, root, steps, dur, peak, wave, sendAmt) {
    for (var i = 0; i < steps.length; i++) {
      tone({ t0: t0 + i * 0.045, dur: dur, freq: detune(semi(root, steps[i])),
             wave: wave || 'triangle', peak: peak, attack: 0.006, send: sendAmt == null ? 0.35 : sendAmt,
             fm: { ratio: 2.005, index: 0.9, decay: dur * 0.35 } });
    }
  }

  function land(kind) {
    if (!gate('land')) return;
    var t0 = T() + 0.004;
    // shared transient — every landing has a physical contact
    nburst({ t0: t0, dur: 0.03, type: 'bandpass', f0: jf(1900), q: 4,
             peak: 0.16, attack: 0.001, send: 0.12 });

    if (kind === 'pack1' || kind === 'pack2' || kind === 'pack3') {
      var steps = CHIME[kind];
      chord(t0 + 0.012, 523.25, steps, 0.55 + steps.length * 0.06, 0.11, 'triangle', 0.40);
      nburst({ t0: t0 + 0.01, dur: 0.30, type: 'highpass', f0: jf(4200), q: 0.7,
               peak: 0.035, attack: 0.012, send: 0.5 });                     // shimmer tail
      if (kind === 'pack3') duck(-5, 180);
      return;
    }
    if (kind === 'ladder') {
      for (var i = 0; i < 4; i++) {
        tone({ t0: t0 + i * 0.075, dur: 0.22, freq: detune(semi(330, PENTA[i])),
               wave: 'triangle', peak: 0.10, attack: 0.004, send: 0.3,
               fm: { ratio: 3.0, index: 1.1, decay: 0.06 } });
      }
      tone({ t0: t0 + 0.30, dur: 0.60, freq: detune(660), wave: 'triangle',
             peak: 0.12, attack: 0.006, send: 0.45, fm: { ratio: 2.0, index: 1.6, decay: 0.2 } });
      return;
    }
    if (kind === 'snake') {
      duck(-7, 320);
      // slide: descending exponential ramp across the whole traversal
      tone({ t0: t0, dur: 0.85, freq: detune(420), glideTo: 96, glideDur: 0.8,
             wave: 'sawtooth', lp: 2400, lpTo: 320, peak: 0.13, attack: 0.02, send: 0.4 });
      nburst({ t0: t0, dur: 0.85, type: 'bandpass', f0: jf(1400), f1: 240, q: 1.6,
               peak: 0.07, attack: 0.05, send: 0.35 });
      // bite: detuned tritone stab
      var tb = t0 + 0.82;
      nburst({ t0: tb, dur: 0.05, type: 'highpass', f0: 2200, q: 0.7, peak: 0.22, attack: 0.001 });
      tone({ t0: tb, dur: 0.45, freq: detune(146.83), wave: 'square', lp: 1200, lpTo: 300,
             peak: 0.16, attack: 0.002, send: 0.35 });
      tone({ t0: tb, dur: 0.45, freq: detune(146.83 * Math.SQRT2), wave: 'square',
             lp: 1400, lpTo: 320, peak: 0.13, attack: 0.002, send: 0.35 });
      tone({ t0: tb, dur: 0.7, freq: 55, wave: 'sine', peak: 0.22, attack: 0.004, send: 0.2 });
      return;
    }
    if (kind === 'hitzone') {
      // anticipation: rising metallic shimmer, unresolved
      nburst({ t0: t0, dur: 0.55, type: 'bandpass', f0: jf(600), f1: jf(5200), q: 2.2,
               peak: 0.09, attack: 0.06, send: 0.5 });
      tone({ t0: t0 + 0.04, dur: 0.5, freq: detune(392), glideTo: 587.33, glideDur: 0.45,
             wave: 'triangle', peak: 0.10, attack: 0.02, send: 0.45,
             fm: { ratio: 4.01, index: 1.8, decay: 0.25 } });
      return;
    }
    if (kind === 'jackpot') { jackpot(); return; }
    // default: neutral stone land
    tone({ t0: t0, dur: 0.16, freq: detune(180), wave: 'triangle', lp: 900,
           peak: 0.14, attack: 0.002, send: 0.15 });
  }

  function hit(tier) {
    if (!gate('hit')) return;
    var t0 = T() + 0.004;
    if (tier === 'top') {
      duck(-8, 900);
      thunder(t0, 1.0);
      // rising shimmer
      nburst({ t0: t0 + 0.05, dur: 0.9, type: 'bandpass', f0: jf(400), f1: jf(8000), q: 1.4,
               peak: 0.10, attack: 0.12, send: 0.6 });
      // held emerald chord + choir-ish detuned unisons
      var root = 164.81, steps = [0, 7, 12, 16, 19, 24], i, j;
      for (i = 0; i < steps.length; i++) {
        for (j = 0; j < 2; j++) {
          tone({ t0: t0 + 0.18 + i * 0.03, dur: 2.2 - i * 0.12,
                 freq: detune(semi(root, steps[i])), wave: i > 3 ? 'triangle' : 'sawtooth',
                 cents: j ? rnd(6, 14) : rnd(-14, -6), lp: jf(2600), lpTo: jf(1200),
                 peak: 0.055 / (1 + i * 0.25), attack: 0.22, send: 0.55 });
        }
      }
      return;
    }
    // small hit: bright metallic emerald chime
    nburst({ t0: t0, dur: 0.02, type: 'highpass', f0: jf(5200), q: 0.7,
             peak: 0.16, attack: 0.001, send: 0.15 });
    tone({ t0: t0, dur: 0.75, freq: detune(880), wave: 'triangle', peak: 0.13, attack: 0.004,
           send: 0.5, fm: { ratio: 3.51, index: 2.6, decay: 0.18 } });
    tone({ t0: t0 + 0.03, dur: 0.55, freq: detune(1318.5), wave: 'sine',
           peak: 0.07, attack: 0.006, send: 0.5 });
    duck(-4, 160);
  }

  function thunder(t0, mag) {
    // sub: pressure wave
    tone({ t0: t0, dur: 1.6 * mag, freq: 62, glideTo: 32, glideDur: 1.3 * mag,
           wave: 'sine', peak: 0.30 * mag, attack: 0.03, send: 0.15 });
    // body: crack
    nburst({ t0: t0, dur: 0.22, type: 'highpass', f0: jf(1800), q: 0.7,
             peak: 0.16 * mag, attack: 0.004, send: 0.35 });
    // tail: rolling rumble
    nburst({ t0: t0 + 0.06, dur: 1.9 * mag, type: 'lowpass', f0: jf(320), f1: 90, q: 0.9,
             peak: 0.20 * mag, attack: 0.10, send: 0.55 });
  }

  /* the sky-serpent passing. Two crossfaded bandpass noise sweeps make the
     doppler (air rushing up as it closes, down as it leaves), a low sine glide
     carries the mass, and an FM chime is the light off its scales. chord=true
     adds the held emerald stack for the summit arrival. */
  /* kd picks the CONTOUR, not just the level: 0 a short dry snap for the quick
     lateral wipe, 1 the full doppler, 2 a long deep pass for the near-camera
     shot. The same gesture id that chose the flight path chooses this, so the
     15 flybys in a three-minute live segment do not all sound identical. */
  function ray(mag, chord, kd) {
    if (!gate('ray')) return;
    var t0 = T() + 0.004, m = clamp(+mag || 1, 0.3, 1.6);
    kd = (kd === 0 || kd === 2) ? kd : 1;
    nburst({ t0: t0, dur: kd === 0 ? 0.18 : 0.30, type: 'bandpass',
             f0: jf(kd === 2 ? 240 : 300), f1: jf(kd === 0 ? 2100 : 2500), q: 1.7,
             peak: 0.075 * m, attack: kd === 0 ? 0.05 : 0.11, send: 0.40 });
    if (kd !== 0)
    nburst({ t0: t0 + (kd === 2 ? 0.30 : 0.25), dur: kd === 2 ? 0.56 : 0.44,
             type: 'bandpass', f0: jf(2300), f1: jf(380), q: 1.4,
             peak: 0.062 * m, attack: 0.03, send: 0.52 });
    tone({ t0: t0, dur: kd === 2 ? 0.78 : 0.60, freq: kd === 2 ? 90 : 122,
           glideTo: kd === 2 ? 48 : 62, glideDur: kd === 2 ? 0.70 : 0.52, wave: 'sine',
           peak: 0.115 * m, attack: 0.025, send: 0.20 });
    tone({ t0: t0 + 0.19, dur: 0.52, freq: detune(1174.66), wave: 'triangle',
           peak: 0.042 * m, attack: 0.006, send: 0.60,
           fm: { ratio: 3.01, index: 1.6, decay: 0.20 } });
    if (!chord) return;
    duck(-7, 1200);
    var root = 164.81, steps = [0, 7, 12, 19, 24], i;
    for (i = 0; i < steps.length; i++) {
      tone({ t0: t0 + 0.22 + i * 0.05, dur: 2.4 - i * 0.16,
             freq: detune(semi(root, steps[i])), wave: i > 3 ? 'triangle' : 'sawtooth',
             cents: rnd(-8, 8), lp: jf(2500), lpTo: jf(1000),
             peak: 0.055 / (1 + i * 0.22), attack: 0.26, send: 0.58 });
    }
  }

  function jackpot() {
    if (!gate('jackpot')) return;
    var t0 = T() + 0.005;
    duck(-9, 1400);
    thunder(t0, 1.0);
    thunder(t0 + 0.42, 0.55);
    // rising shimmer sweep
    nburst({ t0: t0 + 0.08, dur: 1.25, type: 'bandpass', f0: jf(300), f1: jf(9000), q: 1.2,
             peak: 0.11, attack: 0.2, send: 0.65 });
    // held emerald chord, slow bloom
    var root = 110, steps = [0, 7, 12, 16, 19, 23, 28], i;
    for (i = 0; i < steps.length; i++) {
      tone({ t0: t0 + 0.30 + i * 0.04, dur: 2.8 - i * 0.15, freq: detune(semi(root, steps[i])),
             wave: i > 4 ? 'triangle' : 'sawtooth', cents: rnd(-9, 9),
             lp: jf(2400), lpTo: jf(900), peak: 0.06 / (1 + i * 0.2), attack: 0.30, send: 0.6 });
    }
    // bell on top
    tone({ t0: t0 + 0.55, dur: 2.4, freq: detune(880), wave: 'triangle',
           peak: 0.09, attack: 0.01, send: 0.7, fm: { ratio: 3.01, index: 3.2, decay: 0.5 } });
  }

  var UI = {
    tap:    { f: 880,  wave: 'triangle', dur: 0.07, tf: 3400, peak: 0.11 },
    open:   { f: 587,  wave: 'triangle', dur: 0.16, tf: 2600, peak: 0.10, up: 1.5 },
    close:  { f: 440,  wave: 'triangle', dur: 0.14, tf: 2200, peak: 0.09, up: 0.62 },
    toggle: { f: 660,  wave: 'square',   dur: 0.08, tf: 3000, peak: 0.08 },
    error:  { f: 233,  wave: 'square',   dur: 0.24, tf: 1400, peak: 0.11, minor: true },
    tick:   { f: 1244, wave: 'triangle', dur: 0.045, tf: 5200, peak: 0.07 }
  };

  function ui(kind) {
    if (!gate('ui')) return;
    var s = UI[kind] || UI.tap, t0 = T() + 0.003, d = bus.ui;
    // transient
    nburst({ t0: t0, dur: 0.012, type: 'highpass', f0: jf(s.tf), q: 0.7,
             peak: s.peak * 0.9, attack: 0.001, dest: d, send: 0.05 });
    // body
    tone({ t0: t0, dur: s.dur, freq: detune(s.f), glideTo: s.up ? s.f * s.up : 0,
           glideDur: s.dur * 0.8, wave: s.wave, lp: jf(3200),
           peak: jg(s.peak), attack: 0.010, dest: d, send: 0.12 });
    if (s.minor) {
      tone({ t0: t0, dur: s.dur, freq: detune(semi(s.f, 1)), wave: 'square', lp: 1500,
             peak: jg(s.peak * 0.7), attack: 0.012, dest: d, send: 0.12 });
    }
  }

  /* ── ambient storm bed (off by default) ─────────────────────────────── */
  function ambienceOn() {
    if (amb) return;
    var t = T();
    var n = { nodes: [], srcs: [] };

    // rumble: brown noise through an LFO'd lowpass
    var s1 = ctx.createBufferSource(); s1.buffer = noiseBuf; s1.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 750; lp.Q.value = 0.7;   /* §6.4: LFO sweeps 300-1200 Hz */
    var lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = rnd(0.03, 0.08);
    var lfoG = ctx.createGain(); lfoG.gain.value = 450;
    var g1 = ctx.createGain(); g1.gain.value = 0.55;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    s1.connect(lp); lp.connect(g1); g1.connect(bus.amb);
    s1.start(t, rnd(0, 1)); lfo.start(t);

    // rain: bandpassed noise with jittered amplitude
    var s2 = ctx.createBufferSource(); s2.buffer = noiseBuf; s2.loop = true;
    s2.playbackRate.value = 1.7;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2100; bp.Q.value = 0.6;
    var g2 = ctx.createGain(); g2.gain.value = 0.16;
    s2.connect(bp); bp.connect(g2); g2.connect(bus.amb);
    var send = ctx.createGain(); send.gain.value = 0.25; g2.connect(send); send.connect(bus.verbIn);
    s2.start(t, rnd(0, 1));

    n.nodes = [lp, lfoG, g1, bp, g2, send];
    n.srcs = [s1, s2, lfo];
    n.rain = g2;
    amb = n;

    bus.amb.gain.cancelScheduledValues(t);
    bus.amb.gain.setValueAtTime(Math.max(bus.amb.gain.value, 0.0001), t);
    bus.amb.gain.exponentialRampToValueAtTime(Math.max(vol.ambience, 0.0002), t + 1.2);

    scheduleAmbTick(rnd(4000, 9000));
  }

  function scheduleAmbTick(ms) {
    if (ambTimer) root.clearTimeout(ambTimer);
    ambTimer = root.setTimeout(ambTick, ms);
  }

  function ambTick() {
    ambTimer = 0;
    if (!amb || !ctx) return;
    var t = T();
    // jitter rain density so nothing repeats audibly
    try { amb.rain.gain.setTargetAtTime(rnd(0.10, 0.22), t, 1.4); } catch (e) {}
    if (Math.random() < 0.55) thunder(t + rnd(0.1, 0.6), rnd(0.28, 0.6));
    scheduleAmbTick(rnd(8000, 25000));
  }

  function ambienceOff() {
    if (ambTimer) { root.clearTimeout(ambTimer); ambTimer = 0; }
    if (!amb) return;

           crossing it was as wide as the near-camera neck dragging it.
           So each station's clearance radius takes the LARGEST f in the window
           of the path its own neck occupies while that station is drawn — one
           body-length ahead in u. */
        var kwin = Math.ceil(NS * bodyU / ((uHi - uLo) || 1));
        if (kwin < 1) kwin = 1;
        for (j = 0; j <= NS; j++) {
          var fe = SW_F[j], jm = j + kwin; if (jm > NS) jm = NS;
          for (jj = j + 1; jj <= jm; jj++) if (SW_F[jj] > fe) fe = SW_F[jj];
          SW_N[j] = fclr + (SW_Z[j] > Z_BED ? latA : latB) * fe;
        }
        for (j = 1; j <= NS; j++) {
          var nR2 = SW_N[j] > SW_N[j - 1] ? SW_N[j] : SW_N[j - 1];
          if (segD2(fx, fy, SW_X[j - 1], SW_Y[j - 1], SW_X[j], SW_Y[j]) < nR2 * nR2) {
            PCOV = 1; return -1e6;
          }
        }
      }

      /* ── HEAD VISIBILITY, SAMPLED IN TIME, ON THE DOMAIN THE HEAD FLIES ──
         MEASURED FIX (finding 5). This loop is the head-presence invariant the
         whole candidate search is ranked on, and it was walking
         u = -0.03..1.03 uniformly. The head does not fly that: _build puts the
         snout at u = -0.02 + (1.02 + bodyU) * e(p), e is EASED (so the head
         spends far more time mid-frame than the ends), and with bodyU ~= 1 the
         head's real domain runs out past u = 2. So `vis` and `core` were
         scored on a curve the creature never takes, which is the arithmetic
         behind "head on screen 70.8% of frames but readable 59.1%, worst
         flyby 39%" while the probe was reporting the invariant satisfied.
         Now: p is sampled uniformly in TIME, mapped through the flight's own
         ease, and evaluated where the snout actually is. vis/(N+1) is the
         fraction of the FLIGHT the skull is on canvas and core/(N+1) the
         fraction it is inside the box the audience watches. */
      var bodyU = SPINE_LEN / (s.len || 1600);
      var uSpan = 1.02 + bodyU;
      for (i = 0; i <= N; i++) {
        var u = -0.02 + uSpan * easeP(s, i / N), mu = 1 - u;
        var bx = mu * mu * s.p0x + 2 * mu * u * s.p1x + u * u * s.p2x;
        var by = mu * mu * s.p0y + 2 * mu * u * s.p1y + u * u * s.p2y;
        var bz = zAt(s, u);
        var f = prjF(bx, by, bz);
        var on = !!_pok && _px > -mar && _px < W + mar && _py > -mar && _py < H + mar;
        if (on && bz <= Z_BED && bx > -30 && bx < bw + 30 && by > -30 && by < bh + 30) on = false;
        /* BLOCKER FIX — test the DRAWN footprint, not the bare centreline.
           0.70 was a shoulder-half-width fraction, so a body several times
           wider than the tested radius passed the clearance test and buried
           the just-landed tile on 5 of 18 landings (three of them 100% opaque
           over the tile's own rect). hwb*f is the real per-station screen
           half-width; 1.30 of it is the ribbon plus the sail plus the wash. */
        /* and it is tested for stations UNDER the bed too, at a smaller
           radius: `bz > Z_BED` used to exempt them on the theory that the tile
           occludes them, but the body is metres long and the samples either
           side of an under-bed one are drawn on the FRONT canvas — which is
           how a SKIM measured 32% of the focal tile's own rect. */
        /* focal clearance is NOT tested here — see THE FOCAL SWEEP above. This
           loop's u domain is the wrong one for it. */
        if (on) {
          if (hwb * f > PMHW) PMHW = hwb * f;
          vis++; if (!prev) runs++;
          if (_px > cx0 && _px < cx1 && _py > cy0 && _py < cy1) {
            core++;
            /* half-width in SCREEN px at this station. Under 26 and the whole
               creature is a green thread on a phone. */
            if (hwb * f > 26) big++;
          }
        }
        prev = on ? 1 : 0;
      }

      /* ── THE DRAWN INK, RASTERISED ────────────────────────────────────────
         Eight instants across the part of the flight the room is watching. At
         each one the body is walked from the snout back along its own arc for
         one SPINE_LEN in u, at the width the ribbon actually draws there —
         the neck's projected width (which is what _segments renormalises the
         whole silhouette against), tapered by the same DTG curve, plus the
         undulation's own lateral excursion, plus the 1.35 the bloom and the
         crest add to the silhouette — and stamped into a 64x40 union grid.
         The metric is the biggest of the eight, composited with whatever is
         already committed to this event (the summit's earlier bodies), which
         is the peak frame ink an auditor reads off the canvas. */
      var M = 16, KQ = 14, m, kq, cw2 = W / GW, ch2 = H / GH;
      var amps = s.amp * CAL.S, bestC = 0;
      for (m = 0; m <= M; m++) {
        var pm = 0.12 + 0.84 * (m / M);
        var uh = -0.02 + uSpan * easeP(s, pm);
        var fN = 1, gx0 = 0, gy0 = 0, ghad = 0;
        inkInstant();
        for (kq = 0; kq <= KQ; kq++) {
          var kk = kq / KQ, uq = uh - bodyU * kk, mq = 1 - uq;
          var qx = mq * mq * s.p0x + 2 * mq * uq * s.p1x + uq * uq * s.p2x;
          var qy = mq * mq * s.p0y + 2 * mq * uq * s.p1y + uq * uq * s.p2y;
          var qz = zAt(s, uq);
          var qf = prjF(qx, qy, qz);
          if (kq === 0) fN = qf;
          /* FRONT-CANVAS ink only. _draw routes every station whose z is
             under the bed plane to #ray-back (z 15, BELOW the board), so a
             SKIM or a PLUNGE can spend half its flight drawing on a layer the
             board covers. Counting that as escalation is what produced the
             two duds in this sweep — a pack1 modelled at 0.062 that drew
             0.011, and a pack2 modelled at 0.146 that drew 0.020. The board
             footprint test the old code used was the wrong one: the layer
             split is on z alone, not on whether the station is over the bed. */
          var qon = qz > Z_BED && !!_pok
                 && _px > -160 && _px < W + 160 && _py > -160 && _py < H + 160;
          if (qon && ghad) {
            var wq = hwb * fN * 1.35 * (1 - 0.94 * Math.pow(kk, 1.45)) + amps * fN * 0.40 * kk;
            if (wq < 1.5) wq = 1.5;
            stampSeg(gx0, gy0, _px, _py, wq, cw2, ch2);
          }
          gx0 = _px; gy0 = _py; ghad = qon ? 1 : 0;
        }
        /* m === 0 always writes: otherwise a body whose every sampled instant
           is off-frame leaves GX holding the PREVIOUS body's mask, which the
           summit's composite would then commit as its own. */
        if (GCN > bestC || m === 0) {
          bestC = GCN;
          for (kq = 0; kq < GN; kq++) GX[kq] = (GC[kq] === GTAG) ? 1 : 0;
        }
      }
      PCOV = bestC / GN;
      /* A SCORE, not a boolean. The old boolean threw away every rejected
         candidate and fell through to a hardcoded preset — which is how one
         flyby in five ended up a dud (and one measured with literally zero ink
         on either canvas after the preset shifted it off frame). Now the best
         of eight candidates always flies, and 1000+ means "accepted outright". */
      /* HEAD VISIBILITY IS THE INVARIANT. The probe walks the path the head
         actually flies, so vis/(N+1) IS the fraction of the flight the skull
         is on screen — and it averaged 59% with a worst case of 27%, i.e. a
         headless green thread. It was worth `vis` points out of ~200 and lost
         every tiebreak to a corner-clipping arc. It is now weighted 18x and
         carries a hard 4000-point penalty under the floor, so a candidate that
         flies the creature's face off frame cannot win a search — not even as
         the best of eight losers. */
      var vf = (minv || 0.60) * (N + 1);
      /* AND IT HAS TO BE IN THE SHOT, NOT MERELY ON THE CANVAS. Measured: the
         head was on screen for 70.8% of airborne frames but readable (half-
         width >= 18px) for only 59.1%, worst flyby 39%/34%, and NEITHER
         captured jackpot peak frame had a single head in frame. `vis` counts
         stations anywhere inside a 90px-slop frame, which a corner-clipping
         arc satisfies; `core` counts stations inside the central box
         (W*0.17..0.83, H*0.10..0.86), which is the box the audience is
         actually looking at. So core is now the dominant term (22 vs vis 12)
         and carries its own hard floor — a candidate that flies the creature's
         face along the frame edge loses to one that flies it through the shot,
         and the ranking can no longer be won on edge stations alone. The
         `sc >= 1000` accept-outright gate is unchanged: core*22 + big*5 +
         vis*12 peaks at 624 on a 15-sample probe, so nothing reaches 1000
         without the run/core/big bonus below. */
      var cf = 0.34 * (N + 1);
      var sc = core * 22 + big * 5 + vis * 12;
      if (vis < vf) sc -= 4000;
      else if (core < cf) sc -= 2600;
      /* ACCEPT-OUTRIGHT, and it has to be reachable to mean anything: over 18
         flybys the old gate fired ZERO times (_rej 17/18), because it also
         required `big >= 2` — two stations at a screen half-width over 26px —
         and it is evaluated on the body BEFORE the band loop scales it to its
         tier. A 1-pack candidate is never 26px wide at search time, so the
         gate was unreachable by construction and every flyby flew as "best of
         eight losers", which is also what made the rejection counter useless
         as a diagnostic. Width is the band loop's job. What the SEARCH decides
         is geometric: one contiguous pass, with the head in the shot. `big`
         stays a ranking bonus. */
      else if (runs <= 2 && core >= cf) sc += 1000;
      return sc;
    },

    /* ── fly(opts) — one flyby.
     *
     * Every visual parameter is drawn from a designed range: gesture, entry
     * bearing, exit bearing, arc bulge, altitude programme, body scale,
     * undulation amplitude, wave count and rate, bank gain and sign, an
     * occasional barrel roll, duration, ease shape — and the whole candidate is
     * then ACCEPTANCE-TESTED before it is allowed to fly. ─────────────── */
    fly: function (opts) {
      try {
        if (!this._ready || this._destroyed) return null;
        opts = opts || {};
        var s = null, i, oldest = 0, worst = -1;
        for (i = 0; i < POOL; i++) {
          if (!pool[i].on) { s = pool[i]; break; }
          var age = pool[i].t / pool[i].dur;
          if (age > worst) { worst = age; oldest = i; }
        }
        if (!s) s = pool[oldest];                  /* steal the most-finished */

        /* calibrate() only runs inside frame(), and frame() short-circuits
           while nothing is airborne — so on the FIRST flyby of the night
           CAL.ok was still false, _probe returned `true` on its first line and
           the focal-clearance test and the coverage clamp were both skipped
           entirely. One line closes it: the first flyby is now probed like
           every other one. */
        if (!CAL.ok) calibrate();

        /* the ink grid carries the summit's already-committed bodies (see
           inkCommit); an ordinary landing is its own whole event. */
        if (!opts.converge) inkClear();

        var K = global.StormConst;
        var cxB = (K ? K.BOARD_W : 664) / 2, cyB = (K ? K.BOARD_H : 552) / 2;
        var TL = K ? K.TILE : 104;
        var red = this._reduced;
        var kind = opts.kind || '';
        var big = (kind === 'hitzone' || kind === 'pack3' || kind === 'ladder' || !!opts.chord);

        var g = (opts.gesture != null) ? opts.gesture
              : (red ? G_WIPE : this._pickGesture(kind));
        s.gest = g;

        /* ── THE TIME CURVE, DECIDED BEFORE THE SEARCH, NOT AFTER IT ────────
           MEASURED FIX (finding 5). easeA and accel are the whole of the
           mapping from flight time to path position — the head is only in the
           shot for as long as they hold it there — and they used to be
           assigned AFTER the eight-candidate search had already ranked every
           path. So the search was scoring head presence against whatever
           values happened to be left on a recycled pool slot, and _probe's own
           comment had to warn readers not to read them. They are decided
           here, first, and _probe samples through them.
           accel is also more negative across the board (was -0.04..-0.20 for
           the four non-"show" gestures): NEGATIVE accel is what holds the head
           back into the second half of the flight, and at -0.04 a wipe threw
           its head off frame a third of the way in. */
        var show = (g === G_PASS || g === G_ORBIT || g === G_CROWN);
        s.easeA = (opts.easeA != null) ? opts.easeA
                : (red ? 0.10 : show ? 0.38 : (g === G_RISE ? 0.26 : 0.26));
        s.accel = red ? 0 : (show ? -rnd(0.24, 0.34) : -rnd(0.18, 0.30));

        /* body scale first — the focal clearance has to know how thick the
           creature is, not just where its centreline goes. The reward TIER is
           in here: a 1-pack serpent and a hit-zone serpent are visibly not the
           same animal, which is the escalation the audience can actually see. */
        var tsc = (TIER[kind] || 1.06) * (opts.scale || 1) * (GSC[g] || 1);
        s.thick = rnd(1.40, 1.72) * tsc * (red ? 0.85 : 1);
        s.amp = rnd(46, 78) * (red ? 0.30 : 1) * tsc;

        /* focal tile, in screen space */
        tileFocal(opts.tile);
        var fsx = 0, fsy = 0, fclr = 0;
        s.fgx = 0; s.fgy = 0; s.fgr = 0; s.fgbh = 0;
        /* BLOCKER FIX — the summit used to route AROUND this test entirely
           (`!opts.converge`), which is exactly why tile 30 measured 92% opaque
           at the peak of its own set-piece: nothing protected the one thing
           the shot is about. The converge path is held to a smaller radius
           because the crown is MEANT to come close — just never to land on it. */
        if (CAL.ok) {
          /* fclr is the TILE's own screen radius times a margin. Everything
             about the body (shoulder half-width, undulation excursion,
             near-camera magnification) is added per station inside _probe,
             where f is known; adding the undulation here, once and
             unmagnified, is what let a near-row tile be buried by a path the
             probe had just cleared. */
          var tr0 = tileScreenR(FOCAL.x, FOCAL.y, TL * 0.5);
          fsx = FR_X; fsy = FR_Y;
          /* the summit no longer gets a SMALLER exclusion disc than an
             ordinary landing. "The crown is meant to come close" is not worth
             the one thing the whole set-piece is about. */
          fclr = tr0 * (opts.converge ? 1.66 : 1.60);
          /* and the EXACT guard's own radius — the tile's screen radius plus
             15%, applied to the ribbon as actually built rather than as
             predicted. Smaller than fclr on purpose: the sweep steers paths
             generously away, the guard only has to stop ink landing on the
             tile itself. */
          s.fgx = fsx; s.fgy = fsy; s.fgr = tr0 * (opts.converge ? 1.38 : 1.15);
          s.fgbx = FOCAL.x; s.fgby = FOCAL.y; s.fgbh = TL * 0.5;
          /* RETARGET EVERY AIRBORNE BODY onto the tile that was just landed
             on. A ladder chain lands twice inside a second, and the previous
             flyby — still in frame, still guarding the PREVIOUS tile — was
             free to sit on the new one: measured 0.998 of tile 22's own quad
             at 0.998 opaque, painted by the serpent that belonged to tile 14.
             Only the tile the room is looking at NOW is worth protecting. */
          for (i = 0; i < POOL; i++) if (pool[i].on) {
            pool[i].fgbx = s.fgbx; pool[i].fgby = s.fgby; pool[i].fgbh = s.fgbh;
            pool[i].fgx = s.fgx; pool[i].fgy = s.fgy; pool[i].fgr = s.fgr;
          }
        }

        /* the skim deliberately spends part of its run under the bed, so it is
           held to a lower visibility bar than a gesture that has no excuse. */
        var minv = (g === G_SKIM) ? 0.46 : 0.60;
        /* what this reward tier is allowed to paint, as a fraction of frame.
           This is the escalation ladder and it is the only one that matters:
           it is enforced twice — once by PREFERRING candidate paths whose own
           measured footprint sits on the tier's band, and once by a hard
           downward clamp on whatever finally flies. */
        /* opts.covMax / opts.covMin override the tier band OUTRIGHT rather
           than scaling it. MEASURED FIX: the summit's band was KCOV.jackpot x
           covK, i.e. a COMPOSITE number (each converge body measures itself
           plus every body already committed) applied to body 1, which has
           nothing committed. Body 1 was therefore asked for 0.328 of frame on
           its own, could not buy it without becoming a wall, was correctly
           held at the width ceiling (pmhw pinned to 201 in 15 of 15 summits)
           and landed at 0.14-0.20 — inside the pack2/pack3 bands, inverting
           the ladder at the top. The four bands are now cut where the four
           arrivals can actually land them; see jackpot(). */
        var cap = (opts.covMax != null ? opts.covMax
                   : (KCOV[kind] != null ? KCOV[kind] : KCOV_DEF) * (opts.covK || 1))
                * (red ? 0.7 : 1);
        var bp = this._bp, bs = -1e9, sc, clear = 0;
        /* ── accel IS A SEARCH DIMENSION, NOT A CONSTANT ────────────────────
           MEASURED FIX (finding 5). accel is the one flight parameter that
           trades nothing: it holds the snout back into the second half of the
           flight and costs no coverage, no clearance and no gesture identity.
           It was drawn once from a range and then eight PATHS were ranked
           against it. Now each candidate carries its own, swept across the
           whole usable range, and the search — whose dominant term is head
           presence inside the box the audience watches — picks the pair. e(p)
           stays monotone across the sweep (de/dp at p=0 is 1 + 2*easeA +
           1.35*accel, which is 0.91 at the far end). */
        var acB = s.accel;
        for (i = 0; i < 8; i++) {
          if (!red) {
            s.accel = acB - 0.030 * i;
            if (s.accel < -0.44) s.accel = -0.44;
          }
          this._path(s, g, opts, cxB, cyB, i);
          sc = this._probe(s, fsx, fsy, fclr, minv);
          if (sc > -1e5) {
            clear = 1;
            /* on-band preference. Peak coverage for one gesture swings 9% to
               28% of frame on path randomness alone, which is why no scale
               constant ever pinned the ladder: the candidate SEARCH is where
               it has to be pinned. Over-cap candidates are pushed below every
               in-cap one but stay rankable, so something always flies. */
            if (PCOV > cap) sc -= 3000 + (PCOV - cap) * 400;
            /* and a FLOOR, not just a ceiling: an orbit that keeps to the
               frame edges measured 0.7% of the visible board and is the old
               "one flyby in five is a dud" failure coming back in through the
               band-preference door. Under-band is penalised harder than
               over-band because a dud costs the whole beat. */
            else if (PCOV < cap * 0.45 && !opts.converge)
              sc -= 700 + (cap * 0.45 - PCOV) * 1400;
            else sc -= Math.abs(PCOV - cap * 0.85) * 300;
          }
          if (sc >= 1000) { bs = sc; break; }
          if (sc > bs) {
            bs = sc;
            bp[0] = s.p0x; bp[1] = s.p0y; bp[2] = s.p1x; bp[3] = s.p1y;
            bp[4] = s.p2x; bp[5] = s.p2y; bp[6] = s.zA; bp[7] = s.zB;
            bp[8] = s.dip; bp[9] = s.len; bp[10] = s.accel;
          }
        }
        if (bs < 1000) {
          /* nothing cleared the bar in eight tries: fly the BEST candidate,
             which keeps this gesture's identity, rather than a preset. */
          this._rej++;
          s.p0x = bp[0]; s.p0y = bp[1]; s.p1x = bp[2]; s.p1y = bp[3];
          s.p2x = bp[4]; s.p2y = bp[5]; s.zA = bp[6]; s.zB = bp[7];
          s.dip = bp[8]; s.len = bp[9]; s.accel = bp[10];
        }
        /* BLOCKER FIX — when all eight candidates were ON the prize, the old
           code cheerfully flew the "best" of eight losers, every one of which
           sat on the tile the audience had just landed on. A lateral wipe
           square across the focal bearing is the one path whose geometry is
           DEFINED by being off that bearing; four of them are tried, because a
           focal tile near the middle of the bed can be crossed by a wipe from
           one side and cleared by a wipe from the other. Never taken on the
           summit, whose four bodies are choreographed around the tile. */
        if (!clear && !opts.converge && !red) {
          var fa = Math.atan2(FOCAL.y - cyB, FOCAL.x - cxB);
          var FB = this._fb, fbi, fok = 0;
          FB[0] = fa + Math.PI * 0.5; FB[1] = fa - Math.PI * 0.5;
          FB[2] = fa + Math.PI * 0.62; FB[3] = fa - Math.PI * 0.62;
          var g0 = g;
          g = G_WIPE; s.gest = g;
          for (fbi = 0; fbi < 4; fbi++) {
            this._path(s, g, { angle: FB[fbi], tile: opts.tile }, cxB, cyB, 0);
            if (this._probe(s, fsx, fsy, fclr, minv) > -1e5) { fok = clear = 1; break; }
          }
          /* and if none of the four wipes cleared either, PUT THE BEST
             CANDIDATE BACK. The old `void fok` flew whatever the fourth failed
             wipe happened to leave in s — a path that had just been rejected,
             with the gesture identity thrown away for nothing. */
          if (!fok) {
            s.p0x = bp[0]; s.p0y = bp[1]; s.p1x = bp[2]; s.p1y = bp[3];
            s.p2x = bp[4]; s.p2y = bp[5]; s.zA = bp[6]; s.zB = bp[7];
            s.dip = bp[8]; s.len = bp[9]; s.accel = bp[10];
            g = s.gest = g0;
          }
        }
        /* SHRINK TO CLEAR — the last resort, and the one that always works.
           A hit-zone body is ~2.4x BASE_HW and its exclusion disc around the
           focal tile is several hundred screen px wide; a tile in the middle of
           the bed genuinely cannot be crossed by a creature that thick, which
           is why all eight candidates AND all four fallback bearings could be
           rejected and the code then flew the least-bad loser straight over the
           prize (measured: tile 4 at 0.63 any / 0.49 opaque on an ORBIT, tile
           30 at 0.68 / 0.62 in the middle of its own summit). Thickness is the
           only lever that is always available, so it is the one that gives.
           This runs for the summit too: converge skips the bearing search
           because its four bodies are choreographed, but nothing may sit on
           tile 30. 0.72^6 = 0.14 floor; if even that cannot clear, the original
           body is restored rather than flying a thread. */
        this._lastShrink = 1;
        if (!clear && CAL.ok) {
          var t1 = s.thick, a1 = s.amp, tries = 0;
          while (tries < 6) {
            s.thick *= 0.72; s.amp *= 0.72; tries++;
            if (this._probe(s, fsx, fsy, fclr, minv) > -1e5) { clear = 1; break; }
          }
          if (!clear) { s.thick = t1; s.amp = a1; }
          else this._lastShrink = Math.round(Math.pow(0.72, tries) * 100) / 100;
        }

        /* THE HARD CEILING. Measure the footprint of the path that actually
           won, with the clearance test off so PCOV is the chosen candidate's
           own number and not a rejected one's, then shrink — never grow. The
           climb measured 39-58% of frame on ordinary 2-pack landings and
           covered 25 of 30 tiles at full opacity; nothing gets to do that
           again. Downward only, because the clearance test that just passed
           was computed against THIS body's width: growing it afterwards is how
           a cleared path ends up back on the prize. */
        this._probe(s, 0, 0, 0, minv);
        var kk = 1;
        if (CAL.ok) {
          var hwcap = (KHW[kind] != null ? KHW[kind] : KHW_DEF)
                    * (opts.covK || 1) * (red ? 0.8 : 1);
          if (PCOV > cap && PCOV > 0.0005) kk = cap / PCOV;
          if (PMHW > hwcap && PMHW > 1) {
            var k2 = hwcap / PMHW; if (k2 < kk) kk = k2;
          }
          if (kk > 1) kk = 1; else if (kk < 0.42) kk = 0.42;
          if (kk < 1) { s.thick *= kk; s.amp *= kk; }
          /* ══ THE BAND LOOP ═══════════════════════════════════════════════
             The single enforcement point for the escalation metric. Coverage
             is not linear in thickness (amp scales the path's own excursion
             too), so one division could not land the body inside a band — and
             the old code's ONE growth step, capped at 1.85 and reverted
             whenever the clearance test disliked it, is exactly why a tier's
             measured floor was a suggestion. Five secant-ish steps converge
             every gesture tried, and nothing is reverted: growth is safe
             because the per-frame exact focal guard in _build() narrows any
             station that reaches the just-landed tile regardless of how wide
             the body ended up. The loop closes on a final _probe, so
             _diag().pcov is the number this body will actually paint. */

             that happens to the body is a hard clamp on its widest SCREEN

             limit and stuck well under a floor it could only have reached by
             becoming a wall). EXCURSION is the free lever: a wider swim
             lengthens the drawn ribbon without widening it, so coverage rises
             and the peak half-width barely moves. Grown alone, four steps,
             never past the band's own ceiling, and abandoned the moment the
             width ceiling is in play again.

             clamp has just pinned sits AT hwcap, so a strict test broke on
             the first iteration and the lever was never pulled. Excursion
             moves the spine in z as well as laterally, so it does drift the

             thickness and excursion TOGETHER, so a body that flies far from
             camera can buy its whole coverage band out of path length alone.

             clamp below (coverage is exactly proportional to thickness), so
             it is a TRADE: thickness up by k, excursion down by k, which
             leaves coverage roughly where the band loop put it — path length

             eye can find both edges of the animal. One attempt, best effort;
