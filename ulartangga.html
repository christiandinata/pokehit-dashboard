          return;
        }

        var t0 = (global.performance && performance.now) ? performance.now() : 0;

        if (pB.on) this._bctx.clearRect(pB.x0, pB.y0, pB.x1 - pB.x0, pB.y1 - pB.y0);
        if (pF.on) this._fctx.clearRect(pF.x0, pF.y0, pF.x1 - pF.x0, pF.y1 - pF.y0);
        dB.on = dF.on = false;

        if ((this._calN++ % CAL_EVERY) === 0) calibrate();

        for (i = 0; i < POOL; i++) {
          var s = pool[i];
          if (!s.on) continue;
          s.t += dt;
          if (s.t < 0) continue;                        /* still in its delay */
          if (s.t >= s.dur) { s.on = false; continue; }
          var p = s.t / s.dur;
          /* short fades — the old 0.10/0.14 windows spent 240ms of a 1000ms
             flight ramping, and they ramped while the body was off-frame. */
          s.fade = Math.min(1, p / 0.045) * Math.min(1, (1 - p) / 0.06);
          /* THE ROAR. A jaw that cannot gap is a cone with a line drawn on it,
             which is what the mouth seam alone was. One half-sine of gape
             centred on this body's own beat: shut for 88% of the flight, wide
             on the frame the landing pays off. */
          var jw0 = s.flashAt - 0.10;
          s.jaw = (p > jw0 && p < jw0 + 0.24)
                ? Math.sin((p - jw0) / 0.24 * Math.PI) : 0;

          if (!s.fired && p >= s.flashAt) {
            s.fired = true;
            /* BLOCKER FIX. The crown used to be a setTimeout(2620) full-frame
               StormFx.flash(0.40): measured, it fired at 3.6% coverage on an
               empty sky with one tail sliver left in the HUD, and tile 30
               looked exactly as it does at idle. It is now (a) driven by the
               third body's own progress, so the flash and the body co-exist,
               and (b) ANCHORED on tile 30 — a gold bloom, two expanding rings
               and four forked bolts terminating on the summit — so the most
               valuable event on the board is also the biggest thing on it. */
            if (s.crown) {
              try {
                tileFocal(30); prj(FOCAL.x, FOCAL.y, 26);
                if (_pok) global.StormFx.crown(_px, _py);
              } catch (e) {}
            }
            if (s.flashS > 0) { try { global.StormFx.flash(s.flashS, 210); } catch (e) {} }
            if (s.shakeA > 0.4) {
              try { global.StormFx.shake(s.shakeA, 130, -(s.p2y - s.p0y), (s.p2x - s.p0x), 0.14); } catch (e) {}
            }
          }

          if (!CAL.ok) continue;
          buildProfile(s.n - HEAD_EXT);
          this._build(s, t, dt);
          if (!isFinite(s.px[0]) || !isFinite(s.py[0])) continue;
          this._draw(s);
        }

        /* the last word on the prize — see punchSprite(). After every body,
           every wake, every wash and every smear has drawn. */
        this._punch();

        pB.on = dB.on; pB.x0 = dB.x0 - 2; pB.y0 = dB.y0 - 2; pB.x1 = dB.x1 + 2; pB.y1 = dB.y1 + 2;
        pF.on = dF.on; pF.x0 = dF.x0 - 2; pF.y0 = dF.y0 - 2; pF.x1 = dF.x1 + 2; pF.y1 = dF.y1 + 2;

        if (t0) this._watch(performance.now() - t0, dtMs);
      } catch (e) {}
    },

    /* ── _punch() — subtract the just-landed tile out of the near canvas ──
     *  The guarantee. See punchSprite() for why this exists rather than a
     *  fourth generation of per-pass geometry guards. Radius is the exact
     *  guard radius (the tile's own projected screen radius x 1.15, recomputed
     *  every frame in _build so camera punch and shake cannot slide it off)
     *  times 1.8, which puts the whole projected tile quad — corners included
     *  — inside the near-total plateau of the sprite, and feathers over 45%
     *  of the radius beyond it so nothing has a visible edge.
     *  Costs one drawImage a frame and allocates nothing. */
    _punch: function () {
      var i, s = null;
      for (i = 0; i < POOL; i++) {
        if (pool[i].on && pool[i].fgbh > 0 && pool[i].fgr > 0) { s = pool[i]; break; }
      }
      if (!s || !dF.on) return;
      var sp = punchSprite(); if (!sp) return;
      var R = s.fgr * 1.80, c = this._fctx;
      c.save();
      c.globalCompositeOperation = 'destination-out';
      c.globalAlpha = 1;
      c.drawImage(sp, s.fgx - R, s.fgy - R, R * 2, R * 2);
      /* ── AND THE PRIZE, ALWAYS ────────────────────────────────────────
         MEASURED FIX. The focal punch only ever protected the tile just
         landed on, so tile 30 — the one marker the room is playing for —
         was buried on 6 of 18 ORDINARY flybys (numeral frac>=50% alpha of
         1.000 on three of them). The summit's own set-piece kept it clean
         because there tile 30 IS the focal tile. It is now punched on every
         frame that draws ink, at a tighter radius than the focal disc: the
         quad and its badge, and nothing beyond them. One extra drawImage. */
      var K = global.StormConst, TL2 = (K ? K.TILE : 104) * 0.5;
      if (s.fgbh > 0 && CAL.ok) {
        tileFocal(30);
        var r30 = tileScreenR(FOCAL.x, FOCAL.y, TL2, Z_SUMMIT);
        var dx30 = FR_X - s.fgx, dy30 = FR_Y - s.fgy;
        /* skip when the focal disc already covers it (the summit, or a
           landing on 30 itself) — same hole, drawn twice. */
        if (r30 > 1 && dx30 * dx30 + dy30 * dy30 > r30 * r30 * 0.25) {
          var R30 = r30 * 1.72;
          c.drawImage(sp, FR_X - R30, FR_Y - R30, R30 * 2, R30 * 2);
        }
      }
      /* ── AND EVERY TILE A PAWN IS STANDING ON ─────────────────────────
         MEASURED FIX. The per-frame guard protected the just-landed tile and
         tile 30 and nothing else, so a flyby at full opacity buried the OTHER
         players' markers — the one thing on the board that says where each
         buyer is. Tiles live at z 20 and #ray-front at 65, so they are
         genuinely occludable; the HUD (66) and the reveal cards (70) are not,
         and are none of this pass's business.
         Same sprite, same destination-out, same 1.72 radius as the prize, one
         drawImage per occupied tile — at most MAX_PLAYERS of them, and a
         crowd shares a tile so usually far fewer. Occupancy is read into a
         preallocated marker table, so this allocates nothing per frame; it
         extends the guard rather than steering the flight, so no path is
         over-constrained and the shrink-to-clear fallback keeps its job. */
      var G = global.StormGame, occ = this._occ, ps, pi, pn, rt, dxo, dyo, Ro;
      if (CAL.ok && s.fgbh > 0 && G && G.state && G.state.players) {
        ps = G.state.players;
        for (pn = 1; pn <= 30; pn++) occ[pn] = 0;
        for (pi = 0; pi < ps.length; pi++) {
          pn = ps[pi].pos | 0;
          if (pn >= 1 && pn <= 30) occ[pn] = 1;
        }
        for (pn = 1; pn < 30; pn++) {          /* 30 is punched above already */
          if (!occ[pn]) continue;
          tileFocal(pn);
          rt = tileScreenR(FOCAL.x, FOCAL.y, TL2);
          dxo = FR_X - s.fgx; dyo = FR_Y - s.fgy;
          if (rt > 1 && dxo * dxo + dyo * dyo > rt * rt * 0.25) {
            Ro = rt * 1.72;
            c.drawImage(sp, FR_X - Ro, FR_Y - Ro, Ro * 2, Ro * 2);
          }
        }
      }
      c.restore();
    },

    /* ── spine build ───────────────────────────────────────────────────────
     * The undulation is a real travelling wave along arc length: one sine whose
     * phase advances with time and RETARDS along the body by a wave COUNT, so
     * the body propagates a wave from nose to tail at the same wavelength
     * whatever the segment count. Amplitude grows toward the tail and the tail
     * lags by an extra k² term — follow-through, so it reads as a creature
     * driving itself rather than as a sine plotter. The offset is applied in
     * the spine's own rolled 3D frame, which is what makes a banked or barrel-
     * rolling body foreshorten correctly instead of wobbling in 2D. */
    _build: function (s, tMs, dt) {
      var n = s.n, nb = n - HEAD_EXT, i;
      var p = s.t / s.dur; if (p < 0) p = 0; if (p > 1) p = 1;
      var e = p + s.easeA * Math.sin(TAU * p) / Math.PI
                + s.accel * (p - p * p) * 1.35;
      if (e < 0) e = 0; if (e > 1.35) e = 1.35;
      var bodyU = SPINE_LEN / s.len;
      var uH = -0.02 + (1.02 + bodyU) * e;
      var du = bodyU / (nb - 1);
      var ph0 = tMs * 0.001 * s.freq * TAU + s.phase;
      var wk = s.waveTurns * TAU;
      var hx0 = s.hx, hy0 = s.hy;

      for (i = 0; i < n; i++) {
        var hi = i < HEAD_EXT;
        var bi = hi ? 0 : i - HEAD_EXT;
        var u = hi ? (uH + du * HX[i]) : (uH - bi * du);
        var k = hi ? 0 : bi / (nb - 1);
        var mu = 1 - u;
        var bx = mu * mu * s.p0x + 2 * mu * u * s.p1x + u * u * s.p2x;
        var by = mu * mu * s.p0y + 2 * mu * u * s.p1y + u * u * s.p2y;
        var bz = zAt(s, u);
        var tx = 2 * (mu * (s.p1x - s.p0x) + u * (s.p2x - s.p1x));
        var ty = 2 * (mu * (s.p1y - s.p0y) + u * (s.p2y - s.p1y));
        var tz = dzAt(s, u);
        var tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
        tx /= tl; ty /= tl; tz /= tl;
        var rx = ty, ry = -tx, rl = Math.sqrt(rx * rx + ry * ry) || 1;
        rx /= rl; ry /= rl;
        var ax = ry * tz, ay = -rx * tz, az = rx * ty - ry * tx;
        var wv = ph0 - k * wk - 0.55 * k * k;
        var phi = s.bank * s.bankSign * Math.sin(u * Math.PI)
                + s.rollTurns * TAU * u
                + 0.30 * Math.sin(ph0 - k * wk);
        var cp = Math.cos(phi), sp = Math.sin(phi);
        var Rx = rx * cp + ax * sp, Ry = ry * cp + ay * sp, Rz = az * sp;
        var Ux = -rx * sp + ax * cp, Uy = -ry * sp + ay * cp, Uz = az * cp;

        /* head leads, mid-body drives, tail whips ~45% wider */
        var sm = k / 0.30; if (sm > 1) sm = 1;
        var env = (0.22 + 0.78 * (sm * sm * (3 - 2 * sm))) * (1 + 0.45 * k * k);
        var aM = s.amp * env;
        var lat = aM * Math.sin(wv), vrt = aM * 0.28 * Math.sin(wv + 1.15);
        var wx = bx + Rx * lat + Ux * vrt;
        var wy = by + Ry * lat + Uy * vrt;
        var wz = bz + Rz * lat + Uz * vrt;
        s.sz[i] = wz;

        var hwb = BASE_HW * s.thick * (hi ? HP[i] : PROF[bi]);
        prj(wx, wy, wz);
        var cxs = _px, cys = _py;
        s.px[i] = cxs; s.py[i] = cys;
        s.ok[i] = (_pok && isFinite(cxs) && isFinite(cys)) ? 1 : 0;
        prj(wx + Rx * hwb, wy + Ry * hwb, wz + Rz * hwb); s.rax[i] = _px; s.ray[i] = _py;
        prj(wx - Rx * hwb, wy - Ry * hwb, wz - Rz * hwb); s.rbx[i] = _px; s.rby[i] = _py;
        prj(wx + Ux * hwb, wy + Uy * hwb, wz + Uz * hwb); s.uvx[i] = _px - cxs; s.uvy[i] = _py - cys;
        var ddx = s.rax[i] - cxs, ddy = s.ray[i] - cys;
        s.hw[i] = Math.sqrt(ddx * ddx + ddy * ddy);

        if (i === 0 || i === n - 1) {
          var F = i === 0 ? s.h3 : s.t3;
          F[0] = wx; F[1] = wy; F[2] = wz;
          F[3] = tx; F[4] = ty; F[5] = tz;
          F[6] = Rx; F[7] = Ry; F[8] = Rz;
          F[9] = Ux; F[10] = Uy; F[11] = Uz;
          if (i === n - 1) s.hbN = hwb;
        }
      }
      /* ══ HEAD_K — the skull is BIGGER THAN THE NECK ═══════════════════
         The cranium was built at exactly the neck's own half-width (0.98 of
         it at the widest cheek), so on a 34:1 tube the head was the same
         gauge as the body behind it and there was nothing for the eye to
         find: "no head identifiable", "a needle beak", "a glowing dot".
         Every serpent that reads as a serpent has a head 1.5-2x its neck.
         Scaled HERE rather than in _head, so the exact focal guard below
         (which measures the skull's reach off s.hb0) and the not-drawn floor
         both see the real size — widening the skull therefore makes the
         tile-clearance test STRICTER, never looser. */
      s.hb0 = BASE_HW * s.thick * PROF[0] * HEAD_K;

      /* ── the taper the eye reads. Perspective magnification cancels a
       *    board-space taper, so the silhouette is rescaled AFTER projection
       *    against the neck's own projected width. This is also where a sample
       *    that ran past the eye plane is tapered to nothing instead of
       *    SEVERING the run: the body flows out of frame rather than snapping. */
      var ref = s.hw[HEAD_EXT] || 1;
      for (i = 0; i < n; i++) {
        var tgt = (i < HEAD_EXT) ? HP[i] : DTG[i - HEAD_EXT];
        var gg = tgt * ref / (s.hw[i] || 1);
        if (gg < 0.10) gg = 0.10; else if (gg > 2.0) gg = 2.0;
        if (!s.ok[i]) gg = 0;
        s.rax[i] = s.px[i] + (s.rax[i] - s.px[i]) * gg;
        s.ray[i] = s.py[i] + (s.ray[i] - s.py[i]) * gg;
        s.rbx[i] = s.px[i] + (s.rbx[i] - s.px[i]) * gg;
        s.rby[i] = s.py[i] + (s.rby[i] - s.py[i]) * gg;
        s.uvx[i] *= gg; s.uvy[i] *= gg;
        var hh = s.hw[i] * gg;
        s.hw[i] = hh > 320 ? 320 : hh;
      }

      /* ── THE EXACT FOCAL GUARD — the guarantee, as opposed to the model.
         _probe's sweep predicts where the ribbon WILL be from a closed-form
         reading of the path; this is the ribbon as actually built, in screen
         px, on this frame. Every remaining burial was a case where the two
         disagreed — measured -21.5px of penetration by a tail station on a
         path the sweep had cleared — so the drawn geometry now gets the last
         word: any station whose half-width reaches the just-landed tile is
         narrowed until it does not. It reuses the eye-plane taper's own
         mechanism (scale the flanks and the fin toward the centreline), so a
         narrowed run flows instead of snapping, and the body reads as passing
         BEHIND the tile — which, on a bed the serpent straddles, is what it
         should look like anyway.
         The sweep stays: it is what keeps this from firing, and a path chosen
         to miss the tile looks better than a body pinched to miss it. */
      /* re-project the focal tile for THIS frame: FX.punch and FX.shake move
         the whole rig during a landing, and a guard disc pinned to the screen
         position captured at fly() time slides off the tile by 20-30px right
         when it is needed. Two prj calls a frame. */
      /* ── THE SKULL'S OWN SIZE CEILING ─────────────────────────────────
         MEASURED FIX (finding 2/5). The band loop and the KHW clamp bound the
         BODY's screen half-width; nothing bounded the head, which is built in
         board space off the h3 frame and scales with the raw perspective
         magnification. On a near pass it projected past 300 screen px across,
         and at that size every one of the skull's facets — cheek plate,
         underplane, horn ridge, mandible — is a 150px flat polygon. That is
         the "low-poly gem / glass shards" read: not the facet count, the facet
         SIZE. Held to a 150px radius, the same geometry reads as a skull. Four
         prj calls a frame, and it only ever fires on a near-camera pass. */
      if (s.hb0 > 0 && s.ok[0] && CAL.ok) {
        var HC = s.h3, hcb = s.hb0, hcv, hq2, hqx, hqy, hcR = 0;
        prj(HC[0], HC[1], HC[2]);
        var hcox = _px, hcoy = _py;
        for (hcv = 0; hcv < 12; hcv += 3) {
          prj(HC[0] + HC[3] * HV[hcv] * hcb + HC[6] * HV[hcv + 1] * hcb + HC[9] * HV[hcv + 2] * hcb,
              HC[1] + HC[4] * HV[hcv] * hcb + HC[7] * HV[hcv + 1] * hcb + HC[10] * HV[hcv + 2] * hcb,
              HC[2] + HC[5] * HV[hcv] * hcb + HC[8] * HV[hcv + 1] * hcb + HC[11] * HV[hcv + 2] * hcb);
          hqx = _px - hcox; hqy = _py - hcoy; hq2 = hqx * hqx + hqy * hqy;
          if (hq2 > hcR) hcR = hq2;
        }
        hcR = Math.sqrt(hcR);
        if (hcR > 150) {
          var hck = 150 / hcR;
          s.hb0 *= hck;
          for (i = 0; i <= HEAD_EXT; i++) s.hw[i] *= hck;
        }
      }
      if (s.fgbh > 0 && CAL.ok) {
        var fgrr = tileScreenR(s.fgbx, s.fgby, s.fgbh);
        s.fgx = FR_X; s.fgy = FR_Y; s.fgr = fgrr * 1.15;
      }
      if (s.fgr > 0) {
        /* pass 1 — how wide each station is ALLOWED to be. The widest ink a
           station puts down is not its hw: _draw's bloom fills the ribbon at
           1.28x the flank width and the wide halo at 1.56x, and _ridge raises
           the SERRATED CREST to 1.02x the up-vector with a 1.6px gold edge on
           top, so the bound is the larger of 2.70*hw and 1.52*|uv| — 2.70 because _studs' lateral FINS reach 2.60
           half-widths out from the flank, 37% past the old 1.90 bound, and on
           the summit that gap alone measured tile 30 at 0.66 opaque with every
           station otherwise inside its own allowance. Clamping
           to hw alone left the halo and the crest painting into the tile.
           MEASURED, this pass: at 1.30 the crest counted 0.62 of tile 22 as
           SOLID ink, because a serration is opaque where the old translucent
           sail was 0.72 — same reach, four times the alpha. */
        var fgN = s.fgr * 1.18;
        for (i = 0; i < n; i++) {
          GK[i] = 1;
          if (!s.ok[i]) continue;
          var gdx = s.px[i] - s.fgx, gdy = s.py[i] - s.fgy;
          var gd = Math.sqrt(gdx * gdx + gdy * gdy) - fgN;
          var uvm = Math.sqrt(s.uvx[i] * s.uvx[i] + s.uvy[i] * s.uvy[i]) * 1.52;
          var gw = s.hw[i] * 2.05; if (uvm > gw) gw = uvm;
          if (gd >= gw) continue;
          GK[i] = gd > 0 ? gd / (gw || 1) : 0;
        }
        /* NEVER CUT STATION 0. _draw only calls _head on a run that STARTS at
           station 0, so `GK[0] <= 0 -> ok[0] = 0` below did not narrow the
           head, it deleted it: the run began at station 1 and a wing or summit
           body flew as a headless green tarpaulin (the head is the only part
           of this animal that reads as an animal). The neck still narrows to
           a thread — the guard keeps its clamp — but the run stays whole and
           the skull is handled by its own guard below, which now shrinks it
           instead of dropping it. What lands on the tile regardless is taken
           off by _punch, which is total inside the quad. */
        if (GK[0] < 0.04) GK[0] = 0.04;
        /* pass 2 — apply. The sail takes the MINIMUM of its own station and
           the two ahead of it, because _ridge reads the up-vector LAGGED by
           two samples: clamping only station i left its sail being raised from
           station i-2's untouched uv. */
        for (i = 0; i < n; i++) {
          var kb = GK[i], ku = kb;
          if (i + 1 < n && GK[i + 1] < ku) ku = GK[i + 1];
          if (i + 2 < n && GK[i + 2] < ku) ku = GK[i + 2];
          if (kb < 1) {
            s.rax[i] = s.px[i] + (s.rax[i] - s.px[i]) * kb;
            s.ray[i] = s.py[i] + (s.ray[i] - s.py[i]) * kb;
            s.rbx[i] = s.px[i] + (s.rbx[i] - s.px[i]) * kb;
            s.rby[i] = s.py[i] + (s.rby[i] - s.py[i]) * kb;
            s.hw[i] *= kb;
          }
          if (ku < 1) { s.uvx[i] *= ku; s.uvy[i] *= ku; }
          /* AND CUT THE RUN. Pinching a station to zero width is not enough
             when its CENTRELINE is inside the tile: the ribbon polygon still
             runs from that zero-width vertex out to its wide neighbours, and
             that wedge is filled — measured 0.53 of tile 18's own quad still
             solid with three head stations clamped to hw = 0. Dropping ok[i]
             makes _draw end the run and start a new one after the tile, which
             is the same thing the eye-plane taper does: the body separates and
             reads as passing behind the tile instead of over it. */
          if (kb <= 0) s.ok[i] = 0;
        }
        /* THE SKULL IS NEITHER A STATION NOR SCALED BY hw. _head builds the
           cranium in BOARD space off the h3 frame with H3B = s.hb0, so every
           s.hw[] clamp above does nothing to it — measured 0.25-0.50 of the
           focal tile still fully opaque with every station clamped and the
           wake, the studs and the air wash all switched off, the nearest
           station 56-74px away with a 5px half-width. s.hb0 is the only knob
           that moves the skull, so that is the one the guard turns. Its reach
           is measured, not assumed: project the h3 origin and the three
           extreme head vertices (snout tip, both cheeks) and take the largest
           offset. Four prj calls once a frame. */
        var HF = s.h3, hb = s.hb0;
        if (hb > 0 && s.ok[0]) {
          prj(HF[0], HF[1], HF[2]);
          var hox = _px, hoy = _py, hR = 0, hv, hvx, hvy, hv2;
          for (hv = 0; hv < 12; hv += 3) {
            prj(HF[0] + HF[3] * HV[hv] * hb + HF[6] * HV[hv + 1] * hb + HF[9] * HV[hv + 2] * hb,
                HF[1] + HF[4] * HV[hv] * hb + HF[7] * HV[hv + 1] * hb + HF[10] * HV[hv + 2] * hb,
                HF[2] + HF[5] * HV[hv] * hb + HF[8] * HV[hv + 1] * hb + HF[11] * HV[hv + 2] * hb);
            hvx = _px - hox; hvy = _py - hoy; hv2 = hvx * hvx + hvy * hvy;
            if (hv2 > hR) hR = hv2;
          }
          hR = Math.sqrt(hR) * 1.10;
          var hdd = Math.sqrt((hox - s.fgx) * (hox - s.fgx) + (hoy - s.fgy) * (hoy - s.fgy)) - s.fgr;
          if (hdd < hR) {
            var hgk = hdd > 0 ? hdd / hR : 0;
            /* ══ A BODY IS NEVER DRAWN WITHOUT ITS HEAD ═══════════════════
               MEASURED FIX. This used to end `if (hgk <= 0 || s.hb0 < 8)
               s.ok[0] = 0` — drop the skull — and the interaction with _head,
               which floored its own scale at Math.max(8, s.hb0), made that
               the NORMAL outcome on the widest gestures: the wing and the
               summit are the bodies thick enough for the guard to want a
               sub-floor head, so the most expensive flybys on the board were
               precisely the ones that flew as opaque green tarpaulins.
               _head's floor is now 2 board units, so a small skull is drawn
               rather than skipped, the guard's clamp is honest all the way
               down, and hgk is floored at HGK_MIN. When the clearance wants
               the head smaller than that, THE WHOLE BODY shrinks by the same
               factor instead, so head and body stay one animal at one scale.
               Residual ink over the tile is _punch's job, and _punch is total
               inside the quad. */
            if (hgk < HGK_MIN) {
              hgk = HGK_MIN;
              for (i = HEAD_EXT + 1; i < n; i++) {
                s.rax[i] = s.px[i] + (s.rax[i] - s.px[i]) * hgk;
                s.ray[i] = s.py[i] + (s.ray[i] - s.py[i]) * hgk;
                s.rbx[i] = s.px[i] + (s.rbx[i] - s.px[i]) * hgk;
                s.rby[i] = s.py[i] + (s.rby[i] - s.py[i]) * hgk;
                s.uvx[i] *= hgk; s.uvy[i] *= hgk;
                s.hw[i] *= hgk;
              }
            }
            s.hb0 *= hgk;
            for (i = 0; i <= HEAD_EXT; i++) s.hw[i] *= hgk;
          }
        }
      }

      /* head screen velocity for the smear, normalised to a 16.7ms reference
         frame so the smear length is identical at 60 and 120Hz. */
      s.hx = s.px[0]; s.hy = s.py[0];
      if (hx0 || hy0) {
        var kv = dt > 0 ? 16.7 / dt : 1;
        s.vx = (s.hx - hx0) * kv; s.vy = (s.hy - hy0) * kv;
      }

      /* ozone wake: the head is sampled on a fixed 10ms cadence, so the trail
         is the same LENGTH at any refresh rate, and the sample sits on the
         CREST (0.4 of the up axis) so the wake trails off the ridge rather
         than through the middle of the body. */
      s.trGap += dt;
      if (s.trGap >= 10) {
        s.trGap = 0;
        var o = s.trI * 4;
        s.tr[o] = s.hx + s.uvx[0] * 0.4; s.tr[o + 1] = s.hy + s.uvy[0] * 0.4;
        s.tr[o + 2] = s.sz[0]; s.tr[o + 3] = 0;
        s.trI = (s.trI + 1) % TRAIL;
        if (s.trN < TRAIL) s.trN++;
      }
      for (i = 0; i < TRAIL; i++) s.tr[i * 4 + 3] += dt;
    },

    /* ── draw. The spine is split into contiguous runs by the sign of
     *    (z − bed top); each run goes to the layer that gives it the right
     *    occlusion, consecutive runs SHARE two indices so there is no seam
     *    where the body crosses the board plane, and the runs are DEPTH-SORTED
     *    before drawing so a projected self-crossing paints far-behind-near
     *    instead of last-wins. ─────────────────────────────────────────── */
    _draw: function (s) {
      var n = s.n, i, j, nr = 0, i0 = -1, front = false, wsg = 1;
      var RA = this._rA, RB = this._rB, RF = this._rF, RZ = this._rZ, RC = this._rC;
      var shN = 0;
      var MAXR = RA.length - 1;
      /* Cut the spine wherever it (a) crosses the tile-bed plane, (b) runs off
         the eye plane, or (c) has run CHUNK samples. (a) buys the depth
         straddle, (b) stops the body being SEVERED into a black pinched wedge
         at the near clamp — the run simply ends and the next one starts clean —
         and (c) is what lets a projected self-crossing occlude itself. Cuts at
         (a) and (c) share two indices with the next run, so the body is
         continuous across them. */
      for (i = 0; i < n; i++) {
        if (!s.ok[i] || !isFinite(s.px[i]) || !isFinite(s.py[i])) {
          if (i0 >= 0 && i - 1 > i0 && nr < MAXR) {
            RA[nr] = i0; RB[nr] = i - 1; RF[nr] = front ? 1 : 0; RC[nr] = shN; nr++;
          }
          i0 = -1; shN = 0; continue;
        }
        var f = s.sz[i] > Z_BED;
        if (i0 < 0) { i0 = i; front = f; wsg = wsign(s, i); shN = 0; continue; }
        if (f !== front || i - i0 >= CHUNK || wsign(s, i) !== wsg) {
          if (nr < MAXR) { RA[nr] = i0; RB[nr] = i; RF[nr] = front ? 1 : 0; RC[nr] = shN; nr++; }
          /* three shared samples on a CHUNK cut (two on a plane crossing,
             where the layers differ and an overlap would double-paint): the
             next chunk's own fill covers the previous one's boundary. */
          var i0n = (f === front && i - 2 > 0) ? i - 2 : i - 1;
          shN = (f === front) ? (i - i0n) : 0;
          i0 = i0n; front = f;
          wsg = wsign(s, i0);
        }
      }
      if (i0 >= 0 && n - 1 > i0 && nr < MAXR) {
        RA[nr] = i0; RB[nr] = n - 1; RF[nr] = front ? 1 : 0; RC[nr] = shN; nr++;
      }
      if (!nr) return;
      for (i = 0; i < nr; i++) {
        var sm = 0;
        for (j = RA[i]; j <= RB[i]; j++) sm += s.sz[j];
        RZ[i] = sm / (RB[i] - RA[i] + 1);
      }
      /* insertion sort, far (low z) first, so near paints over far. */
      for (i = 1; i < nr; i++) {
        var za = RZ[i], aa = RA[i], ab = RB[i], af = RF[i], ac = RC[i];
        for (j = i - 1; j >= 0 && RZ[j] > za; j--) {
          RZ[j + 1] = RZ[j]; RA[j + 1] = RA[j]; RB[j + 1] = RB[j];
          RF[j + 1] = RF[j]; RC[j + 1] = RC[j];
        }
        RZ[j + 1] = za; RA[j + 1] = aa; RB[j + 1] = ab; RF[j + 1] = af; RC[j + 1] = ac;
      }
      this._nr = nr;
      this._air(s, RA, RB, RF, nr);
      for (i = 0; i < nr; i++) this._run(s, RA[i], RB[i], RF[i] === 1, RC[i]);
      /* fins and gold ride the SPINE, not the run: chunking used to drop any
         station that straddled a cut, which is why fins were "inconsistently
         present". Each station picks its own layer from its own depth. */
      this._studs(s);
      this._trail(s);
      this._wash(s);
    },

    /* ── _air(): the ozone bloom and the motion smear, ONCE per layer ─────
     *  One path over every run on that layer, one fill. Overlaps union under
     *  nonzero winding instead of stacking, so the body has one soft boundary
     *  rather than one hard boundary per chunk — see the note in _run. */
    _air: function (s, RA, RB, RF, nr) {
      var al = s.fade; if (al <= 0.012) return;
      var q = this._q, gI = 0.55 + 0.45 * this._int, i, k, a, b, n = s.n;
      var hmax = 0;
      for (i = 0; i < n; i++) if (s.ok[i] && s.hw[i] > hmax) hmax = s.hw[i];
      var blur = BLUR_LADDER[q];
      var moving = (s.vx * s.vx + s.vy * s.vy) > 484;
      /* the smear offset is capped at 14px total: a smear reads as speed from
         its gradient, not its reach, and an uncapped one escaped the focal
         guard by up to 90px. */
      var svx = s.vx * 0.030, svy = s.vy * 0.030;
      var svl = Math.sqrt(svx * svx + svy * svy) * (blur || 1);
      if (svl > 14) { var svk = 14 / svl; svx *= svk; svy *= svk; }
      var a2 = Math.ceil((n - 1) * 0.20);      /* nose stays crisp */
      for (k = 0; k < 2; k++) {
        var c = k ? this._fctx : this._bctx, any = 0, j;
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = C_GLOW;
        c.beginPath();
        for (i = 0; i < nr; i++) {
          if ((RF[i] === 1 ? 1 : 0) !== k) continue;
          a = RA[i]; b = RB[i];
          /* a run _run() had to GROW gets the bloom grown with it, or the
             glow breaks where the body does not. */
          if (b - a < 2) { if (a > 0) a--; else if (b < n - 1) b++; }
          if (b - a < 2) continue;
          edge(s, a, b, 1.12, 0.02, 0); emit(c, a, b, 0, 1);
          edge(s, a, b, 1.12, 0.02, 1); emit(c, a, b, 1, 0);
          c.closePath(); any = 1;
        }
        if (any) {
          c.globalAlpha = 0.100 * al * gI; c.fill();
          if (q >= 2 && hmax < 96) {
            c.beginPath();
            for (i = 0; i < nr; i++) {
              if ((RF[i] === 1 ? 1 : 0) !== k) continue;
              a = RA[i]; b = RB[i];
              if (b - a < 2) { if (a > 0) a--; else if (b < n - 1) b++; }
              if (b - a < 2) continue;
              edge(s, a, b, 1.30, 0.02, 0); emit(c, a, b, 0, 1);
              edge(s, a, b, 1.30, 0.02, 1); emit(c, a, b, 1, 0);
              c.closePath();
            }
            c.globalAlpha = 0.042 * al * gI; c.fill();
          }
          if (blur > 0 && moving) {
            c.fillStyle = C_EMER;
            for (j = blur; j >= 1; j--) {
              c.save();
              c.translate(-svx * j, -svy * j);
              c.beginPath();
              var drewS = 0;
              for (i = 0; i < nr; i++) {
                if ((RF[i] === 1 ? 1 : 0) !== k) continue;
                a = RA[i] > a2 ? RA[i] : a2; b = RB[i]; if (b - a < 2) continue;
                edge(s, a, b, 0.96, 0.02, 0); emit(c, a, b, 0, 1);
                edge(s, a, b, 0.96, 0.02, 1); emit(c, a, b, 1, 0);
                c.closePath(); drewS = 1;
              }
              if (drewS) { c.globalAlpha = al * 0.060 / Math.sqrt(j); c.fill(); }
              c.restore();
            }
          }
        }
        c.globalCompositeOperation = 'source-over';
        c.globalAlpha = 1;
      }
    },

    _run: function (s, a, b, front, shared) {
      /* ARTIFACT FIX. A run of two samples is, geometrically, a QUAD — one
         cross-section chord to the next — and _ribbon fills it and then strokes
         its rim in C_RIM cyan at 3.2px. That is a hard-edged cyan rectangle
         stuck on the body, and the run splitter can produce one wherever two
         cuts land within two samples.
         BLOCKER FIX — it used to `return`, which does not hide the quad, it
         DELETES up to two stations of body and leaves a hole. That is the
         "beaded chain of unjoined lozenges near the head" and the "detached
         shard floating clear of the body" the magnified crops found: the
         shard is the run after the gap. The run is now GROWN to three
         stations instead of dropped, borrowing from whichever neighbour has a
         projectable station to lend; only a run that cannot reach three at
         all is skipped, and by then its neighbours have covered it. */
      var n = s.n, i, nb = n - HEAD_EXT;
      if (b - a < 2) {
        while (b - a < 2) {
          if (a > 0 && s.ok[a - 1] && isFinite(s.px[a - 1])) { a--; if (shared) shared--; }
          else if (b < n - 1 && s.ok[b + 1] && isFinite(s.px[b + 1])) b++;
          else return;
        }
      }
      /* the shared head of the run belongs to the run in front of it: its
         fill covers the cut, but an ADDITIVE stroke over the same stations
         doubles the specular and steps the value at every chunk boundary. */
      var sa = a + (shared || 0); if (sa > b - 1) sa = b - 1; if (sa < a) sa = a;
      var c = front ? this._fctx : this._bctx;
      var D = front ? dF : dB;
      var dpr = this._dpr, q = this._q;

      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, hmax = 0;
      for (i = a; i <= b; i++) {
        if (!isFinite(s.px[i]) || !isFinite(s.py[i])) return;
        if (s.hw[i] > hmax) hmax = s.hw[i];
      }
      var m = hmax * 2.2 + 60;
      for (i = a; i <= b; i++) {
        var xx = s.px[i], yy = s.py[i];
        if (xx - m < x0) x0 = xx - m;
        if (xx + m > x1) x1 = xx + m;
        if (yy - m < y0) y0 = yy - m;
        if (yy + m > y1) y1 = yy + m;
      }
      var W = this._w, H = this._h;
      if (x1 < -80 || y1 < -80 || x0 > W + 80 || y0 > H + 80) return;
      D.add(x0 < 0 ? 0 : x0, y0 < 0 ? 0 : y0, x1 > W ? W : x1, y1 > H ? H : y1);

      /* under the bed it is seen through the storm's own haze. 0.94, not 0.85:
         at 0.85 you could see the board through the deep half of the body, and
         a creature you can see through is sheeting, not an animal. */
      /* 1.00, not 0.94. "The far wall of the tube is visible through the near
         wall" and "dark green translucent tarps": a body you can see through
         at ALL is sheeting, and 6% of a bright board behind a dark flank is
         plenty to read as translucency once the frame is magnified. The deep
         half is already darkened by its own gradient and by the tile bed in
         front of it; it does not also need to be transparent. */
      var al = s.fade;
      if (al <= 0.012) return;
      var gI = 0.55 + 0.45 * this._int;

      c.lineCap = 'butt'; c.lineJoin = 'round';

      /* 1+2 — the ozone bloom and the motion smear USED TO LIVE HERE, once
             per run. That is the whole of "hard-edged flat quads", "stacked
             translucent slabs" and "the far wall of the tube visible through
             the near wall", and it is arithmetic, not taste: both passes are
             ADDITIVE ribbon FILLS — hard-edged polygons — and consecutive runs
             deliberately share three stations, so every overlap region got the
             pass twice. At CHUNK 7 that is ~7 bloom polygons and ~28 smear
             polygons per body, each with its own hard boundary, summing to
             0.5-0.7 of additive alpha in the overlaps. Magnified, that is
             exactly the khaki parallelogram over the mint parallelogram over
             the blown-white slab that the native-resolution crops keep
             finding, and no per-pass alpha tuning fixes a stack of seven.
             They are now drawn ONCE per layer for the whole spine, as a
             single path with one fill (see _air): nonzero winding makes the
             union, so overlap counts once, there is one silhouette boundary
             instead of seven, and the fill count drops from ~35 to 6. */
      /* and the mode is asserted HERE, not inherited. _run leaves the context
         in 'lighter' after its rim pass, so every run after the first was
         filling its body ADDITIVELY over the one in front of it — a
         see-through tube, a washed mint flank and a khaki overlap wherever
         two runs met. Two assignments, and the body is opaque again. */
      c.globalCompositeOperation = 'source-over';
      /* 3 — the body, in ONE gradient fill across the cross-section. Four
             stacked flat ribbons gave concentric hard-edged bands with the
             bright line down the CENTRE: licorice, not a lit tube. */
      var mi = (a + b) >> 1;
      var da = (s.rax[mi] - s.px[mi]) * LX + (s.ray[mi] - s.py[mi]) * LY;
      var sx, sy, lx, ly;
      if (da >= 0) { lx = s.rax[mi]; ly = s.ray[mi]; sx = s.rbx[mi]; sy = s.rby[mi]; }
      else { lx = s.rbx[mi]; ly = s.rby[mi]; sx = s.rax[mi]; sy = s.ray[mi]; }
      var gx0 = s.px[mi] + (sx - s.px[mi]) * 1.06, gy0 = s.py[mi] + (sy - s.py[mi]) * 1.06;
      var gdx = s.px[mi] + (lx - s.px[mi]) * 1.06 - gx0;
      var gdy = s.py[mi] + (ly - s.py[mi]) * 1.06 - gy0;
      if (!(gdx * gdx + gdy * gdy > 1)) { gdx = 1; gdy = 0; }
      this._ribbon(c, s, a, b, 0.99, 0.0);
      c.globalAlpha = al;
      c.fillStyle = front ? this._gbF : this._gbB;
      c.setTransform(dpr * gdx, dpr * gdy, -dpr * gdy, dpr * gdx, dpr * gx0, dpr * gy0);
      c.fill();
      c.setTransform(dpr, 0, 0, dpr, 0, 0);

      /* 3b — VENTRAL SCUTE BAND. A dark stroke inboard of the shadow-side
              silhouette. A gradient alone reads as vinyl tubing; a tube with
              one hard dark band along its underside reads as a belly. Paired
              with the gold ribs in _studs, this is the whole material claim —
              two cues, both of which survive a 60px body. */
      c.globalAlpha = al * 0.62; c.strokeStyle = C_BELLY;
      /* the 9px cap made the belly band vanish on any near-camera pass; a
         belly is a fraction of the body, not a fixed number of pixels. */
      c.lineWidth = Math.max(2.2, Math.min(22, hmax * 0.16));
      c.beginPath();
      if (da >= 0) { edge(s, sa, b, 0.78, 0, 1); } else { edge(s, sa, b, 0.78, 0, 0); }
      emit(c, sa, b, 0, 1); c.stroke();

      /* 4 — the dorsal sail, ONE continuous ridge whose height is a half-sine
             along the body, so it is always attached and foreshortens with the
             roll. Its crest carries the gold. */
      if (q >= 1) this._ridge(c, s, a, b, al, gI);

      /* 5 — light: a cold rim on the SHADOW edge (backlight off the
             thunderhead, tinted 35% toward the landing player's emblem), a
             crisp additive line on the lit edge, and facets that only flash
             when their own up axis actually faces the light. */
      /* alphas roughly doubled from the first cut: on a re-encoded phone video
         87% of the body measured dark-on-dark, and a 0.24 rim on a near-black
         flank is the first thing a bitrate ladder throws away. The rim also
         carries the winning player's emblem colour at 60%. */
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = al * 0.44 * gI;
      c.strokeStyle = s.rim; c.lineWidth = 3.2;
      c.beginPath();
      if (da >= 0) { edge(s, sa, b, 0.95, 0, 1); } else { edge(s, sa, b, 0.95, 0, 0); }
      emit(c, sa, b, 0, 1); c.stroke();
      c.globalAlpha = al * 0.58 * gI;
      c.strokeStyle = C_LIT; c.lineWidth = 2.0;
      c.beginPath();
      if (da >= 0) { edge(s, sa, b, 0.95, 0, 0); } else { edge(s, sa, b, 0.95, 0, 1); }
      emit(c, sa, b, 0, 1); c.stroke();
      if (q >= 2) {
        /* emerald facets: cross-section chords that only fire where the tube's
           own up axis faces the aurora, so they read as plate edges catching
           the light rather than as stripes painted on a hose. */
        c.globalAlpha = al * 0.18 * gI;
        c.strokeStyle = C_FACET; c.lineWidth = 1.3;
        c.beginPath();
        /* start past the snout: these chords over the HEAD's cross-sections
           painted one flat hexagonal cyan panel on the cheek that read as a
           pane of glass stuck to the skull. The skull does its own light. */
        for (i = (sa > HEAD_EXT ? sa : HEAD_EXT + 1); i <= b; i += 3) {
          if (s.uvy[i] > -0.5 * s.hw[i]) continue;
          c.moveTo(s.px[i] + (s.rax[i] - s.px[i]) * 0.90, s.py[i] + (s.ray[i] - s.py[i]) * 0.90);
          c.lineTo(s.px[i] + (s.rbx[i] - s.px[i]) * 0.90, s.py[i] + (s.rby[i] - s.py[i]) * 0.90);
        }
        c.stroke();
      }

      /* 6 — head and tail, each only on the run that actually owns its end.
             Mode reset first: the rim/facet pass above leaves 'lighter', and
             an additively-filled cranium is a glass shard, not a skull. */
      c.globalCompositeOperation = 'source-over';
      if (a === 0 && s.ok[0]) this._head(c, s, al, gI, front);
      if (b === n - 1 && s.ok[n - 1]) this._tail(c, s, al, gI);
      c.globalAlpha = 1;
    },

    /* the ribbon: centre line offset toward the rolled-up axis by offU, at
       width scale w. Plain moveTo/quadratic — no Path2D, no allocation. */
    _ribbon: function (c, s, a, b, w, offU) {
      c.beginPath();
      edge(s, a, b, w, offU, 0); emit(c, a, b, 0, 1);
      edge(s, a, b, w, offU, 1); emit(c, a, b, 1, 0);
      c.closePath();
    },

    /* ── THE DORSAL LINE. ═══════════════════════════════════════════════
     *  BLOCKER FIX, and the single biggest one in this pass. The dorsal SAIL
     *  was a translucent membrane reaching 1.25 half-widths above the spine
     *  along the ENTIRE body, filled flat at alpha 0.90 and 0.72. At a 60px
     *  shoulder that slab is the largest single shape in frame, it has hard
     *  polygon edges, and you can see the board through it — which is, in
     *  order, "flat hard-edged facets", "visible quad artifacts", "no
     *  material" and the summit's "reads as shattered glass, not three
     *  serpents". Three serpents each dragging a translucent pane over the
     *  board IS shattered glass. Magnified, it was the only thing on screen.
     *
     *  It is replaced by two things that cannot become a pane:
     *    1  a LOW opaque keel (max 0.36 half-widths) — the ridge of the back,
     *    2  a SERRATED CREST of discrete, separated, opaque swept spines with
     *       a gold leading edge — the repeating rhythm the material brief
     *       asks for, delivered as anatomy rather than as a decal, and it
     *       reads at 50px precisely because the gaps between the spines are
     *       as legible as the spines.
     *  Net fill area is down roughly 70% on the largest shape in the scene,
     *  which the Adreno budget also likes. */
    _ridge: function (c, s, a, b, al, gI) {
      var nb = s.n - HEAD_EXT, i, ki, hgt;
      c.beginPath();
      for (i = a; i <= b; i++) {
        ki = i <= HEAD_EXT ? 0 : (i - HEAD_EXT) / (nb - 1);
        hgt = 0.13 + 0.23 * Math.sin(Math.PI * Math.min(1, ki * 1.12));
        TX[i] = s.px[i] + s.uvx[i] * hgt; TY[i] = s.py[i] + s.uvy[i] * hgt;
      }
      emit(c, a, b, 0, 1);
      for (i = b; i >= a; i--) { TX[i] = s.px[i] + s.uvx[i] * 0.02; TY[i] = s.py[i] + s.uvy[i] * 0.02; }
      emit(c, a, b, 1, 0);
      c.closePath();
      /* OPAQUE on purpose: a keel you can see the board through is sheeting. */
      c.globalAlpha = al * 0.97; c.fillStyle = 'rgb(8,46,35)'; c.fill();
      /* its lit top edge, so the back has a direction */
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = al * 0.34 * gI; c.strokeStyle = C_EMER; c.lineWidth = 1.4;
      c.beginPath();
      for (i = a; i <= b; i++) {
        ki = i <= HEAD_EXT ? 0 : (i - HEAD_EXT) / (nb - 1);
        hgt = 0.13 + 0.23 * Math.sin(Math.PI * Math.min(1, ki * 1.12));
        TX[i] = s.px[i] + s.uvx[i] * hgt; TY[i] = s.py[i] + s.uvy[i] * hgt;
      }
      emit(c, a, b, 0, 1); c.stroke();
      c.globalCompositeOperation = 'source-over';

      /* the serration. Every second station gets one spine, so the row is a
         countable rhythm rather than a comb, and each is its own closed
         triangle: three vertices, no shared edge, no pane. */
      /* ══ THE SCUTE RHYTHM IS ABSOLUTE, NOT PER-RUN ═══════════════════
         MEASURED FIX. The row stepped `i += 2` from the RUN's own first
         station, so every depth cut re-phased it and a serration straddling
         a cut was dropped outright — magnified, "3-5 irregular transverse
         ribs over a smooth cylinder", which is what the crops kept finding
         instead of plating. Anchoring the parity to the absolute index makes
         one continuous rhythm along the whole spine whatever the run
         splitter does with it. One line. */
      var drew = 0, s0 = a > HEAD_EXT ? a : HEAD_EXT;
      if ((s0 - HEAD_EXT) & 1) s0++;
      c.beginPath();
      for (i = s0; i + 2 <= b; i += 2) {
        if (!s.ok[i] || !s.ok[i + 2]) continue;
        ki = (i - HEAD_EXT) / (nb - 1); if (ki < 0) ki = 0;

              which is exactly why it read as "an eyeball decal on a cone": a

              source-over passes fix the missing axis —
                (i)  a dark underplane from the muzzle back along the shadow
                     flank and under the cheek, which is what separates the
                     jawline from the cranium, and
                (ii) a soft additive dome highlight on the parietal, which is
                     what makes the cranium read as a BALL behind the brow.
              Both are keyed off `side` (the near flank) and LX/LY, so they
              track the storm's own key light rather than being painted on. */
      if (side_on) {
        c.globalAlpha = al * 0.46; c.fillStyle = 'rgb(5,22,18)';
        c.beginPath();
        h3(c, 1.96, 0.10 * side, -0.02, 1);
        h3(c, 1.60, 0.30 * side, -0.06);
        h3(c, 0.72, 0.58 * side, -0.02);
        h3(c, -0.30, 0.82 * side, 0.10);
        h3(c, -1.10, 0.62 * side, 0.06);
        h3(c, -1.66, 0.36 * side, 0.06);
        h3(c, -1.66, 0.10 * side, 0.20);
        h3(c, -0.40, 0.44 * side, 0.30);
        h3(c, 0.70, 0.30 * side, 0.20);
        h3(c, 1.72, 0.14 * side, 0.10);
        c.closePath(); c.fill();
      }

      /* 2c — THE MOUTH. Drawn source-over, 2.6px, dark, from the snout vertex
              along the jaw to the hinge. At 3-5x magnification the old head was
              "a smooth tapering wedge with no jaw line, no mouth, no cheek" —
              every part existed in the geometry and none of it was separable
              from the body it sat on. One dark seam is what says "this thing
              can bite", and 2.6px survives a 60px head on a bitrate ladder. */
      if (side_on) {
        c.globalAlpha = al * 0.88; c.strokeStyle = C_BELLY;
        c.lineWidth = Math.max(2.0, Math.min(5.5, hs * 0.20));
        c.lineJoin = 'round';
        c.beginPath();
        h3(c, 2.02, 0.00, -0.10 - jw * 1.10, 1);
        h3(c, 1.52, 0.24 * side, -0.14 - jw * 0.82);
        h3(c, 0.62, 0.46 * side, -0.18 - jw * 0.48);
        h3(c, -0.36, 0.62 * side, -0.06 - jw * 0.18);
        h3(c, -1.00, 0.68 * side, 0.02);
        c.stroke();
      }

      /* 2d — CHEEK PLATES. A flat gold pair sweeping back off the widest
              cheek vertices and OUT past the cranium silhouette, so the head
              has a landmark shape rather than one smooth taper. Flat fill on
              purpose: source-over gold reads as plate, additive gold reads as
              a flare. This is the feature that was simply absent. */
      /* BLOCKER FIX — "visible quad artifacts", "flat hard-edged facets". Every
         one of these appendages used to reach OUTSIDE the cranium silhouette
         (the cheek plate to r=1.52 against a cranium of 0.98, the horn to
         u=1.86) as a flat polygon with a hard rim, and a magnified head was
         therefore a pile of shards with a skull somewhere inside it. Both are
         now INBOARD of the silhouette and read as surface relief on the head
         rather than as separate plates flying beside it — the cheek is a plate
         ON the cheek, and the horn is a low swept ridge, not a sail. */
      if (side_on && hs >= 6) {
        /* ══ THE CHEEK IS A VALUE BREAK, NOT A GOLD PLATE ═══════════════
           BLOCKER FIX. Two axis-aligned gold quads swept off the cheek
           vertices are the "gold rectangles glued on" and the "two gold
           squares mid-body" that four separate head crops found: a
           four-vertex flat fill with a hard rim is a plate whatever its
           alpha, and there is no gold anywhere on a skull that reads as
           anatomy at 50px. What a cheek actually is, is a VALUE STEP where
           the masseter mass turns away from the light — so it is drawn as
           one, a dark quadratic sweep from the jaw hinge forward under the
           orbit, on the shadow flank only, with no boundary of its own on
           the lit side. Cheaper than the plate it replaces: one path, one
           fill, no stroke. */
        c.globalAlpha = al * 0.52; c.fillStyle = 'rgb(6,26,21)';
        c.beginPath();
        h3(c, 0.74, 0.56 * -side, 0.10, 1);
        h3(c, 0.04, 0.86 * -side, 0.16);
        h3(c, -0.72, 0.82 * -side, 0.10);
        h3(c, -1.28, 0.56 * -side, 0.06);
        h3(c, -1.10, 0.40 * -side, -0.14);
        h3(c, -0.20, 0.54 * -side, -0.18);
        h3(c, 0.66, 0.36 * -side, -0.06);
        c.closePath(); c.fill();
        /* ── THE MUZZLE BREAK. The single reason four crops in a row read
           "one large flat mint plane bounded by straight chords": the skull
           is ONE silhouette with ONE gradient, so there is no value step
           anywhere along its length and the brow does not exist as a form.
           The muzzle is now its own mass — a lighter bone value over the
           snout, ending in a hard boundary at the muzzle break just ahead of
           the orbit, so the head breaks into cranium / muzzle / mandible and
           the silhouette has a brow. Inboard of the cranium path by 0.06 all
           round, so it can never read as a plate flying beside the head. */
        c.globalAlpha = al * 0.72; c.fillStyle = 'rgb(34,104,79)';
        c.beginPath();
        h3(c, 1.98, 0.16, 0.06, 1);
        h3(c, 1.66, 0.32, 0.17);
        h3(c, 1.04, 0.56, 0.36);
        h3(c, 0.66, 0.62, 0.44);
        h3(c, 0.62, 0.30, 0.14);
        h3(c, 0.66, -0.30, 0.14);
        h3(c, 0.66, -0.62, 0.44);
        h3(c, 1.04, -0.56, 0.36);
        h3(c, 1.66, -0.32, 0.17);
        h3(c, 1.98, -0.16, 0.06);
        c.closePath(); c.fill();
        /* the break itself: a dark seam across the top of the muzzle where
           the nasal bridge meets the brow. This is the line that makes the
           brow a brow. */
        c.globalAlpha = al * 0.80; c.strokeStyle = 'rgb(4,18,14)';
        c.lineWidth = Math.max(1.6, hs * 0.11);
        c.beginPath();
        h3(c, 0.68, 0.60, 0.44, 1);
        h3(c, 0.62, 0.16, 0.20);
        h3(c, 0.68, -0.60, 0.44);
        c.stroke();
        /* the NOSTRIL — one dark notch on the near flank of the muzzle. Two
           pixels of intent, and the muzzle stops being a wedge. */
        if (hs >= 10) {
          h3p(1.72, 0.30 * side, 0.16);
          c.globalAlpha = al * 0.82; c.fillStyle = 'rgb(3,14,11)';
          c.beginPath(); c.arc(_px, _py, Math.max(1.1, hs * 0.075), 0, TAU); c.fill();
        }

        /* 2e — HORN RIDGES. A low swept pair off the brow, kept under u=1.05
                so they read as the skull's own crest rather than as two flat
                sails standing off it. Source-over plate, gold leading edge. */
        c.beginPath();
        h3(c, 0.30, 0.50, 0.62, 1);
        h3(c, -0.86, 0.66, 1.02);
        h3(c, -1.52, 0.52, 0.74);
        h3(c, -0.52, 0.44, 0.46);
        c.closePath();
        h3(c, 0.30, -0.50, 0.62, 1);
        h3(c, -0.86, -0.66, 1.02);
        h3(c, -1.52, -0.52, 0.74);
        h3(c, -0.52, -0.44, 0.46);
        c.closePath();
        c.globalAlpha = al * 0.94; c.fillStyle = 'rgb(11,56,42)'; c.fill();
        c.globalAlpha = al * 0.44; c.strokeStyle = 'rgb(178,138,38)';
        c.lineWidth = Math.max(1.0, hs * 0.045); c.stroke();
      }

      c.globalCompositeOperation = 'lighter';
      /* 2b — a lit ridge along the NEAR upper silhouette. Without it the skull
              is a matte wedge against a matte sky at broadcast size: this is
              the line that says "bone catching the aurora" and it is the single
              cheapest thing that makes the head read at 50px. */
      c.globalAlpha = al * 0.30 * gI; c.strokeStyle = C_LIT; c.lineWidth = 1.7;
      c.beginPath();
      h3(c, 2.02, 0.19 * side, 0.07, 1);
      h3(c, 1.70, 0.38 * side, 0.19); h3(c, 1.06, 0.66 * side, 0.40);
      h3(c, 0.36, 0.92 * side, 0.64); h3(c, -0.22, 1.00 * side, 0.56);
      h3(c, -0.96, 0.76 * side, 0.34); h3(c, -1.72, 0.44 * side, 0.24);
      c.stroke();
      /* 2f — PARIETAL DOME. The one additive lobe on the cranium's own upper
              lit quadrant, behind the brow. Without a highlight that sits
              BEHIND the eye, the brightest thing on the head is the eye and
              the cranium behind it reads as flat backdrop. */
      /* the parietal lobe used to be drawn here as a flat additive disc with a
         hard rim. The radial FORM gradient above is the dome now, and two
         highlights describing one surface is exactly how a shaded head turns
         back into a decal — so the disc is deleted, not retuned. */
      /* 3 — gold brow ridge, running from the nose vertex back over the eye */
      /* 0.48, not 0.80: additive gold over an already-lit crest blew out to a
         white spear at near-camera scale. */
      /* the specular that used to live on the head was a flat cyan facet; the
         highlight a skull actually gets is a small one, on the brow. */
      if (side_on && hs >= 8) {
        h3(c, 0.50, 0.54 * side, 0.60, 1);
        var bhx = _px, bhy = _py;
        c.globalAlpha = al * 0.15 * gI; c.fillStyle = C_LIT;
        c.beginPath(); c.arc(bhx, bhy, Math.max(1.4, hs * 0.11), 0, TAU); c.fill();
      }
      /* 0.24, not 0.48: an ADDITIVE gold polygon the length of the whole snout
         is a flare, and at a 48px shoulder it measured as a pale hard-edged
         streak lying across the muzzle. This is a nasal keel, not a light. */
      /* SOURCE-OVER. An additive gold polygon down the whole snout blows to
         paper-white over the already-lit muzzle — measured as "a hard-edged
         blown-white rectangle with thin black arcs over it", the arcs being
         the mouth line showing through. A nasal keel is bone: it takes the
         light, it does not emit it. */
      /* NARROWER, AND IT STOPS AT THE MUZZLE BREAK. 0.18 of a skull
         half-width down the whole length, in struck gold at 0.52, measured as
         a pale hard-edged streak lying across the muzzle — one of the "gold
         pinstripes" that a 50px head resolves as noise. A keel is a RIDGE:
         0.085 wide, dark bone rather than gold, running only the snout, with
         a single 1.4px lit line along its crest doing the reading. */
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = al * 0.62; c.fillStyle = 'rgb(16,62,48)';
      c.beginPath();
      h3(c, 1.96, 0.000, 0.05, 1);
      h3(c, 1.30, 0.075, 0.30); h3(c, 0.72, 0.085, 0.48);
      h3(c, 0.72, -0.085, 0.48); h3(c, 1.30, -0.075, 0.30);
      c.closePath(); c.fill();
      if (hs >= 8) {
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = al * 0.34 * gI; c.strokeStyle = C_LIT; c.lineWidth = 1.4;
        c.beginPath();
        h3(c, 1.96, 0.000, 0.06, 1);
        h3(c, 1.30, 0.000, 0.31); h3(c, 0.72, 0.000, 0.49);
        c.stroke();
        c.globalCompositeOperation = 'source-over';
      }

      /* 4 — THE TEETH, where the crest blades used to be.
             The blades are deleted, not retuned. Two flat triangles reaching
             two skull-lengths behind the head, filled dark and edged in
             additive gold, are exactly the "scatter of hard-edged dark blades
             and gold pinstripes" and the "detached shard floating clear of
             the body" that every head crop found — and they were doing the
             job a crest does (say which end is the head) that the brow, the
             muzzle break and the orbit now do properly.
             What the mouth was missing instead is teeth. Four on the upper
             jaw, pointing down along the mouth line, drawn in the same bone
             value as the muzzle so they read as part of the skull rather than
             as white confetti. This is the cue that survives 30px: a jaw with
             points on it cannot be mistaken for a cone. */
      if (side_on && hs >= 9) {
        var tf, tth = 0.13 + 0.10 * jw;
        c.globalAlpha = al * 0.94; c.fillStyle = 'rgb(216,240,228)';
        c.beginPath();
        for (tf = 0; tf < 4; tf++) {
          var tfx = 1.72 - tf * 0.44, tfr = 0.24 + tf * 0.10;
          var tfu = -0.09 - jw * (0.95 - tf * 0.15);
          var tsz = 0.20 - tf * 0.025;
          h3(c, tfx + tsz, tfr * side, tfu, 1);
          h3(c, tfx - tsz, tfr * side, tfu);
          h3(c, tfx, tfr * side, tfu - tth);
          c.closePath();
        }
        c.fill();
        /* and the shadow they cast into the mouth, so they sit ON the jaw
           rather than floating in front of it */
        c.globalAlpha = al * 0.50; c.strokeStyle = 'rgb(4,16,12)';
        c.lineWidth = Math.max(0.8, hs * 0.035); c.stroke();
      }

      /* 5 — ONE eye, the near one, SET IN the skull: socket, glow, slit, rim. */
      if (hs >= 9) {
        /* 0.26, not 0.46: at 0.46 the socket's orange bloom sat on the snout
           TIP and read as a hot spot on the nose rather than as an eye behind
           the brow ridge. */
        /* f 0.34 / u 0.20, not f 0.16 / u 0.42: at u=0.42 the socket sat at
           the same height as the brow shelf that is supposed to overhang it,
           so on a rolled head the eye ended up ON the upper silhouette or
           below the lower one — magnified, it looked like a gold ring stuck to
           the jaw. 0.20 puts it squarely UNDER the brow, which is where the
           shelf's own shadow lands. */
        /* f 0.42 / u 0.26: squarely UNDER the brow shelf and just behind the
           muzzle break, which on the reshaped skull is where an eye goes. */
        h3p(0.42, 0.70 * side, 0.26);
        /* head-on, the skull is foreshortened to a disc and an opaque socket
           the size of the whole face reads as one giant iris — so the recess
           and the pupil only exist while the head is anywhere near profile. */
        /* 0.22 / 0.13, not 0.30 / 0.17. The orbit is er*1.10 scaled 1.75 in
           the fore-aft axis, so at 0.30 of the skull's half-width the socket
           spanned most of the visible face — "a low-poly gem with a giant
           anime eye". A predator's orbit is roughly a fifth of the skull. */
        var ex = _px, ey = _py, er = Math.max(3, hs * (side_on ? 0.22 : 0.13));
        if (side_on) {
          /* ══ THE SOCKET IS A CAVITY ═══════════════════════════════════════
             Verdict three rounds running: "a glowing dot for an eye", "an
             eyeball decal". The previous build DID draw a socket — a ring 26%
             wider than the sclera, which at a 20px head is two pixels of dark
             and reads as an outline, not as a recess. What makes an eye sit IN
             a skull is (a) an ORBIT bigger than the eye, so unlit socket floor
             shows all round it, (b) a BROW that physically overhangs it, and
             (c) the brow's cast shadow across the eye's own upper third.
             All three are built here, in the skull's 3D frame, before one
             pixel of iris is drawn. */
          /* the orbit: a deep hollow, 1.9x the eye and elongated fore-aft
             along the body's own right axis, so the recess foreshortens with
             the head instead of staying a circle. */
          c.globalCompositeOperation = 'source-over';
          c.save();
          c.translate(ex, ey);
          c.rotate(Math.atan2(s.uvy[0], s.uvx[0]));
          c.scale(1, 1.75);
          c.globalAlpha = al * 0.95; c.fillStyle = 'rgb(3,13,11)';
          c.beginPath(); c.arc(0, 0, er * 1.10, 0, TAU); c.fill();
          /* socket floor: a touch of bounce so the hollow has depth rather
             than being a hole punched in the head */
          c.globalAlpha = al * 0.55; c.fillStyle = 'rgb(14,46,36)';
          c.beginPath(); c.arc(er * 0.16, er * 0.22, er * 0.82, 0, TAU); c.fill();
          c.restore();
          /* THE BROW that does the overhanging: an opaque shelf in the skull's
             own lit value, springing off the brow-ridge vertex and reaching
             OVER the orbit. Because it is opaque and drawn after the hollow,
             the top of the socket is physically covered — which is the whole
             difference between a recess and a ring. */
          c.globalAlpha = al * 0.98; c.fillStyle = 'rgb(30,96,72)';
          c.beginPath();
          h3(c, 0.92, 0.52 * side, 0.44, 1);
          h3(c, 0.44, 0.80 * side, 0.62);
          h3(c, -0.28, 0.90 * side, 0.56);
          h3(c, -0.50, 0.66 * side, 0.42);
          h3(c, -0.12, 0.72 * side, 0.34);
          h3(c, 0.58, 0.54 * side, 0.28);
          c.closePath(); c.fill();
          /* its own lit top edge, so the shelf reads as bone and not as a
             patch of paint */
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = al * 0.42 * gI; c.strokeStyle = C_LIT;
          c.lineWidth = Math.max(1.2, hs * 0.09);
          c.beginPath();
          h3(c, 0.92, 0.52 * side, 0.44, 1);
          h3(c, 0.44, 0.80 * side, 0.62);
          h3(c, -0.28, 0.90 * side, 0.56);
          c.stroke();
          c.globalCompositeOperation = 'source-over';
        }
        if (side_on) {
          /* BLOCKER FIX. The eye was an ADDITIVE radial gradient — a soft gold
             dot with no pupil, iris or lid — which is a navigation light, not
             an eye. It is now built the way an eye is built: a dark recessed
             socket, an opaque amber SCLERA over it, a hard dark slit PUPIL
             across it, a gold orbital rim, and exactly one small additive
             SPECULAR up-light. Nothing about the eye is additive except the
             specular, which is the only part of a real eye that emits. */
          /* the eye itself, 0.74 of the orbit and seated DOWN-FORWARD in it,
             so unlit socket floor shows along the whole upper rear arc. */
          var pux = s.uvx[0], puy = s.uvy[0];
          var pl = Math.sqrt(pux * pux + puy * puy) || 1;
          var eux = pux / pl, euy = puy / pl;
          var sx2 = ex - eux * er * 0.26, sy2 = ey - euy * er * 0.26;
          var sr = er * 0.74;
          c.globalCompositeOperation = 'source-over';
          c.globalAlpha = al * 0.97; c.fillStyle = 'rgb(236,190,88)';
          c.beginPath(); c.arc(sx2, sy2, sr, 0, TAU); c.fill();
          /* the slit pupil: a real lens, not a stroked line — an ellipse
             squashed across the socket along the body's own up axis. */
          c.save();
          c.translate(sx2, sy2);
          c.rotate(Math.atan2(euy, eux));
          c.scale(0.30, 1);
          c.globalAlpha = al * 0.96; c.fillStyle = 'rgb(4,12,9)';
          c.beginPath(); c.arc(0, 0, sr * 0.88, 0, TAU); c.fill();
          c.restore();
          /* THE BROW'S CAST SHADOW, across the eye's own upper third. This is
             the cue that says the light is stopped by something above — a
             lit sphere with no occlusion shadow is a bead, not an eye in a
             head. Drawn as a thick dark cap arc oriented by the up axis. */
          c.save();
          c.translate(sx2, sy2);
          c.rotate(Math.atan2(euy, eux));
          c.globalAlpha = al * 0.72; c.fillStyle = 'rgb(4,15,12)';
          c.beginPath();
          c.arc(0, 0, sr * 1.02, Math.PI * 0.62, Math.PI * 1.38);
          c.closePath(); c.fill();
          c.restore();
          /* the gold orbital rim traces the ORBIT, not the eye — the bony
             ring around the hollow, elongated with it. */
          c.save();
          c.translate(ex, ey);
          c.rotate(Math.atan2(puy / pl, pux / pl));
          c.scale(1, 1.75);
          c.globalAlpha = al * 0.52 * gI;
          c.strokeStyle = 'rgb(214,172,58)'; c.lineWidth = Math.max(1.1, er * 0.15);
          /* two thirds of a turn, open at the top where the shelf overhangs */
          c.beginPath(); c.arc(0, 0, er * 1.06, Math.PI * 0.10, Math.PI * 1.16);
          c.stroke();
          c.restore();
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = al * 0.78;
          c.fillStyle = 'rgb(255,252,240)';
          c.beginPath();
          c.arc(sx2 + eux * sr * 0.30, sy2 + euy * sr * 0.30,
                Math.max(1, sr * 0.22), 0, TAU);
          c.fill();
          c.globalCompositeOperation = 'source-over';
        } else {
          /* ══ HEAD-ON IS STILL A HEAD ══════════════════════════════════
             BLOCKER FIX. Every feature on this skull was gated on `side_on`,
             so a head at a shallow angle — measured at hhw 41, which is a
             TYPICAL size, not an edge case — drew as one soft amber lamp on a
             pale plane: "a featureless pale mitten with no features at all".
             Head-on you see both orbits, the brow ridge between them and the
             muzzle below, which is three value steps and two dark holes. That
             is a face at 30px. Painted in the same order a face occludes:
             muzzle, brow, then the sockets over both. */
          c.globalCompositeOperation = 'source-over';
          c.globalAlpha = al * 0.70; c.fillStyle = 'rgb(34,104,79)';
          c.beginPath();
          h3(c, 1.98, 0.16, 0.06, 1);
          h3(c, 1.04, 0.52, 0.34); h3(c, 0.62, 0.34, 0.16);
          h3(c, 0.62, -0.34, 0.16); h3(c, 1.04, -0.52, 0.34);
          h3(c, 1.98, -0.16, 0.06);
          c.closePath(); c.fill();
          c.globalAlpha = al * 0.60; c.fillStyle = 'rgb(6,26,21)';
          c.beginPath();
          h3(c, 0.52, 0.92, 0.60, 1);
          h3(c, -0.24, 1.00, 0.54); h3(c, -0.24, 0.32, 0.72); h3(c, 0.52, 0.32, 0.74);
          c.closePath();
          h3(c, 0.52, -0.92, 0.60, 1);
          h3(c, -0.24, -1.00, 0.54); h3(c, -0.24, -0.32, 0.72); h3(c, 0.52, -0.32, 0.74);
          c.closePath(); c.fill();
          var eo, eox, eoy;
          for (eo = -1; eo <= 1; eo += 2) {
            h3p(0.42, 0.70 * eo, 0.26);
            eox = _px; eoy = _py;
            if (!isFinite(eox) || !isFinite(eoy)) continue;
            c.globalAlpha = al * 0.94; c.fillStyle = 'rgb(3,13,11)';
            c.beginPath(); c.arc(eox, eoy, er * 1.30, 0, TAU); c.fill();
            c.globalAlpha = al * 0.96; c.fillStyle = 'rgb(236,190,88)';
            c.beginPath(); c.arc(eox, eoy, er * 0.74, 0, TAU); c.fill();
            c.globalAlpha = al * 0.94; c.fillStyle = 'rgb(4,12,9)';
            c.beginPath(); c.arc(eox, eoy, er * 0.30, 0, TAU); c.fill();
          }
          /* and one amber bloom over both, so the eyes still carry at range */
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = al * 0.58;
          c.fillStyle = front ? this._geF : this._geB;
          c.setTransform(dpr * er * 1.7, 0, 0, dpr * er * 1.7, dpr * ex, dpr * ey);
          c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.fill();
          c.setTransform(dpr, 0, 0, dpr, 0, 0);
          c.globalCompositeOperation = 'source-over';
        }
      }
    },

    /* the tail fluke: a vertical fan in the tail's own up-plane, so it goes
       edge-on and vanishes exactly when the body rolls. Its up axis lags the
       spine by three samples — the fin trails, it does not lock. */
    _tail: function (c, s, al, gI) {
      var n = s.n;
      if (n < 8) return;
      /* the fluke is built from the t3 frame at the tail TIP and reaches ~2.3

         literally khaki. On a near-camera pass the fluke projects several
         hundred px across, so the crops were finding a mustard parallelogram
         with hard corners sitting over a mint one: the single most
         recognisable artifact in three rounds of head-and-body crops, and it

    /* ── the displaced-air / ozone wake. Three stacked additive widths, in two

     *    midpoints so it follows the body's own curves instead of cutting the
     *    corners off them with 84px straight chords.

     *    than per sample — the wake hugs the head, and per-sample routing meant
     *    four path builds instead of two for a difference nobody can see. */
    _trail: function (s) {

      var lay = front ? 1 : 0.6;

             tail where it would cross the just-landed tile costs nothing: it
             is the oldest, faintest end of the trail. */

     *    so the tile bed and the thunderheads brighten as the body passes and
     *    the serpent is inside the scene instead of pasted over it. One
     *    pre-built gradient, placed by the transform — zero allocation. First
     *    thing off the ladder, because it is pure fill area. */

      var R = 200 * (0.8 + 0.4 * s.mag), c = this._fctx, dpr = this._dpr;
      if (!isFinite(s.hx) || !isFinite(s.hy)) return;

      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.055 * s.fade * (0.5 + 0.5 * this._int);
      c.fillStyle = this._gwF;

      c.setTransform(dpr, 0, 0, dpr, 0, 0);

      c.globalAlpha = 1;

    },

    /* ── frame-time watchdog. An EWMA rather than a rolling median, so nothing
     *    is allocated: the old version sliced and sorted a 60-element array
     *    every 60 frames. Over our share of the frame, drop a rung; after
     *    sustained headroom, give one back. ─────────────────────────────── */
    _watch: function (cost, rawDt) {
      if (global.document && global.document.hidden) { this._wN = 0; this._holdUp = 0; return; }
      if (!(cost >= 0) || cost > 60 || rawDt > 34) { this._wN = 0; return; }

      if (++this._wN < WATCH_WINDOW) return;

      if (this._ew > period * 0.22) { if (this._q > 0) this._q--; this._holdUp = 0; }
      else if (this._ew < period * 0.10) {
        this._holdUp += WATCH_WINDOW;
        if (this._holdUp >= STEP_UP_HOLD) {
          this._holdUp = 0;
          if (this._q < SEG_LADDER.length - 1) this._q++;

    },

    revive: function () {
      try { this._ew = 0; this._wN = 0; this._holdUp = 0; this._q = SEG_START; this._calN = 0; } catch (e) {}
    },

    destroy: function () {
      try {
        this._destroyed = true; this._ready = false;
        if (this._unsub) { try { this._unsub(); } catch (e) {} this._unsub = null; }
        for (var i = 0; i < POOL; i++) pool[i].on = false;
        if (this._cvB && this._cvB.parentNode) this._cvB.parentNode.removeChild(this._cvB);
        if (this._made && this._cvF && this._cvF.parentNode) this._cvF.parentNode.removeChild(this._cvF);

    },

    _diag: function () {
      var n = 0;

      return { ready: this._ready, active: n, flown: this._flew, q: this._q,
               segs: SEG_LADDER[this._q], smear: BLUR_LADDER[this._q],
               costMs: Math.round(this._cost * 100) / 100, cal: CAL.ok,
               reduced: this._reduced, intensity: this._int, dpr: this._dpr,
               gest: this._g1, rejected: this._rej,
               /* the last flyby's estimated drawn footprint and the clamp
                  factor the tier cap applied to it — the two numbers that say
                  whether the escalation ladder is actually being enforced. */
               pcov: Math.round(PCOV * 1000) / 1000,
               /* the ESCALATION METRIC: the owning body's own peak projected
                  ink coverage, latched before its companion flyby lands. */
               tiercov: Math.round((this._tierCov || 0) * 1000) / 1000,
               /* the escalation metric, in the unit the audience sees: the
                  estimated fraction of the frame carrying serpent on the
                  body's biggest frame, composited across a summit's bodies. */

               shrink: this._lastShrink || 1,

                  serpent — so "is the skull readable at 60px" is a question
                  you can answer by pointing a magnifier at it, not by guessing
                  where it went. */
               /* is the first live skull in PROFILE this frame? _head only
                  builds the socket, the brow, the jawline and the mouth when
                  it is, so an audit that magnifies a head-on frame is looking
                  at a foreshortened disc and learning nothing. */
               hso: pool[0].on ? (pool[0].so || 0) : -1,
               hx: pool[0].on ? Math.round(pool[0].hx) : -1,
               hy: pool[0].on ? Math.round(pool[0].hy) : -1,

    }
  };

  /* the landing player's emblem colour, mixed into the storm's cold rim AND
     into the ozone wake, so the moment says WHO won it. Two strings built per

  }
  function mixRim(hex)  { return mix3(hex, 120, 190, 255, 0.60, C_RIM); }
  function mixWake(hex) { return mix3(hex, 150, 255, 225, 0.55, C_OZONE); }

  global.StormRay = Ray;

<script>
/* ===== JS:LOOP+GAME (B2) ===== */
(function(){

  TILE:104, GAP:8, COLS:6, ROWS:5, TILES:30,

    if(p<=0)return 0; if(p>=1)return 1;

    for(i=0;i<18;i++){ v=cx(t); if(v<p)lo=t; else hi=t; t=(lo+hi)*0.5 }

  expo     : bez(.16,1,.3,1),

   ───────────────────────────────────────────────────────────────────────────── */

  timeScale:1, targetHz:60, paused:false,
  add:function(fn,order){ var id=nextId++; cbs.push({id:id,fn:fn,o:order||30});
    cbs.sort(function(a,b){return a.o-b.o}); return id },
  remove:function(id){ for(var i=0;i<cbs.length;i++) if(cbs[i].id===id){cbs.splice(i,1);return} },
  start:function(){ if(running)return; running=true; lastT=0; discardNext=true; requestAnimationFrame(tick) },
  stop:function(){ running=false },

    (function ramp(){

      else if(e<IN+freezeMs)         LOOP.timeScale=FLOOR;
      else if(e<IN+freezeMs+OUT){    var p=(e-IN-freezeMs)/OUT;

D.addEventListener('visibilitychange',function(){

/* ─────────────────────────────────────────────────────────────────────────────

   ───────────────────────────────────────────────────────────────────────────── */

   gradient is built once, ever, and placed by setTransform at fill time so a
   crown allocates nothing per frame. */
var rings=[], glows=[], bolts=[], crownG=null;

/* one fork, baked once at spawn. Midpoint displacement plus a generation of
   branches, tapered — a strike has geometry or it is a colour wash, and the
   sky's own bolts were measuring as "a flat lilac full-sky brightening". */
function forkInto(strokes, x0, y0, x1, y1, it, jit, w) {
  var pts=[[x0,y0],[x1,y1]], k, i, o;
  for(k=0;k<it;k++){

    for(i=0;i<pts.length-1;i++){
      var a=pts[i], b=pts[i+1], dx=b[0]-a[0], dy=b[1]-a[1];

      o.push([(a[0]+b[0])*0.5-(dy/L)*amp,(a[1]+b[1])*0.5+(dx/L)*amp]);

  var trunk=forkInto(st, x+(Math.random()-0.5)*len*0.55, y-len, x, y, 5, 0.26, 4.4);
  var b, i, r, br;

    /* one twig off each branch, half again as thin. THICKNESS HIERARCHY is
       what separates electricity from a vein diagram: trunk 4.4, branch 2.2,
       twig 1.1, and _draw walks the array BACKWARD so the trunk paints over
       its own children instead of under them. */
    i=1+((Math.random()*(br.length-2))|0);
    forkInto(st, br[i][0], br[i][1], br[i][0]+(Math.random()-0.5)*len*0.30,

var FX={
  reducedMotion:RM.matches,

function frameFx(dt,t){
  /* ── shake: A(t)=A0·e^(−t/τ), only on #shake ─────────────────────────────── */
  var sx=0, sy=0, sr=0, i;
  for(i=shakes.length-1;i>=0;i--){
    var s=shakes[i]; s.t+=dt;
    var a=s.a0*Math.exp(-s.t/s.tau);
    if(a<0.05){ shakes.splice(i,1); continue }
    var ph=s.t*0.09;
    /* 60% along the impact normal, 40% random */
    sx += a*(0.6*s.nx + 0.4*Math.sin(ph*3.1+i));
    sy += a*(0.6*s.ny + 0.4*Math.sin(ph*2.3+i*1.7));
    sr += s.rot*(a/s.a0)*Math.sin(ph*4.1+i);
  }
  elShake.setProperty('--shake-x',sx.toFixed(2)+'px');
  elShake.setProperty('--shake-y',sy.toFixed(2)+'px');
  elShake.setProperty('--shake-rot',sr.toFixed(3)+'deg');

  /* ── parallax lerp 0.10, over an ambient drift so the scene is NEVER dead.
        the target device is a touch tablet: pointermove fires only during a
        drag, so --par-x sat at exactly 0 for whole sessions. 26s/19s periods
        so it cannot read as a loop, and it moves the sky planes, the board and
        the foil against each other at differential rates. ─────────────────── */
  if(FX.reducedMotion){ parX=parY=0 } else {
    var ax = 8.5*Math.sin(t/5300) + 3.4*Math.sin(t/2100+1.1);
    var ay = 5.2*Math.sin(t/6900+1.3) + 2.1*Math.sin(t/3100+0.4);
    parX+=(parTX+ax-parX)*0.10; parY+=(parTY+ay-parY)*0.10;
    /* one non-finite frame is permanent: parX is fed by its own previous value,
       and StormRay's calibration divides by it. Costs two compares. */
    if(!isFinite(parX)) parX=0; if(!isFinite(parY)) parY=0;
  }
  R.setProperty('--par-x',parX.toFixed(2)+'px');
  R.setProperty('--par-y',parY.toFixed(2)+'px');
  elRig.setProperty('--cam-scale',camScale.toFixed(4));
  /* a foil sheen does not need 120Hz */
  foilT+=dt;
  if(foilT>=100){
    foilT=0;
    R.setProperty('--foil-angle',(parX*26).toFixed(2)+'deg');
    R.setProperty('--foil-shift',(parX*180).toFixed(1)+'px');
  }

  /* ── flash decay ─────────────────────────────────────────────────────────── */
  if(flashV>0){
    flashV=Math.max(0,flashV-dt*flashDecay);
    elFlash.setProperty('--flash',flashV.toFixed(3));
  }

  /* ── link pulses: cheap transform writes, no DOM reads ───────────────────── */
  linkPulse(dt);

  if(!ctx) return;
  var vp=window.StormViewport, d=vp.dpr;
  ctx.setTransform(d,0,0,d,0,0);

  if(!parts.length && !trailCount() && !rings.length && !glows.length && !bolts.length) return;
  ctx.globalCompositeOperation='lighter';
  var sec=dt/1000;
  /* ── the summit crown, under the particles ─────────────────────────────── */
  if(glows.length||rings.length||bolts.length){
    var dv=vp.dpr;
    for(i=glows.length-1;i>=0;i--){
      var gl=glows[i]; gl.t+=dt;
      if(gl.t>=gl.max){ glows.splice(i,1); continue }
      var gk=1-gl.t/gl.max, gr=gl.r*(0.42+0.58*(1-gk*gk));
      if(!crownG){
        crownG=ctx.createRadialGradient(0,0,0,0,0,1);
        crownG.addColorStop(0.00,'rgba(255,250,222,0.95)');
        crownG.addColorStop(0.22,'rgba(255,216,112,0.58)');
        crownG.addColorStop(0.56,'rgba(242,196,56,0.17)');
        crownG.addColorStop(1.00,'rgba(242,196,56,0)');

      ctx.globalAlpha=gk*gk*0.92; ctx.fillStyle=crownG;

      var rg=rings[i]; rg.t+=dt;
      if(rg.t<0) continue;

      ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r0+(rg.r1-rg.r0)*e,0,6.2832); ctx.stroke();
    }
    for(i=bolts.length-1;i>=0;i--){
      var bo=bolts[i]; bo.t+=dt;
      if(bo.t>=bo.max){ bolts.splice(i,1); continue }
      var bk=1-bo.t/bo.max, fl=bk*bk*(0.62+0.38*Math.sin(bo.t*0.085));

          ctx.lineWidth=stk.w*(lay===0?9:lay===1?3.4:1);
          ctx.strokeStyle=lay===2?'rgb(255,252,238)':'rgb(255,226,152)';
          ctx.beginPath(); ctx.moveTo(sp[0][0],sp[0][1]);
          for(pi=1;pi<sp.length;pi++) ctx.lineTo(sp[pi][0],sp[pi][1]);
          ctx.stroke();
        }
      }
    }
  }
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.life+=dt;
    if(p.life>=p.max){ parts.splice(i,1); continue }
    p.vy += 1400*sec;                              /* gravity px/s²           */
    var drag=Math.exp(-2.6*sec);                   /* frame-rate INVARIANT    */

    ctx.restore();

     the length is identical at 60 and 120Hz. */
  for(var id in trails){ if(!trails.hasOwnProperty(id)) continue;
    var tr=trails[id];
    while(tr.pts.length && trailNow-tr.pts[0].t > tr.pts[0].life) tr.pts.shift();
    if(tr.pts.length<2){ if(!tr.pts.length) delete trails[id]; continue }
    var hue=tr.c||[156,245,200];
    ctx.strokeStyle='rgb('+hue[0]+','+hue[1]+','+hue[2]+')';
    ctx.lineCap='round';
    var m=tr.pts.length;
    for(var j=1;j<m;j++){
      var kk=j/(m-1);
      ctx.globalAlpha=0.08+0.55*kk;
      ctx.lineWidth=1.2+6.4*kk;
      ctx.beginPath();
      ctx.moveTo(tr.pts[j-1].x,tr.pts[j-1].y);
      ctx.lineTo(tr.pts[j].x,tr.pts[j].y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
